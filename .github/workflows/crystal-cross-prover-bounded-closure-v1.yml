name: Crystal Cross-Prover Bounded Closure V1

on:
  push:
    branches:
      - crystal-cross-prover-auto-family-v5
      - mathgraph-core-v0-kernel
    paths:
      - '.github/workflows/crystal-cross-prover-bounded-closure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify prerequisite authority graph
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo="metalogiclabs/mathgraph"
          token=os.environ["GH_TOKEN"]

          def jobs(run_id):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r)["jobs"]

          def require_job(run_id,name):
              xs=jobs(run_id)
              x=next(x for x in xs if x["name"]==name)
              assert x["conclusion"]=="success",(run_id,name,x["status"],x["conclusion"])
              return x

          def require_step(run_id,job_name,step_name):
              x=next(x for x in jobs(run_id) if x["name"]==job_name)
              s=next(s for s in x.get("steps",[]) if s["name"]==step_name)
              assert s["conclusion"]=="success",(run_id,job_name,step_name,s["status"],s["conclusion"])
              return x,s

          evidence={}
          evidence["v4_promote"]=require_job(36648459392,"promote")["id"]
          evidence["v5_discovery_lean"]=require_job(36648331218,"discover-lean")["id"]
          evidence["hard_pair_lean"]=require_job(36647829062,"lean")["id"]
          evidence["hard_pair_pvs"]=require_job(36647829062,"pvs")["id"]
          evidence["projection_v1"]=require_job(36640121901,"pvs-replay-and-promote")["id"]
          evidence["projection_type_v2"]=require_job(36648156480,"promote")["id"]
          evidence["refutation_promotion"]=require_job(36649006912,"promote")["id"]
          evidence["false_cad_probe"]=require_job(36648207056,"probe")["id"]
          evidence["lean_negations_job"],_ = require_step(
              36648693445,"refute","Kernel-check exact Lean negations"
          )
          evidence["lean_negations_job"]=evidence["lean_negations_job"]["id"]
          print(json.dumps(evidence,sort_keys=True))
          open("/tmp/evidence.json","w").write(json.dumps(evidence,sort_keys=True)+"\n")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"

      - name: Recompute pinned bounded family and exact partition
        run: |
          set -euo pipefail
          mkdir -p /tmp/pvs-family artifacts/crystal_cross_prover_bounded_closure_v1
          BASE=https://raw.githubusercontent.com/j-tanner-slagel/pvs_cad/8750362e99c2ba0e9a0307dcaa39b9766c562feb/cad
          for f in cad_demo.pvs cad_demo.prf cad_examples.pvs cad_examples.prf cad_star_ex.pvs cad_star_ex.prf; do
            curl -fsSL -o "/tmp/pvs-family/$f" "$BASE/$f"
          done
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from mathgraph.cross_prover_family_discovery import discover_family,compile_family_bundle
          from mathgraph.core_v0 import Grammar,Status
          from mathgraph.core_v0_family_adapter import replay_family

          pins={
            "cad_demo.pvs":"90a3d14afff0fc023c2053b7635b05b93dfa5429",
            "cad_demo.prf":"f2db4a2a6fd22f23b472e62c1cb0b18779799577",
            "cad_examples.pvs":"36a2070d67ce77e901f08a094fd02ba7d2738470",
            "cad_examples.prf":"fb6aac8f611768ff1a920f17d941e39ebb097fcc",
            "cad_star_ex.pvs":"988021b508653ebf6da1ab8aab50905ec77ccd3b",
            "cad_star_ex.prf":"96915e3de48733a6402d47bae20e99003faca13b",
          }
          def git_blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          for name,want in pins.items():
              got=git_blob(Path("/tmp/pvs-family",name).read_bytes())
              assert got==want,(name,got,want)

          theories=("cad_demo","cad_examples","cad_star_ex")
          sources={k:Path("/tmp/pvs-family",f"{k}.pvs").read_text() for k in theories}
          proofs={k:Path("/tmp/pvs-family",f"{k}.prf").read_text() for k in theories}
          d=discover_family(sources,proofs)

          assert d["source_lemma_count"]==34,d
          assert d["supported_occurrence_count"]==26,d
          assert d["source_verified_occurrence_count"]==25,d
          assert d["source_unverified_supported_occurrence_count"]==1,d
          assert d["unique_canonical_claim_count"]==25,d
          assert d["verified_unique_claim_count"]==25,d
          assert d["unsupported_occurrence_count"]==8,d

          unsupported={f"{x['theory']}.{x['formula']}" for x in d["unsupported_occurrences"]}
          projections={
            "cad_star_ex.s_sqrt","cad_star_ex.s_fun","cad_star_ex.s_skip",
            "cad_star_ex.s_mix","cad_star_ex.s_posreal","cad_star_ex.s_sqrtpos",
          }
          refuted={"cad_demo.d_inverse","cad_demo.t_amgm3"}
          assert unsupported==projections|refuted,(unsupported,projections|refuted)
          assert projections.isdisjoint(refuted)

          unverified=[
            f"{x['theory']}.{x['formula']}"
            for x in d["supported_occurrences"]
            if x["source_proof_status"]=="NO_PINNED_PROOF"
          ]
          assert unverified==["cad_demo.s_pos"],unverified

          fresh={
            x["claim_id"] for x in d["unique_claims"]
            if x["certificate_schema"] in {"composed_algebraic_witness","bounded_intermediate_value"}
          }
          assert fresh=={
            "real.parabola_meets_unit_circle@1",
            "real.depressed_cubic_has_root@1",
          },fresh
          supported={x["claim_id"] for x in d["unique_claims"]}
          reused=supported-fresh
          assert len(reused)==23 and len(fresh)==2

          evidence=json.loads(Path("/tmp/evidence.json").read_text())
          obj=compile_family_bundle(
              d,
              reused_claim_ids=sorted(reused),
              newly_qualified_claim_ids=sorted(fresh),
              evidence_refs=[
                "github-run:36648459392:v4-promotion",
                "github-run:36648331218:v5-discovery-lean",
                "github-run:36647829062:hard-pair-pvs-lean",
                "github-run:36640121901:sufficient-interface-v1",
                "github-run:36648156480:type-range-projection-v2",
                "github-run:36649006912:refutation-promotion",
                "github-run:36648207056:false-cad-probe",
                "github-run:36648693445:lean-negations",
              ],
          )

          outdir=Path("artifacts/crystal_cross_prover_bounded_closure_v1")
          v5={
            "schema":"mathgraph.crystal-cross-prover-auto-family-result.v5",
            "status":"WARRANTED_BOUNDED_AUTOMATIC_CROSS_PROVER_FAMILY_V5",
            "parent_warrant_run":36648459392,
            "consumer_run":36648331218,
            "hard_pair_authority_run":36647829062,
            "source_lemma_count":34,
            "exact_supported_occurrence_count":26,
            "source_verified_exact_occurrence_count":25,
            "source_unverified_duplicate_occurrence_count":1,
            "unique_exact_canonical_claim_count":25,
            "reused_exact_claim_count":23,
            "newly_qualified_exact_claim_count":2,
            "new_schemas":["composed_algebraic_witness","bounded_intermediate_value"],
            "raw_non_exact_occurrence_count":8,
            "family_semantic_object_id":obj.id,
            "interfaces":list(obj.interfaces),
          }
          closure={
            "schema":"mathgraph.cross-prover-bounded-source-closure.v1",
            "status":"WARRANTED_BOUNDED_CROSS_PROVER_SOURCE_CLOSURE_V1",
            "source_repository":"j-tanner-slagel/pvs_cad",
            "source_commit":"8750362e99c2ba0e9a0307dcaa39b9766c562feb",
            "source_lemma_count":34,
            "partition":{
              "exact_true_source_occurrences":26,
              "exact_true_canonical_meanings":25,
              "sufficient_interface_true_source_occurrences":6,
              "refuted_false_source_occurrences":2,
            },
            "partition_check":"26 + 6 + 2 = 34; pairwise disjoint by exact source identity",
            "unresolved_true_source_occurrences":0,
            "unclassified_source_occurrences":0,
            "occurrence_level_unknowns":[
              {
                "source":"cad_demo.s_pos",
                "status":"UNKNOWN_SOURCE_UNVERIFIED",
                "canonical_meaning":"real.positive_product2@1",
                "canonical_meaning_status":"WARRANTED",
                "canonical_authority":"cad_star_ex.s_pos",
              }
            ],
            "refuted_sources":sorted(refuted),
            "projection_sources":sorted(projections),
            "exact_family_semantic_object_id":obj.id,
            "evidence_runs":{
              "v4_exact_family":36648459392,
              "v5_consumers":36648331218,
              "hard_pair":36647829062,
              "projection_v1":36640121901,
              "projection_type_v2":36648156480,
              "refutation_promotion":36649006912,
              "false_cad_probe":36648207056,
              "lean_negations":36648693445,
            },
            "boundary":"This closes only the 34 pinned lemma surfaces from the three declared pvs_cad source files. It is not a universal PVS parser, universal proof translator, or completeness claim beyond the supported source snapshot.",
          }

          # Replay the same discovery result into the prover-agnostic kernel.
          # Projection endpoints are explicit adapter inputs; theorem names
          # alone must never manufacture IMPLIES relations.
          core_replay=replay_family(
            d,
            grammar=Grammar(
              "pvs-cad-bounded-claim-and-interface-ir",
              "1",
              "sha256:cross-prover-bounded-family-and-interface-ir-v1",
            ),
            source_digests={
              "cad_demo":pins["cad_demo.pvs"],
              "cad_examples":pins["cad_examples.pvs"],
              "cad_star_ex":pins["cad_star_ex.pvs"],
            },
            verified_claim_authorities={
              row["claim_id"]:[
                "github-run:36648459392:v4-promotion",
                "github-run:36648331218:v5-discovery-lean",
                "github-run:36647829062:hard-pair-pvs-lean",
              ]
              for row in d["unique_claims"]
              if row["source_authority_status"]=="SOURCE_AUTHORITY_AVAILABLE"
            },
            refuted_source_authorities={
              "cad_demo.d_inverse":["github-run:36649006912:refutation-promotion","github-run:36648207056:false-cad-probe"],
              "cad_demo.t_amgm3":["github-run:36649006912:refutation-promotion","github-run:36648207056:false-cad-probe"],
            },
            implication_authorities={
              row["source_occurrence"]:row
              for row in json.loads(Path("experiments/crystal_cross_prover_bounded_closure_v1/core_v0_projection_map.json").read_text())["relations"]
            },
            repository="j-tanner-slagel/pvs_cad",
            commit="8750362e99c2ba0e9a0307dcaa39b9766c562feb",
          )
          core_summary={
            "schema":"mathgraph.core-v0-cross-prover-replay.v1",
            "status":"WARRANTED_BOUNDED_CORE_REPLAY_WITH_SIX_TYPED_IMPLICATIONS",
            "partition":core_replay.partition,
            "object_count":len(core_replay.graph.objects),
            "unknown_count":len(core_replay.graph.unknowns),
            "rejected_source_unknowns":sorted(
              name for name,unknown in core_replay.unknown_by_source.items()
              if core_replay.graph.status_of(unknown.id) is Status.REJECTED
            ),
            "projection_relation":"INTERFACE_IMPLIES_SOURCE_INSTANCE",
            "projection_mapping":"experiments/crystal_cross_prover_bounded_closure_v1/core_v0_projection_map.json",
            "projection_same_meaning":False,
          }
          outdir.joinpath("v5_result.json").write_text(json.dumps(v5,indent=2,sort_keys=True)+"\n")
          outdir.joinpath("bounded_closure_result.json").write_text(json.dumps(closure,indent=2,sort_keys=True)+"\n")
          outdir.joinpath("core_v0_family.mg").write_bytes(core_replay.graph.to_mg())
          outdir.joinpath("core_v0_replay.json").write_text(json.dumps(core_summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(v5,sort_keys=True))
          print(json.dumps(closure,sort_keys=True))
          print(json.dumps(core_summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-cross-prover-bounded-source-closure-v1
          path: artifacts/crystal_cross_prover_bounded_closure_v1/
