name: V71 Residual-Conditioned Development Calibration

on:
  push:
    branches: [residual-conditioned-development-v71]
    paths:
      - 'experiments/residual_conditioned_development_v71/**'
      - '.github/workflows/residual-conditioned-development-v71.yml'
  workflow_dispatch:

jobs:
  calibrate-residual-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Static check
        run: python3 -m py_compile experiments/residual_conditioned_development_v71/run_calibration.py
      - name: Install frozen route backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1
      - name: Fetch pinned opened calibration streams
        run: |
          set -euo pipefail
          mkdir -p external-v71
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v71/book3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v71/book3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v71/book3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v71/book3500.jsonl" | sha256sum -c -
          curl -fsSL --retry 3 https://raw.githubusercontent.com/heathsanchez/equational-theories-lean-stage2/374eb40ba5389915deb174fbc12cc92346214dd1/examples/problems/normal.jsonl -o external-v71/stage2-normal.jsonl
          echo "V71_CALIBRATION_ONLY=opened_by_v67_not_fresh"
      - name: Run V71 closed-loop calibration
        run: |
          PYTHONPATH=. python3 experiments/residual_conditioned_development_v71/run_calibration.py \
            --book3000 external-v71/book3000.jsonl \
            --book3500 external-v71/book3500.jsonl \
            --stage2 external-v71/stage2-normal.jsonl \
            --out external-v71/results
      - name: Preserve V71 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v71-residual-conditioned-development-calibration
          path: external-v71/results/
