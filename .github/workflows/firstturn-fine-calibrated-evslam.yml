name: C99 fine first-turn interval guard and original EvSLAM sensitivity
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - '.github/workflows/firstturn-fine-calibrated-evslam.yml'
      - 'experiments/uzh_rotation/firstturn_fine_capture.c'
      - 'experiments/uzh_rotation/firstturn_fine_capture.h'
      - 'experiments/uzh_rotation/test_firstturn_fine_capture.py'
      - 'experiments/uzh_rotation/audit_evslam_fine_capture.py'
  workflow_dispatch:
jobs:
  source-grounded-high-precision-embedded-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source identity of frozen previous map and coarse adapter
        run: |
          test "$(git hash-object experiments/uzh_rotation/firstturn_interval_capture.c)" = b7957be414692be82449ff4daa90751011621304
      - name: Install original-source/independent finite dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1 PyYAML==6.0.3 gdown==6.1.0
      - name: Exhaustive fine 720896-state C99 oracle and original coarse C99 tests
        run: |
          python -m unittest discover -s experiments/uzh_rotation -p 'test_firstturn_fine_capture.py' -v
          python -m unittest discover -s experiments/uzh_rotation -p 'test_firstturn_interval_capture.py' -v
          python -m unittest discover -s experiments/uzh_rotation -p 'test_evslam_source_phase_clock.py' -v
      - name: Authenticate original published pose references
        run: |
          mkdir -p original_evslam
          python - <<'PY'
          import subprocess
          base="https://raw.githubusercontent.com/NAIL-HNU/EvSLAM_Dataset/f116a9fe305f3ad8b1a379e1bb52becfc87654dc/evaluation/ground_truth"
          names={"drone_rot_norm_gt.txt":"809d83df4063376d0ee50f62095131e1d8940c00",
                 "drone_rot_fast_gt.txt":"47a1bd5b54c0843d2535af42ebff0529950a5a6f"}
          for name,sha in names.items():
              subprocess.run(["curl","-fsSL","--retry","2",f"{base}/{name}","-o",f"original_evslam/{name}"],check=True)
              actual=subprocess.check_output(["git","hash-object",f"original_evslam/{name}"],text=True).strip()
              assert actual==sha,(name,actual)
          PY
      - name: Authenticate original small publisher batch-2 calibration files
        run: |
          gdown 1ZeQokirC1dyB9is8bmm8gCKejxv2V7rD -O original_evslam/camera_calib.yaml
          gdown 16XWYmUw6NPwe9jD_r5nUKnS4N-0uwJdQ -O original_evslam/imu_calib.yaml
      - name: Compare both native C99 policies against identical source-derived angle intervals
        run: |
          python experiments/uzh_rotation/audit_evslam_fine_capture.py \
            --source-dir original_evslam --calib original_evslam/camera_calib.yaml \
            --imu-calib original_evslam/imu_calib.yaml \
            --output evslam_fine_capture_report.json
      - name: Independent source boundary and comparison assertions
        run: |
          python - <<'PY'
          import json
          d=json.load(open("evslam_fine_capture_report.json"))
          assert d["nominal_offset_is_not_certified_uncertainty"]
          assert d["GT_samples_not_camera_events"] and d["new_c99_map_struct_is_unchanged"]
          assert d["original_map_and_coarse_source_intact"]
          for name,x in d["results"].items():
              assert x["samples_first_turn_evaluable"]>50
              assert x["fine_accepted"]>=x["coarse_accepted"]
              assert x["fine_false_admissions_inside_model"]==0
              assert x["coarse_false_admissions_inside_model"]==0
              assert not x["navigation_correction_authorized"]
              assert x["coarse_refused"]>=x["continuous_interval_ambiguous"]
              assert x["fine_refused"]>=x["continuous_interval_ambiguous"]
              print("EVSLAM_FINER_CAPTURE",name,x["coarse_refused"],x["fine_refused"],x["recovered_admission_samples"])
          PY
      - name: Preserve authenticated finite-model and real pose sensitivity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firstturn-fine-c99-calibrated-evslam-source-pose
          path: evslam_fine_capture_report.json
          if-no-files-found: warn
