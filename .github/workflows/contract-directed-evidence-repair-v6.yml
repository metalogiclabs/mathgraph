name: Contract directed evidence repair V6
on:
  push:
    branches: [research/contract-directed-evidence-repair-v6-20261022]
  workflow_dispatch:
jobs:
  repair-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python research/generic_observation_v3/contract_repair_v6.py
