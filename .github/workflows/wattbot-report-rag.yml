name: WattBot eight-report scientific RAG transfer
on:
  push:
    branches: [wattbot-report-rag-v1]
    paths:
      - 'experiments/wattbot2026/report_loader.py'
      - 'experiments/wattbot2026/flashlite_rag_probe.py'
      - '.github/workflows/wattbot-report-rag.yml'
jobs:
  report-corpus-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned source-reader environment
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Test bounded report authority and synthetic grounding
        run: |
          python experiments/wattbot2026/report_loader.py
          python experiments/wattbot2026/flashlite_rag_probe.py --self-test
      - name: Paired arXiv-only versus report-augmented official training score
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/flashlite_rag_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Claim boundary
        run: echo "Official TRAIN reused holdout only; eight exact URLs, no public corpus or private answer publication."
