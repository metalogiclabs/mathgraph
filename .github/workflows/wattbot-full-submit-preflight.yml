name: WattBot complete reader submission preflight
on:
  push:
    branches: [wattbot-full-window-v1, wattbot-complete-submit-v3]
    paths:
      - 'experiments/wattbot2026/submit_full_reader.py'
      - 'experiments/wattbot2026/cached_pdf.py'
      - 'experiments/wattbot2026/submission_gate.py'
      - 'experiments/wattbot2026/tests/test_submission_gate.py'
      - '.github/workflows/wattbot-full-submit-preflight.yml'
jobs:
  synthetic-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only transport and pinned-PDF validation dependencies
        run: python -m pip install pandas requests pymupdf pytest
      - name: Compile and test scientific citation/transport contracts
        run: |
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/report_loader.py
          python experiments/wattbot2026/full_reader.py --self-test
          python experiments/wattbot2026/submit_full_reader.py --self-test
          python -m pytest -q experiments/wattbot2026/tests/test_query_window.py experiments/wattbot2026/tests/test_submission_gate.py experiments/wattbot2026/tests/test_cached_pdf.py
      - name: No unqualified Kaggle submission
        run: echo "This CI checks code and provenance/transport fixtures ONLY; no Kaggle answers generated and no secrets used."
