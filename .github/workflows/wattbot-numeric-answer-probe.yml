name: WattBot evidence-checked numeric answer pilot
on:
  push:
    branches: [wattbot-2026-holdout-v1]
    paths:
      - 'experiments/wattbot2026/numeric_answer_probe.py'
      - '.github/workflows/wattbot-numeric-answer-probe.yml'
jobs:
  grounded-answer-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle pandas numpy requests pymupdf
      - name: Score evidence-checked numeric candidates on fixed official training holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/numeric_answer_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip" --max-docs 24
      - name: Verification boundary
        run: |
          echo "Only aggregate score, counts and download exceptions are logged."
          echo "Gold answers used ONLY by the official scorer. Numeric claims are candidates, not certified entailments."
