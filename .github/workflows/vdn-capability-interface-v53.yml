name: VDN Capability Interface V53
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/finite_inevitability/run_v53_capability_induced_interface_refinement.py'
      - '.github/workflows/vdn-capability-interface-v53.yml'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust capability-induced interface refinement
        run: python3 verified-developmental-navigation/case_studies/finite_inevitability/run_v53_capability_induced_interface_refinement.py
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-capability-interface-v53
          path: verified-developmental-navigation/case_studies/finite_inevitability/results_v53_capability_induced_interface_refinement/result.json
