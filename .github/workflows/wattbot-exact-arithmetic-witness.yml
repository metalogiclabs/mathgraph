name: WattBot source-grounded exact arithmetic witness ablation
on:
  push:
    branches: [wattbot-exact-arithmetic-witness-v1]
    paths:
      - 'experiments/wattbot2026/arithmetic_witness.py'
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
      - '.github/workflows/wattbot-exact-arithmetic-witness.yml'
jobs:
  exact-arithmetic-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official scorer and source PDF dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Verify exact Fraction law, anchored operands and refusal states
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/arithmetic_witness.py
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Same-response official TRAIN scorer for arithmetic and citation candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Consequence and authority boundary
        run: |
          echo "The operation alphabet is question-wording constrained, no gold labels in prediction."
          echo "Exact rational evaluation and two literal operands can certify arithmetic only."
          echo "Scientific premise relevance is not proven and remains CANDIDATE."
          echo "Same 63 previously inspected TRAIN responses; no TEST labels, Kaggle submission or raw copyrighted-source artifacts."
