name: VDN ARC-AGI-2 object representation v8

on:
  workflow_dispatch:
  push:
    branches:
      - vdn-arc2-representation-v6
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v8_object_relational.py'
      - '.github/workflows/vdn-arc2-object-v8.yml'

jobs:
  object-representation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(find data/evaluation -name '*.json' | wc -l)" -eq 120
      - name: Test multicolor object representation
        run: |
          python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v8_object_relational.py /tmp/ARC-AGI-2/data/evaluation
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-object-v8
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v8_object_relational/result.json
