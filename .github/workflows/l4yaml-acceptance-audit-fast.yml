name: L4YAML acceptance audit fast

on:
  push:
    branches: [l4yaml-parser-boundary-v1]
    paths:
      - 'experiments/l4yaml/AcceptanceAudit.lean'
      - '.github/workflows/l4yaml-acceptance-audit-fast.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: 16562a74421f94cc0f8216eecf21f1ff58166fa7
          path: upstream
          submodules: recursive
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean
        working-directory: upstream
        run: elan toolchain install "$(cat lean-toolchain)" || true
      - name: Build parser
        working-directory: upstream
        run: lake build L4YAML.Parser.Composition
      - name: Run acceptance audit
        run: |
          cp experiments/l4yaml/AcceptanceAudit.lean upstream/AcceptanceAudit.lean
          cd upstream
          lake env lean AcceptanceAudit.lean
