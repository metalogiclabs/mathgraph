name: Yamcs numerical conversion contracts - isolated
on:
  push:
    branches: [experiment/yamcs-numerics-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: yamcs/yamcs
          ref: 4af5abd2b5d8535f77e902de717c77d657f0093e
          path: upstream
      - name: Native author tests, exact mathematical oracles, repair and withdrawal
        run: python3 research/aerospace/yamcs-numerics-20261124/run.py upstream receipts
      - name: Preserve evidence including failed experiments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yamcs-numerics-receipts
          path: receipts/
          if-no-files-found: error
