name: EFRD original camera IMU duplicate-source qualification
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - '.github/workflows/efrd-dvs-source-collisions.yml'
      - 'experiments/uzh_rotation/audit_efrd_dvs_duplicate_times.py'
      - 'experiments/uzh_rotation/test_efrd_dvs_duplicate_times.py'
  workflow_dispatch:
jobs:
  source-preserving-camera-clock-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned original-source and numerical dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1 rosbags==0.11.9 gdown==6.1.0
      - name: Original source-conflict and no-leakage controls
        run: python -m unittest discover -s experiments/uzh_rotation -p 'test_efrd_dvs_duplicate_times.py' -v
      - name: Reacquire original source for independent verification
        run: gdown 1e-VrEQWKORSoH3aTKH54ArjjBr3ehMXk -O lab1.bag
      - name: Authenticate raw collisions before source-alternative diagnostics
        run: |
          python experiments/uzh_rotation/audit_efrd_dvs_duplicate_times.py \
            --bag lab1.bag --out efrd_dvs_clock_collision_report.json
      - name: Verify no source alteration or fabricated heading authority
        run: |
          python - <<'PY'
          import json
          d=json.load(open('efrd_dvs_clock_collision_report.json'))
          assert d['original_source_sha256']=='2fac73513203739df46fb085a4e67f8f41e7c2aa9ebfdd115d97b34a9929e484'
          assert d['camera_imu_count']==61279
          assert d['same_time_extra_observations']==16
          assert d['byte_identical_same_receipt_extras']+d['conflicting_same_time_extras']==16
          assert d['mocap_pose_count']==12228
          assert d['source_boundaries']['min_max_are_not_exhaustive_correlation_bounds']
          assert not d['source_boundaries']['navigation_correction_authorized']
          for name,c in d['min_max_source_choice_lag_diagnostics'].items():
              assert name in ('min','max')
              assert not c['used_truth_for_navigation']
              assert not c['used_camera_events']
              print('SOURCE_DIAGNOSTIC',name,c['status'],c.get('metrics',{}))
          print('DVS_SOURCE_COLLISIONS',d['camera_gyro_source_state'],
                d['byte_identical_same_receipt_extras'],d['conflicting_same_time_extras'])
          PY
      - name: Preserve source evidence even if conflicts cause UNKNOWN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efrd-dvs-camera-original-timestamp-collisions
          path: efrd_dvs_clock_collision_report.json
          if-no-files-found: warn
