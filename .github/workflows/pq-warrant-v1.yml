name: MathGraph Post-Quantum Warrant V1

on:
  push:
    branches:
      - mathgraph-pq-warrant-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-pq-warrant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned ML-DSA implementation and tests
        run: |
          set -euo pipefail
          python -m pip install -e ".[all]" "cryptography==47.0.0"
          python -m pip check
      - name: Run real ML-DSA-65 and independent semantic replay tests
        run: |
          set -euo pipefail
          mkdir -p evidence-out/pq-warrant-v1
          python -m pytest -v             tests/test_crystal_extension.py             tests/test_crystal_adapter_contract.py             tests/test_pq_warrant.py             --junitxml=evidence-out/pq-warrant-v1/junit.xml             2>&1 | tee evidence-out/pq-warrant-v1/pytest.log
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse("evidence-out/pq-warrant-v1/junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) + int(s.attrib.get("errors", 0)) for s in suites)
          assert tests >= 20, ("insufficient test coverage", tests)
          assert failures == 0, ("test failures", failures)
          print(f"PQ_WARRANT_QUALIFIED_TESTS={tests};FAILURES={failures}")
          PY
      - name: Pin the audited exact-source files and explicit boundary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "Branch=mathgraph-pq-warrant-v1"
            echo "Profile=ML-DSA-65, SHA3-512, canonical MGSO v1"
            echo "Boundary=finite Boolean 3-variable claim logic, Python reference semantics"
            echo "Independent replay=distinct parser/logic, same cryptography backend"
            echo "NO_CLAIM=general proof soundness, secure deployment, independent crypto verification"
            sha256sum mathgraph/crystal.py               mathgraph/pq_warrant.py               scripts/pq_warrant_independent_replay.py               tests/test_pq_warrant.py               docs/pq_warrant_v1.md
          } > evidence-out/pq-warrant-v1/source-receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-pq-warrant-v1-evidence
          path: evidence-out/pq-warrant-v1
