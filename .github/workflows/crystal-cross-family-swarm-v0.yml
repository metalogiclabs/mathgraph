name: Crystal Cross Family Swarm V0
on:
  push:
    branches: [crystal-cross-family-swarm-v0]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]"
      - name: Prove inherited semantic waists unchanged
        run: |
          git diff --exit-code 36ef1100abc6f989f6d19e42775319259dbb54d1 -- mathgraph/crystal.py
          git diff --exit-code 36ef1100abc6f989f6d19e42775319259dbb54d1 -- mathgraph/math_claim.py
          git diff --exit-code 36ef1100abc6f989f6d19e42775319259dbb54d1 -- mathgraph/graph_invariants.py
      - name: Recheck inherited Crystal tests
        run: python -m pytest -q tests/test_crystal.py tests/test_crystal_math_claim_dialect_v0.py
      - name: Run cross-family residual market
        run: python scripts/run_crystal_cross_family_swarm_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-cross-family-swarm-v0-evidence
          path: evidence/crystal-cross-family-swarm-v0/result.json
          if-no-files-found: error
