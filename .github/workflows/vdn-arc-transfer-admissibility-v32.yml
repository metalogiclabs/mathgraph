name: VDN ARC transfer admissibility V32
on:
  push:
    branches: [mathgraph/msi-arc-pikpi-v11-20260828]
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v32_transfer_admissibility_gate.py'
      - '.github/workflows/vdn-arc-transfer-admissibility-v32.yml'
  workflow_dispatch:
jobs:
  transfer-admissibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V32 transfer admissibility gate
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v32_transfer_admissibility_gate.py /tmp/ARC-AGI-1/data/evaluation /tmp/ARC-AGI-1/data/training
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-transfer-admissibility-v32
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v32_transfer_admissibility_gate/result.json
