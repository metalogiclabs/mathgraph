name: Crystal Chess Clock Gated Effort V55 Parallel

on:
  push:
    branches:
      - crystal-chess-clock-gated-effort-v55-parallel
    paths:
      - ".github/workflows/crystal-chess-clock-gated-effort-v55-parallel.yml"
      - "experiments/crystal_chess_apply_clock_gate_v55.py"
      - "experiments/crystal_chess_timemgmt_ablation_v51.py"
      - "experiments/crystal_chess_normal_exposure_v22.py"
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mid
            tc: "2+0.02"
            seed: 20261108
          - label: slow
            tc: "5+0.05"
            seed: 20261109
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_apply_clock_gate_v55.py
          python -m py_compile experiments/crystal_chess_timemgmt_ablation_v51.py
          python -m py_compile experiments/crystal_chess_normal_exposure_v22.py

      - name: Build pinned baseline
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish-base
          git -C /tmp/stockfish-base checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish-base/src -j2 build ARCH=x86-64

      - name: Build frozen V55 candidate
        run: |
          set -euo pipefail
          cp -a /tmp/stockfish-base /tmp/stockfish-cand
          mkdir -p "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}"
          python experiments/crystal_chess_apply_clock_gate_v55.py --search-cpp /tmp/stockfish-cand/src/search.cpp
          git -C /tmp/stockfish-cand diff -- src/search.cpp > "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/stockfish.patch"
          make -C /tmp/stockfish-cand/src -j2 build ARCH=x86-64

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Disservin/fastchess.git /tmp/fastchess
          git -C /tmp/fastchess checkout 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          make -C /tmp/fastchess -j2

      - name: Generate untouched openings
        run: |
          set -euo pipefail
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish-base/src/stockfish             --book "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/normal.epd"             --manifest "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/normal_manifest.json"             --openings 512 --plies 12 --depth 6 --multipv 4 --seed ${{ matrix.seed }}

      - name: Run paired match
        run: |
          set -euo pipefail
          /tmp/fastchess/fastchess             -engine cmd=/tmp/stockfish-cand/src/stockfish name=CrystalClockGateV55             -engine cmd=/tmp/stockfish-base/src/stockfish name=StockfishBaseline             -each tc=${{ matrix.tc }} option.Threads=1 option.Hash=16 option.Ponder=false             -openings file="artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/normal.epd" format=epd order=sequential             -rounds 512 -repeat -concurrency 4             -pgnout file="artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/match.pgn"             -log file="artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/fastchess.log" level=info             | tee "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/fastchess.stdout"

      - name: Analyse paired Elo
        run: |
          set -euo pipefail
          python experiments/crystal_chess_timemgmt_ablation_v51.py             --pgn "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/match.pgn"             --candidate-name CrystalClockGateV55             --variant "clock_gate_64ms_${{ matrix.label }}"             --output "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/result.json"             | tee "artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/analyse.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-clock-gated-effort-v55-${{ matrix.label }}
          path: artifacts/crystal-chess-v55-parallel/${{ matrix.label }}/
          if-no-files-found: error
