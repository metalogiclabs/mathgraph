name: Crystal Buehler Physical Loop V1

on:
  push:
    branches:
      - crystal-buehler-physical-loop-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Run source-gated Crystal experiment
        run: python experiments/buehler_physical_loop_v1.py
      - name: Show compact result
        if: always()
        run: |
          test -f evidence/buehler-physical-loop-v1/result.json
          python - <<'PY'
          import json
          p='evidence/buehler-physical-loop-v1/result.json'
          d=json.load(open(p))
          print('experiment_status=', d.get('experiment_status'))
          print('epistemic_status=', d.get('epistemic_status'))
          print('exact_graphene_source=', d.get('exact_graphene_source_probe',{}).get('status'))
          print('rows=', d.get('rows'))
          print('mapping=', json.dumps(d.get('mapping',{}), indent=2))
          for k,v in d.get('results',{}).items():
              print('\nTARGET', k)
              print('selected=', v['selection']['selected_features'])
              print('cv=', v['selection']['selected_cv_median_ape'])
              print('holdout=', v['source_holdout_selected'].get('median_ape'))
              print('all=', v['source_holdout_all_features'].get('median_ape'))
              print('family=', v['geometry_family_transfer'].get('status'), v['geometry_family_transfer'].get('median_family_mape'))
              print('alt_physics=', v['alternate_physics_world'].get('status'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buehler-physical-loop-v1-evidence
          path: |\n            evidence/buehler-physical-loop-v1\n            evidence/buehler-graphene-exact-v1
          if-no-files-found: error
