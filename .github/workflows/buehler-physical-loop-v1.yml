name: Crystal Buehler Physical Loop V1

on:
  push:
    branches:
      - crystal-buehler-physical-loop-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn pyarrow huggingface_hub
      - name: Probe exact graphene sources
        run: python experiments/buehler_graphene_exact_probe.py
      - name: Mine exact graphene schemas\n        run: python experiments/buehler_graphene_schema_mine.py\n      - name: Run source-gated proxy control
        run: python experiments/buehler_physical_loop_v1.py
      - name: Show exact graphene probe
        if: always()
        run: |
          test -f evidence/buehler-graphene-exact-v1/probe.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/buehler-graphene-exact-v1/probe.json'))
          for k,r in d.get('repos',{}).items():
              print('\nREPO', k, r.get('id'), r.get('pin'))
              print('tree_count=',r.get('tree_count'),'tree_error=',r.get('tree_error'))
              print('siblings=',r.get('siblings'))
              for f in r.get('files',[])[:250]:
                  print(f)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buehler-physical-loop-v1-evidence
          path: |
            evidence/buehler-physical-loop-v1
            evidence/buehler-graphene-exact-v1
          if-no-files-found: error
