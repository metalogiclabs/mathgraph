name: Crystal Buehler Physical Loop V1

on:
  push:
    branches:
      - crystal-buehler-physical-loop-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fast probe dependencies
        run: python -m pip install --disable-pip-version-check numpy huggingface_hub
      - name: Inspect exact graphene agent provenance
        run: python experiments/buehler_graphene_agent_fast.py
      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buehler-graphene-fast-v1-evidence
          path: evidence/buehler-graphene-fast-v1
          if-no-files-found: error

  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn pyarrow huggingface_hub
      - name: Probe exact graphene sources
        run: python experiments/buehler_graphene_exact_probe.py
      - name: Mine exact graphene schemas
        run: python experiments/buehler_graphene_schema_mine.py
      - name: Run source-gated proxy control
        run: python experiments/buehler_physical_loop_v1.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buehler-physical-loop-v1-evidence
          path: |
            evidence/buehler-physical-loop-v1
            evidence/buehler-graphene-exact-v1
          if-no-files-found: error
