name: GOETH V22 Competing Valid FCU Replay (Fork Only)
on:
  push:
    branches:
      - research/goeth-v22-competing-valid
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact first-party GOETH experiment commit
        uses: actions/checkout@v4
        with:
          repository: metalogiclabs/go-ethereum
          # Cross-repository checkout resolves branch refs; the exact SHA
          # assertion in the next step rejects any moved branch head.
          ref: bal-engine-competing-valid-v22
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Pin input source and upstream Geth tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goeth-v22"
          test "$(git rev-parse HEAD)" = "e9d84f1007ee8200496ab2955d15975e832fa620"
          {
            echo "MATHGRAPH_QUALIFICATION_SOURCE=${GITHUB_SHA}"
            echo "GOETH_RESEARCH_COMMIT=$(git rev-parse HEAD)"
            echo "GOETH_RESEARCH_TREE=$(git rev-parse HEAD^{tree})"
          } | tee "$RUNNER_TEMP/goeth-v22/source.txt"
          git config user.name "Metalogic CI"
          git config user.email "ci@mathgraph.org"
          git fetch --no-tags https://github.com/ethereum/go-ethereum.git 3a6c2e3b35ef8caa3d39dcbea3fe9f09099cca8c
          git merge --no-edit FETCH_HEAD
          echo "GOETH_MERGED_SOURCE_TREE=$(git rev-parse HEAD^{tree})" | tee -a "$RUNNER_TEMP/goeth-v22/source.txt"
      - name: Execute authenticated serial and concurrent FCU schedules
        run: |
          set -euo pipefail
          gofmt -w eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_engine_concurrent_v20_test.go
          test -z "$(gofmt -l eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_engine_concurrent_v20_test.go)"
          set +e
          go test -tags balexperiment ./eth/catalyst -run '^(TestBALV20SerialInvalidFCUClearsPending|TestBALV21ConcurrentInvalidationSuppressesOldAdmission|TestBALV22ConcurrentNewerValidWitnessPrevails)$' -count=1 -v -timeout=35m 2>&1 | tee "$RUNNER_TEMP/goeth-v22/tests.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$RUNNER_TEMP/goeth-v22/go_test_exit.txt"
          if [ "$result" -ne 0 ]; then
            if grep -q "MG_BAL_V22_ORDER older_valid_fcu_paused_before_admission" "$RUNNER_TEMP/goeth-v22/tests.log" &&
               grep -q "MG_BAL_V22_ORDER newer_valid_fcu_admitted_different_finalized_hash" "$RUNNER_TEMP/goeth-v22/tests.log" &&
               grep -q "MG_BAL_V22_OBSTRUCTION OLD_FCU_OVERWROTE_NEW_VALID_WITNESS" "$RUNNER_TEMP/goeth-v22/tests.log"; then
              echo "V22_RESULT=NAMED_OBSTRUCTION;scope=newer_valid_fcu_witness_overwritten" | tee "$RUNNER_TEMP/goeth-v22/boundary.txt"
              exit 0
            fi
            echo "V22_RESULT=UNKNOWN;reason=native_test_failed_or_setup_incomplete" | tee "$RUNNER_TEMP/goeth-v22/boundary.txt"
            exit 1
          fi
          for test_case in TestBALV20SerialInvalidFCUClearsPending TestBALV21ConcurrentInvalidationSuppressesOldAdmission TestBALV22ConcurrentNewerValidWitnessPrevails; do
            passes="$(grep -Ec "^[[:space:]]*--- PASS: ${test_case} \(" "$RUNNER_TEMP/goeth-v22/tests.log" || true)"
            if [ "$passes" -ne 1 ]; then
              echo "V22_RESULT=UNKNOWN;reason=positive_test_count_mismatch;test=${test_case};passes=${passes}" | tee "$RUNNER_TEMP/goeth-v22/boundary.txt"
              exit 1
            fi
          done
          if grep -q "MG_BAL_V20_SERIAL_CONTROL_PASS authenticated_valid_then_invalid_clear" "$RUNNER_TEMP/goeth-v22/tests.log" &&
             grep -q "MG_BAL_V21_SUPERSESSION_PASS pending_empty_after_older_fcu_completed" "$RUNNER_TEMP/goeth-v22/tests.log" &&
             grep -q "MG_BAL_V22_ORDER older_valid_fcu_paused_before_admission" "$RUNNER_TEMP/goeth-v22/tests.log" &&
             grep -q "MG_BAL_V22_ORDER newer_valid_fcu_admitted_different_finalized_hash" "$RUNNER_TEMP/goeth-v22/tests.log" &&
             grep -q "MG_BAL_V22_COMPETING_VALID_PASS newer_witness_preserved_after_older_fcu_completed" "$RUNNER_TEMP/goeth-v22/tests.log"; then
            echo "V22_RESULT=BOUNDED_POSITIVE;scope=same_source_two_authenticated_valid_fcus;general_cross_fork_fcu=UNKNOWN" | tee "$RUNNER_TEMP/goeth-v22/boundary.txt"
          else
            echo "V22_RESULT=UNKNOWN;reason=missing_positive_order_or_witness" | tee "$RUNNER_TEMP/goeth-v22/boundary.txt"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goeth-v22-external-native-evidence
          path: ${{ runner.temp }}/goeth-v22/
          if-no-files-found: ignore
