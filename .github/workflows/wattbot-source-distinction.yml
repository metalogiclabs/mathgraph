name: WattBot source-distinction retrieval diagnostic
on:
  push:
    branches: [wattbot-source-distinction-v1]
    paths:
      - 'experiments/wattbot2026/source_refinement_probe.py'
      - 'experiments/wattbot2026/submit_full_reader.py'
      - '.github/workflows/wattbot-source-distinction.yml'
jobs:
  citation-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official-data and PDF tools
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Deterministic ranking and source distinction controls
        run: python experiments/wattbot2026/source_refinement_probe.py --self-test
      - name: Evaluate source recall using only development TRAIN labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/source_refinement_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Authority boundary
        run: |
          echo "This only measures TRAIN citation retrieval upper bounds."
          echo "No LLM requests, protected-test labels, Kaggle submissions or prediction artifacts."
          echo "A better citation recall is not yet a better Kaggle leaderboard score."
