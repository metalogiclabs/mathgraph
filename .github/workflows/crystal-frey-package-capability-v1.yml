name: Crystal FreyPackage Capability Promotion V1

on:
  push:
    branches:
      - crystal-corpus-wide-bridge-scout-v1
    paths:
      - 'mathgraph/frey_package_capability.py'
      - 'tests/test_frey_package_capability.py'
      - 'evidence/crystal-frey-package-reconciliation-v1.json'
      - '.github/workflows/crystal-frey-package-capability-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - name: Check FreyPackage compiler
        run: python -m pytest -q tests/test_frey_package_capability.py
      - name: Compile canonical FreyPackage capability
        run: |
          mkdir -p artifacts/crystal_frey_package_capability_v1
          python - <<'PY'
          import json
          from pathlib import Path
          from mathgraph.frey_package_capability import compile_authority_file

          out=compile_authority_file(
              "evidence/crystal-frey-package-reconciliation-v1.json",
              "artifacts/crystal_frey_package_capability_v1/capability.json",
          )
          out["status"]="REUSABLE"
          Path("artifacts/crystal_frey_package_capability_v1/capability.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-frey-package-capability-v1
          path: artifacts/crystal_frey_package_capability_v1/capability.json
