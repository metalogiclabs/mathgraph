name: VDN ARC-AGI-2 parser portal v17
on:
  push:
    branches: [vdn-arc2-meta-v11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser-portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Run parser portal test
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v17_parser_portal.py /tmp/ARC-AGI-2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-parser-portal-v17
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v17_parser_portal/result.json
