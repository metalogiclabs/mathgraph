name: Crystal Chess Time Management Ablation V51

on:
  push:
    branches:
      - crystal-chess-timemgmt-ablation-v51
    paths:
      - "experiments/crystal_chess_timemgmt_ablation_v51.py"
      - ".github/workflows/crystal-chess-timemgmt-ablation-v51.yml"
      - "experiments/crystal_chess_normal_exposure_v22.py"
  workflow_dispatch:

jobs:
  ablation-match:
    strategy:
      fail-fast: false
      matrix:
        variant: [stable, effort, both]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_timemgmt_ablation_v51.py
          python -m py_compile experiments/crystal_chess_normal_exposure_v22.py

      - name: Build pinned baseline Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish-base
          git -C /tmp/stockfish-base checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish-base/src -j2 build ARCH=x86-64
          /tmp/stockfish-base/src/stockfish bench 16 1 3 default depth > /tmp/baseline-bench.txt 2>&1

      - name: Patch residual-earned candidate
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cp -a /tmp/stockfish-base /tmp/stockfish-cand
          mkdir -p "artifacts/crystal-chess-v51/$VARIANT"
          python - <<'PY'
          import os,re
          from pathlib import Path
          variant=os.environ['VARIANT']
          p=Path('/tmp/stockfish-cand/src/search.cpp')
          s=p.read_text()
          stable=r'''timeReduction = std::clamp\(
          \s*interpolate\(double\(rootDepth - lastBestMoveDepth\), 4\.96, 18\.79, 0\.639, 1\.712\), 0\.629,
          \s*1\.544\);'''
          effort=r'''double highBestMoveEffort = std::clamp\(
          \s*interpolate\(i64\(nodesEffort\), i64\(75800\), i64\(104510\), 0\.969, 0\.714\), 0\.693, 0\.838\);'''
          if variant in ('stable','both'):
              s,n=re.subn(stable,'timeReduction = 1.0;',s,count=1)
              assert n==1, ('stable patch drift',n)
          if variant in ('effort','both'):
              s,n=re.subn(effort,'double highBestMoveEffort = 1.0;',s,count=1)
              assert n==1, ('effort patch drift',n)
          p.write_text(s)
          PY
          git -C /tmp/stockfish-cand diff -- src/search.cpp > "artifacts/crystal-chess-v51/$VARIANT/stockfish.patch"
          test -s "artifacts/crystal-chess-v51/$VARIANT/stockfish.patch"
          make -C /tmp/stockfish-cand/src -j2 build ARCH=x86-64
          /tmp/stockfish-cand/src/stockfish bench 16 1 3 default depth > "artifacts/crystal-chess-v51/$VARIANT/candidate-bench.txt" 2>&1

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Disservin/fastchess.git /tmp/fastchess
          git -C /tmp/fastchess checkout 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          make -C /tmp/fastchess -j2

      - name: Generate untouched normal opening book
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish-base/src/stockfish             --book "artifacts/crystal-chess-v51/$VARIANT/normal.epd"             --manifest "artifacts/crystal-chess-v51/$VARIANT/normal_manifest.json"             --openings 256 --plies 12 --depth 6 --multipv 4 --seed 20261102

      - name: Run paired same-clock match
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          candidate="Crystal$VARIANT"
          /tmp/fastchess/fastchess             -engine cmd=/tmp/stockfish-cand/src/stockfish name="$candidate"             -engine cmd=/tmp/stockfish-base/src/stockfish name=StockfishBaseline             -each tc=1+0.01 option.Threads=1 option.Hash=16 option.Ponder=false             -openings file="artifacts/crystal-chess-v51/$VARIANT/normal.epd" format=epd order=sequential             -rounds 256 -repeat -concurrency 4             -pgnout file="artifacts/crystal-chess-v51/$VARIANT/match.pgn"             -log file="artifacts/crystal-chess-v51/$VARIANT/fastchess.log" level=info             | tee "artifacts/crystal-chess-v51/$VARIANT/fastchess.stdout"

      - name: Analyse candidate Elo
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          candidate="Crystal$VARIANT"
          python experiments/crystal_chess_timemgmt_ablation_v51.py             --pgn "artifacts/crystal-chess-v51/$VARIANT/match.pgn"             --candidate-name "$candidate"             --variant "$VARIANT"             --output "artifacts/crystal-chess-v51/$VARIANT/result.json"             | tee "artifacts/crystal-chess-v51/$VARIANT/analyse.log"
          grep -q "CRYSTAL_CHESS_TIMEMGMT_ABLATION_V51=PASS" "artifacts/crystal-chess-v51/$VARIANT/analyse.log"
          cp /tmp/baseline-bench.txt "artifacts/crystal-chess-v51/$VARIANT/"
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > "artifacts/crystal-chess-v51/$VARIANT/STOCKFISH_PIN.txt"
          printf '%s\n' "Disservin/fastchess@60d7a7a26c6b0582a15c112fb29a1829bef2adb3" > "artifacts/crystal-chess-v51/$VARIANT/FASTCHESS_PIN.txt"

      - name: Upload V51 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-timemgmt-ablation-v51-${{ matrix.variant }}
          path: artifacts/crystal-chess-v51/${{ matrix.variant }}/
          if-no-files-found: error
