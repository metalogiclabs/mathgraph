name: PKC physical declaration type change and restoration V7

on:
  push:
    branches:
      - research/pkc-physical-type-withdrawal-v1-20261019
    paths:
      - 'research/pkc_type_withdrawal_v1/**'
      - '.github/workflows/pkc-physical-type-withdrawal-v7.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sysml-to-lean-causal:
    name: Physical source declaration-type switch with unchanged semantic interpretation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout evidence protocols and frozen interpreter
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exactly pinned NASA/JPL source
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/PropertyKindCalculus
          ref: e0deb453e05ffa63297d9704ceb47d0855193824
          path: target
          submodules: false
          persist-credentials: false
      - name: Verify exact source and experiments without drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "e0deb453e05ffa63297d9704ceb47d0855193824"
          test "$(cat target/lean-toolchain)" = "leanprover/lean4:v4.34.0"
          git show 784b9b59bc3b036e0e9f7a6e97d506979a0da174:research/pkc_typed_statement_v1/Check.lean > /tmp/pkc-v6-frozen-check.lean
          cmp /tmp/pkc-v6-frozen-check.lean research/pkc_typed_statement_v1/Check.lean
          git show 784b9b59bc3b036e0e9f7a6e97d506979a0da174:research/cross_domain_correspondence_v1/protocol.py > /tmp/cross-domain-v1-frozen.py
          cmp /tmp/cross-domain-v1-frozen.py research/cross_domain_correspondence_v1/protocol.py
          test "$(git hash-object research/pkc_typed_statement_v1/Check.lean)" = "88914d5c6cd38dc55ffe555d11320f15aeb88bfe"
          sha256sum research/pkc_type_withdrawal_v1/{PROTOCOL.md,make_probe.py,mutate.py,audit.py,run.sh}
      - name: Install immutable OpenSysML v0.9.1 release and check publisher SHA256
        shell: bash
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/opensysml-v0.9.1"
          mkdir -p "$path/extract"
          release="https://github.com/Open-MBEE/OpenSysML/releases/download/v0.9.1"
          curl -fsSL --retry 2 "$release/SHA256SUMS.txt" -o "$path/SHA256SUMS.txt"
          curl -fsSL --retry 2 "$release/sysml-linux-amd64.tar.gz" -o "$path/sysml-linux-amd64.tar.gz"
          python3 - "$path" <<'PY'
          import hashlib, pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          records=[line for line in (root/"SHA256SUMS.txt").read_text().splitlines()
                   if line.split() and line.split()[-1].lstrip("*").rsplit("/",1)[-1]
                      == "sysml-linux-amd64.tar.gz"]
          if len(records) != 1:
              raise SystemExit(f"CHECKSUM_RECORD_COUNT_MISMATCH {len(records)}")
          matched=re.search(r"(?i)(?<![a-f0-9])[a-f0-9]{64}(?![a-f0-9])",records[0])
          if matched is None: raise SystemExit("NO_SHA256_DIGEST_IN_RELEASE_RECORD")
          expected=matched.group().lower()
          actual=hashlib.sha256((root/"sysml-linux-amd64.tar.gz").read_bytes()).hexdigest()
          if expected != actual: raise SystemExit("SIGNED_RELEASE_CHECKSUM_MISMATCH")
          (root/"selected-checksum.txt").write_text(f"{expected}  sysml-linux-amd64.tar.gz\\n")
          print(f"OPENSYSML_RELEASE_SHA256_VERIFIED {actual}")
          PY
          tar -xzf "$path/sysml-linux-amd64.tar.gz" -C "$path/extract"
          binary="$(python3 - "$path/extract" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          candidates=[]
          for p in root.rglob("*"):
              if not p.is_file(): continue
              with p.open("rb") as f: magic=f.read(4)
              if magic==bytes([0x7f,0x45,0x4c,0x46]): candidates.append(p)
          if len(candidates)!=1:
              raise SystemExit(f"OPEN_SYSML_ELF_BINARY_COUNT {len(candidates)}")
          print(candidates[0])
          PY
          )"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" --version 2>&1 | tee "$path/converter-version.txt"
          grep -F '0.9.1' "$path/converter-version.txt"
          echo "SYSML=$binary" >> "$GITHUB_ENV"
      - name: Install source-locked Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
      - name: Hydrate source-declared FloatLib exact commit
        shell: bash
        run: |
          set -euo pipefail
          root="target/.lake/packages/floatlib"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/lean-dojo/FloatLib.git
          git -C "$root" -c protocol.version=2 fetch --depth=1 --no-tags origin \
            5f8218dc571c01d6f8bd070c65bcd0de3a40b3c5
          git -C "$root" checkout -q --detach 5f8218dc571c01d6f8bd070c65bcd0de3a40b3c5
          test "$(git -C "$root" rev-parse HEAD)" = "5f8218dc571c01d6f8bd070c65bcd0de3a40b3c5"
      - name: Hydrate source-declared TorchLean exact commit (unmodified)
        shell: bash
        run: |
          set -euo pipefail
          root="target/.lake/packages/TorchLean"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/NicolasRouquette/TorchLean.git
          git -C "$root" -c protocol.version=2 fetch --depth=1 --no-tags origin \
            f12547fa82cc55210553d64b88af81ba5df8f6a3
          git -C "$root" checkout -q --detach f12547fa82cc55210553d64b88af81ba5df8f6a3
          test "$(git -C "$root" rev-parse HEAD)" = "f12547fa82cc55210553d64b88af81ba5df8f6a3"
      - name: Optional authenticated upstream Mathlib cache
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cd target
          "$HOME/.elan/bin/lake" exe cache get 2>&1 \
            | tee "$RUNNER_TEMP/jpl-pkc-v5-cache.log"
      - name: Authenticate and retrieve original seven-case V6 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/metalogiclabs/mathgraph/actions/artifacts/12160348478 --jq .digest)" = "sha256:83e601483fe442a68ec139fb569295dba6256065638049159e724039f4d07740"
          test "$(gh api repos/metalogiclabs/mathgraph/actions/artifacts/12160348478 --jq .expired)" = false
          test "$(gh api repos/metalogiclabs/mathgraph/actions/artifacts/12160348478 --jq .workflow_run.head_sha)" = 784b9b59bc3b036e0e9f7a6e97d506979a0da174
          mkdir -p evidence-v6
          gh run download 39192976898 --repo metalogiclabs/mathgraph --name pkc-typed-nonempty-correspondence-v6 --dir evidence-v6
      - name: Execute BASE → MUTANT → RESTORED pinned source/native contrast
        shell: bash
        run: |
          set -euo pipefail
          bash research/pkc_type_withdrawal_v1/run.sh
      - name: Archive raw physical source mutation, native builds, verdicts and restoration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkc-physical-type-withdrawal-v7
          path: |
            research/pkc_type_withdrawal_v1/
            !research/pkc_type_withdrawal_v1/__pycache__/**
            ${{ runner.temp }}/opensysml-v0.9.1/selected-checksum.txt
            ${{ runner.temp }}/opensysml-v0.9.1/converter-version.txt
          if-no-files-found: ignore
