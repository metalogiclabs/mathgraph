name: Crystal Chess Hybrid Guard Transfer V15

on:
  push:
    branches:
      - crystal-chess-hybrid-guard-transfer-v15
    paths:
      - "experiments/crystal_chess_hybrid_guard_transfer_v15.py"
      - ".github/workflows/crystal-chess-hybrid-guard-transfer-v15.yml"
      - "experiments/crystal_chess_verified_hybrid_search_v14.py"
      - "experiments/crystal_chess_interaction_law_v7.py"
      - "experiments/crystal_chess_kppvk_complete_census_v12.py"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  prospective-guard-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Compile V15
        run: python -m py_compile experiments/crystal_chess_hybrid_guard_transfer_v15.py

      - name: Download frozen V14 guard artifact
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-verified-hybrid-search-v14
          path: /tmp/v14-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36357299241

      - name: Verify frozen V14 guard identity
        run: |
          set -euo pipefail
          test -s /tmp/v14-artifact/crystal_chess_verified_hybrid_guard_v14.jsonl.gz
          sha256sum /tmp/v14-artifact/crystal_chess_verified_hybrid_guard_v14.jsonl.gz
          test "$(sha256sum /tmp/v14-artifact/crystal_chess_verified_hybrid_guard_v14.jsonl.gz | awk '{print $1}')" = "10bb241dbadaa3b8229196ccf6e11587abd69554ff61802343451a4e691a7baa"

      - name: Acquire exact five-piece Syzygy WDL authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw KPPvK.rtbw KPPPvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Prospectively transfer frozen guard to complete K+3P boundary
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v15
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v15/
          cp /tmp/v14-artifact/crystal_chess_verified_hybrid_guard_v14.jsonl.gz artifacts/crystal-chess-v15/
          python experiments/crystal_chess_hybrid_guard_transfer_v15.py             --tablebase-dir /tmp/syzygy             --guard /tmp/v14-artifact/crystal_chess_verified_hybrid_guard_v14.jsonl.gz             --output artifacts/crystal-chess-v15/crystal_chess_hybrid_guard_transfer_v15.json             | tee artifacts/crystal-chess-v15/run.log

      - name: Upload V15 evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-hybrid-guard-transfer-v15
          path: artifacts/crystal-chess-v15/
          if-no-files-found: error
