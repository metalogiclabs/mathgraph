name: WattBot exact full pinned corpus quote reclosure qualification
on:
  push:
    branches: [wattbot-full-quote-reclosure-v1]
    paths:
      - '.github/workflows/wattbot-full-quote-reclosure.yml'
      - 'experiments/wattbot2026/full_quote_reclosure.py'
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
jobs:
  exact-page-reclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official scorer and scientific source dependencies
        run: python -m pip install kaggle pandas numpy pymupdf requests
      - name: Test exact quote outside six passages, ambiguity and independent page checker
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/full_quote_reclosure.py
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Measure unique all-PDF quotation reclosure under same 63 TRAIN model replies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Source and score authority
        run: |
          echo "Question and model outputs frozen before searching PDF corpus for verbatim quote."
          echo "Ambiguous and absent source quotations remain unverified and are NOT promoted."
          echo "Entire corpus already pinned by SHA-256; no new sources or model calls."
          echo "TRAIN-only official Score.py with 63 previously inspected questions."
          echo "Literal occurrence is not scientific entailment; no hidden TEST or Kaggle submission."
