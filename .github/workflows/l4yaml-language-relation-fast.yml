name: L4YAML language relation fast

on:
  push:
    branches: [l4yaml-parser-boundary-v1]
    paths:
      - 'experiments/l4yaml/CapstoneObstruction.lean'
      - 'experiments/l4yaml/LanguageRelation.lean'
      - '.github/workflows/l4yaml-language-relation-fast.yml'
  workflow_dispatch:

jobs:
  relation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: 16562a74421f94cc0f8216eecf21f1ff58166fa7
          path: upstream
          submodules: recursive
      - name: Cache pinned L4YAML build
        uses: actions/cache@v4
        with:
          path: upstream/.lake/build
          key: l4yaml-16562a74421f94cc0f8216eecf21f1ff58166fa7-${{ runner.os }}
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean
        working-directory: upstream
        run: elan toolchain install "$(cat lean-toolchain)" || true
      - name: Build strictness dependency
        working-directory: upstream
        run: lake build L4YAML.Proofs.Production.DocumentProduction
      - name: Kernel-check strict language relation
        run: |
          cp experiments/l4yaml/CapstoneObstruction.lean upstream/CapstoneObstruction.lean
          cp experiments/l4yaml/LanguageRelation.lean upstream/LanguageRelation.lean
          cd upstream
          lake env lean -o .lake/build/lib/lean/CapstoneObstruction.olean CapstoneObstruction.lean
          lake env lean LanguageRelation.lean
