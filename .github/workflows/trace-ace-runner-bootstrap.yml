name: Bootstrap Trace Ace GPU Runner

on:
  push:
    paths:
      - .github/workflows/trace-ace-runner-bootstrap.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  issue-encrypted-token:
    runs-on: ubuntu-latest
    steps:
      - name: Issue and encrypt short-lived registration token
        env:
          GH_TOKEN: ${{ github.token }}
          PUBKEY_B64: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PUBKEY_B64" | base64 -d > runner-public.pem
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token" \
            > token.json
          TOKEN="$(jq -er '.token' token.json)"
          CIPHER="$(printf '%s' "$TOKEN" | openssl pkeyutl -encrypt -pubin -inkey runner-public.pem | base64 -w0)"
          echo "::add-mask::$CIPHER"
          echo "Encrypted runner token created."
          echo "RUNNER_TOKEN_CIPHERTEXT=$CIPHER"
