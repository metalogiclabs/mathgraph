name: G1 Check integration full regression
on:
  push:
    branches: [fix/g1-monitor-deny-unbound-requalification-20261104]
    paths:
      - '.github/workflows/g1-full-check-regression.yml'
      - 'integrations/mathgraph-check-github/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Execute every discovered MathGraph Check JavaScript test and count actual tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' alltests < <(find integrations/mathgraph-check-github -name '*.test.mjs' -type f -print0)
          test "${#alltests[@]}" -ge 13
          printf 'DISCOVERED_TEST_FILES=%s\n' "${#alltests[@]}"
          node --test --test-reporter=tap "${alltests[@]}" | tee /tmp/check-full-tests.tap
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/check-full-tests.tap').read_text()
          counters={}
          for line in text.splitlines():
              for key in ('tests','pass','fail','skipped','cancelled'):
                  if line.startswith('# '+key+' '):
                      counters[key]=int(line.split()[-1])
          import re
          allowlisted={
            ("actual pinned upstream source and JSONL are checked if fixture is present","Pinned upstream fixture supplied in replay CI only"),
            ("published GitHub artifact ZIP matches the independent digest, when supplied","Published ZIP is supplied out of band; it is not committed"),
            ("real host+ZIP+upstream produce correlated advisory evidence without a reviewer","Pinned upstream checkout supplied by CI"),
            ("allowlisted APPROVED declaration may attest review but never mathematically certify meaning","Pinned upstream checkout supplied by CI"),
            ("the separately pinned V2 replay workflow is eligible for the same bounded primary ZIP check","Pinned upstream checkout supplied by CI"),
            ("changed attempt, artifact digest or head on second readback withdraws result","Pinned upstream checkout supplied by CI"),
            ("full V2 collector binds both authenticated artifacts and pinned resolved environment","Pinned upstream checkout supplied by CI"),
            ("V2 collector rejects changing environment digest on final readback or wrong admin pin","Pinned upstream checkout supplied by CI"),
            ("the exact third-party Artin gold artifact is identified, not misreported as replayed","External upstream fixture is optional for the normal JS suite"),
          }
          skips=[]
          for line in text.splitlines():
              if ' # SKIP ' in line:
                  m=re.match(r'^ok [0-9]+ - (.*?) # SKIP (.*?)$',line)
                  assert m is not None, 'UNKNOWN_SKIPPED_CASE_SHAPE'
                  skips.append((m.group(1),m.group(2)))
          assert len(skips)==len(allowlisted)==9 and set(skips)==allowlisted, 'UNKNOWN_UNREVIEWED_SKIPS'
          assert counters.get('tests',0)>=347, 'UNKNOWN_INCOMPLETE_TEST_DISCOVERY'
          assert counters.get('skipped')==len(skips), 'UNKNOWN_SKIP_COUNTER_MISMATCH'
          assert counters.get('fail')==0 and counters.get('cancelled')==0, 'UNKNOWN_JS_TEST_FAILURE'
          assert counters.get('pass')==counters['tests']-len(skips), 'UNKNOWN_MISSING_TEST_OUTCOMES'
          print('PRODUCT_ASSERTIONS_PASSED',counters['pass'])
          print('EXTERNALLY_QUALIFIED_TESTS_UNKNOWN',len(skips))
          print('TOTAL_DISCOVERED_TESTS',counters['tests'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-full-check-test-evidence
          path: /tmp/check-full-tests.tap
          retention-days: 60
