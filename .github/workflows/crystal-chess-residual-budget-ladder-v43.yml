name: Crystal Chess Residual Budget Ladder V43

on:
  push:
    branches:
      - crystal-chess-residual-budget-ladder-v43
    paths:
      - "experiments/crystal_chess_residual_budget_ladder_v43.py"
      - ".github/workflows/crystal-chess-residual-budget-ladder-v43.yml"
      - "experiments/crystal_chess_normal_certificate_set_v41.py"
      - "experiments/crystal_chess_search_sufficiency_v25.py"
  workflow_dispatch:

jobs:
  residual-budget-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_residual_budget_ladder_v43.py

      - name: Download exact V42 residual
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-normal-certificate-width-v42
          path: /tmp/v42
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36519656689

      - name: Verify V42 residual identity
        run: |
          set -euo pipefail
          test -s /tmp/v42/result.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v42/result.json'))
          assert p['schema']=='mathgraph.crystal-chess.normal-certificate-width.v42'
          assert p['status']=='NO_NONTRIVIAL_ZERO_MISS_WIDTH'
          assert p['source']['authority_absent_both_top16']==19
          assert len(p['source']['variants']['union_top16']['miss_examples'])==19
          print('V42_RESIDUAL_IDENTITY=PASS')
          PY

      - name: Build pinned Stockfish authority
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/stockfish-bench.txt 2>&1

      - name: Run exact residual budget ladder
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v43
          python experiments/crystal_chess_residual_budget_ladder_v43.py             --stockfish /tmp/stockfish/src/stockfish             --v42-result /tmp/v42/result.json             --output artifacts/crystal-chess-v43/result.json             | tee artifacts/crystal-chess-v43/run.log
          grep -Eq "CRYSTAL_CHESS_RESIDUAL_BUDGET_LADDER_V43=(V42_RESIDUAL_IS_BUDGET_HORIZON_ONLY|V42_RESIDUAL_MIXES_BUDGET_AND_SEARCH_MODE|V42_RESIDUAL_NOT_RECOVERED_BY_100K_MULTIPV16)" artifacts/crystal-chess-v43/run.log
          cp /tmp/stockfish-bench.txt artifacts/crystal-chess-v43/

      - name: Upload V43 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-residual-budget-ladder-v43
          path: artifacts/crystal-chess-v43/
          if-no-files-found: error
