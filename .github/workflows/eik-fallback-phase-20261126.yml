name: EIK numerical fallback regression
on:
  push:
    branches: [research/eik-cell-entry-20261126]
    paths: ['.github/workflows/eik-fallback-phase-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: eik-public-frontier-20261126
          run-id: 45729980897
          github-token: ${{ github.token }}
          path: published-fixture
      - name: Pin the evaluator and test the residue contract
        run: |
          set -euo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          git -C kit checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          python -m pip install --require-hashes -r kit/requirements.txt
          python -m pip install numpy==2.3.5
          (cd kit && python -m eik setup)
          (cd research/eik && python -m unittest test_packed_residue -v)
      - name: Reproduce the numerical counterexample and corrected fallback
        env:
          EIK_THREADS: '1'
        run: |
          python research/eik/fallback_phase_replay.py \
            --baseline published-fixture/sources/entry49.c \
            --header kit/harness/eik.h --kit kit --out fallback-evidence
      - name: Preserve exact-source receipts
        if: always()
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,os
          p=pathlib.Path('fallback-evidence');p.mkdir(exist_ok=True)
          (p/'source-commit.txt').write_text(os.environ['GITHUB_SHA']+'\n')
          m={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file()}
          (p/'SHA256SUMS.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-fallback-phase-20261126
          path: fallback-evidence/
          if-no-files-found: error
