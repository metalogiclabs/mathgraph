          ! grep -E '(sorryAx|unknownConstant|ofReduceBool)' axioms.txt
      - name: Archive bounded model bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-logspace-model-bridge
          path: isolated/axioms.txt
          if-no-files-found: warn
