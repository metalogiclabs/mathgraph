name: ethereum-crystal-v5-heldout
on:
  push:
    branches: [ethereum-msi-consequential-interface-v1]
  workflow_dispatch:
jobs:
  heldout-family-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin EELS source and family names
        run: |
          curl -fsSL https://raw.githubusercontent.com/ethereum/execution-specs/84e7d2c266e3319fc3882e72f379282bb1c40f2d/tests/amsterdam/eip7928_block_level_access_lists/test_cases.md -o /tmp/test_cases.md
          for x in test_bal_noop_storage_write test_bal_delegated_storage_reads test_bal_delegated_storage_writes test_bal_withdrawal_contract_cross_index test_bal_consolidation_contract_cross_index test_bal_zero_value_transfer test_bal_contract_creation_mainnet test_bal_account_access_target test_bal_net_zero_balance_transfer; do grep -q "$x" /tmp/test_cases.md; done
      - name: Requalify Crystal v4
        run: python experiments/ethereum_crystal_v4/run.py
      - name: Run held-out protocol-family transfer
        run: python experiments/ethereum_crystal_v5/run.py
