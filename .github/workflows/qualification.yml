name: Autopilot public bounded qualification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout standalone distribution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact external source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pallets/itsdangerous
          ref: 672971d66a2ef9f85151e53283113f33d642dabd
          path: upstream_itsdangerous
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install bounded test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run independent test suite
        env:
          MATHGRAPH_PINNED_UPSTREAM: upstream_itsdangerous
        run: python -m unittest -v test_upstream_encoding_transfer test_upstream_transfer_cockpit test_upstream_nebius_agent test_paired_benchmark test_permitted_witness_audit test_merge_decision_lab test_model_observation_merge
      - name: Reproduce upstream separator and scripted repair
        run: |
          python upstream_encoding_transfer.py --upstream-checkout upstream_itsdangerous --report upstream-transfer-report.json
          python upstream_transfer_cockpit.py upstream-transfer-report.json --output upstream-transfer-cockpit.html
          python upstream_nebius_agent.py --provider scripted --upstream-checkout upstream_itsdangerous --report upstream-scripted-report.json
          python paired_benchmark.py --upstream-checkout upstream_itsdangerous --report paired-benchmark-report.json
          python permitted_witness_audit.py --upstream-checkout upstream_itsdangerous --report permitted-witness-report.json
          python merge_decision_lab.py --upstream-checkout upstream_itsdangerous --report merge-decision-report.json
          python model_observation_merge.py --provider scripted --upstream-checkout upstream_itsdangerous --report model-observation-offline-report.json
      - name: Independently check public no-login demo
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          url="https://mathgraph-autopilot-nebius-demo.metalogiclabs-check.workers.dev/"
          req=Request(url,headers={"User-Agent":"MathGraph-qualification/1.0"})
          with urlopen(req,timeout=25) as res:
              page=res.read(100000)
              assert res.status==200, res.status
              assert res.headers.get("Content-Type","").startswith("text/html")
          assert b"MathGraph Autopilot" in page
          assert b"OFFLINE" in page
          assert b"<select" in page
          assert b"40255882641" in page
          assert b"remains UNKNOWN until a valid private API credential" not in page
          print("PUBLIC_ANONYMOUS_DEMO_GREEN bytes=",len(page))
          PY
      - name: Package scoped MIT-licensed source (deterministic bytes)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          paths = [
              ".github/workflows/qualification.yml", ".gitignore",
              "LICENSE", "README.md", "EVIDENCE.md", "BENCHMARK_PROTOCOL_20261026.md",
              "BENCHMARK_RESULTS_20261026.md", "NEBIUS_NVIDIA_FEEDBACK.md",
              "DEVPOST_FINAL_COPY.md", "LIVE_MODEL_MERGE_EVIDENCE_20261026.md", "requirements-dev.txt",
              "paired_benchmark.py", "test_paired_benchmark.py",
              "permitted_witness_audit.py", "test_permitted_witness_audit.py",
              "merge_decision_lab.py", "test_merge_decision_lab.py",
              "model_observation_merge.py", "test_model_observation_merge.py",
              "index.html", "upstream_encoding_transfer.py", "upstream_nebius_agent.py",
              "upstream_transfer_cockpit.py", "test_upstream_encoding_transfer.py",
              "test_upstream_nebius_agent.py", "test_upstream_transfer_cockpit.py",
          ]
          with ZipFile("autopilot-standalone-source.zip", "w") as z:
              for name in sorted(paths):
                  info = ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  z.writestr(info, Path(name).read_bytes())
          assert ZipFile("autopilot-standalone-source.zip").testzip() is None
          print("PACKAGED_STANDALONE_FILES", len(paths))
          PY
      - name: Upload source distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mathgraph-autopilot-scoped-mit-source
          if-no-files-found: error
          path: autopilot-standalone-source.zip
      - name: Retain offline evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autopilot-standalone-offline-evidence
          if-no-files-found: error
          path: |
            upstream-transfer-report.json
            upstream-transfer-cockpit.html
            upstream-scripted-report.json
            paired-benchmark-report.json
            permitted-witness-report.json
            merge-decision-report.json
            model-observation-offline-report.json
