name: WattBot allowed answer-unit prompting qualification
on:
  push:
    branches: [wattbot-supplied-unit-reader-v1]
    paths:
      - 'experiments/wattbot2026/supplied_unit_reader_probe.py'
      - '.github/workflows/wattbot-supplied-unit-reader.yml'
jobs:
  supplied-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official frozen scorer and PDF dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Unit feature and source provenance controls
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/full_reader.py --self-test
          python experiments/wattbot2026/supplied_unit_reader_probe.py --self-test
      - name: Evaluate frozen 63 TRAIN questions with supplied output unit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/supplied_unit_reader_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Evidence, cost and data boundary
        run: |
          echo "answer_unit is provided in official TEST, not a hidden label."
          echo "Historical comparison is not same-run paired."
          echo "No protected TEST inference or Kaggle submission; no raw PDF/question artifacts."
