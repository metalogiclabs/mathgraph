name: MathGraph published Artin native controls
on:
  push:
    branches: ['feat/mathgraph-mention-agent-v1-20261102']
    paths:
      - '.github/workflows/mathgraph-mention-artin-controls.yml'
      - 'integrations/mathgraph-check-github/mention-artin-control-v1.mjs'
permissions:
  contents: read
jobs:
  native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify control logic
        run: node --test integrations/mathgraph-check-github/mention-artin-control-v1.test.mjs
      - name: Bind published exercise and pinned Lean bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artin-mention" "$RUNNER_TEMP/lean-428"
          curl --proto '=https' --tlsv1.2 -fL --retry 2 https://raw.githubusercontent.com/marcusm117/ProofNet-Verified/14879cb23e078d122adecd9578dd26a7304f753b/data/archive/proofnet-verified-4.28/proofnet-1.lean -o "$RUNNER_TEMP/artin-mention/published-exercise.lean.txt"
          echo "a9ea15e08b984edb0690348b953a11bf0a1c2cd2541131323c26c243f21ee7fc  $RUNNER_TEMP/artin-mention/published-exercise.lean.txt" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -fL --retry 2 https://github.com/leanprover/lean4/releases/download/v4.28.0/lean-4.28.0-linux.tar.zst -o "$RUNNER_TEMP/lean-428.tar.zst"
          echo "ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd  $RUNNER_TEMP/lean-428.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean-428.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean-428"
          echo "$RUNNER_TEMP/lean-428/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen Mathlib environment
        working-directory: ${{ runner.temp }}/artin-mention
        run: |
          set -euo pipefail
          printf '%s\n' 'leanprover/lean4:v4.28.0' > lean-toolchain
          cat > lakefile.lean <<'LEAN'
          import Lake
          open Lake DSL
          package MathGraphArtinControls where
          require mathlib from git "https://github.com/leanprover-community/mathlib4.git" @ "8f9d9cff6bd728b17a24e163c9402775d9e6a365"
          lean_lib Candidate where
          LEAN
          lake update
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lake-manifest.json'));if(d.packages.find(p=>p.name==='mathlib')?.rev!=='8f9d9cff6bd728b17a24e163c9402775d9e6a365')throw Error('MATHLIB_REVISION_MISMATCH')"
          lake exe cache get Mathlib/GroupTheory/Subgroup/Centralizer.lean
      - name: Check published original target and stronger-assumption control
        env:
          LEAN_NUM_THREADS: '1'
        run: node integrations/mathgraph-check-github/mention-artin-control-v1.mjs "$RUNNER_TEMP/artin-mention"
      - name: Preserve native receipt and resolved environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mathgraph-artin-mention-controls
          path: |
            ${{ runner.temp }}/artin-mention/artin-mention-native-receipt.json
            ${{ runner.temp }}/artin-mention/lake-manifest.json
            ${{ runner.temp }}/artin-mention/published-exercise.lean.txt
          retention-days: 14
          if-no-files-found: warn
