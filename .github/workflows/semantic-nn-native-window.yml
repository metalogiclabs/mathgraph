name: Pinned NN temporal monitor native qualification
on:
  push:
    branches: [research/semantic-discovery-six-case-20261126]
    paths:
      - research/semantic_discovery_six/post_trial/native_nn/**
      - research/semantic_discovery_six/post_trial/verify_clock_sources.py
      - .github/workflows/semantic-nn-native-window.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source projection contracts
        run: python3 -m unittest discover -s research/semantic_discovery_six/post_trial/native_nn -p 'test_*.py' -v
      - name: Recover exact author sources and active clock configurations
        run: |
          set -euo pipefail
          python3 research/semantic_discovery_six/post_trial/native_nn/prepare.py \
            --root "$RUNNER_TEMP/nn-source" --out "$RUNNER_TEMP/nn-native-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/nn-native-evidence/research-source-commit.txt"
      - name: Prepare pinned native tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nn-native-tools"
          curl --fail --location --silent --show-error \
            https://github.com/kind2-mc/kind2/releases/download/v2.3.0/kind2-v2.3.0-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/nn-native-tools/kind2.tar.gz"
          echo "7358812f361ff772f6b3951a5cfc6171b7a7dcfd2f27548b22d7b78893a7446e  $RUNNER_TEMP/nn-native-tools/kind2.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nn-native-tools/kind2.tar.gz" -C "$RUNNER_TEMP/nn-native-tools"
          python3 -m pip install --target "$RUNNER_TEMP/nn-native-tools/python" z3-solver==4.15.4.0
          rustup toolchain install 1.85.0 --profile minimal
      - name: Prove copied clock equations and compile the scoped monitor
        run: |
          set -euo pipefail
          python3 research/semantic_discovery_six/post_trial/native_nn/host_codegen.py \
            --kind2 "$RUNNER_TEMP/nn-native-tools/kind2" \
            --z3 "$RUNNER_TEMP/nn-native-tools/python/bin/z3" \
            --out "$RUNNER_TEMP/nn-native-evidence"
      - name: Inventory native evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'nn-native-evidence'
          root.mkdir(exist_ok=True)
          entries = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to(root).as_posix() for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'MANIFEST.sha256']
          (root / 'MANIFEST.sha256').write_text(chr(10).join(entries) + chr(10))
          PY
      - name: Preserve native evidence including failed qualifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-nn-native-window
          path: ${{ runner.temp }}/nn-native-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
