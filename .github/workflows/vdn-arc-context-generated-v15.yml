name: VDN ARC context-generated future quotient V15

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v15_context_generated_future_quotient.py"
      - ".github/workflows/vdn-arc-context-generated-v15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-generated-future-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V15 context-generated quotient
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v15_context_generated_future_quotient.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-context-generated-v15
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v15_context_generated_future_quotient/result.json
