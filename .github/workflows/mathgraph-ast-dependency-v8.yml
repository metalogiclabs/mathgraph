name: MathGraph v8 — dependency-omission prospective source trial
on:
  push:
    branches:
      - experiment/ast-obligation-dependency-v8-20261118
    paths:
      - .github/workflows/mathgraph-ast-dependency-v8.yml
      - experiments/source_obligation_selection/v8_dependency_payload.tar.gz.b64
permissions:
  contents: read
jobs:
  frozen-v8-openlayers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/source_obligation_selection/v8_dependency_payload.tar.gz.b64
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify frozen v8 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v8"
          base64 -d experiments/source_obligation_selection/v8_dependency_payload.tar.gz.b64 > "$RUNNER_TEMP/v8/src.tar.gz"
          echo "eea83d5bd5155c0eb2e67299e05022779279b928d934bb71fdd8dc7b585c5d37  $RUNNER_TEMP/v8/src.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/v8/src.tar.gz" -C "$RUNNER_TEMP/v8"
          cd "$RUNNER_TEMP/v8"
          echo "9f08311e2d4d9579f953a4294a0eee038cc38620189c0aa5b9c67e39142a23fe  mathgraph_ast_obligations_v8.js" | sha256sum -c -
          echo "22b6bc4aae123beded0db513dd1306bb7b4dc4f2c7ef1bbd27465aa21e0f5878  run_v8_source_pinned_trial.js" | sha256sum -c -
          echo "e7d885e37c4a3fa564ad8cf503125b056dcd3b26c0e2f893a94ecc68e6385efe  openlayers_v8_frozen_manifest.json" | sha256sum -c -
          echo "dff93dd97a6c75b58e13fd176e2de18cd0c03a3ac5bd3104104e10c6a0805011  mathgraph_ast_obligations_v7.js" | sha256sum -c -
          echo "7e38038012ce147372d30b435b9e8e5fb6833b5bc92d892bb6373523dfba1743  mathgraph_ast_obligations_v5.js" | sha256sum -c -
          echo "FROZEN_BLOB_MANIFEST_AND_ANALYZER_SHA256_PASS"
      - name: Re-run full synthetic and adversarial regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v8"
          npm install --no-save --no-audit --no-fund --ignore-scripts typescript@5.8.3
          node --test mathgraph_ast_obligations_v5.test.js mathgraph_ast_obligations_v5.adversarial.test.js mathgraph_ast_obligations_v6.test.js mathgraph_ast_obligations_v7.test.js mathgraph_ast_obligations_v8.test.js mathgraph_ast_obligations_v8.adversarial.test.js run_v8_source_pinned_trial.test.js | tee tests.tap
      - name: Run prospective OpenLayers 12-file frozen source trial
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v8"
          node run_v8_source_pinned_trial.js openlayers_v8_frozen_manifest.json > openlayers_v8_trial.json
          node - <<'NODE'
          const r = require('./openlayers_v8_trial.json');
          if (r.source_integrity !== 'PER_BLOB_CHECKED' || r.file_count !== 12 || r.qualified_verifier_runs !== 0 || r.claim_status !== 'UNKNOWN') process.exit(2);
          console.log(JSON.stringify({ref:r.ref,files:r.file_count,v7_hits:r.v7_hit_count,v8_hits:r.v8_hit_count,implicit_hits:r.implicit_hit_count,top3_v7:r.top3_v7.map(h=>({path:h.path,id:h.id,score:h.score})),top3_v8:r.top3_v8.map(h=>({path:h.path,id:h.id,score:h.score,origin:h.origin,omitted:h.omitted_dependencies})),size_baseline:r.size_baseline},null,2));
          NODE
          echo "OPENLAYERS_EXACT_SOURCE_AND_ADVISORY_BOUNDARY_GREEN"
      - name: Retrospective calibration on two exact source files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v8"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "https://raw.githubusercontent.com/nasa/openmct/e09bfaf47856b2b7ae2ea74334800b26fd27a41e/src/api/telemetry/TelemetryAPI.js" -o openmct.js
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "https://raw.githubusercontent.com/CesiumGS/cesium/4725bdf41ae454b538f2da3cffda88112334f6c1/packages/engine/Source/Core/ArcGISTiledElevationTerrainProvider.js" -o cesium.js
          test "$(git hash-object openmct.js)" = "944e467fc38a3b27b3e4e77dc6c75be20e34054a"
          test "$(git hash-object cesium.js)" = "d5504ce85a76e333d337b2aba3db3abc31d6d0a2"
          node - <<'NODE'
          const fs=require('node:fs'), {scan:v7}=require('./mathgraph_ast_obligations_v7'),{scan:v8}=require('./mathgraph_ast_obligations_v8');
          const output={};
          for(const [label,path] of [['openmct','openmct.js'],['cesium','cesium.js']]){
            const code=fs.readFileSync(path,'utf8');const a=v7(code,path),b=v8(code,path);
            output[label]={v7_hits:a.hotspots.length,v8_hits:b.hotspots.length,implicit:b.implicit_hotspot_count,top3:b.hotspots.slice(0,3).map(x=>({id:x.id,score:x.score,origin:x.origin,omitted:x.omitted_dependencies||[],consumer:x.consumer_demand?.classification}))};
          }
          fs.writeFileSync('known_source_controls.json',JSON.stringify(output,null,2));console.log(JSON.stringify(output));
          NODE
          echo "RETROSPECTIVE_CALIBRATION_SOURCE_PINNED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-v8-openlayers-prospective
          path: |
            ${{ runner.temp }}/v8/tests.tap
            ${{ runner.temp }}/v8/openlayers_v8_trial.json
            ${{ runner.temp }}/v8/known_source_controls.json
            ${{ runner.temp }}/v8/openlayers_v8_frozen_manifest.json
          if-no-files-found: warn
