name: Prune superseded public research artifacts

on:
  push:
    branches:
      - chore/prune-superseded-evidence-artifacts-20261027
    paths:
      - '.github/workflows/prune-superseded-research-artifacts.yml'

permissions:
  contents: read
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only the explicitly enumerated superseded archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          required_repo = "metalogiclabs/mathgraph"
          assert repo == required_repo, "REFUSE_WRONG_REPOSITORY"
          assert os.environ["GITHUB_REF"] == (
              "refs/heads/chore/prune-superseded-evidence-artifacts-20261027"
          ), "REFUSE_WRONG_BRANCH"

          # Exact artifact/run pairs from old source revisions; new
          # separately qualified artifacts on cleaned revisions are retained.
          expected = [
              (40444611292,12707851134,"mathgraph-claim-assurance-v1-pkc-sysml"),
              (40444646666,12707777059,"mathgraph-claim-assurance-v1-pkc-sysml"),
              (40444670120,12707920906,"mathgraph-claim-assurance-v1-pkc-sysml"),
              (40444937145,12708361306,"mathgraph-claim-assurance-v1-pkc-sysml"),
              (40444942254,12708241271,"mathgraph-claim-assurance-v1-pkc-sysml"),
              (40445566927,12708002714,"mathgraph-claim-assurance-v1-pkc-sysml"),
              (40445570801,12707883439,"mathgraph-claim-assurance-v1-pkc-sysml"),
              (40447509375,12708942567,"mathgraph-autonomous-rover-claim-assurance-v1"),
              (40447576405,12708767878,"mathgraph-autonomous-rover-claim-assurance-v1"),
              (40447607620,12709215947,"mathgraph-autonomous-rover-claim-assurance-v1"),
              (40447743899,12709565103,"mathgraph-autonomous-rover-claim-assurance-v1"),
              (40447749268,12709146303,"mathgraph-autonomous-rover-claim-assurance-v1"),
          ]

          token = os.environ["GH_TOKEN"]
          def request(method, artifact):
              path = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact}"
              req = urllib.request.Request(
                  path, method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "bounded-artifact-retention-reconcile",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, b""
                  raise

          # Validate *all* observable artifacts before deleting *any*.
          present = []
          for run_id, artifact_id, name in expected:
              status, raw = request("GET", artifact_id)
              if status == 404:
                  print("ALREADY_UNAVAILABLE", artifact_id)
                  continue
              assert status == 200, ("UNEXPECTED_INSPECTION_STATUS", artifact_id, status)
              metadata = json.loads(raw)
              assert metadata["id"] == artifact_id, "ARTIFACT_ID_CHANGED"
              assert metadata["name"] == name, "ARTIFACT_NAME_CHANGED"
              assert metadata["workflow_run"]["id"] == run_id, "ARTIFACT_RUN_CHANGED"
              assert metadata["created_at"].startswith("2026-10-27T"), "ARTIFACT_AGE_CHANGED"
              present.append(artifact_id)
          print("EXACT_ARTIFACTS_VALIDATED", len(present))

          for artifact_id in present:
              status, _ = request("DELETE", artifact_id)
              assert status in (204, 404), ("DELETE_REFUSED", artifact_id, status)
              print("REMOVED_OR_ABSENT", artifact_id, status)

          for artifact_id in present:
              status, _ = request("GET", artifact_id)
              assert status == 404, ("ARTIFACT_STILL_PRESENT", artifact_id, status)
          print("SUPERSEDED_ARTIFACT_CLEANUP_VERIFIED", len(present))
          PY
