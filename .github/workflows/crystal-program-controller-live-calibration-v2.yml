name: Crystal Programme Controller Live Calibration V2

on:
  push:
    branches: [crystal-program-controller-live-calibration-v2]
    paths:
      - 'experiments/crystal_program_controller_v1/shared_calibration_v2_ethereum_extension.json'
      - 'scripts/run_crystal_shared_calibration_v2_ethereum.py'
      - '.github/workflows/crystal-program-controller-live-calibration-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify chronology, identity, wall cost, and V22 result
        run: |
          python - <<'PY'
          import base64,datetime as dt,io,json,os,urllib.request,zipfile
          from pathlib import Path

          repo="metalogiclabs/mathgraph"
          token=os.environ["GH_TOKEN"]
          cfg=json.loads(Path(
            "experiments/crystal_program_controller_v1/shared_calibration_v2_ethereum_extension.json"
          ).read_text())
          sample=cfg["sample"]

          def api(url, raw=False):
              req=urllib.request.Request(
                url,
                headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"crystal-live-calibration-v2",
                },
              )
              with urllib.request.urlopen(req,timeout=90) as r:
                  data=r.read()
              return data if raw else json.loads(data)

          parent=api(
            f"https://api.github.com/repos/{repo}/actions/runs/{cfg['parent_calibration_run']}"
          )
          assert parent["conclusion"]=="success",parent["conclusion"]
          assert parent["head_sha"]==cfg["parent_calibration_head"],parent["head_sha"]

          commit=api(
            f"https://api.github.com/repos/{repo}/commits/{sample['source_head']}"
          )
          run=api(
            f"https://api.github.com/repos/{repo}/actions/runs/{sample['source_run']}"
          )
          assert run["conclusion"]=="success",run["conclusion"]
          assert run["head_sha"]==sample["source_head"],run["head_sha"]

          def ts(x): return dt.datetime.fromisoformat(x.replace("Z","+00:00"))
          parent_done=ts(parent["updated_at"])
          candidate_time=ts(commit["commit"]["author"]["date"])
          run_started=ts(run["run_started_at"])
          assert parent_done < candidate_time <= run_started,(parent_done,candidate_time,run_started)

          jobs=api(
            f"https://api.github.com/repos/{repo}/actions/runs/{sample['source_run']}/jobs?per_page=100"
          )["jobs"]
          job=next(x for x in jobs if x["id"]==sample["source_job"])
          assert job["conclusion"]=="success",job["conclusion"]
          wall=int((ts(job["completed_at"])-ts(job["started_at"])).total_seconds())
          assert wall==sample["job_wall_seconds"],(wall,sample["job_wall_seconds"])

          arts=api(
            f"https://api.github.com/repos/{repo}/actions/runs/{sample['source_run']}/artifacts"
          )["artifacts"]
          art=next(x for x in arts if x["id"]==sample["source_artifact"])
          assert art["digest"]==sample["source_artifact_digest"],(art["digest"],sample["source_artifact_digest"])

          encoded=api(
            f"https://api.github.com/repos/{repo}/contents/{sample['prospective_freeze_surface']}?ref={sample['source_head']}"
          )
          source=base64.b64decode(encoded["content"]).decode()
          assert "trials = 21" in source
          assert "WARRANTED_PERFORMANCE" in source
          assert "NARROWS" in source
          assert "REJECTS_DIRECTION" in source
          assert "len(digests) == 1" in source
          assert "len(pivots) == 1" in source
          assert "len(roots) == 1" in source
          assert "len(root_chains) == 1" in source
          assert "PROSPECTIVE_CLASSIFICATION_IN_ARTIFACT=true" in source

          blob=api(
            f"https://api.github.com/repos/{repo}/actions/artifacts/{sample['source_artifact']}/zip",
            raw=True,
          )
          z=zipfile.ZipFile(io.BytesIO(blob))
          names=z.namelist()
          result_name=next(x for x in names if x.endswith("crystal-v22-summary.json"))
          result=json.loads(z.read(result_name))
          assert result["classification"]==sample["terminal_classification"],result
          assert result["trials"]==21,result
          assert result["primary_apply_cpu_positive_pairs"]==18,result
          assert abs(result["primary_apply_cpu_paired_median_ratio"]-1.025429812960514)<1e-12
          low,high=result["primary_apply_cpu_bootstrap_95"]
          assert low>1 and high>low,(low,high)
          assert result["final_digest"]
          assert result["final_pivot_hash"]
          assert result["final_state_root"]
          assert result["root_chain_digest"]
          print(
            "ETHEREUM_V22_CALIBRATION_SOURCE_OK",
            "parent_done",parent["updated_at"],
            "candidate",commit["commit"]["author"]["date"],
            "run_start",run["run_started_at"],
            "wall",wall,
            "classification",result["classification"],
          )
          PY

      - name: Compute extended common measurement
        run: python scripts/run_crystal_shared_calibration_v2_ethereum.py

      - name: Assert completed-action comparison does not become forecast
        run: |
          python - <<'PY'
          import json
          p=json.load(open(
            "artifacts/crystal_program_controller_v1/shared_calibration_decision_v2_ethereum.json"
          ))
          assert p["status"]=="COMMON_MEASUREMENT_EXTENDED_NO_CURRENT_FORECAST",p
          assert p["completed_observed_order"]==["nucleus","ethereum","cross-prover"],p
          assert p["rates"]["nucleus"]>p["rates"]["ethereum"]>p["rates"]["cross-prover"],p
          assert p["selected_current_campaign_id"] is None,p
          print(
            "CRYSTAL_LIVE_CALIBRATION_V2=PASS",
            p["completed_observed_order"],
            p["rates"],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-program-controller-live-calibration-v2
          path: |
            experiments/crystal_program_controller_v1/shared_calibration_v2_ethereum_extension.json
            artifacts/crystal_program_controller_v1/shared_calibration_decision_v2_ethereum.json
          if-no-files-found: error
