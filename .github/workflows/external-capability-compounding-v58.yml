name: V58 Fresh External Capability Compounding

on:
  push:
    branches: [external-capability-compounding-v58]
    paths:
      - 'experiments/external_capability_compounding_v58/**'
      - '.github/workflows/external-capability-compounding-v58.yml'
  workflow_dispatch:

jobs:
  fresh-external-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned finite-model backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1

      - name: Freeze external corpus bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-v58
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl \
            -o external-v58/wrong-book-3000.jsonl
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl \
            -o external-v58/wrong-book-3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v58/wrong-book-3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v58/wrong-book-3500.jsonl" | sha256sum -c -
          echo "V58_FRESH_STREAM_FROZEN=rows_2628_2756"

      - name: Run frozen V58 prospective stream
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v58/run.py \
            --wrong-book-3000 external-v58/wrong-book-3000.jsonl \
            --wrong-book-3500 external-v58/wrong-book-3500.jsonl \
            --out external-v58/results

      - name: Preserve V58 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v58-fresh-external-capability-compounding
          path: external-v58/results/
