name: Crystal Cross-Prover Auto Family V1

on:
  push:
    branches:
      - crystal-cross-prover-auto-family-v1
    paths:
      - 'experiments/crystal_cross_prover_auto_family_v1/**'
      - 'mathgraph/cross_prover_family_discovery.py'
      - 'tests/test_cross_prover_family_discovery.py'
      - '.github/workflows/crystal-cross-prover-auto-family-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - name: Test family discovery kernel
        run: python -m pytest -q tests/test_cross_prover_family_discovery.py
      - name: Fetch exact PVS source family and discover semantic claims
        run: |
          set -euo pipefail
          mkdir -p /tmp/pvs-family artifacts/crystal_cross_prover_auto_family_v1
          BASE=https://raw.githubusercontent.com/j-tanner-slagel/pvs_cad/8750362e99c2ba0e9a0307dcaa39b9766c562feb/cad
          for f in cad_demo.pvs cad_demo.prf cad_examples.pvs cad_examples.prf cad_star_ex.pvs cad_star_ex.prf; do
            curl -fsSL -o "/tmp/pvs-family/$f" "$BASE/$f"
          done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from mathgraph.cross_prover_family_discovery import discover_family,render_lean_family

          m=json.loads(Path("experiments/crystal_cross_prover_auto_family_v1/manifest.json").read_text())
          by_path={}
          for row in m["source"]["files"]:
              by_path[Path(row["source_path"]).name]=row["source_blob_sha"]
              by_path[Path(row["proof_path"]).name]=row["proof_blob_sha"]

          def git_blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          for name,want in by_path.items():
              data=Path("/tmp/pvs-family",name).read_bytes()
              got=git_blob(data)
              assert got==want,(name,got,want)
              print("PIN_OK",name,got)

          sources={
              "cad_demo":Path("/tmp/pvs-family/cad_demo.pvs").read_text(),
              "cad_examples":Path("/tmp/pvs-family/cad_examples.pvs").read_text(),
              "cad_star_ex":Path("/tmp/pvs-family/cad_star_ex.pvs").read_text(),
          }
          d=discover_family(sources)
          assert d["supported_occurrence_count"]==8,d
          assert d["unique_canonical_claim_count"]==7,d
          assert d["duplicate_semantic_group_count"]==1,d
          dup=d["duplicate_semantic_groups"][0]
          assert dup["claim_id"]=="real.positive_product2@1",dup
          assert dup["source_occurrence_count"]==2,dup
          assert d["unsupported_occurrence_count"]>0,d

          out=Path("artifacts/crystal_cross_prover_auto_family_v1")
          out.joinpath("discovery.json").write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          lean=render_lean_family(d,skip_claim_ids=["real.amgm2@1"])
          out.joinpath("Surface.lean").write_text(lean)
          print(json.dumps({
              "source_lemmas":d["source_lemma_count"],
              "supported_occurrences":d["supported_occurrence_count"],
              "unsupported_occurrences":d["unsupported_occurrence_count"],
              "unique_claims":d["unique_canonical_claim_count"],
              "duplicates":d["duplicate_semantic_group_count"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-auto-family-discovery
          path: artifacts/crystal_cross_prover_auto_family_v1/

  pvs-replay:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install PVS runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates libgmp10
      - name: Install exact PVS 8.1.2
        run: |
          set -euo pipefail
          curl -fL -o /tmp/pvs.tgz https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  /tmp/pvs.tgz" | sha256sum -c -
          mkdir -p /tmp/pvs-dist
          tar -xzf /tmp/pvs.tgz -C /tmp/pvs-dist
          PVS_BIN="$(find /tmp/pvs-dist -maxdepth 3 -type f -name pvs -perm -u+x | head -1)"
          test -n "$PVS_BIN"
          PVS_DIR="$(dirname "$PVS_BIN")"
          echo "PVS_DIR=$PVS_DIR" >> "$GITHUB_ENV"
          "$PVS_BIN" --version
          test -x "$PVS_DIR/proveit"
      - name: Pin NASALib and PVS CAD
        run: |
          set -euo pipefail
          git init /tmp/nasalib
          git -C /tmp/nasalib remote add origin https://github.com/nasa/pvslib.git
          git -C /tmp/nasalib fetch --depth=1 origin e426f69dc2680ad575491f93c5a51739ec8b25fa
          git -C /tmp/nasalib checkout --detach FETCH_HEAD
          git init /tmp/pvs_cad
          git -C /tmp/pvs_cad remote add origin https://github.com/j-tanner-slagel/pvs_cad.git
          git -C /tmp/pvs_cad fetch --depth=1 origin 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          git -C /tmp/pvs_cad checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pvs_cad rev-parse HEAD)" = 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          ln -sfn /tmp/nasalib "$PVS_DIR/nasalib"
      - name: Replay all newly discovered PVS source occurrences
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal_cross_prover_auto_family_v1
          cd /tmp/pvs_cad/cad
          export PVS_LIBRARY_PATH=/tmp/nasalib
          "$PVS_DIR/proveit" -q --timeout 180 @cad_demo.s_pos             | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v1/pvs_demo.log"
          "$PVS_DIR/proveit" -q --timeout 180 @cad_examples.ex_sos:ex_sos_TCC1:ex_disc             | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v1/pvs_examples.log"
          "$PVS_DIR/proveit" -q --timeout 180 @cad_star_ex.s_pos:s_split:s_iff:s_div             | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v1/pvs_star.log"

          for log in "$GITHUB_WORKSPACE"/artifacts/crystal_cross_prover_auto_family_v1/pvs_*.log; do
            grep -q "Grand Totals:" "$log"
            if grep -Ei "unfinished|untried|unchecked" "$log"; then
              exit 1
            fi
          done
          cat > "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v1/pvs_replay.json" <<'EOF'
          {"status":"PVS_FAMILY_REPLAY_GREEN","new_source_occurrences":7,"auxiliary_tccs":1,"reused_existing_occurrences":1}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-auto-family-pvs
          path: artifacts/crystal_cross_prover_auto_family_v1/

  lean-replay:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cross-prover-auto-family-discovery
          path: /tmp/family
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check all six newly compiled Lean consumers
        run: |
          set -euo pipefail
          ROOT=/tmp/crystal-cross-prover-family-lean
          mkdir -p "$ROOT"
          cp /tmp/family/Surface.lean "$ROOT/Surface.lean"
          echo 'leanprover/lean4:v4.35.0-rc3' > "$ROOT/lean-toolchain"
          cat > "$ROOT/lakefile.toml" <<'EOF'
          name = "crystal-cross-prover-auto-family"
          version = "0.1.0"

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "3cb72cfd416d1b5ec4b930d67648ef036a5df24f"
          EOF
          cd "$ROOT"
          lake update
          lake exe cache get
          lake env lean Surface.lean
          mkdir -p "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v1"
          sha256sum Surface.lean > "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v1/lean_surface.sha256"
          cat > "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v1/lean_replay.json" <<'EOF'
          {"status":"LEAN_FAMILY_REPLAY_GREEN","new_unique_claims":6,"reused_existing_claims":1}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-auto-family-lean
          path: artifacts/crystal_cross_prover_auto_family_v1/

  promote:
    needs: [discover,pvs-replay,lean-replay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - uses: actions/download-artifact@v4
        with:
          name: cross-prover-auto-family-discovery
          path: /tmp/discovery
      - name: Compile qualified family and exact UNKNOWN residual
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal_cross_prover_auto_family_v1
          python - <<'PY'
          import json,os
          from pathlib import Path
          from mathgraph.cross_prover_family_discovery import compile_family_bundle

          d=json.loads(Path("/tmp/discovery/discovery.json").read_text())
          reused=["real.amgm2@1"]
          supported=sorted(x["claim_id"] for x in d["unique_claims"])
          fresh=sorted(set(supported)-set(reused))
          assert len(fresh)==6,(supported,fresh)

          obj=compile_family_bundle(
              d,
              reused_claim_ids=reused,
              newly_qualified_claim_ids=fresh,
              evidence_refs=[
                  f"github-run:{os.environ['RUN_ID']}:pvs-replay",
                  f"github-run:{os.environ['RUN_ID']}:lean-replay",
                  "evidence:crystal-cross-prover-cad-v1",
              ],
          )
          out={
              "schema":"mathgraph.crystal-cross-prover-auto-family-result.v1",
              "status":"WARRANTED_BOUNDED_AUTOMATIC_CROSS_PROVER_FAMILY",
              "run_id":int(os.environ["RUN_ID"]),
              "head_sha":os.environ["HEAD_SHA"],
              "source_lemma_count":d["source_lemma_count"],
              "supported_occurrence_count":d["supported_occurrence_count"],
              "unsupported_occurrence_count":d["unsupported_occurrence_count"],
              "unique_canonical_claim_count":d["unique_canonical_claim_count"],
              "duplicate_semantic_group_count":d["duplicate_semantic_group_count"],
              "reused_claim_ids":reused,
              "newly_qualified_claim_ids":fresh,
              "family_semantic_object_id":obj.id,
              "interfaces":list(obj.interfaces),
              "unsupported_disposition":"UNKNOWN_UNSUPPORTED_GRAMMAR",
              "systems_law":{
                  "name":"discover-normalize-dedupe-verify",
                  "statement":"A bounded cross-prover linker can discover semantic candidates from source shape rather than theorem names, quotient duplicate source surfaces by canonical claim, reuse existing warrant, independently check only new claims, and preserve unsupported source formulas as typed UNKNOWN."
              },
          }
          Path("artifacts/crystal_cross_prover_auto_family_v1/result.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-cross-prover-auto-family-v1
          path: artifacts/crystal_cross_prover_auto_family_v1/result.json
