name: Crystal Chess KRPvKRP Capability V24

on:
  push:
    branches:
      - crystal-chess-krpvkrp-capability-v24
    paths:
      - "experiments/crystal_chess_krpvkrp_capability_v24.py"
      - ".github/workflows/crystal-chess-krpvkrp-capability-v24.yml"
  workflow_dispatch:

jobs:
  krpvkrp-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_krpvkrp_capability_v24.py

      - name: Download frozen V22 normal-game corpus
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-normal-exposure-v22
          path: /tmp/v22
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36361812786

      - name: Verify V22 corpus identity
        run: |
          set -euo pipefail
          test -s /tmp/v22/match.pgn
          sha256sum /tmp/v22/match.pgn | tee /tmp/V22_PGN_SHA256.txt

      - name: Acquire exact KRPvKRP Syzygy WDL authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          w5="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          w6="https://tablebase.lichess.ovh/tables/standard/6-wdl"
          for f in KRPvKR.rtbw KRPvKP.rtbw KRvKP.rtbw KRvKR.rtbw KRPvK.rtbw KPvKP.rtbw KRvK.rtbw KPvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$w5/$f"
            test -s "/tmp/syzygy/$f"
          done
          curl --fail --location --retry 5 --retry-delay 2 -o /tmp/syzygy/KRPvKRP.rtbw "$w6/KRPvKRP.rtbw"
          test -s /tmp/syzygy/KRPvKRP.rtbw
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Acquire and qualify prospective KRPvKRP guard
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v24
          python experiments/crystal_chess_krpvkrp_capability_v24.py             --pgn /tmp/v22/match.pgn             --tablebase-dir /tmp/syzygy             --output artifacts/crystal-chess-v24/result.json             --guard-output artifacts/crystal-chess-v24/krpvkrp_guard_v24.json.gz             | tee artifacts/crystal-chess-v24/run.log
          grep -Eq "CRYSTAL_CHESS_KRPVKRP_CAPABILITY_V24=(WARRANTED_PROSPECTIVE_KRPVKRP_ACTION_GUARD|EXACT_KRPVKRP_HOLDOUT_RESIDUAL|NO_ZERO_ERROR_VALIDATION_GUARD)" artifacts/crystal-chess-v24/run.log
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v24/
          cp /tmp/V22_PGN_SHA256.txt artifacts/crystal-chess-v24/

      - name: Upload V24 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-krpvkrp-capability-v24
          path: artifacts/crystal-chess-v24/
          if-no-files-found: error
