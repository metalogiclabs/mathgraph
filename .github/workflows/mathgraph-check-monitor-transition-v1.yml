name: MathGraph Check queued monitor withdrawal qualification
on:
  pull_request:
    paths:
      - 'integrations/mathgraph-check-github/cloudflare/worker.mjs'
      - 'integrations/mathgraph-check-github/cloudflare/monitor-transition-v1*'
      - '.github/workflows/mathgraph-check-monitor-transition-v1.yml'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check integrations/mathgraph-check-github/cloudflare/worker.mjs
      - run: node --test integrations/mathgraph-check-github/cloudflare/consumer.test.mjs integrations/mathgraph-check-github/cloudflare/ingress.test.mjs integrations/mathgraph-check-github/cloudflare/monitor-transition-v1.test.mjs integrations/mathgraph-check-github/evidence-contract-v1.test.mjs integrations/mathgraph-check-github/check-resolve-monitor-v1.test.mjs integrations/mathgraph-check-github/authenticated-cycle-v1.test.mjs integrations/mathgraph-check-github/advisory-publisher-v1.test.mjs integrations/mathgraph-check-github/app-token-reconcile-v1.test.mjs
