name: WattBot official V1-V2 public result audit
on:
  push:
    branches: [wattbot-kaggle-status-v2]
    paths: ['.github/workflows/wattbot-kaggle-audit-v2.yml']
jobs:
  kaggle-authority:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install kaggle
      - name: Read completed Kaggle submission public scores
        run: kaggle competitions submissions -c WattBot2026
      - name: Public team rank and score target
        run: kaggle competitions leaderboard WattBot2026 --show
      - name: Scope
        run: echo "Official public Kaggle authority only; never claim private test score."
