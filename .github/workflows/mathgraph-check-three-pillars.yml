name: MathGraph Check — Check Resolve Monitor
on:
  pull_request:
    paths:
      - 'integrations/mathgraph-check-github/check-resolve-monitor-v1*'
      - 'integrations/mathgraph-check-github/evidence-contract-v1*'
      - '.github/workflows/mathgraph-check-three-pillars.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/mathgraph-check-github/evidence-contract-v1.test.mjs integrations/mathgraph-check-github/check-resolve-monitor-v1.test.mjs
