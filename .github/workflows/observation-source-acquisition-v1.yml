name: Observation source acquisition V1 bounded qualification
on:
  push:
    branches:
      - research/observation-source-acquisition-v1-20261022
  workflow_dispatch:
jobs:
  source-search-and-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restricted prospective source selection and independent CRC oracle
        run: python research/observation_source_acquisition_v1/prospective.py
