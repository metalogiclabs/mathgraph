name: Crystal Literature Heldout Transfer V4

on:
  push:
    branches:
      - crystal-literature-heldout-transfer-v4
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -e ".[all]"
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - name: Prove Crystal, claim dialect, and V3 interpreter frozen
        run: |
          git diff --exit-code 7c26a228971132a6c40920fd974dbd3f95b294f6 -- mathgraph/crystal.py
          git diff --exit-code 7c26a228971132a6c40920fd974dbd3f95b294f6 -- mathgraph/math_claim.py
          git diff --exit-code 7c26a228971132a6c40920fd974dbd3f95b294f6 -- mathgraph/extraction_contract.py
      - name: Run held-out transfer
        run: python scripts/run_crystal_literature_heldout_transfer_v4.py
      - name: Upload held-out evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-literature-heldout-transfer-v4-evidence
          path: evidence/crystal-literature-heldout-transfer-v4/
          if-no-files-found: error
