name: LeanEval carrier zero bridge probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  carrier-zero-bridge:
    if: github.head_ref == 'lean-eval-multitarget-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: annals_erdos_supersingular_primes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Verify valuation zero bridge
        working-directory: /tmp/${{ env.TARGET }}
        run: |
          cat > Submission.lean <<'LEAN'
          import ChallengeDeps
          import Mathlib.NumberTheory.Padics.PadicVal.Basic

          set_option autoImplicit false
          namespace ErdosSupersingularPrimes

          theorem carrier_zero_bridge (p : ℕ) (z : ℤ)
              (hnot : ¬ (p : ℤ) ∣ z) :
              padicValRat p (z : ℚ) = 0 := by
            rw [padicValRat.of_int]
            exact_mod_cast padicValInt.eq_zero_of_not_dvd (p := p) hnot

          end ErdosSupersingularPrimes
          LEAN
          set +e
          lake build Submission > /tmp/carrier-zero-bridge.log 2>&1
          code=$?
          cat /tmp/carrier-zero-bridge.log
          echo "CARRIER_ZERO_BRIDGE_GATE exit=$code"
          exit $code
