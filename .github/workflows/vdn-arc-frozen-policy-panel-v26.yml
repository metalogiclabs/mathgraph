name: VDN ARC frozen-policy target panel V26

on:
  push:
    branches:
      - mathgraph/msi-arc-pikpi-v11-20260828
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v26_frozen_policy_target_panel.py'
      - '.github/workflows/vdn-arc-frozen-policy-panel-v26.yml'
  workflow_dispatch:

jobs:
  frozen-policy-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V26 frozen-policy target panel
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v26_frozen_policy_target_panel.py /tmp/ARC-AGI-1/data
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-frozen-policy-panel-v26
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v26_frozen_policy_target_panel/result.json
