name: WattBot pinned report manifest discrepancy audit
on:
  push:
    branches: [wattbot-report-pin-audit-v1]
    paths:
      - 'experiments/wattbot2026/report_pin_probe.py'
      - '.github/workflows/wattbot-report-pin-audit.yml'
permissions:
  contents: read
jobs:
  report-source-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install constrained pinned metadata/PDF adapter
        run: python -m pip install kaggle requests pymupdf
      - name: Independently test loader's approved-host and redirect restrictions
        run: python experiments/wattbot2026/report_pin_probe.py --self-test
      - name: Fetch authorized source records and audit only eight report hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/report_pin_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Epistemic boundary
        run: |
          echo "No source bytes or question rows published."
          echo "Changed source hash or failed access is UNKNOWN; no submission generated."
