# Trigger V23 after workflow registration.
name: Crystal Chess Stockfish Search Node Census V23

on:
  push:
    branches:
      - crystal-chess-search-node-census-v23
    paths:
      - "experiments/patch_stockfish_material_census_v23.py"
      - "experiments/crystal_chess_stockfish_node_census_v23.py"
      - ".github/workflows/crystal-chess-search-node-census-v23.yml"
  workflow_dispatch:

jobs:
  node-census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install driver dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999"
          python -m py_compile experiments/crystal_chess_stockfish_node_census_v23.py

      - name: Clone and build pinned baseline Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          cp /tmp/stockfish/src/stockfish /tmp/stockfish-baseline
          /tmp/stockfish-baseline bench 16 1 3 default depth > /tmp/baseline-bench.txt 2>&1

      - name: Apply diagnostic-only material census patch
        run: |
          set -euo pipefail
          python experiments/patch_stockfish_material_census_v23.py /tmp/stockfish/src/search.cpp
          git -C /tmp/stockfish diff --check
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/instrumented-bench.txt 2>&1
          base_nodes="$(grep -E 'Nodes searched' /tmp/baseline-bench.txt | tail -1 | awk '{print $3}')"
          inst_nodes="$(grep -E 'Nodes searched' /tmp/instrumented-bench.txt | tail -1 | awk '{print $3}')"
          echo "baseline_bench_nodes=$base_nodes"
          echo "instrumented_bench_nodes=$inst_nodes"
          test "$base_nodes" = "$inst_nodes"

      - name: Run internal search-node census
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v23
          python experiments/crystal_chess_stockfish_node_census_v23.py             --generator-stockfish /tmp/stockfish-baseline             --instrumented-stockfish /tmp/stockfish/src/stockfish             --openings 64             --plies 12             --opening-depth 6             --multipv 4             --nodes 100000             --seed 20260928             --output artifacts/crystal-chess-v23/result.json             | tee artifacts/crystal-chess-v23/run.log
          grep -Eq "CRYSTAL_CHESS_STOCKFISH_NODE_CENSUS_V23=(WARRANTED_SEARCH_NODE_RESIDUAL_CENSUS|NO_SIX_PIECE_SEARCH_RESIDUAL_OBSERVED)" artifacts/crystal-chess-v23/run.log
          cp /tmp/baseline-bench.txt artifacts/crystal-chess-v23/
          cp /tmp/instrumented-bench.txt artifacts/crystal-chess-v23/
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > artifacts/crystal-chess-v23/STOCKFISH_PIN.txt

      - name: Upload V23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-stockfish-node-census-v23
          path: artifacts/crystal-chess-v23/
          if-no-files-found: error
