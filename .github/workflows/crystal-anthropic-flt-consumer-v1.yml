name: Crystal Anthropic FLT Consumer V1

on:
  push:
    branches:
      - crystal-anthropic-flt-consumer-v1
    paths:
      - 'experiments/crystal_anthropic_flt_consumer_v1/**'
      - '.github/workflows/crystal-anthropic-flt-consumer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned consumer environment
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          lake update
          grep -q '6e837e75355538c7f80bab5b956861e86c4eacc2' lake-manifest.json

      - name: Restore Mathlib build cache
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: lake exe cache get

      - name: Measure reused Anthropic source surface
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          FLT_DIR=".lake/packages/flt_e2e"
          test -d "$FLT_DIR"
          find "$FLT_DIR" -name '*.lean' -type f -print0 | xargs -0 wc -l | tail -1 | tee anthropic_lean_loc.txt
          find CrystalAnthropicConsumer -name '*.lean' -type f -print0 | xargs -0 wc -l | tail -1 | tee consumer_lean_loc.txt

      - name: Build imported theorem consumer
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          START="$(date +%s)"
          lake build CrystalAnthropicConsumer
          lake env lean CrystalAnthropicConsumer/Consumer.lean
          END="$(date +%s)"
          echo "$((END-START))" | tee build_seconds.txt

      - name: Verify exact imported theorem and transport
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          grep -F 'import Theorems.Thm_fermat_last_theorem' CrystalAnthropicConsumer/Consumer.lean
          grep -F 'exact fermat_last_theorem n hn a b c ha hb hc' CrystalAnthropicConsumer/Consumer.lean
          grep -F '(positiveFLTFor_iff_mathlib n).mp' CrystalAnthropicConsumer/Consumer.lean
          ! grep -RInE '\b(sorry|admit|axiom)\b' CrystalAnthropicConsumer

      - name: Emit reuse measurement
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          def total(path):
              s=Path(path).read_text().strip()
              return int(re.findall(r'\d+', s)[-1])
          out={
            "schema":"mathgraph.crystal-anthropic-flt-consumer.v1",
            "anthropic_commit":"6e837e75355538c7f80bab5b956861e86c4eacc2",
            "anthropic_lean_loc_available":total("anthropic_lean_loc.txt"),
            "local_consumer_lean_loc":total("consumer_lean_loc.txt"),
            "build_seconds":int(Path("build_seconds.txt").read_text().strip()),
            "imported_theorem":"fermat_last_theorem",
            "transport_target":"FermatLastTheorem",
            "local_reformalization_of_anthropic_proof":0,
            "status":"VERIFIED_REUSE"
          }
          Path("reuse_measurement.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-anthropic-flt-consumer-v1
          path: |
            experiments/crystal_anthropic_flt_consumer_v1/reuse_measurement.json
            experiments/crystal_anthropic_flt_consumer_v1/anthropic_lean_loc.txt
            experiments/crystal_anthropic_flt_consumer_v1/consumer_lean_loc.txt
            experiments/crystal_anthropic_flt_consumer_v1/build_seconds.txt
