name: Crystal Anthropic Corpus Consumer V1

on:
  push:
    branches:
      - crystal-anthropic-flt-consumer-v1
    paths:
      - 'experiments/crystal_anthropic_flt_consumer_v1/**'
      - '.github/workflows/crystal-anthropic-flt-consumer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve independently pinned Mathlib
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          lake update
          grep -q 'db584cd6d46c92f209a44c0f1c829460d327499d' lake-manifest.json

      - name: Restore Mathlib build cache
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: lake exe cache get

      - name: Fetch exact Anthropic theorem slice
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          COMMIT=6e837e75355538c7f80bab5b956861e86c4eacc2
          mkdir -p Theorems P2M/Sol Definitions
          curl -fsSL -o Theorems/Thm_IsLocalRing_isRegular_of_systemOfParameters.lean             https://raw.githubusercontent.com/anthropics/fermats-last-theorem/$COMMIT/Theorems/Thm_IsLocalRing_isRegular_of_systemOfParameters.lean
          curl -fsSL -o P2M/Sol/S_IsLocalRing_isRegular_of_systemOfParameters.lean             https://raw.githubusercontent.com/anthropics/fermats-last-theorem/$COMMIT/P2M/Sol/S_IsLocalRing_isRegular_of_systemOfParameters.lean
          curl -fsSL -o Definitions/Def_Patching_SystemTypes.lean             https://raw.githubusercontent.com/anthropics/fermats-last-theorem/$COMMIT/Definitions/Def_Patching_SystemTypes.lean
          curl -fsSL -o P2M/Util.lean             https://raw.githubusercontent.com/anthropics/fermats-last-theorem/$COMMIT/P2M/Util.lean
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            "Theorems/Thm_IsLocalRing_isRegular_of_systemOfParameters.lean":"156b86e8484a7fc53225a3e87a5b14f4a7f4eb0a",
            "P2M/Sol/S_IsLocalRing_isRegular_of_systemOfParameters.lean":"bfe8fa3c06aea15de9c4ba9388d3c787eafc55dd",
            "Definitions/Def_Patching_SystemTypes.lean":"013e3b7dfa5db55021deb21f3ea7108f0c0ed9aa",
            "P2M/Util.lean":"0a73367f78bc165bb5d35e42ca14f5055252e7f6",
          }
          for name, want in expected.items():
              data=Path(name).read_bytes()
              got=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert got == want, (name,got,want)
              print("PIN_OK", name, got)
          PY

      - name: Measure imported theorem proof cost
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          WRAP="Theorems/Thm_IsLocalRing_isRegular_of_systemOfParameters.lean"
          PROOF="P2M/Sol/S_IsLocalRing_isRegular_of_systemOfParameters.lean"
          wc -l "$WRAP" "$PROOF" | tee imported_theorem_loc.txt
          wc -c "$WRAP" "$PROOF" | tee imported_theorem_bytes.txt
          find CrystalAnthropicConsumer -name '*.lean' -type f -print0 | xargs -0 wc -l | tail -1 | tee consumer_lean_loc.txt

      - name: Build imported theorem consumer
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          START="$(date +%s)"
          lake build CrystalAnthropicConsumer
          lake env lean CrystalAnthropicConsumer/Consumer.lean
          END="$(date +%s)"
          echo "$((END-START))" | tee build_seconds.txt

      - name: Verify exact import and consequence transport
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          set -euo pipefail
          grep -F 'import Theorems.Thm_IsLocalRing_isRegular_of_systemOfParameters' CrystalAnthropicConsumer/Consumer.lean
          grep -F 'IsLocalRing.isRegular_of_systemOfParameters' CrystalAnthropicConsumer/Consumer.lean
          grep -F 'regular_to_weak_view' CrystalAnthropicConsumer/Consumer.lean
          ! grep -RInE '\b(sorry|admit|axiom)\b' CrystalAnthropicConsumer

      - name: Emit direct reuse measurement
        working-directory: experiments/crystal_anthropic_flt_consumer_v1
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          def nth_total(path, line):
              s=Path(path).read_text().strip().splitlines()
              return int(re.findall(r'\d+', s[line])[0])

          proof_loc=nth_total("imported_theorem_loc.txt",1)
          proof_bytes=nth_total("imported_theorem_bytes.txt",1)
          consumer_loc=int(re.findall(r'\d+', Path("consumer_lean_loc.txt").read_text())[0])

          out={
            "schema":"mathgraph.crystal-anthropic-theorem-consumer.v1",
            "anthropic_commit":"6e837e75355538c7f80bab5b956861e86c4eacc2",
            "mathlib_commit":"db584cd6d46c92f209a44c0f1c829460d327499d",
            "imported_theorem":"IsLocalRing.isRegular_of_systemOfParameters",
            "source_proof_module_loc":proof_loc,
            "source_proof_module_bytes":proof_bytes,
            "local_consumer_lean_loc":consumer_loc,
            "local_reformalization_of_source_proof_loc":0,
            "protected_consumer_consequence":"RingTheory.Sequence.IsWeaklyRegular R xs",
            "bridge":"IsRegular.toIsWeaklyRegular",
            "build_seconds":int(Path("build_seconds.txt").read_text().strip()),
            "status":"VERIFIED_REUSE"
          }
          Path("reuse_measurement.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-anthropic-theorem-consumer-v1
          path: |
            experiments/crystal_anthropic_flt_consumer_v1/reuse_measurement.json
            experiments/crystal_anthropic_flt_consumer_v1/imported_theorem_loc.txt
            experiments/crystal_anthropic_flt_consumer_v1/imported_theorem_bytes.txt
            experiments/crystal_anthropic_flt_consumer_v1/consumer_lean_loc.txt
            experiments/crystal_anthropic_flt_consumer_v1/build_seconds.txt
