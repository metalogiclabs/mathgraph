name: Pressure envelope transfer obstruction V10
on:
  push:
    branches: [navier-stokes-semantic-bridge-v1]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/PressureEnvelopeObstruction.lean'
      - '.github/workflows/navier-stokes-pressure-obstruction-v10.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/PressureEnvelopeObstruction.lean'
      - '.github/workflows/navier-stokes-pressure-obstruction-v10.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pressure-envelope-v10-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-pressure-envelope-countermodel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze source and original OpenAI authority
        run: |
          set -euo pipefail
          mkdir -p .four-loss-env pressure-v10-evidence
          git rev-parse HEAD | tee pressure-v10-evidence/head-sha.txt
          cp experiments/navier_stokes_semantic_bridge_v1/PressureEnvelopeObstruction.lean .four-loss-env/PressureEnvelopeObstruction.lean
          cp .four-loss-env/PressureEnvelopeObstruction.lean pressure-v10-evidence/PressureEnvelopeObstruction.lean
          sha256sum .four-loss-env/PressureEnvelopeObstruction.lean > pressure-v10-evidence/source.sha256
          printf '%s\n' 'leanprover/lean4:v4.34.0-rc2' > .four-loss-env/lean-toolchain
          cat > .four-loss-env/lakefile.toml <<'EOF'
          name = "mathgraph_pressure_envelope_v10"
          version = "0.1.0"
          [[require]]
          name = "NavierStokesAndEuler"
          git = "https://github.com/openai/NavierStokesAndEuler.git"
          rev = "f9e8bc5b38b6e212696e8a30e3e91517af887bbd"
          [[lean_lib]]
          name = "PressureEnvelopeObstruction"
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            .four-loss-env/.lake
            .four-loss-env/lake-manifest.json
          key: openai-four-loss-v6-lean434rc2-mathlib-pinned-f9e8bc5
      - name: Install original Lean
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh' \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve original upstream and verify actual envelope definition
        working-directory: .four-loss-env
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/NavierStokesAndEuler rev-parse HEAD)" = 'f9e8bc5b38b6e212696e8a30e3e91517af887bbd'
          grep -q 'def pressureEnvelope (R A B : ℝ) : ℝ :=' .lake/packages/NavierStokesAndEuler/NavierStokes/R3/WholeSpaceComparisonClosure.lean
          cp lake-manifest.json ../pressure-v10-evidence/lake-manifest.json
          lake env lean --version | tee ../pressure-v10-evidence/lean-version.txt
          lake exe cache get
      - name: Kernel check actual pressure-envelope separation and Sobolev-direction control
        working-directory: .four-loss-env
        run: |
          set -euo pipefail
          lake build PressureEnvelopeObstruction 2>&1 | tee ../pressure-v10-evidence/build.log
          lake env lean -DwarningAsError=true PressureEnvelopeObstruction.lean 2>&1 | tee ../pressure-v10-evidence/axioms.log
      - name: Audit qualified theorem axes and nonclaims
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('pressure-v10-evidence')
          assert (root/'head-sha.txt').read_text().strip()==os.environ['EXPECTED_HEAD']
          log=(root/'axioms.log').read_text()
          prefix='MathGraph.PressureEnvelopeObstruction.'
          expected={prefix+s for s in (
            'source_at_unit', 'formal_at_unit','no_uniform_envelope_transfer',
            'no_transfer_from_one_way_sobolev')}
          rows=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          rows += [(n,'') for n in re.findall(r"'([^']+)' does not depend on any axioms",log)]
          seen={}
          for n,axioms in rows:
            assert n not in seen,n
            used={s.strip() for s in axioms.split(',') if s.strip()}
            assert used <= {'propext','Classical.choice','Quot.sound'},(n,sorted(used))
            seen[n]=sorted(used)
          assert set(seen)==expected,sorted(expected.symmetric_difference(set(seen)))
          result={
            'schema':'mathgraph.pressure-envelope-scalar-obstruction-v10',
            'head_sha':os.environ['EXPECTED_HEAD'],
            'actual_OpenAI_commit':'f9e8bc5b38b6e212696e8a30e3e91517af887bbd',
            'actual_OpenAI_pressure_envelope':True,
            'reported_paper_envelope':'1/R*(B+1)*(B^.5+R^(-.75)*B^.75)',
            'cannot_dominate_existing_formal_upper_bound_by_source_B_only_envelope':True,
            'remains_impossible_under_one_way_sobolev_relation':True,
            'actual_Navier_Stokes_counterexample_produced':False,
            'paper_equation_refuted':False,
            'alternate_analytic_proof_excluded':False,
            'source_NL_interpretation_approved':False,
            'can_promote_source_truth':False,
            'axiom_audit':seen,
            'sha256_files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()},
          }
          (root/'result.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pressure-obstruction-v10
          path: pressure-v10-evidence/
          if-no-files-found: error
