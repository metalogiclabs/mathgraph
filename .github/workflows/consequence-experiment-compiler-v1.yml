name: Consequence to Experiment Compiler V1 - independent finite qualification
on:
  push:
    branches:
      - research/consequence-to-experiment-compiler-v1-20261021
    paths:
      - 'research/consequence_experiment_compiler_v1/**'
      - '.github/workflows/consequence-experiment-compiler-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-and-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify revision and run standalone finite tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cd research/consequence_experiment_compiler_v1
          python -m py_compile compiler.py fixtures.py independent_oracle.py test_protocol.py fuzz_independent.py independent_audit.py
          python test_protocol.py | tee run.log
          python fuzz_independent.py | tee -a run.log
          sha256sum compiler.py fixtures.py independent_oracle.py test_protocol.py fuzz_independent.py independent_audit.py PROTOCOL.md result.json cases.json fuzz_result.json > SHA256SUMS.txt
          git diff --exit-code -- compiler.py fixtures.py independent_oracle.py test_protocol.py fuzz_independent.py independent_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consequence-experiment-v1-candidate-and-reference
          path: |
            research/consequence_experiment_compiler_v1/run.log
            research/consequence_experiment_compiler_v1/result.json
            research/consequence_experiment_compiler_v1/cases.json
            research/consequence_experiment_compiler_v1/fuzz_result.json
            research/consequence_experiment_compiler_v1/SHA256SUMS.txt
          if-no-files-found: warn
  independent-receipt-audit:
    needs: candidate-and-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: consequence-experiment-v1-candidate-and-reference
          path: audit-artifact
      - name: Independently replay all authoritative finite costs and Galois correspondence
        run: |
          set -euo pipefail
          cd research/consequence_experiment_compiler_v1
          # Audit uses only independent_oracle + static fixtures, never imports compiler.py.
          python independent_audit.py ../../audit-artifact | tee audit.log
          sha256sum ../../audit-artifact/result.json ../../audit-artifact/cases.json ../../audit-artifact/fuzz_result.json ../../audit-artifact/independent_audit_receipt.json > audit-SHA256SUMS.txt
          grep -q 'INDEPENDENT_REFERENCE_AUDIT_PASS 240 40 GALOIS 983040' audit.log
          git diff --exit-code -- independent_oracle.py fixtures.py independent_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consequence-experiment-v1-independent-audit
          path: |
            research/consequence_experiment_compiler_v1/audit.log
            audit-artifact/independent_audit_receipt.json
            research/consequence_experiment_compiler_v1/audit-SHA256SUMS.txt
          if-no-files-found: warn