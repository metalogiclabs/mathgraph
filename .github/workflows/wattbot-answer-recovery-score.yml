name: WattBot provisional-answer V4 Kaggle scoring authority
on:
  push:
    branches: [wattbot-answer-recovery-v4]
    paths:
      - '.github/workflows/wattbot-answer-recovery-score.yml'
jobs:
  read-only-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle client
        run: python -m pip install kaggle
      - name: Read submission 57018114 score versus strict V4 57017667
        run: kaggle competitions submissions -c WattBot2026
      - name: Read public leaderboard
        run: kaggle competitions leaderboard WattBot2026 --show
      - name: Read authenticated user placement
        run: kaggle competitions list --group entered -s WattBot2026 -v
      - name: Evidence boundary
        run: echo "Read-only scorer lookup. No new submission, model inference or protected dataset."
