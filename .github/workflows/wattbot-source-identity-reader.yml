name: WattBot official source identity reader distinction
on:
  push:
    branches: [wattbot-source-identity-reader-v1]
    paths:
      - '.github/workflows/wattbot-source-identity-reader.yml'
      - 'experiments/wattbot2026/derivation_router_probe.py'
jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable official scorer and PDF reader dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Validate title-year-refID lineage and unchanged PDF quotations
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/derivation_router_probe.py --self-test
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Score document identity as single controlled question-side intervention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/derivation_router_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Protected future
        run: |
          echo "First and second reader share exact six pinned PDF page excerpts."
          echo "Only official source metadata title/year/type/venue is added, never as a PDF quotation."
          echo "TRAIN scorer after prediction; no target gold used in source attribution."
          echo "Additional reserved model spend <= USD 0.16; no Kaggle TEST or submission."
