name: V71 Exact Graph Frontier Diagnostic

on:
  push:
    branches: [capability-graph-frontier-v71-exact-diagnostic]
    paths:
      - 'experiments/capability_graph_frontier_transfer_v71/**'
      - '.github/workflows/capability-graph-frontier-v71-exact-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose-exact-graph-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Static check
        run: |
          python3 -m py_compile experiments/capability_graph_frontier_transfer_v71/run_calibration.py
          python3 -m py_compile experiments/capability_graph_frontier_transfer_v71/run_exact_diagnostic.py
      - name: Install inherited frozen backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1
      - name: Fetch opened unlabeled law universe
        run: |
          set -euo pipefail
          mkdir -p external-v71-exact
          curl -fsSL --retry 3 https://raw.githubusercontent.com/heathsanchez/equational-theories-lean-stage2/374eb40ba5389915deb174fbc12cc92346214dd1/examples/problems/eq_size5.txt -o external-v71-exact/eq_size5.txt
          test "$(git hash-object external-v71-exact/eq_size5.txt)" = "0deca9c8860fb60f2ae161ab7e3f458ec3b178ca"
          echo "V71_EXACT_DIAGNOSTIC_ONLY=NO_CLAIM"
      - name: Run exact-frontier diagnostic
        run: |
          PYTHONPATH=. python3 experiments/capability_graph_frontier_transfer_v71/run_exact_diagnostic.py \
            --laws external-v71-exact/eq_size5.txt \
            --out external-v71-exact/results
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v71-exact-graph-frontier-diagnostic
          path: external-v71-exact/results/
