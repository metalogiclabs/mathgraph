name: VDN Developmental Ratchet V53
on:
  push:
    branches: [vdn-crown-jewel-v53]
    paths:
      - 'verified-developmental-navigation/case_studies/finite_inevitability/run_v53_developmental_ratchet_crown_jewel.py'
      - '.github/workflows/vdn-developmental-ratchet-v53.yml'
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust finite developmental ratchet
        run: python3 verified-developmental-navigation/case_studies/finite_inevitability/run_v53_developmental_ratchet_crown_jewel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vdn-developmental-ratchet-v53
          path: verified-developmental-navigation/case_studies/finite_inevitability/results_v53_developmental_ratchet_crown_jewel/result.json
