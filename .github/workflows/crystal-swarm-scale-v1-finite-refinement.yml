name: Crystal Swarm Scale V1 Finite Refinement
on:
  push:
    branches: [crystal-swarm-scale-v1-finite-refinement]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]"
      - name: Prove inherited semantic waists unchanged
        run: |
          git diff --exit-code 4a12e1aa0996b664e0ed4f5d46a2b3cf162af12a -- mathgraph/crystal.py
          git diff --exit-code 4a12e1aa0996b664e0ed4f5d46a2b3cf162af12a -- mathgraph/math_claim.py
          git diff --exit-code 4a12e1aa0996b664e0ed4f5d46a2b3cf162af12a -- mathgraph/graph_invariants.py
          git diff --exit-code 4a12e1aa0996b664e0ed4f5d46a2b3cf162af12a -- mathgraph/finite_relation.py
      - name: Recheck inherited Crystal tests
        run: python -m pytest -q tests/test_crystal.py tests/test_crystal_math_claim_dialect_v0.py
      - name: Refine 76-family finite residual
        run: python scripts/run_crystal_swarm_scale_v1_finite_refinement.py
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-swarm-scale-v1-finite-refinement-evidence
          path: evidence/crystal-swarm-scale-v1-finite-refinement/result.json
          if-no-files-found: error
