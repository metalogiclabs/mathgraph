name: Pressure Laplacian-test interface V19
on:
  push:
    branches: [navier-pressure-laplacian-v19]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/PressureLaplacianBridge.lean'
      - '.github/workflows/navier-stokes-laplacian-bridge-v19.yml'
  pull_request:
    branches: [navier-stokes-pressure-legacy-v17]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/PressureLaplacianBridge.lean'
      - '.github/workflows/navier-stokes-laplacian-bridge-v19.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pressure-laplacian-v19-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-laplacian-pressure-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze exact source and pinned OpenAI authority
        run: |
          set -euo pipefail
          mkdir -p .pressure-v19-env pressure-v19-evidence
          git rev-parse HEAD | tee pressure-v19-evidence/head-sha.txt
          cp experiments/navier_stokes_semantic_bridge_v1/PressureLaplacianBridge.lean .pressure-v19-env/PressureLaplacianBridge.lean
          cp .pressure-v19-env/PressureLaplacianBridge.lean pressure-v19-evidence/PressureLaplacianBridge.lean
          sha256sum .pressure-v19-env/PressureLaplacianBridge.lean > pressure-v19-evidence/lean-source.sha256
          printf '%s\n' 'leanprover/lean4:v4.34.0-rc2' > .pressure-v19-env/lean-toolchain
          cat > .pressure-v19-env/lakefile.toml <<'EOF'
          name = "mathgraph_pressure_laplacian_v19"
          version = "0.1.0"
          [[require]]
          name = "NavierStokesAndEuler"
          git = "https://github.com/openai/NavierStokesAndEuler.git"
          rev = "f9e8bc5b38b6e212696e8a30e3e91517af887bbd"
          [[lean_lib]]
          name = "PressureLaplacianBridge"
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            .pressure-v19-env/.lake
            .pressure-v19-env/lake-manifest.json
          key: openai-four-loss-v6-lean434rc2-mathlib-pinned-f9e8bc5
      - name: Install original Lean
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh' \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify exact OpenAI Fourier/pressure definitions
        working-directory: .pressure-v19-env
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/NavierStokesAndEuler rev-parse HEAD)" = 'f9e8bc5b38b6e212696e8a30e3e91517af887bbd'
          grep -q 'theorem pressureL1_poisson' .lake/packages/NavierStokesAndEuler/NavierStokes/R3PressureFourier.lean
          grep -q 'theorem pressurePair_laplacianCLM' .lake/packages/NavierStokesAndEuler/NavierStokes/R3/RieszTestOperators.lean
          cp lake-manifest.json ../pressure-v19-evidence/lake-manifest.json
          lake env lean --version | tee ../pressure-v19-evidence/lean-version.txt
          lake exe cache get
      - name: Kernel-check source and active pressure on Laplacian observations
        working-directory: .pressure-v19-env
        run: |
          set -euo pipefail
          lake build PressureLaplacianBridge 2>&1 | tee ../pressure-v19-evidence/build.log
          lake env lean -DwarningAsError=true PressureLaplacianBridge.lean 2>&1 | tee ../pressure-v19-evidence/axioms.log
      - name: Audit exact head and four theorem axiom sets
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root=Path('pressure-v19-evidence')
          assert (root/'head-sha.txt').read_text().strip()==os.environ['EXPECTED_HEAD']
          log=(root/'axioms.log').read_text()
          prefix='MathGraph.PressureLaplacianBridge.'
          expected={prefix+x for x in (
            'source_and_comparison_test_laplacians_agree',
            'comparison_test_partials_commute',
            'old_pressure_poisson_laplacian_test',
            'actual_old_and_comparison_pressure_agree_on_laplacian_tests')}
          rows=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          rows += [(n,'') for n in re.findall(r"'([^']+)' does not depend on any axioms",log)]
          seen={}
          for n,a in rows:
            assert n not in seen,n
            used={s.strip() for s in a.split(',') if s.strip()}
            assert used <= {'propext','Classical.choice','Quot.sound'},(n,sorted(used))
            seen[n]=sorted(used)
          assert set(seen)==expected,('theorem names/axioms mismatch', sorted(expected.symmetric_difference(set(seen))))
          d={
            'schema':'mathgraph.pressure-laplacian-protected-tests-v19',
            'head_sha':os.environ['EXPECTED_HEAD'],
            'upstream_sha':'f9e8bc5b38b6e212696e8a30e3e91517af887bbd',
            'scope':'OLD_CANONICAL_FOURIER_PRESSURE_AND_ACTIVE_RIESZ_PRESSURE_AGREE_ON_LAPLACIAN_TESTS_FOR_REAL_INTEGRABLE_DATA',
            'source_lean_and_comparison_pressure_agree_on_laplacian_tests':True,
            'all_schwartz_tests_agreement_proved':False,
            'global_pressure_flux_eq_10_19_proved':False,
            'independent_source_nl_contract_approved':False,
            'production_gate_changed':False,
            'axiom_audit':seen,
            'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          }
          (root/'result.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pressure-laplacian-v19
          path: pressure-v19-evidence/
          if-no-files-found: error
