name: VDN ARC-AGI-2 local symbol quotient v15
on:
  push:
    branches: [vdn-arc2-meta-v11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-symbol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Run local symbol quotient test
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v15_local_symbol_quotient.py /tmp/ARC-AGI-2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-local-symbol-v15
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v15_local_symbol_quotient/result.json
