name: G2 masked untouched validator source transfer
on:
  push:
    branches: [research/udm-g2-validator-masked-cold-20261103]
    paths: ['.github/workflows/udm-g2-validator-masked-cold-20261103.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rank: 2, repo: 'go-playground/validator', pr: 1664, base: 'df91dfdd9abdbb838739d13a70550efb7f730d3e', head: 'a37c290428207fcaf419d295cde1fc432fa37c9e', prod: 'postcode_regexes.go', testfile: 'validator_test.go'}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/test
          ref: a39b021e93d6033971dd32432b216e27ac83b7c2
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.base }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact author-native red/green, then fully masked source packet
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '${{ matrix.base }}'
          git -C source fetch --no-tags origin 'refs/pull/${{ matrix.pr }}/head:refs/remotes/origin/pr${{ matrix.pr }}-head'
          test "$(git -C source rev-parse refs/remotes/origin/pr${{ matrix.pr }}-head)" = '${{ matrix.head }}'
          mkdir -p qualification packet/base_source
          python tooling/research/g2_native_residual/qualify_v2.py \
            --repo source --base '${{ matrix.base }}' --head '${{ matrix.head }}' \
            --test-file '${{ matrix.testfile }}' --output qualification
          python - <<'PY'
          import json,re,shutil,hashlib
          from pathlib import Path
          report=json.load(open('qualification/qualification.json'))
          assert report['status']=='WARRANTED_BOUNDED_AUTHENTIC_AUTHOR_NATIVE_RED_GREEN',report
          assert report['matched_failed_tests']
          packet=json.load(open('qualification/learner-residual.json'))
          assert packet['source_sha']=='${{ matrix.base }}'
          packet['failing_tests']=['WITHHELD_ASSERTION_ID']
          packet['native_assertion_output']=''
          packet['native_contract']='A protected original-author native assertion differs between exact original and contributor revisions; assertion identity, expected values and diagnostic output withheld.'
          Path('packet/learner-residual.json').write_text(json.dumps(packet,indent=2,sort_keys=True)+'\n')
          root=Path('source')
          prod=Path('${{ matrix.prod }}')
          src=(root/prod).read_text()
          m=re.search(r'^package\s+([A-Za-z_][A-Za-z_0-9]*)\b',src,re.M)
          assert m,'UNKNOWN_BASE_PACKAGE'
          siblings=sorted(p for p in (root/prod.parent).glob('*.go') if p.is_file() and not p.name.endswith('_test.go'))
          selected=[prod]+[p.relative_to(root) for p in siblings if p.relative_to(root)!=prod][:2]
          for rel in selected:
              p=Path('packet/base_source')/rel
              p.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(root/rel,p)
          subject={'schema':'mathgraph.g2.source-neutral-subject.v3',
                   'repository':'${{ matrix.repo }}','source_sha':'${{ matrix.base }}',
                   'production_file':str(prod),'package_name':m.group(1),
                   'source_files':[{'path':str(p),'sha256':hashlib.sha256((root/p).read_bytes()).hexdigest()} for p in selected]}
          Path('packet/subject.json').write_text(json.dumps(subject,indent=2,sort_keys=True)+'\n')
          assert packet['native_assertion_output']=='' and packet['failing_tests']==['WITHHELD_ASSERTION_ID']
          print('NATIVE_SOURCE_WARRANT',report['status'],'WITNESSES',len(report['matched_failed_tests']))
          print('PACKET_MASKED_SOURCE_ONLY',subject['repository'],len(selected))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-masked-transfer-author-rank-${{ matrix.rank }}
          path: qualification
          retention-days: 60
      - uses: actions/upload-artifact@v4
        with:
          name: g2-masked-transfer-packet-rank-${{ matrix.rank }}
          path: packet
          retention-days: 60

  propose:
    needs: [prepare-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rank: 2, repo: 'go-playground/validator', pr: 1664, base: 'df91dfdd9abdbb838739d13a70550efb7f730d3e', head: 'a37c290428207fcaf419d295cde1fc432fa37c9e', prod: 'postcode_regexes.go'}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/mathgraph
          ref: 1c58c10d0817a259af4ea22acbeba7cf0a4f3db8
          path: code
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with:
          name: g2-masked-transfer-packet-rank-${{ matrix.rank }}
          path: packet
      - name: Frozen model source-only bridge vs direct, no code execution
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('packet/learner-residual.json'))
          assert p['native_assertion_output']=='' and p['failing_tests']==['WITHHELD_ASSERTION_ID']
          assert p['source_sha']=='${{ matrix.base }}'
          PY
          node code/research/udm_g2_source_neutral_v3/propose.mjs \
            packet/learner-residual.json packet/base_source proposals packet/subject.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-masked-transfer-proposals-rank-${{ matrix.rank }}
          path: proposals
          retention-days: 60

  independent-native:
    needs: [propose]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rank: 2, repo: 'go-playground/validator', pr: 1664, base: 'df91dfdd9abdbb838739d13a70550efb7f730d3e', head: 'a37c290428207fcaf419d295cde1fc432fa37c9e', prod: 'postcode_regexes.go'}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/mathgraph
          ref: 1c58c10d0817a259af4ea22acbeba7cf0a4f3db8
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.base }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: g2-masked-transfer-proposals-rank-${{ matrix.rank }}
          path: proposals
      - uses: actions/download-artifact@v4
        with:
          name: g2-masked-transfer-packet-rank-${{ matrix.rank }}
          path: packet
      - name: Identity and no-model-key separate native verifier
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test "$(git -C source rev-parse HEAD)" = '${{ matrix.base }}'
          git -C source fetch --no-tags origin 'refs/pull/${{ matrix.pr }}/head:refs/remotes/origin/pr${{ matrix.pr }}-head'
          test "$(git -C source rev-parse refs/remotes/origin/pr${{ matrix.pr }}-head)" = '${{ matrix.head }}'
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=json.load(open('packet/learner-residual.json'))
          assert p['native_assertion_output']=='' and p['failing_tests']==['WITHHELD_ASSERTION_ID']
          d=json.load(open('packet/subject.json'))
          assert p['source_sha']==d['source_sha']=='${{ matrix.base }}'
          for item in d['source_files']:
              assert hashlib.sha256((Path('source')/item['path']).read_bytes()).hexdigest()==item['sha256']
          PY
          python -m unittest discover -s code/research/udm_g2_source_neutral_v3 -p test_source_neutral.py -v 2>&1 | tee /tmp/source-neutral-regressions.log
          grep -q 'Ran 6 tests' /tmp/source-neutral-regressions.log
          grep -q '^OK$' /tmp/source-neutral-regressions.log
      - name: Independently replay candidate vs original and head, withdraw, restore
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(python -c 'import json;print(json.load(open("packet/subject.json"))["package_name"])')"
          python code/research/udm_g2_source_neutral_v3/evaluate.py \
            --source source --base '${{ matrix.base }}' --head '${{ matrix.head }}' \
            --production-file '${{ matrix.prod }}' --package-name "$PACKAGE_NAME" \
            --proposals proposals --output evaluation | tee evaluation.stdout
          python - <<'PY'
          import json
          d=json.load(open('evaluation/evaluation.json'))
          assert d['schema']=='mathgraph.g2.go-native-qualification.v1'
          assert d['base_sha']=='${{ matrix.base }}' and d['head_sha']=='${{ matrix.head }}'
          print('MASKED_SOURCE_DISTINCT_SCIENCE','${{ matrix.rank }}',d['status'],d.get('fair_comparison'))
          print('STRICT_G2',d['strict_g2'],'STRICT_G3',d['strict_g3'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-masked-transfer-native-rank-${{ matrix.rank }}
          path: |
            evaluation
            evaluation.stdout
            /tmp/source-neutral-regressions.log
          retention-days: 60