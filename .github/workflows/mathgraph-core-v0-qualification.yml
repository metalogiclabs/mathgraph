name: MathGraph Core V0 Qualification

on:
  push:
    branches:
      - mathgraph-core-v0-kernel
    paths:
      - 'mathgraph/core_v0.py'
      - 'mathgraph/core_v0_family_adapter.py'
      - 'mathgraph/discovery_candidate_sources.py'
      - 'mathgraph/discovery_scheduler.py'
      - 'tests/test_mathgraph_core_v0.py'
      - 'tests/test_core_v0_discovery_integration.py'
      - 'tests/test_discovery_candidate_sources.py'
      - 'tests/test_discovery_scheduler.py'
      - 'docs/mathgraph_core_v0.md'
      - 'docs/discovery_scheduler.md'
      - '.github/workflows/mathgraph-core-v0-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MathGraph
        run: python -m pip install -e '.[all]'
      - name: Core and discovery integration tests
        run: |
          python -m pytest -q \
            tests/test_mathgraph_core_v0.py \
            tests/test_core_v0_discovery_integration.py \
            tests/test_discovery_candidate_sources.py \
            tests/test_discovery_scheduler.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MathGraph
        run: python -m pip install -e '.[all]'
      - name: Full repository test suite
        run: python -m pytest -q
