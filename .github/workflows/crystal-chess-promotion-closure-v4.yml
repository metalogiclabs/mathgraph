name: Crystal Chess Promotion Closure V4

on:
  push:
    branches:
      - crystal-chess-promotion-closure-v4
    paths:
      - "experiments/crystal_chess_kpvk_v0.py"
      - "experiments/crystal_chess_promotion_closure_v4.py"
      - ".github/workflows/crystal-chess-promotion-closure-v4.yml"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  promotion-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Compile experiment
        run: |
          python -m py_compile experiments/crystal_chess_kpvk_v0.py
          python -m py_compile experiments/crystal_chess_promotion_closure_v4.py

      - name: Acquire exact 3-piece Syzygy WDL and DTZ authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          wdl="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          dtz="https://tablebase.lichess.ovh/tables/standard/3-4-5-dtz"
          for stem in KPvK KQvK KRvK KBvK KNvK; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$stem.rtbw" "$wdl/$stem.rtbw"
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$stem.rtbz" "$dtz/$stem.rtbz"
            test -s "/tmp/syzygy/$stem.rtbw"
            test -s "/tmp/syzygy/$stem.rtbz"
          done
          sha256sum /tmp/syzygy/*.rtb* | tee /tmp/syzygy/SHA256SUMS

      - name: Exhaustively close promotion basins
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-promotion-v4
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-promotion-v4/
          python experiments/crystal_chess_promotion_closure_v4.py             --tablebase-dir /tmp/syzygy             --output artifacts/crystal-chess-promotion-v4/result.json             | tee artifacts/crystal-chess-promotion-v4/run.log
          grep -q "CRYSTAL_CHESS_PROMOTION_CLOSURE_V4=" artifacts/crystal-chess-promotion-v4/run.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-promotion-closure-v4
          path: artifacts/crystal-chess-promotion-v4/
          if-no-files-found: error
