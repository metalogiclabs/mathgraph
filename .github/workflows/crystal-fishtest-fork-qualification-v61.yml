name: Crystal Fishtest Fork Qualification V61

on:
  push:
    branches:
      - crystal-fishtest-fork-qualification-v61
    paths:
      - ".github/workflows/crystal-fishtest-fork-qualification-v61.yml"
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Clone exact Fishtest candidate
        run: |
          set -euo pipefail
          git clone --filter=blob:none --branch crystal-clock-gate-v1 https://github.com/metalogiclabs/Stockfish.git /tmp/candidate
          test "$(git -C /tmp/candidate rev-parse HEAD)" = "63351ab226b9418ba5046cdd0d7e6ac469327a18"
          git -C /tmp/candidate diff 0a215d6c9e48856ef630013b8ab8312941a59057..HEAD -- src/search.cpp > /tmp/candidate.patch
          echo "7ee31f9f8fc69589be85358af7d9e0e736ee20c55704e8f344ff4bae93a35c98  /tmp/candidate.patch" | sha256sum -c -

      - name: Build candidate
        run: |
          set -euo pipefail
          make -C /tmp/candidate/src -j2 build ARCH=x86-64

      - name: Capture Fishtest bench signature
        run: |
          set -euo pipefail
          mkdir -p evidence
          /tmp/candidate/src/stockfish bench 2>&1 | tee evidence/bench.txt
          SIGNATURE="$(grep 'Nodes searched  :' evidence/bench.txt | awk '{print $4}')"
          test -n "$SIGNATURE"
          echo "$SIGNATURE" | tee evidence/bench_signature.txt
          {
            echo "repository=https://github.com/metalogiclabs/Stockfish"
            echo "branch=crystal-clock-gate-v1"
            echo "candidate_commit=63351ab226b9418ba5046cdd0d7e6ac469327a18"
            echo "base_commit=0a215d6c9e48856ef630013b8ab8312941a59057"
            echo "diff_sha256=7ee31f9f8fc69589be85358af7d9e0e736ee20c55704e8f344ff4bae93a35c98"
            echo "bench_signature=$SIGNATURE"
          } > evidence/manifest.txt
          echo "CRYSTAL_FISHTEST_FORK_QUALIFICATION_V61=PASS"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-fishtest-fork-qualification-v61
          path: evidence/
          if-no-files-found: error
