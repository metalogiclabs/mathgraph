name: WattBot official PDF source obstruction and recovery audit
on:
  push:
    branches: [wattbot-missing-source-boundary-v1]
    paths:
      - '.github/workflows/wattbot-missing-source-boundary.yml'
      - 'experiments/wattbot2026/missing_source_audit.py'
jobs:
  source-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PDF source and competition parsing dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Verify source-obstruction audit cannot change official scoring code
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/submit_full_reader.py --self-test
      - name: Identify original failed public source IDs and version-preserving endpoint status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/missing_source_audit.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Authority and preservation boundary
        run: |
          echo "Do not replace failed sources or alter pinned corpus bytes."
          echo "No LLM/model calls, private TEST labels, Kaggle submission or PDF artifacts."
          echo "All output source metadata comes from the official public registry."
