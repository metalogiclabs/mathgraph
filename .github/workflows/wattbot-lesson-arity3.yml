name: WattBot three-example verified lesson compiler ablation
on:
  push:
    branches: [wattbot-lesson-arity3-v1]
    paths:
      - '.github/workflows/wattbot-lesson-arity3.yml'
      - 'experiments/wattbot2026/verified_lesson.py'
jobs:
  three-lesson-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scientific and scoring dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Verify all three examples come exclusively from allowed development
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/verified_lesson.py
          python experiments/wattbot2026/derivation_router_probe.py --self-test
      - name: "Official scorer on frozen 63 TRAIN: three versus historical two lessons"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/derivation_router_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Qualification boundary
        run: |
          echo "Three development-only examples, identical six PDF pages and model."
          echo "Historical two-example comparator 37985937618 scored .69074074."
          echo "Cross-run model samples are NOT paired; first response controls stay same-run."
          echo "No private TEST labels, no Kaggle submission; additional reserve capped USD .16."
