name: EvSLAM source-only turn-to-turn translation and viewing risk
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - '.github/workflows/evslam-turn-parallax-risk.yml'
      - 'experiments/uzh_rotation/evslam_turn_to_turn_risk.py'
      - 'experiments/uzh_rotation/test_evslam_turn_to_turn_risk.py'
  workflow_dispatch:
jobs:
  source-only-genuine-revisit-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locked motion geometry dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1
      - name: Independent stationary, translating, axis and reversal controls
        run: python -m unittest discover -s experiments/uzh_rotation -p 'test_evslam_turn_to_turn_risk.py' -v
      - name: Fetch and authenticate original publisher GT exactly
        run: |
          mkdir -p original_evslam
          python - <<'PY'
          import subprocess
          base="https://raw.githubusercontent.com/NAIL-HNU/EvSLAM_Dataset/f116a9fe305f3ad8b1a379e1bb52becfc87654dc/evaluation/ground_truth"
          names={"drone_rot_norm_gt.txt":"809d83df4063376d0ee50f62095131e1d8940c00",
                 "drone_rot_fast_gt.txt":"47a1bd5b54c0843d2535af42ebff0529950a5a6f"}
          for name,sha in names.items():
              subprocess.run(["curl","-fsSL","--retry","2",f"{base}/{name}","-o",f"original_evslam/{name}"],check=True)
              actual=subprocess.check_output(["git","hash-object",f"original_evslam/{name}"],text=True).strip()
              assert actual==sha,(name,actual)
              print("SOURCE_IDENTITY_VERIFIED",name,actual)
          PY
      - name: Quantify retrospective repeated-phase spatial change
        run: |
          python experiments/uzh_rotation/evslam_turn_to_turn_risk.py \
            --source-dir original_evslam --out evslam_revisit_geometry.json
      - name: 'Independent promotion boundary: not real camera measurements'
        run: |
          python - <<'PY'
          import json
          d=json.load(open("evslam_revisit_geometry.json"))
          assert set(d["analyses"])=={"drone_rot_norm","drone_rot_fast"}
          for name,v in d["analyses"].items():
              assert v["later_full_turns_measured"]>=2,(name,v)
              assert not v["visual_scene_stationarity_verified"]
              assert not v["camera_field_of_view_overlap_verified"]
              assert not v["navigation_correction_authorized"]
              assert v["no_camera_or_imu_samples_read"]
              print("POSE_MATCH_RISK_ONLY",name,v["per_turn_later"])
          PY
      - name: Preserve original-source physics and all negative cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evslam-multiturn-real-reference-parallax-risk
          path: evslam_revisit_geometry.json
          if-no-files-found: warn
