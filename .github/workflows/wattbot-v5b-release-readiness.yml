name: WattBot authenticated V5b release readiness and current public authority
on:
  push:
    branches: [wattbot-verified-lesson-two-read-v5b]
    paths:
      - '.github/workflows/wattbot-v5b-release-readiness.yml'
jobs:
  read-only-current-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Kaggle client
        run: python -m pip install kaggle
      - name: Read authenticated submission quota before any V5b external release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          import json
          api=KaggleApi()
          api.authenticate()
          s=api.competition_get_submission_limits("WattBot2026")
          print("WATTBOT_V5B_RELEASE_READINESS="+json.dumps({
             "remaining_today":int(s.num_allowed_now),
             "used_today":int(s.num_today),
             "used_total":int(s.num_total),
             "limited_by_total":bool(s.limited_by_total),
             "no_model_calls_or_submission":True
          },sort_keys=True),flush=True)
          PY
      - name: Read exact official MathGraph public submission scores
        run: kaggle competitions submissions -c WattBot2026
      - name: Read current team rank and leader
        run: kaggle competitions leaderboard WattBot2026 --show
      - name: Never spend quota in a read-only authority run
        run: echo "NO Kaggle submission. NO model inference. NO protected answer access."
