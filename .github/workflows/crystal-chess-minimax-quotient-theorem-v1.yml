name: Crystal Chess Minimax Quotient Theorem V1

on:
  push:
    branches:
      - crystal-chess-minimax-quotient-theorem-v1
    paths:
      - "verified-developmental-navigation/lean/**"
      - ".github/workflows/crystal-chess-minimax-quotient-theorem-v1.yml"
  workflow_dispatch:

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build protected action quotient theorem
        working-directory: verified-developmental-navigation/lean
        run: |
          lake build
          grep -q "theorem isOptimal_iff" VerifiedDevelopmentalNavigation/ActionQuotient.lean
          grep -q "theorem outcomeComplete_of_key_pure" VerifiedDevelopmentalNavigation/ActionQuotient.lean
