name: Capability Lineage Paired Baseline

on:
  push:
    branches: [research/capability-closure-lineage-conformance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing differential tests
        run: python -m unittest discover -s tests -p 'test_incremental_closure.py' -v
      - name: Paired benchmark with equality assertions
        run: |
          mkdir -p "$RUNNER_TEMP/paired"
          python -m experiments.capability_lineage_paired_benchmark --out "$RUNNER_TEMP/paired/results.csv" --updates 80
          git rev-parse HEAD > "$RUNNER_TEMP/paired/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-lineage-paired-baseline
          path: ${{ runner.temp }}/paired/
          if-no-files-found: warn
