name: MathGraph Check - Cloudflare Workers and Queues qualification
on:
  push:
    branches:
      - mathgraph-check-github-app-shadow-v0
    paths:
      - 'integrations/mathgraph-check-github/cloudflare/**'
      - 'integrations/mathgraph-check-github/analysis.mjs'
      - '.github/workflows/mathgraph-check-cloudflare-v0.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathgraph-check-cloudflare-v0
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Real-event shape negative controls and App identity simulations
        run: |
          set -euo pipefail
          node --test integrations/mathgraph-check-github/cloudflare/*.test.mjs
      - name: Check Workers runtime bundle without Cloudflare credentials
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.1 deploy --dry-run \
            --config integrations/mathgraph-check-github/cloudflare/wrangler.toml \
            --outdir "$RUNNER_TEMP/mathgraph-check-cloudflare-dry-run"
          test -n "$(find "$RUNNER_TEMP/mathgraph-check-cloudflare-dry-run" -type f -print -quit)"
      - name: Exercise Cloudflare workerd HTTP runtime without credentials
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.1 dev --local \
            --config integrations/mathgraph-check-github/cloudflare/wrangler.toml \
            --ip 127.0.0.1 --port 8799 \
            > "$RUNNER_TEMP/mathgraph-workerd.log" 2>&1 &
          worker_pid="$!"
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready="false"
          for n in $(seq 1 130); do
            if curl --silent --max-time 2 -o /dev/null \
              -w '%{http_code}' http://127.0.0.1:8799/health | grep -qx '200'; then
              ready="true"
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 0.3
          done
          if [ "$ready" != "true" ]; then
            echo 'CLOUDFLARE_WORKER_DID_NOT_START'
            # This job has no runtime secrets. Show only startup diagnostics.
            grep -Ei 'error|failed|not found|refused|incompatible|missing' \
              "$RUNNER_TEMP/mathgraph-workerd.log" | tail -n 22 || true
            exit 1
          fi
          status="$(curl --silent --max-time 5 -o /dev/null \
            -w '%{http_code}' http://127.0.0.1:8799/ready)"
          test "$status" = "503" || {
            echo 'CLOUDFLARE_UNCONFIGURED_WORKER_REPORTED_FALSE_READY'
            exit 1
          }
          status="$(curl --silent --max-time 5 -o /dev/null \
            -w '%{http_code}' http://127.0.0.1:8799/nonexistent)"
          test "$status" = "404"
          echo 'MATHGRAPH_CLOUDFLARE_RUNTIME=ALIVE_WITH_SECRETS_FAIL_CLOSED'
      - name: Boundary declaration
        run: |
          echo 'MATHGRAPH_CLOUDFLARE_BOUNDARY=CODE_TESTED_BUNDLE_DRY_RUN_ONLY'
          echo 'No Cloudflare worker or queue deployed; no GitHub webhook changed.'
