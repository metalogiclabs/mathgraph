name: VDN ARC active residual separator V18b

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v18b_active_separator_query_synthesis.py"
      - ".github/workflows/vdn-arc-active-separator-v18b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-separator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V18b active separator
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v18b_active_separator_query_synthesis.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-active-separator-v18b
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v18b_active_separator_query_synthesis/result.json
