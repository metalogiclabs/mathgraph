name: LeanEval quartic frontier

on:
  pull_request:
    paths:
      - '.github/workflows/lean-eval-quartic-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quartic-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_EVAL_SHA: de48559590eb8cff2125e8e933b3e13bb8a3ff98
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone frozen LeanEval
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem abel_ruffini /tmp/abel_ruffini
          cd /tmp/abel_ruffini
          lake update
      - name: Verify quartic composition frontier
        working-directory: /tmp/abel_ruffini
        run: |
          cat > DegreeFour.lean <<'EOF'
          import Mathlib

          open Polynomial

          theorem quartic_square_radical
              (z : ℂ) (hz : z ∈ solvableByRad ℚ ℂ)
              (s : ℂ) (hs : s^2 = z) : s ∈ solvableByRad ℚ ℂ := by
            apply solvableByRad.rad_mem (by norm_num : (2 : ℕ) ≠ 0)
            rw [hs]
            exact hz

          theorem quartic_final_reconstruct
              (P Q R y z s : ℂ)
              (hP : P ∈ solvableByRad ℚ ℂ)
              (hQ : Q ∈ solvableByRad ℚ ℂ)
              (hR : R ∈ solvableByRad ℚ ℂ)
              (hz : z ∈ solvableByRad ℚ ℂ)
              (hs : s^2 = z)
              (hs0 : s ≠ 0)
              (hy : y^2 + s*y + (z + P)/2 - Q/(2*s) = 0) :
              y ∈ solvableByRad ℚ ℂ := by
            have hs_mem : s ∈ solvableByRad ℚ ℂ := quartic_square_radical z hz s hs
            have hhalf : ((2 : ℚ) : ℂ) ∈ solvableByRad ℚ ℂ := by
              exact (solvableByRad.base_mem ℚ ℂ (2 : ℚ))
            have hsden : (2*s) ∈ solvableByRad ℚ ℂ := mul_mem hhalf hs_mem
            have hsden0 : (2*s : ℂ) ≠ 0 := by exact mul_ne_zero (by norm_num) hs0
            have hc : ((z + P)/2 - Q/(2*s)) ∈ solvableByRad ℚ ℂ := by
              apply sub_mem
              · exact div_mem (add_mem hz hP) hhalf
              · exact div_mem hQ hsden
            have hdisc : (s^2 - 4 * ((z + P)/2 - Q/(2*s))) ∈ solvableByRad ℚ ℂ := by
              exact sub_mem (pow_mem hs_mem 2) (mul_mem (solvableByRad.base_mem ℚ ℂ (4 : ℚ)) hc)
            let t : ℂ := 2*y + s
            have ht2 : t^2 = s^2 - 4 * ((z + P)/2 - Q/(2*s)) := by
              dsimp [t]
              linear_combination 4 * hy
            have ht : t ∈ solvableByRad ℚ ℂ := by
              apply solvableByRad.rad_mem (by norm_num : (2 : ℕ) ≠ 0)
              rw [ht2]
              exact hdisc
            have htwo : ((2 : ℚ) : ℂ) ∈ solvableByRad ℚ ℂ := solvableByRad.base_mem ℚ ℂ (2 : ℚ)
            have : y = (t - s) / 2 := by
              dsimp [t]
              ring
            rw [this]
            exact div_mem (sub_mem ht hs_mem) htwo

          theorem quartic_factor_from_resolvent
              (P Q R z : ℂ)
              (hzrel : z^3 - P*z^2 - 4*R*z + (4*P*R - Q^2) = 0) :
              ∀ y : ℂ,
                y^4 + P*y^2 + Q*y + R = 0 →
                (y^2 + z/2)^2 = (z - P) * y^2 - Q*y + (z^2/4 - R) := by
            intro y hy
            linear_combination hy

          EOF
          set +e
          lake env lean DegreeFour.lean > /tmp/degree-four.log 2>&1
          code=$?
          echo "degree_four_composition_exit=$code" | tee /tmp/quartic-summary.txt
          tail -n 120 /tmp/degree-four.log
          exit 0
      - name: Upload quartic residual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-eval-quartic-frontier
          path: |
            /tmp/degree-four.log
            /tmp/quartic-summary.txt
