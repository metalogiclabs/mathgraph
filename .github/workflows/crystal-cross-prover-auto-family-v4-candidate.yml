name: Crystal Cross-Prover Auto Family V4 Candidate

on:
  push:
    branches:
      - crystal-cross-prover-auto-family-v4
    paths:
      - 'experiments/crystal_cross_prover_auto_family_v4/**'
      - 'mathgraph/cross_prover_family_discovery.py'
      - 'tests/test_cross_prover_family_discovery.py'
      - '.github/workflows/crystal-cross-prover-auto-family-v4-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[all]"
      - name: Test discovery kernel
        run: python -m pytest -q tests/test_cross_prover_family_discovery.py
      - name: Discover V4 candidate and freeze residual
        run: |
          set -euo pipefail
          mkdir -p /tmp/pvs-family artifacts/crystal_cross_prover_auto_family_v4
          BASE=https://raw.githubusercontent.com/j-tanner-slagel/pvs_cad/8750362e99c2ba0e9a0307dcaa39b9766c562feb/cad
          for f in cad_demo.pvs cad_demo.prf cad_examples.pvs cad_examples.prf cad_star_ex.pvs cad_star_ex.prf; do
            curl -fsSL -o "/tmp/pvs-family/$f" "$BASE/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from mathgraph.cross_prover_family_discovery import discover_family,render_lean_family
          sources={k:Path("/tmp/pvs-family",f"{k}.pvs").read_text() for k in ("cad_demo","cad_examples","cad_star_ex")}
          proofs={k:Path("/tmp/pvs-family",f"{k}.prf").read_text() for k in ("cad_demo","cad_examples","cad_star_ex")}
          d=discover_family(sources,proofs)
          assert d["source_lemma_count"]==34,d
          assert d["supported_occurrence_count"]==24,d
          assert d["source_verified_occurrence_count"]==23,d
          assert d["source_unverified_supported_occurrence_count"]==1,d
          assert d["unsupported_occurrence_count"]==10,d
          assert d["unique_canonical_claim_count"]==23,d
          assert d["verified_unique_claim_count"]==23,d
          fresh=sorted(x["claim_id"] for x in d["unique_claims"] if x["certificate_schema"]=="quantifier_witness_duality")
          assert len(fresh)==5,fresh
          unsupported={f"{x['theory']}.{x['formula']}":x["status"] for x in d["unsupported_occurrences"]}
          assert unsupported["cad_demo.d_inverse"]=="UNKNOWN_UNSUPPORTED_GRAMMAR"
          assert unsupported["cad_demo.t_amgm3"]=="UNKNOWN_UNSUPPORTED_GRAMMAR"
          out=Path("artifacts/crystal_cross_prover_auto_family_v4")
          out.joinpath("discovery.json").write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          skip=sorted(x["claim_id"] for x in d["unique_claims"] if x["certificate_schema"]!="quantifier_witness_duality")
          out.joinpath("Surface.lean").write_text(render_lean_family(d,skip_claim_ids=skip))
          print(json.dumps({
            "supported_occurrences":24,
            "unique_claims":23,
            "new_quantifier_duality_claims":5,
            "raw_exact_unknowns":10,
            "parallel_projection_relations":4,
            "effective_unresolved_if_new_gates_green":6,
            "parent_v3":"REQUIRED_BEFORE_FAMILY_PROMOTION"
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-auto-family-v4-discovery
          path: artifacts/crystal_cross_prover_auto_family_v4/

  lean-new:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cross-prover-auto-family-v4-discovery
          path: /tmp/family
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check five new consumers
        run: |
          set -euo pipefail
          ROOT=/tmp/crystal-v4-lean
          mkdir -p "$ROOT"
          cp /tmp/family/Surface.lean "$ROOT/Surface.lean"
          echo 'leanprover/lean4:v4.35.0-rc3' > "$ROOT/lean-toolchain"
          cat > "$ROOT/lakefile.toml" <<'EOF'
          name = "crystal-cross-prover-v4"
          version = "0.1.0"
          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "3cb72cfd416d1b5ec4b930d67648ef036a5df24f"
          EOF
          cd "$ROOT"
          lake update
          lake exe cache get
          lake env lean Surface.lean

  pvs-new:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates libgmp10
      - name: Install exact PVS and pinned source
        run: |
          set -euo pipefail
          curl -fL -o /tmp/pvs.tgz https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  /tmp/pvs.tgz" | sha256sum -c -
          mkdir -p /tmp/pvs-dist
          tar -xzf /tmp/pvs.tgz -C /tmp/pvs-dist
          PVS_BIN="$(find /tmp/pvs-dist -maxdepth 3 -type f -name pvs -perm -u+x | head -1)"
          PVS_DIR="$(dirname "$PVS_BIN")"
          echo "PVS_DIR=$PVS_DIR" >> "$GITHUB_ENV"
          git init /tmp/nasalib
          git -C /tmp/nasalib remote add origin https://github.com/nasa/pvslib.git
          git -C /tmp/nasalib fetch --depth=1 origin e426f69dc2680ad575491f93c5a51739ec8b25fa
          git -C /tmp/nasalib checkout --detach FETCH_HEAD
          git init /tmp/pvs_cad
          git -C /tmp/pvs_cad remote add origin https://github.com/j-tanner-slagel/pvs_cad.git
          git -C /tmp/pvs_cad fetch --depth=1 origin 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          git -C /tmp/pvs_cad checkout --detach FETCH_HEAD
          ln -sfn /tmp/nasalib "$PVS_DIR/nasalib"
      - name: Replay five new source authorities
        run: |
          set -euo pipefail
          cd /tmp/pvs_cad/cad
          export PVS_LIBRARY_PATH=/tmp/nasalib
          "$PVS_DIR/proveit" -q --timeout 180 @cad_demo.d_no_inverse | tee /tmp/pvs_demo.log
          "$PVS_DIR/proveit" -q --timeout 180 @cad_star_ex.s_disc:s_alt_goal:s_alt_hyp:s_two | tee /tmp/pvs_star.log
          for log in /tmp/pvs_demo.log /tmp/pvs_star.log; do
            grep -q "Grand Totals:" "$log"
            if grep -Ei "unfinished|untried|unchecked" "$log"; then exit 1; fi
          done

  candidate:
    needs: [discover,lean-new,pvs-new]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record locally qualified V4 pending V3 lineage
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/crystal_cross_prover_auto_family_v4
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={
            "schema":"mathgraph.crystal-cross-prover-auto-family-result.v4-candidate",
            "status":"CANDIDATE_NEW_AUTHORITIES_GREEN_PARENT_V3_PENDING",
            "run_id":int(os.environ["RUN_ID"]),
            "head_sha":os.environ["HEAD_SHA"],
            "new_constructor":"quantifier_witness_duality",
            "new_claim_count":5,
            "new_pvs_authorities":"GREEN",
            "new_lean_consumers":"GREEN",
            "required_parent_run":36645655186,
            "raw_exact_unknowns_after_local_extension":10,
            "parallel_projection_relations":4,
            "effective_unresolved_after_local_extension":6,
            "promotion_boundary":"Do not promote the 23-claim family until V3 has terminal warranted status."
          }
          Path("artifacts/crystal_cross_prover_auto_family_v4/result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-cross-prover-auto-family-v4-candidate
          path: artifacts/crystal_cross_prover_auto_family_v4/result.json
