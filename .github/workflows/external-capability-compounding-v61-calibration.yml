name: V61 Opened Verified Proof Compilation

on:
  push:
    branches: [external-capability-compounding-v61]
    paths:
      - 'experiments/external_capability_compounding_v61/**'
      - '.github/workflows/external-capability-compounding-v61-calibration.yml'
  workflow_dispatch:

jobs:
  proof-compilation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Freeze external corpus bytes
        run: |
          set -euo pipefail
          mkdir -p external-v61
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v61/book3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v61/book3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v61/book3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v61/book3500.jsonl" | sha256sum -c -
          echo "FRESH_ROWS_2820_PLUS_UNTOUCHED"

      - name: Train verified macros on V58-opened rows and validate on V59-opened rows
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v61/calibrate_proof_compilation.py \
            --book3000 external-v61/book3000.jsonl \
            --book3500 external-v61/book3500.jsonl \
            --out external-v61/calibration

      - name: Preserve calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v61-opened-verified-proof-compilation
          path: external-v61/calibration/
