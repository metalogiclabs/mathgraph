name: ethereum-crystal-v16-geth-catchup-end-to-end
on:
  push:
    branches: [ethereum-msi-consequential-interface-v1]
  workflow_dispatch:
jobs:
  geth-catchup-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned EELS
        run: |
          git clone --filter=blob:none https://github.com/ethereum/execution-specs.git /tmp/eels
          cd /tmp/eels
          git checkout 84e7d2c266e3319fc3882e72f379282bb1c40f2d
      - uses: astral-sh/setup-uv@v6
      - name: Install EELS workspace
        working-directory: /tmp/eels
        run: uv sync --group test
      - name: Generate official Amsterdam BAL corpus
        working-directory: /tmp/eels
        run: |
          rm -rf /tmp/eels-v16-fixtures
          uv run fill --from Amsterdam --until Amsterdam --output=/tmp/eels-v16-fixtures --skip-index --no-html -n 2 tests/amsterdam/eip7928_block_level_access_lists
      - name: Export frozen held-out BAL RLP
        run: |
          uv run --project /tmp/eels python experiments/ethereum_crystal_v10/export_heldout_rlp.py /tmp/eels-v16-fixtures /tmp/crystal-v16-heldout.rlpbin
          sha256sum /tmp/crystal-v16-heldout.rlpbin > /tmp/crystal-v16-heldout.sha256
      - name: Checkout and patch pinned geth
        run: |
          git clone --filter=blob:none https://github.com/ethereum/go-ethereum.git /tmp/geth
          cd /tmp/geth
          git checkout 920c07774c65ebb3023536f85df642c44478b540
          cp "$GITHUB_WORKSPACE/experiments/ethereum_crystal_v13/crystal_apply_decoder.go" core/types/bal/crystal_apply_decoder.go
          python "$GITHUB_WORKSPACE/experiments/ethereum_crystal_v13/patch_geth.py"
          cp "$GITHUB_WORKSPACE/experiments/ethereum_crystal_v16/crystal_catchup_bench_test.go" eth/protocols/snap/crystal_catchup_bench_test.go
          gofmt -w core/types/bal/crystal_apply_decoder.go eth/protocols/snap/syncv2.go eth/protocols/snap/crystal_catchup_bench_test.go
          git diff --check
          git diff > /tmp/crystal-v16-geth.patch
      - name: Verify end-to-end state parity
        working-directory: /tmp/geth
        env:
          CRYSTAL_BAL_CORPUS: /tmp/crystal-v16-heldout.rlpbin
        run: go test ./eth/protocols/snap -run '^TestCrystalCatchupCorpusStateParity$' -count=1 -v
      - name: Benchmark decode plus apply plus batch writes
        working-directory: /tmp/geth
        env:
          CRYSTAL_BAL_CORPUS: /tmp/crystal-v16-heldout.rlpbin
        run: |
          go test ./eth/protocols/snap -run '^$' -bench '^BenchmarkCrystalCatchup(Full|Compact)$' -benchmem -benchtime=1x -count=5 | tee /tmp/crystal-v16-bench.txt
          python "$GITHUB_WORKSPACE/experiments/ethereum_crystal_v16/parse_bench.py" /tmp/crystal-v16-bench.txt /tmp/crystal-v16-certificate.json
      - name: Upload V16 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-crystal-v16-geth-catchup-end-to-end
          path: |
            /tmp/crystal-v16-certificate.json
            /tmp/crystal-v16-bench.txt
            /tmp/crystal-v16-geth.patch
            /tmp/crystal-v16-heldout.sha256
      - name: Seal
        run: |
          echo "ETHEREUM_CRYSTAL_V16_GETH_CATCHUP_END_TO_END=PASS"
          echo "GETH_PIN=920c07774c65ebb3023536f85df642c44478b540"
