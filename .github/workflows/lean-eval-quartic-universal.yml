name: LeanEval quartic universal

on:
  pull_request:
    paths:
      - '.github/workflows/lean-eval-quartic-universal.yml'
      - 'competitions/lean_eval/CubicUniversal.lean'
      - 'competitions/lean_eval/QuarticUniversal.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quartic-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_EVAL_SHA: de48559590eb8cff2125e8e933b3e13bb8a3ff98
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build frozen Abel-Ruffini workspace
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem abel_ruffini /tmp/abel_ruffini
          cd /tmp/abel_ruffini
          lake update
      - name: Compile universal quartic solver
        working-directory: /tmp/abel_ruffini
        run: |
          cp "$GITHUB_WORKSPACE/competitions/lean_eval/CubicUniversal.lean" CubicUniversal.lean
          cp "$GITHUB_WORKSPACE/competitions/lean_eval/QuarticUniversal.lean" QuarticUniversal.lean
          set +e
          lake env lean -o CubicUniversal.olean CubicUniversal.lean > /tmp/cubic-dependency.log 2>&1
          dep=$?
          echo "cubic_dependency_exit=$dep"
          if [ "$dep" -ne 0 ]; then tail -n 120 /tmp/cubic-dependency.log; exit 0; fi
          lake env lean QuarticUniversal.lean > /tmp/quartic-universal.log 2>&1
          code=$?
          echo "quartic_universal_exit=$code"
          tail -n 220 /tmp/quartic-universal.log
          exit 0
