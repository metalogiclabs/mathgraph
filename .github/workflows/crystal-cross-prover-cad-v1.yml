name: Crystal Cross-Prover CAD Semantic Linker V1
# cross-prover qualification gate

on:
  push:
    branches:
      - crystal-cross-prover-semantic-linker-v1
    paths:
      - 'experiments/crystal_cross_prover_cad_v1/**'
      - 'mathgraph/cross_prover_semantic_surface.py'
      - 'tests/test_cross_prover_semantic_surface.py'
      - '.github/workflows/crystal-cross-prover-cad-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - name: Test cross-prover compiler
        run: python -m pytest -q tests/test_cross_prover_semantic_surface.py
      - name: Verify exact PVS source surface
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal_cross_prover_cad_v1
          curl -fsSL -o /tmp/cad_demo.pvs             https://raw.githubusercontent.com/j-tanner-slagel/pvs_cad/8750362e99c2ba0e9a0307dcaa39b9766c562feb/cad/cad_demo.pvs
          curl -fsSL -o /tmp/cad_demo.prf             https://raw.githubusercontent.com/j-tanner-slagel/pvs_cad/8750362e99c2ba0e9a0307dcaa39b9766c562feb/cad/cad_demo.prf
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from mathgraph.cross_prover_semantic_surface import (
              load_manifest, verify_pvs_source_surface,
          )

          m=load_manifest("experiments/crystal_cross_prover_cad_v1/manifest.json")
          def git_blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          src=Path("/tmp/cad_demo.pvs").read_bytes()
          prf=Path("/tmp/cad_demo.prf").read_bytes()
          assert git_blob(src)==m["pvs"]["source_blob_sha"]
          assert git_blob(prf)==m["pvs"]["proof_blob_sha"]
          result=verify_pvs_source_surface(m,src.decode())
          assert '(|d_amgm-0|' in prf.decode()
          assert '(CAD)' in prf.decode()
          result["proof_blob_sha"]=m["pvs"]["proof_blob_sha"]
          result["source_blob_sha"]=m["pvs"]["source_blob_sha"]
          Path("artifacts/crystal_cross_prover_cad_v1/source_surface.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-source-surface
          path: artifacts/crystal_cross_prover_cad_v1/source_surface.json

  pvs-replay:
    needs: source-surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PVS runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates libgmp10
      - name: Install exact PVS 8.1.2 binary
        run: |
          set -euo pipefail
          curl -fL -o /tmp/pvs.tgz             https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  /tmp/pvs.tgz" | sha256sum -c -
          mkdir -p /tmp/pvs-dist
          tar -xzf /tmp/pvs.tgz -C /tmp/pvs-dist
          PVS_BIN="$(find /tmp/pvs-dist -maxdepth 3 -type f -name pvs -perm -u+x | head -1)"
          test -n "$PVS_BIN"
          PVS_DIR="$(dirname "$PVS_BIN")"
          echo "PVS_DIR=$PVS_DIR" >> "$GITHUB_ENV"
          "$PVS_BIN" --version
          test -x "$PVS_DIR/proveit"
      - name: Pin NASALib and PVS CAD corpus
        run: |
          set -euo pipefail
          git init /tmp/nasalib
          git -C /tmp/nasalib remote add origin https://github.com/nasa/pvslib.git
          git -C /tmp/nasalib fetch --depth=1 origin e426f69dc2680ad575491f93c5a51739ec8b25fa
          git -C /tmp/nasalib checkout --detach FETCH_HEAD
          test "$(git -C /tmp/nasalib rev-parse HEAD)" = e426f69dc2680ad575491f93c5a51739ec8b25fa

          git init /tmp/pvs_cad
          git -C /tmp/pvs_cad remote add origin https://github.com/j-tanner-slagel/pvs_cad.git
          git -C /tmp/pvs_cad fetch --depth=1 origin 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          git -C /tmp/pvs_cad checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pvs_cad rev-parse HEAD)" = 8750362e99c2ba0e9a0307dcaa39b9766c562feb

          test "$(git -C /tmp/pvs_cad hash-object cad/cad_demo.pvs)" = 90a3d14afff0fc023c2053b7635b05b93dfa5429
          test "$(git -C /tmp/pvs_cad hash-object cad/cad_demo.prf)" = f2db4a2a6fd22f23b472e62c1cb0b18779799577

          ln -sfn /tmp/nasalib "$PVS_DIR/nasalib"
          echo "PVS_LIBRARY_PATH=/tmp/nasalib" >> "$GITHUB_ENV"
      - name: Replay exact PVS CAD theorem
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1"
          cd /tmp/pvs_cad/cad
          export PVS_LIBRARY_PATH=/tmp/nasalib
          "$PVS_DIR/proveit" -q --timeout 180 @cad_demo.d_amgm:d_amgm_TCC1             | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1/pvs_replay.log"
          grep -q "Grand Totals:" "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1/pvs_replay.log"
          if grep -Ei "unfinished|untried|unchecked" "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1/pvs_replay.log"; then
            exit 1
          fi
          echo '{"status":"PVS_REPLAY_GREEN","theory":"cad_demo","formula":"d_amgm","pvs":"8.1.2","nasalib":"e426f69dc2680ad575491f93c5a51739ec8b25fa"}'             > "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1/pvs_replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-pvs-replay
          path: artifacts/crystal_cross_prover_cad_v1/pvs_replay.*

  lean-replay:
    needs: source-surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Construct exact Lean consumer
        run: |
          set -euo pipefail
          ROOT=/tmp/crystal-cross-prover-lean
          mkdir -p "$ROOT"
          echo 'leanprover/lean4:v4.35.0-rc3' > "$ROOT/lean-toolchain"
          cat > "$ROOT/lakefile.toml" <<'EOF'
          name = "crystal-cross-prover-cad"
          version = "0.1.0"

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "3cb72cfd416d1b5ec4b930d67648ef036a5df24f"
          EOF
          python - <<'PY'
          from pathlib import Path
          from mathgraph.cross_prover_semantic_surface import load_manifest, render_lean_file
          m=load_manifest("experiments/crystal_cross_prover_cad_v1/manifest.json")
          Path("/tmp/crystal-cross-prover-lean/Surface.lean").write_text(render_lean_file(m))
          PY
          cd "$ROOT"
          lake update
          lake exe cache get
          lake env lean Surface.lean
          mkdir -p "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1"
          sha256sum Surface.lean | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1/lean_surface.sha256"
          echo '{"status":"LEAN_REPLAY_GREEN","theorem":"CrystalCrossProverCAD.amgm2_real","toolchain":"v4.35.0-rc3","mathlib":"3cb72cfd416d1b5ec4b930d67648ef036a5df24f"}'             > "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_cad_v1/lean_replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-lean-replay
          path: artifacts/crystal_cross_prover_cad_v1/

  promote:
    needs: [source-surface, pvs-replay, lean-replay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - name: Compile cross-prover semantic capability
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/crystal_cross_prover_cad_v1
          python - <<'PY'
          import json,os
          from pathlib import Path
          from mathgraph.cross_prover_semantic_surface import (
              CrossProverAuthority,
              compile_cross_prover_capability,
              load_manifest,
          )
          m=load_manifest("experiments/crystal_cross_prover_cad_v1/manifest.json")
          run=os.environ["RUN_ID"]
          obj=compile_cross_prover_capability(
              m,
              CrossProverAuthority(
                  pvs_replay_ref=f"github-run:{run}:pvs-replay",
                  lean_replay_ref=f"github-run:{run}:lean-replay",
                  source_match_ref=f"git-head:{os.environ['HEAD_SHA']}",
              ),
          )
          out={
              "schema":"mathgraph.crystal-cross-prover-cad-result.v1",
              "status":"WARRANTED_BOUNDED_CROSS_PROVER_SEMANTIC_LINK",
              "semantic_object_id":obj.id,
              "type_id":obj.type_id,
              "interfaces":list(obj.interfaces),
              "canonical_claim_id":m["canonical_claim"]["id"],
              "pvs":{
                  "theory":m["pvs"]["theory"],
                  "formula":m["pvs"]["formula"],
                  "commit":m["pvs"]["commit"],
                  "proof_replayed":True,
              },
              "lean":{
                  "theorem":"CrystalCrossProverCAD.amgm2_real",
                  "mathlib_commit":m["lean"]["mathlib_commit"],
                  "kernel_checked":True,
              },
              "origin_class":"INDEPENDENT_PROVER_SURFACES",
              "unknowns":[
                  "universal PVS-to-Lean proof transport",
                  "automatic semantic alignment for arbitrary formulas",
                  "reuse without an independently checkable consumer certificate"
              ],
          }
          Path("artifacts/crystal_cross_prover_cad_v1/result.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-cross-prover-cad-v1
          path: artifacts/crystal_cross_prover_cad_v1/result.json
