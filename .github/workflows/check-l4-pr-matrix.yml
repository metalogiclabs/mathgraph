name: L4YAML varied audit calibration
on:
  push:
    branches: [research/check-l4-pr-matrix-v1]
    paths:
      - 'experiments/check-l4-pr-matrix-v1/**'
      - '.github/workflows/check-l4-pr-matrix.yml'
permissions:
  contents: read
concurrency:
  group: l4yaml-varied-audit-calibration
  cancel-in-progress: false
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Admission regressions
        run: python3 -m unittest discover -s experiments/check-l4-pr-matrix-v1 -p 'test_*.py'
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
      - name: Native offline replay
        run: python3 experiments/check-l4-pr-matrix-v1/native.py experiments/check-l4-pr-matrix-v1/native-config.json matrix-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l4yaml-audit-calibration
          path: |
            matrix-results/*.json
            matrix-results/logs/
