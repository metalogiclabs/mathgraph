name: LeanEval profinite rigidity probe

on:
  push:
    branches:
      - lean-eval-baseline
    paths:
      - 'experiments/lean_eval/annals_absolute_profinite_rigidity/**'
      - '.github/workflows/lean-eval-profinite-rigidity-probe.yml'
  workflow_dispatch:

jobs:
  profinite-rigidity-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate frozen target workspace
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
          lake exe cache get
          lake build
          lake exe lean-eval start-problem annals_absolute_profinite_rigidity /tmp/profinite
          cd /tmp/profinite
          lake update
          lake build ChallengeDeps Challenge
      - name: Install probe
        run: |
          cp "$GITHUB_WORKSPACE/experiments/lean_eval/annals_absolute_profinite_rigidity/Submission.lean" /tmp/profinite/Submission.lean
      - name: Compile and expose residual
        run: |
          set +e
          cd /tmp/profinite
          lake build Submission 2>&1 | tee /tmp/profinite-probe.log
          code=${PIPESTATUS[0]}
          echo "profinite_probe_exit=$code"
          exit 0
      - name: Upload probe log
        uses: actions/upload-artifact@v4
        with:
          name: lean-eval-profinite-rigidity-probe
          path: /tmp/profinite-probe.log
