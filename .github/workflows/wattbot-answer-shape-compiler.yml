name: WattBot exact range versus derived-band answer-shape qualification
on:
  push:
    branches: [wattbot-answer-shape-compiler-v1]
    paths:
      - '.github/workflows/wattbot-answer-shape-compiler.yml'
      - 'experiments/wattbot2026/answer_shape.py'
      - 'experiments/wattbot2026/derivation_router_probe.py'
jobs:
  consequence-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Score.py and scientific PDF dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Verify exact value shape with immutable citation identity
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/answer_shape.py
          python experiments/wattbot2026/derivation_router_probe.py --self-test
      - name: Score answer shape with same model replies and unchanged evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/derivation_router_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Protected scientific boundary
        run: |
          echo "No source/citation or answer content invented: formatting-only normalization."
          echo "Source-stated ranges and tolerance bands retain distinct score semantics."
          echo "Only 182 development TRAIN worked examples, never target holdout or TEST labels."
          echo "Same 63 TRAIN model replies for each arm; extra cost capped USD 0.16."
          echo "No Kaggle TEST inference, submission or answer artifacts."
