name: VDN ARC state-conditioned method V25

on:
  push:
    branches:
      - mathgraph/msi-arc-pikpi-v11-20260828
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v25_state_conditioned_method.py'
      - '.github/workflows/vdn-arc-state-conditioned-v25.yml'
  workflow_dispatch:

jobs:
  state-conditioned-method:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V25 state-conditioned method transfer
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v25_state_conditioned_method.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-state-conditioned-v25
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v25_state_conditioned_method/result.json
