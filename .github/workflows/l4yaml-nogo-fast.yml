name: L4YAML universal no-go fast

on:
  push:
    branches: [l4yaml-parser-boundary-v1]
    paths:
      - 'experiments/l4yaml/CapstoneObstruction.lean'
      - 'experiments/l4yaml/SemanticObstruction.lean'
      - 'experiments/l4yaml/CorrectedCapstone.lean'
      - 'experiments/l4yaml/NoGo.lean'
      - '.github/workflows/l4yaml-nogo-fast.yml'
  workflow_dispatch:

jobs:
  no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: 16562a74421f94cc0f8216eecf21f1ff58166fa7
          path: upstream
          submodules: recursive
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean
        working-directory: upstream
        run: elan toolchain install "$(cat lean-toolchain)" || true
      - name: Build dependencies
        working-directory: upstream
        run: |
          lake build L4YAML.Surface.Document L4YAML.Scanner.Scanner L4YAML.Parser.TokenParser L4YAML.Parser.Composition L4YAML.Proofs.Composition
      - name: Kernel-check universal no-go
        run: |
          cp experiments/l4yaml/CapstoneObstruction.lean upstream/CapstoneObstruction.lean
          cp experiments/l4yaml/SemanticObstruction.lean upstream/SemanticObstruction.lean
          cp experiments/l4yaml/CorrectedCapstone.lean upstream/CorrectedCapstone.lean
          cp experiments/l4yaml/NoGo.lean upstream/NoGo.lean
          cd upstream
          lake env lean -o .lake/build/lib/lean/CapstoneObstruction.olean CapstoneObstruction.lean
          lake env lean -o .lake/build/lib/lean/SemanticObstruction.olean SemanticObstruction.lean
          lake env lean -o .lake/build/lib/lean/CorrectedCapstone.olean CorrectedCapstone.lean
          lake env lean NoGo.lean
