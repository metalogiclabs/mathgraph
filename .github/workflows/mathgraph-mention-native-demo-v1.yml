name: MathGraph native claim and repair controls
on:
  push:
    branches: ['feat/mathgraph-mention-agent-v1-20261102']
    paths:
      - '.github/workflows/mathgraph-mention-native-demo-v1.yml'
      - 'integrations/mathgraph-check-github/run-mention-native-controls-v1.mjs'
      - 'integrations/mathgraph-check-github/mention-native-demo-v1.mjs'
permissions:
  contents: read
jobs:
  native-claim-consumer-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Download and verify Lean 4.28.0 release bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mathgraph-lean-image/lean"
          curl --proto '=https' --tlsv1.2 -fL --retry 2 \
            https://github.com/leanprover/lean4/releases/download/v4.28.0/lean-4.28.0-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          echo "ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/mathgraph-lean-image/lean"
          docker build -t mathgraph-lean-demo:v1 -f integrations/mathgraph-check-github/Dockerfile.native-demo "$RUNNER_TEMP/mathgraph-lean-image"
          docker image inspect --format '{{.Id}}' mathgraph-lean-demo:v1
      - name: Check authentic proof, original consumer and repair in isolated native Lean
        run: node integrations/mathgraph-check-github/run-mention-native-controls-v1.mjs
