name: WattBot external scoreboard snapshot
on:
  push:
    branches: [wattbot-full-window-v1]
    paths:
      - '.github/workflows/wattbot-scoreboard-snapshot.yml'
jobs:
  kaggle-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle
      - name: Exact Kaggle submitted-score authority
        run: kaggle competitions submissions -c WattBot2026
      - name: Current Kaggle public leaderboard
        run: kaggle competitions leaderboard WattBot2026 --show
      - name: Authenticated placement
        run: kaggle competitions list --group entered -s WattBot2026 -v
