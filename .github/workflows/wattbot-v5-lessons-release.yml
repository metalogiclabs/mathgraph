name: WattBot V5 guarded Kaggle release — compiled development lessons
on:
  workflow_dispatch:
    inputs:
      submit_to_kaggle:
        description: "I have checked that Kaggle submission quota is available"
        required: true
        type: boolean
        default: false
  push:
    branches: [wattbot-verified-lessons-submit-v5]
    paths:
      - '.github/workflows/wattbot-v5-lessons-release.yml'
jobs:
  kaggle-v5:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.submit_to_kaggle) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[WATTBOT_V5_SUBMIT]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned evaluator and source PDF dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf pytest
      - name: Verify evidence, exemplar-isolation and CSV gates before any inference
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/full_reader.py --self-test
          python experiments/wattbot2026/verified_lesson.py
          python experiments/wattbot2026/submit_verified_lessons_v5.py --self-test
          python -m pytest -q experiments/wattbot2026/tests/test_submission_gate.py experiments/wattbot2026/tests/test_query_window.py
      - name: Generate protected TEST candidate only from supplied question text and pinned PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/submit_verified_lessons_v5.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip" \
            --out "$RUNNER_TEMP/wattbot/mathgraph_verified_lessons_v5.csv"
          python experiments/wattbot2026/submission_gate.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip" \
            --submission "$RUNNER_TEMP/wattbot/mathgraph_verified_lessons_v5.csv"
      - name: Submit V5 only after all integrity, budget and null-transport gates pass
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/wattbot/mathgraph_verified_lessons_v5.csv"
          kaggle competitions submit -c WattBot2026 \
            -f "$RUNNER_TEMP/wattbot/mathgraph_verified_lessons_v5.csv" \
            -m "MathGraph V5: DEV-only verified lesson compilation with V4 source and candidate guards; ${GITHUB_SHA:0:12}"
      - name: Read Kaggle acceptance or pending status
        run: kaggle competitions submissions -c WattBot2026
      - name: Qualification boundary
        run: |
          echo "V5 TRAIN same-response qualification 37985937618: 0.61058201 -> 0.69074074."
          echo "This is not itself a Kaggle score; Kaggle COMPLETE is external authority."
          echo "No hidden TEST labels, near-duplicate answer memorization, unpinned PDF, or CSV publication."
          echo "Raw scientific claims remain CANDIDATE until warranted by source verification."
