name: MathGraph Protocol — Finite Capability Conformance V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'conformance/capability_v1/**'
      - 'conformance/discover_v1/**'
      - 'conformance/interoperability_v1/**'
      - 'conformance/import_v1/**'
      - 'conformance/protocol_v1/**'
      - 'conformance/resolve_v1/**'
      - 'conformance/source_catalogue_v1/**'
      - 'catalogues/mathlib-v4.34.1-foundations-v1.source.json'
      - 'mathgraph_protocol/**'
      - 'mathgraph/discovery_scheduler.py'
      - 'mathgraph/discovery_candidate_sources.py'
      - 'mathgraph/evidence_packs.py'
      - 'adapters/in_toto_v1.py'
      - 'scripts/mathgraph_discover_v1.py'
      - 'scripts/mathgraph_capability_v1.py'
      - 'scripts/mathgraph_import_v1.py'
      - 'scripts/package_mathgraph_resolve_v1.py'
      - 'scripts/qualify_mathlib_source_catalogue_v1.py'
      - 'scripts/run_discovery_scheduler.py'
      - 'scripts/run_discovery_scheduler_from_evidence.py'
      - 'tests/test_mathgraph_protocol_import.py'
      - 'tests/test_mathlib_source_catalogue_qualification_v1.py'
      - 'tests/test_source_catalogue_contract_v1.py'
      - 'tests/fixtures/source_catalogue_v1/**'
      - 'website/tests/contracts.test.ts'
      - 'tests/test_discovery_scheduler.py'
      - 'tests/test_discovery_candidate_sources.py'
      - 'protocol/schemas/**'
      - 'protocol/registries/**'
      - 'examples/evidence_packs/**'
      - 'pyproject.toml'
      - 'website/public/capabilities/**'
      - 'website/public/catalogues/mathlib/v4.34.1/**'
      - 'website/public/evidence/mg-l4yaml-source-check-20261010/record.json'
      - 'website/public/schemas/**'
      - 'experiments/developmental_capability_growth_v1/**'
      - '.github/workflows/mathgraph-protocol-conformance-v1.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  finite-capability-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Reviewed separately from incoming descriptors, receipts, and registries.
      FINITE_POLICY_SHA256: 7069c764579d933679f6bfd9b922a724ad9bcb250e4060c660cb4fd099c60e89
      IMPORT_POLICY_SHA256: 944231afaf9d89e6f7dc77d9efbe80dcbd3fc76f8e8f260b32637a0f261faf65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.17'
      - name: Acquire test tools and immutable runtime before isolation
        run: |
          set -euo pipefail
          # Legacy scheduler compatibility imports the optional SAIR dependencies.
          python -m pip install pytest==9.0.3 jsonschema==4.26.0 numpy==2.4.2 pandas==3.0.1
          FINITE_IMAGE_REF=python:3.11-slim@sha256:e529028263dbe6910a2d96f7d2b8f5266385e917fd45d286ef166977c094a51e
          docker pull "$FINITE_IMAGE_REF"
          FINITE_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$FINITE_IMAGE_REF")
          echo "FINITE_IMAGE_ID=$FINITE_IMAGE_ID" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/finite-capability-evidence"
          docker image inspect "$FINITE_IMAGE_ID" > "$RUNNER_TEMP/finite-capability-evidence/runtime-image.json"
      - name: Strict contracts, mutations, pins, and byte-identical projections
        run: |
          set -euo pipefail
          echo "$FINITE_POLICY_SHA256  conformance/capability_v1/trust-policy.json" | sha256sum -c -
          echo "$IMPORT_POLICY_SHA256  conformance/import_v1/fixtures/trust-policy.json" | sha256sum -c -
          python -m pytest conformance/import_v1 conformance/protocol_v1 conformance/resolve_v1 \
            conformance/discover_v1 conformance/capability_v1 conformance/interoperability_v1 \
            conformance/source_catalogue_v1 \
            tests/test_mathgraph_protocol_import.py \
            tests/test_mathlib_source_catalogue_qualification_v1.py \
            tests/test_discovery_scheduler.py tests/test_discovery_candidate_sources.py -q
          cmp protocol/registries/capabilities-v1.json website/public/capabilities/index-v1.json
          git diff --exit-code
      - name: Replay only four inputs with network and repository access denied
        run: |
          set -euo pipefail
          python conformance/capability_v1/run_isolated.py --backend docker \
            --image-id "$FINITE_IMAGE_ID" --policy-sha256 "$FINITE_POLICY_SHA256" \
            > "$RUNNER_TEMP/finite-capability-evidence/replay.json" \
            2> "$RUNNER_TEMP/finite-capability-evidence/isolation.json"
          echo "5d85d7117532fd777d7b2948ab1138bec47db81176327fdb9591e0be7fe2a006  $RUNNER_TEMP/finite-capability-evidence/replay.json" | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mathgraph-finite-capability-independent-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finite-capability-evidence/
          if-no-files-found: error
          retention-days: 14
