name: LeanEval equation portal V2

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-equation-portal-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equation-factor-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: annals_erdos_supersingular_primes
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Verify equation-derived interfaces
        id: verify
        working-directory: /tmp/${{ env.TARGET }}
        run: |
          set +e
          cat > /tmp/base.lean <<'LEAN'
          import ChallengeDeps
          import Mathlib.Analysis.Complex.Exponential

          set_option autoImplicit false
          namespace ErdosSupersingularPrimes
          open Int Real

          def k₀ : ℕ := sorry

          theorem generated_core_bound (k : ℕ) (hk : k ≥ k₀) (s : Solution k)
              (hs : s.l.Prime) (hy : s.y ≠ 0) (hd : s.d ≠ 0) :
              s.l ≤ exp (10 ^ k) := by
            sorry
          end ErdosSupersingularPrimes
          LEAN

          cat > /tmp/interfaces.tsv <<'EOF'
          sham\ts.l = s.l\texact rfl
          product_nonzero\t(∏ i ∈ Finset.range k, (s.n + i * s.d)) ≠ 0\thave hpow : s.y ^ s.l ≠ 0 := pow_ne_zero _ hy; rw [← s.eq] at hpow; exact hpow
          factor_nonzero\t∀ i ∈ Finset.range k, (s.n + i * s.d) ≠ 0\tapply Finset.prod_ne_zero_iff.mp; have hpow : s.y ^ s.l ≠ 0 := pow_ne_zero _ hy; rw [← s.eq] at hpow; exact hpow
          factor_coprime_d\t∀ i ∈ Finset.range k, Int.gcd (s.n + i * s.d) s.d = 1\tintro i hi; simpa [s.gcd] using (Int.gcd_add_mul_left_left s.n s.d (i : ℤ))
          prime_support_transfer\t∀ q : ℤ, Prime q → q ∣ (∏ i ∈ Finset.range k, (s.n + i * s.d)) → q ∣ s.y\tintro q hq hdiv; rw [s.eq] at hdiv; exact hq.dvd_of_dvd_pow hdiv
          exponent_multiplicity\t∀ q : ℤ, q ∣ s.y → q ^ s.l ∣ (∏ i ∈ Finset.range k, (s.n + i * s.d))\tintro q hq; rw [s.eq]; exact pow_dvd_pow_of_dvd hq s.l
          EOF
          sed -i 's/^          //' /tmp/interfaces.tsv

          : > /tmp/verified.tsv
          while IFS=$'\t' read -r name prop proof; do
            cp /tmp/base.lean Submission.lean
            PROP="$prop" PROOF="$proof" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          repl=("  have hDelta : " + os.environ['PROP'] + " := by\n"
                + "    " + os.environ['PROOF'] + "\n"
                + "  sorry\n"
                + "end ErdosSupersingularPrimes")
          s,n=re.subn(r'  sorry\nend ErdosSupersingularPrimes',lambda _: repl,s,count=1)
          if n != 1: raise SystemExit(f'interface replacements={n}')
          open('Submission.lean','w').write(s)
          PY
            pycode=$?
            if [ "$pycode" -ne 0 ]; then
              echo "PORTAL_HARNESS_FATAL name=$name python_exit=$pycode"
              exit "$pycode"
            fi
            lake build Submission > "/tmp/interface-${name}.log" 2>&1
            code=$?
            echo "PORTAL_INTERFACE_VERIFY name=$name exit=$code"
            if [ "$code" -eq 0 ]; then
              printf '%s\t%s\t%s\n' "$name" "$prop" "$proof" >> /tmp/verified.tsv
            fi
          done < /tmp/interfaces.tsv
          echo "verified=$(wc -l < /tmp/verified.tsv)" >> "$GITHUB_OUTPUT"
      - name: Replay primitive language across portal
        id: replay
        working-directory: /tmp/${{ env.TARGET }}
        run: |
          set +e
          cat > /tmp/tails.tsv <<'EOF'
          simp\ttry simp_all
          aesop\ttry aesop
          grind\ttry grind
          norm\ttry norm_num at *
          linarith\ttry linarith
          nlinarith\ttry nlinarith
          positivity\ttry positivity
          ringnf\ttry ring_nf
          fieldsimp\ttry field_simp
          elim\ttry solve_by_elim
          contra\ttry contradiction
          tauto\ttry tauto
          EOF
          sed -i 's/^          //' /tmp/tails.tsv
          : > /tmp/replay.tsv
          solved=0
          winner=''
          while IFS=$'\t' read -r iname prop proof; do
            while IFS=$'\t' read -r tname body; do
              cp /tmp/base.lean Submission.lean
              PROP="$prop" PROOF="$proof" BODY="$body" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          repl=("  have hDelta : " + os.environ['PROP'] + " := by\n"
                + "    " + os.environ['PROOF'] + "\n"
                + "  " + os.environ['BODY'] + "\n"
                + "end ErdosSupersingularPrimes")
          s,n=re.subn(r'  sorry\nend ErdosSupersingularPrimes',lambda _: repl,s,count=1)
          if n != 1: raise SystemExit(f'replay replacements={n}')
          open('Submission.lean','w').write(s)
          PY
              pycode=$?
              if [ "$pycode" -ne 0 ]; then
                echo "PORTAL_HARNESS_FATAL replay=$iname:$tname python_exit=$pycode"
                exit "$pycode"
              fi
              lake build Submission > "/tmp/replay-${iname}-${tname}.log" 2>&1
              code=$?
              sig=$(python3 - "/tmp/replay-${iname}-${tname}.log" <<'PY'
          import re,sys,hashlib
          s=open(sys.argv[1],errors='ignore').read()
          chunks=re.findall(r'(?:Initial goal:|unsolved goals|⊢)[\s\S]{0,1200}',s)
          x=(chunks[-1] if chunks else s[-2200:])
          x=re.sub(r'^hDelta\s*:.*$', '', x, flags=re.M)
          x=re.sub(r'/tmp/[^ ]+','<PATH>',x)
          x=re.sub(r'\d+\.\d+s','<TIME>',x)
          x='\n'.join(line for line in x.splitlines() if line.strip())
          print(hashlib.sha256(x.encode()).hexdigest()[:16])
          PY
          )
              printf '%s\t%s\t%s\t%s\n' "$iname" "$tname" "$code" "$sig" >> /tmp/replay.tsv
              if [ "$code" -eq 0 ]; then
                solved=1
                winner="${iname}:${tname}"
                cp Submission.lean /tmp/PORTAL-SOLVED.lean
                break 2
              fi
            done < /tmp/tails.tsv
          done < /tmp/verified.tsv
          echo "solved=$solved" >> "$GITHUB_OUTPUT"
          echo "winner=$winner" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from collections import defaultdict
          rows=[x.rstrip().split('\t') for x in open('/tmp/replay.tsv') if x.strip()]
          by=defaultdict(list)
          for r in rows:
              if len(r)==4: by[r[0]].append(r)
          sham=set(r[3] for r in by.get('sham',[]))
          changed=[]
          print('PORTAL_REPLAY_PROGRAMS',len(rows))
          print('PORTAL_SHAM_CLASSES',len(sham))
          for name,rs in sorted(by.items()):
              sig=set(r[3] for r in rs)
              delta=len(sig-sham)
              print('PORTAL_FRONTIER',name,'PROGRAMS',len(rs),'CLASSES',len(sig),'NOVEL_VS_SHAM',delta)
              if name!='sham' and sig != sham: changed.append(name)
          print('PORTAL_CHANGING_INTERFACES',','.join(changed) if changed else 'NONE')
          open('/tmp/changing.txt','w').write('\n'.join(changed))
          PY
          changing=$(grep -c . /tmp/changing.txt 2>/dev/null || true)
          echo "changing=$changing" >> "$GITHUB_OUTPUT"
      - name: Equation portal gate
        run: |
          if [ "${{ steps.replay.outputs.solved }}" = "1" ]; then
            echo 'EQUATION_PORTAL_GATE {"classification":"EXACT_REACHED","winner":"${{ steps.replay.outputs.winner }}"}'
          elif [ "${{ steps.replay.outputs.changing }}" -gt 0 ]; then
            echo 'EQUATION_PORTAL_GATE {"classification":"REPRESENTATION_SEPARATION","changing":${{ steps.replay.outputs.changing }}}'
          else
            echo 'EQUATION_PORTAL_GATE {"classification":"EQUATION_PORTAL_EXHAUSTED","changing":0}'
          fi
      - name: Upload portal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equation-factor-portal-v2
          path: |
            /tmp/interfaces.tsv
            /tmp/verified.tsv
            /tmp/interface-*.log
            /tmp/tails.tsv
            /tmp/replay.tsv
            /tmp/replay-*.log
            /tmp/changing.txt
            /tmp/PORTAL-SOLVED.lean
          if-no-files-found: ignore
