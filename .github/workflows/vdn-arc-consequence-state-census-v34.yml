name: VDN ARC consequence-state census V34
on:
  push:
    branches:
      - mathgraph/msi-arc-pikpi-v11-20260828
jobs:
  consequence-state-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V34 consequence-state census
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v34_consequence_state_census.py /tmp/ARC-AGI-1/data/evaluation /tmp/ARC-AGI-1/data/training
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-consequence-state-census-v34
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v34_consequence_state_census/result.json
