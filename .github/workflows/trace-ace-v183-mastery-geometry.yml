name: Trace the Ace V183 Mastery Geometry
on:
  push:
    paths:
      - 'experiments/trace_the_ace_v183/**'
      - '.github/workflows/trace-ace-v183-mastery-geometry.yml'
  workflow_dispatch:
jobs:
  v183:
    runs-on: [self-hosted, trace-ace-gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check persistent inputs
        run: |
          test -f /workspace/trace_the_ace/train_features_TMQTWsB.csv
          test -f /workspace/trace_the_ace/train_labels_44ujmj2.csv
          test -d /workspace/trace_the_ace/transcripts_extracted
      - name: Run mastery geometry test
        run: python3 experiments/trace_the_ace_v183/run_v183_mastery_geometry.py
      - name: Show result
        if: always()
        run: cat /workspace/trace-ace-results/v183/v183_results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-the-ace-v183-results
          path: /workspace/trace-ace-results/v183/
          if-no-files-found: warn
