name: MathGraph Check durable CI observations
on:
  pull_request:
    paths:
      - 'integrations/mathgraph-check-github/durable-ci-capture-v1*'
      - '.github/workflows/mathgraph-check-durable-ci-capture.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/mathgraph-check-github/durable-ci-capture-v1.test.mjs integrations/mathgraph-check-github/living-warrant-cycle-v1.test.mjs
