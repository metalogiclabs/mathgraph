name: Crystal Chess Residual Ladder Transfer V19

on:
  push:
    branches:
      - crystal-chess-residual-ladder-transfer-v19
    paths:
      - "experiments/crystal_chess_residual_ladder_transfer_v19.py"
      - ".github/workflows/crystal-chess-residual-ladder-transfer-v19.yml"
      - "experiments/crystal_chess_verified_hybrid_search_v14.py"
      - "experiments/crystal_chess_residual_guard_ladder_v16.py"
      - "experiments/crystal_chess_kppvk_complete_census_v12.py"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  prospective-residual-ladder-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify Crystal and compile V19
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_crystal.py
          python -m py_compile experiments/crystal_chess_residual_ladder_transfer_v19.py

      - name: Download frozen residual ladder source artifact
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-residual-guard-ladder-v16
          path: /tmp/v16-ladder
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36359443246

      - name: Verify frozen residual ladder identity
        run: |
          set -euo pipefail
          guard=/tmp/v16-ladder/crystal_chess_residual_guard_ladder_v16.jsonl.gz
          test -s "$guard"
          actual="$(gzip -dc "$guard" | sha256sum | awk '{print $1}')"
          echo "residual_ladder_uncompressed_sha256=$actual"
          test "$actual" = "7c19923878b0fe4502871cc025582137471f93227c76dff537c1870da3401285"

      - name: Acquire exact Syzygy verifier authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          w345="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          w6="https://tablebase.lichess.ovh/tables/standard/6-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw KPPvK.rtbw KPPPvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$w345/$f"
            test -s "/tmp/syzygy/$f"
          done
          curl --fail --location --retry 5 --retry-delay 2 -o /tmp/syzygy/KPPPPvK.rtbw "$w6/KPPPPvK.rtbw"
          test -s /tmp/syzygy/KPPPPvK.rtbw
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Prospectively transfer frozen residual ladder
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v19
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v19/
          cp /tmp/v16-ladder/crystal_chess_residual_guard_ladder_v16.jsonl.gz artifacts/crystal-chess-v19/
          python experiments/crystal_chess_residual_ladder_transfer_v19.py \
            --tablebase-dir /tmp/syzygy \
            --guard /tmp/v16-ladder/crystal_chess_residual_guard_ladder_v16.jsonl.gz \
            --output artifacts/crystal-chess-v19/crystal_chess_residual_ladder_transfer_v19.json \
            | tee artifacts/crystal-chess-v19/run.log

      - name: Upload V19 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-residual-ladder-transfer-v19
          path: artifacts/crystal-chess-v19/
          if-no-files-found: error
