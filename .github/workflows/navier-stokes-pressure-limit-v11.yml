name: Gaussian weighted pressure limit V11
on:
  push:
    branches: [navier-stokes-semantic-bridge-v1]
    paths: ['experiments/navier_stokes_semantic_bridge_v1/PressureGaussianLimit.lean', '.github/workflows/navier-stokes-pressure-limit-v11.yml']
  pull_request:
    branches: [main]
    paths: ['experiments/navier_stokes_semantic_bridge_v1/PressureGaussianLimit.lean', '.github/workflows/navier-stokes-pressure-limit-v11.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pressure-gaussian-limit-v11-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-gaussian-l2-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin source and actual upstream Lean
        run: |
          set -euo pipefail
          mkdir -p .four-loss-env pressure-v11-evidence
          git rev-parse HEAD | tee pressure-v11-evidence/head-sha.txt
          cp experiments/navier_stokes_semantic_bridge_v1/PressureGaussianLimit.lean .four-loss-env/PressureGaussianLimit.lean
          cp .four-loss-env/PressureGaussianLimit.lean pressure-v11-evidence/PressureGaussianLimit.lean
          sha256sum .four-loss-env/PressureGaussianLimit.lean > pressure-v11-evidence/source.sha256
          printf '%s\n' 'leanprover/lean4:v4.34.0-rc2' > .four-loss-env/lean-toolchain
          cat > .four-loss-env/lakefile.toml <<'EOF'
          name = "mathgraph_gaussian_pressure_limit_v11"
          version = "0.1.0"
          [[require]]
          name = "NavierStokesAndEuler"
          git = "https://github.com/openai/NavierStokesAndEuler.git"
          rev = "f9e8bc5b38b6e212696e8a30e3e91517af887bbd"
          [[lean_lib]]
          name = "PressureGaussianLimit"
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            .four-loss-env/.lake
            .four-loss-env/lake-manifest.json
          key: openai-four-loss-v6-lean434rc2-mathlib-pinned-f9e8bc5
      - name: Install original Lean
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh' \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify original upstream and strong-limit theorem anchors
        working-directory: .four-loss-env
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/NavierStokesAndEuler rev-parse HEAD)" = 'f9e8bc5b38b6e212696e8a30e3e91517af887bbd'
          grep -q 'theorem regularizedCommutatorLp_tendsto' .lake/packages/NavierStokesAndEuler/NavierStokes/R3PressureCutoff.lean
          grep -q 'theorem operatorL2_tendsto' .lake/packages/NavierStokesAndEuler/NavierStokes/R3RieszApproximation.lean
          cp lake-manifest.json ../pressure-v11-evidence/lake-manifest.json
          lake env lean --version | tee ../pressure-v11-evidence/lean-version.txt
          lake exe cache get
      - name: Kernel-check Gaussian limit and bound transport
        working-directory: .four-loss-env
        run: |
          set -euo pipefail
          lake build PressureGaussianLimit 2>&1 | tee ../pressure-v11-evidence/build.log
          lake env lean -DwarningAsError=true PressureGaussianLimit.lean 2>&1 | tee ../pressure-v11-evidence/axioms.log
      - name: Audit axioms and protect pressure-bound interpretation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('pressure-v11-evidence')
          assert (root/'head-sha.txt').read_text().strip()==os.environ['EXPECTED_HEAD']
          log=(root/'axioms.log').read_text()
          prefix='MathGraph.PressureGaussianLimit.'
          expected={prefix+s for s in ('regularized_weighted_pressure_tendsto','bound_passes_to_actual_weighted_pressure')}
          rows=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          rows += [(n,'') for n in re.findall(r"'([^']+)' does not depend on any axioms",log)]
          seen={}
          for n,a in rows:
            assert n not in seen,n
            used={s.strip() for s in a.split(',') if s.strip()}
            assert used <= {'propext','Classical.choice','Quot.sound'},(n,sorted(used))
            seen[n]=sorted(used)
          assert set(seen)==expected,('axiom report mismatch',sorted(expected.symmetric_difference(set(seen))))
          record={
            'schema':'mathgraph.pressure-gaussian-weighted-l2-limit-v11',
            'head_sha':os.environ['EXPECTED_HEAD'],
            'upstream_SHA':'f9e8bc5b38b6e212696e8a30e3e91517af887bbd',
            'verified_interface':'NavierStokes.R3PressureCutoff.weightedPressure Lp2',
            'gaussian_weighted_pressure_strong_limit':True,
            'all_scales_Lp2_norm_bound_transports_to_actual_weightedPressure':True,
            'such_uniform_bound_proved_here':False,
            'physical_pressure_flux_bridge_proved':False,
            'original_manuscript_10_19_proved':False,
            'pressure_source_NL_approved':False,
            'production_admission_changed':False,
            'theorem_axioms':seen,
            'file_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          }
          (root/'result.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          print(json.dumps(record,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weighted-pressure-limit-v11
          path: pressure-v11-evidence/
          if-no-files-found: error
