name: VDN Lean Core V1
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/lean/MinimalSufficientInterface.lean'
      - '.github/workflows/vdn-lean-core-v1.yml'
  workflow_dispatch:
jobs:
  lean-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build theorem core in pinned mathlib project
        working-directory: experiments/continuation_claim_audit_lab/lean_project
        run: |
          lake update
          lake env lean ../../../verified-developmental-navigation/lean/MinimalSufficientInterface.lean
