name: Crystal Chess Continuous Trace V48

on:
  push:
    branches:
      - crystal-chess-continuous-trace-v48
    paths:
      - "experiments/crystal_chess_continuous_trace_v48.py"
      - ".github/workflows/crystal-chess-continuous-trace-v48.yml"
      - "experiments/crystal_chess_search_sufficiency_v25.py"
  workflow_dispatch:

jobs:
  continuous-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_continuous_trace_v48.py

      - name: Download exact V47 source residual
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-progressive-stopping-v47
          path: /tmp/v47
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36523379587

      - name: Verify exact 11-state residual
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v47/result.json'))
          assert p['schema']=='mathgraph.crystal-chess.progressive-stopping.v47'
          rows=p['source']['rules']['last3_move_pv3']['mismatch_examples']
          assert len(rows)==11
          print('V47_EXACT_11_STATE_RESIDUAL=PASS')
          PY

      - name: Build pinned Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/stockfish-bench.txt 2>&1

      - name: Capture uninterrupted iterative-deepening traces
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v48
          python experiments/crystal_chess_continuous_trace_v48.py             --stockfish /tmp/stockfish/src/stockfish             --v47-result /tmp/v47/result.json             --output artifacts/crystal-chess-v48/result.json             | tee artifacts/crystal-chess-v48/run.log
          grep -q "CRYSTAL_CHESS_CONTINUOUS_TRACE_V48=CONTINUOUS_TRACE_DIAGNOSTIC_COMPLETE" artifacts/crystal-chess-v48/run.log
          cp /tmp/stockfish-bench.txt artifacts/crystal-chess-v48/

      - name: Upload V48 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-continuous-trace-v48
          path: artifacts/crystal-chess-v48/
          if-no-files-found: error
