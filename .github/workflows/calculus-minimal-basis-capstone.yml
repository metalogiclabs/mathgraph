name: Calculus minimal basis capstone

on:
  push:
    branches:
      - calculus/core-v0
    paths:
      - 'MathGraph/Calculus/ReconstructionStage27MinimalBasisCapstone.lean'
      - 'MathGraph/Calculus/CanonicalDevelopmentalCalculus.lean'
      - 'MathGraph/Calculus/ActiveBoundaryCompression.lean'
      - 'MathGraph/Calculus/VerifierBoundaryEndogenization.lean'
      - 'MathGraph/Calculus/SymmetryBreakingAnchor.lean'
      - 'MathGraph/Calculus/OrbitStabilizerBoundary.lean'
      - 'MathGraph/Calculus/GeneralOrbitStabilizerBoundary.lean'
      - 'MathGraph/Calculus/FiniteInformationBoundary.lean'
      - 'MathGraph/Calculus/NumericInformationBoundary.lean'
      - 'MathGraph/Calculus/InteractionGeneratedBoundary.lean'
      - '.github/workflows/calculus-minimal-basis-capstone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-minimal-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEAN_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.0
      - name: Compile foundational dependency chain
        run: |
          lean -o MathGraph/Calculus/Core.olean MathGraph/Calculus/Core.lean
          lean -o MathGraph/Calculus/Refinement.olean MathGraph/Calculus/Refinement.lean
          lean -o MathGraph/Calculus/Separation.olean MathGraph/Calculus/Separation.lean
          lean -o MathGraph/Calculus/Representation.olean MathGraph/Calculus/Representation.lean
          lean -o MathGraph/Calculus/OutcomeGrounding.olean MathGraph/Calculus/OutcomeGrounding.lean
          lean -o MathGraph/Calculus/EqualityAblation.olean MathGraph/Calculus/EqualityAblation.lean
          lean -o MathGraph/Calculus/IncidenceGrounding.olean MathGraph/Calculus/IncidenceGrounding.lean
          lean -o MathGraph/Calculus/WitnessIncidenceGrounding.olean MathGraph/Calculus/WitnessIncidenceGrounding.lean
          lean -o MathGraph/Calculus/DirectWitnessGrounding.olean MathGraph/Calculus/DirectWitnessGrounding.lean
          lean -o MathGraph/Calculus/TypedIdentityGrounding.olean MathGraph/Calculus/TypedIdentityGrounding.lean
          lean -o MathGraph/Calculus/DirectedTransportGrounding.olean MathGraph/Calculus/DirectedTransportGrounding.lean
          lean -o MathGraph/Calculus/TransportEqualityAblation.olean MathGraph/Calculus/TransportEqualityAblation.lean
          lean -o MathGraph/Calculus/CoordinateAblation.olean MathGraph/Calculus/CoordinateAblation.lean
          lean -o MathGraph/Calculus/StateCarrierAblation.olean MathGraph/Calculus/StateCarrierAblation.lean
          lean -o MathGraph/Calculus/BareTransportAlgebra.olean MathGraph/Calculus/BareTransportAlgebra.lean
          lean -o MathGraph/Calculus/RawTransportGenesis.olean MathGraph/Calculus/RawTransportGenesis.lean
          lean -o MathGraph/Calculus/RockBottomAblation.olean MathGraph/Calculus/RockBottomAblation.lean
      - name: Compile reconstruction dependency chain
        run: |
          lean -o MathGraph/Calculus/ReconstructionFromBedrock.olean MathGraph/Calculus/ReconstructionFromBedrock.lean
          lean -o MathGraph/Calculus/ReconstructionStage2Profiles.olean MathGraph/Calculus/ReconstructionStage2Profiles.lean
          lean -o MathGraph/Calculus/ReconstructionStage3Logic.olean MathGraph/Calculus/ReconstructionStage3Logic.lean
          lean -o MathGraph/Calculus/ReconstructionStage4Separation.olean MathGraph/Calculus/ReconstructionStage4Separation.lean
          lean -o MathGraph/Calculus/ReconstructionStage5Refinement.olean MathGraph/Calculus/ReconstructionStage5Refinement.lean
          lean -o MathGraph/Calculus/ReconstructionStage6Residual.olean MathGraph/Calculus/ReconstructionStage6Residual.lean
          lean -o MathGraph/Calculus/ReconstructionStage7FirstDistinction.olean MathGraph/Calculus/ReconstructionStage7FirstDistinction.lean
          lean -o MathGraph/Calculus/ReconstructionStage8Selection.olean MathGraph/Calculus/ReconstructionStage8Selection.lean
          lean -o MathGraph/Calculus/ReconstructionStage9Saturation.olean MathGraph/Calculus/ReconstructionStage9Saturation.lean
          lean -o MathGraph/Calculus/ReconstructionStage10Sufficiency.olean MathGraph/Calculus/ReconstructionStage10Sufficiency.lean
          lean -o MathGraph/Calculus/ReconstructionStage11MinimalSufficient.olean MathGraph/Calculus/ReconstructionStage11MinimalSufficient.lean
          lean -o MathGraph/Calculus/ReconstructionStage12FiniteTermination.olean MathGraph/Calculus/ReconstructionStage12FiniteTermination.lean
          lean -o MathGraph/Calculus/ReconstructionStage13Development.olean MathGraph/Calculus/ReconstructionStage13Development.lean
          lean -o MathGraph/Calculus/ReconstructionStage14ConstructorGenesis.olean MathGraph/Calculus/ReconstructionStage14ConstructorGenesis.lean
          lean -o MathGraph/Calculus/ReconstructionStage15RecursiveDevelopment.olean MathGraph/Calculus/ReconstructionStage15RecursiveDevelopment.lean
          lean -o MathGraph/Calculus/ReconstructionStage16SchemaGenesis.olean MathGraph/Calculus/ReconstructionStage16SchemaGenesis.lean
          lean -o MathGraph/Calculus/ReconstructionStage17DirectGeneratorGenesis.olean MathGraph/Calculus/ReconstructionStage17DirectGeneratorGenesis.lean
          lean -o MathGraph/Calculus/ReconstructionStage18ResidualAsGenerator.olean MathGraph/Calculus/ReconstructionStage18ResidualAsGenerator.lean
          lean -o MathGraph/Calculus/ReconstructionStage19GenericResidualGenerator.olean MathGraph/Calculus/ReconstructionStage19GenericResidualGenerator.lean
          lean -o MathGraph/Calculus/ReconstructionStage20ResidualClosure.olean MathGraph/Calculus/ReconstructionStage20ResidualClosure.lean
          lean -o MathGraph/Calculus/ReconstructionStage21DirectionBoundary.olean MathGraph/Calculus/ReconstructionStage21DirectionBoundary.lean
          lean -o MathGraph/Calculus/ReconstructionStage22MeasurementGenesis.olean MathGraph/Calculus/ReconstructionStage22MeasurementGenesis.lean
          lean -o MathGraph/Calculus/ReconstructionStage23GeneratedInterface.olean MathGraph/Calculus/ReconstructionStage23GeneratedInterface.lean
          lean -o MathGraph/Calculus/ReconstructionStage24HistoryQuotient.olean MathGraph/Calculus/ReconstructionStage24HistoryQuotient.lean
          lean -o MathGraph/Calculus/ReconstructionStage25StateNecessity.olean MathGraph/Calculus/ReconstructionStage25StateNecessity.lean
          lean -o MathGraph/Calculus/ReconstructionStage26TaskOrientation.olean MathGraph/Calculus/ReconstructionStage26TaskOrientation.lean
      - name: Verify Stage27 minimal basis capstone
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage27MinimalBasisCapstone.olean MathGraph/Calculus/ReconstructionStage27MinimalBasisCapstone.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE27_GATE {"classification":"LEAN_VERIFIED_RELATIVE_MINIMAL_SUFFICIENT_DEVELOPMENTAL_BASIS_WITH_HISTORY_AND_INTERNAL_ORIENTATION_ELIMINATED_AND_STATE_BEDROCK_NECESSITY_ABLATIONS"}'
      - name: Verify canonical calculus and final survivor ablation matrix
        run: |
          lean -o MathGraph/Calculus/CanonicalDevelopmentalCalculus.olean MathGraph/Calculus/CanonicalDevelopmentalCalculus.lean
          echo 'CALCULUS_CANONICAL_ABLATION_GATE {"classification":"LEAN_VERIFIED_CANONICAL_DEVELOPMENTAL_CALCULUS_WITH_FOUR_SURVIVOR_RELATIVE_ABLATION_MATRIX"}'
      - name: Verify active boundary compression
        run: |
          lean -o MathGraph/Calculus/ActiveBoundaryCompression.olean MathGraph/Calculus/ActiveBoundaryCompression.lean
          echo 'CALCULUS_ACTIVE_BOUNDARY_COMPRESSION_GATE {"classification":"LEAN_VERIFIED_THREE_TOP_LEVEL_OBJECT_PACKAGING_WITH_TWO_INDEPENDENTLY_NECESSARY_BOUNDARY_ROLES_STRUCTURAL_NOT_INFORMATION_THEORETIC_COMPRESSION"}'
      - name: Verify verifier boundary endogenization
        run: |
          lean -o MathGraph/Calculus/VerifierBoundaryEndogenization.olean MathGraph/Calculus/VerifierBoundaryEndogenization.lean
          echo 'CALCULUS_VERIFIER_BOUNDARY_ENDOGENIZATION_GATE {"classification":"LEAN_VERIFIED_SELECTIVE_OBSERVATIONAL_STATE_DERIVED_FROM_ORDERED_VERIFIER_TASK_HISTORY_WHILE_COMPLETE_BOUNDARY_ENDOGENIZATION_IS_BLOCKED_BY_SYMMETRY"}'
      - name: Verify minimal symmetry-breaking anchor
        run: |
          lean -o MathGraph/Calculus/SymmetryBreakingAnchor.olean MathGraph/Calculus/SymmetryBreakingAnchor.lean
          echo 'CALCULUS_SYMMETRY_BREAKING_ANCHOR_GATE {"classification":"LEAN_VERIFIED_ORDERED_TASK_PAIR_REDUCES_TO_ONE_EXTERNAL_SYMMETRY_BREAKING_BIT_ON_TWO_POINT_SEED_AND_NO_EQUIVARIANT_ENDOGENOUS_ANCHOR_EXISTS"}'
      - name: Verify generalized orbit stabilizer boundary
        run: |
          lean -o MathGraph/Calculus/OrbitStabilizerBoundary.olean MathGraph/Calculus/OrbitStabilizerBoundary.lean
          echo 'CALCULUS_ORBIT_STABILIZER_BOUNDARY_GATE {"classification":"LEAN_VERIFIED_FREE_INVOLUTIVE_SYMMETRY_REQUIRES_EXTERNAL_ORBIT_REPRESENTATIVE_FOR_ORIENTATION_AND_FORBIDS_EQUIVARIANT_ENDOGENOUS_ANCHOR"}'
      - name: Verify full group-action orbit stabilizer boundary
        run: |
          lean -o MathGraph/Calculus/GeneralOrbitStabilizerBoundary.olean MathGraph/Calculus/GeneralOrbitStabilizerBoundary.lean
          echo 'CALCULUS_GENERAL_ORBIT_STABILIZER_GATE {"classification":"LEAN_VERIFIED_ARBITRARY_GROUP_ACTION_BOUNDARY_LABELS_QUOTIENT_EXACTLY_BY_STABILIZER_AND_NO_GLOBAL_FIXED_POINT_FORCES_EXTERNAL_ORBIT_REPRESENTATIVE"}'
      - name: Verify finite information boundary lower bound
        run: |
          lean -o MathGraph/Calculus/FiniteInformationBoundary.olean MathGraph/Calculus/FiniteInformationBoundary.lean
          echo 'CALCULUS_FINITE_INFORMATION_BOUNDARY_GATE {"classification":"LEAN_VERIFIED_FAITHFUL_BOUNDARY_CODE_MUST_INJECT_EVERY_PAIRWISE_SEPARATED_ORBIT_FAMILY_AND_ONE_BOOL_BIT_CANNOT_ENCODE_THREE_OPERATIONALLY_DISTINCT_ORBIT_POINTS"}'
      - name: Verify exact numeric bit-capacity boundary
        run: |
          lean MathGraph/Calculus/NumericInformationBoundary.lean
          echo 'CALCULUS_NUMERIC_INFORMATION_BOUNDARY_GATE {"classification":"LEAN_VERIFIED_B_BIT_FAITHFUL_BOUNDARY_HAS_AT_MOST_TWO_POW_B_PAIRWISE_SEPARATED_OPERATIONAL_ORBIT_CHOICES"}'
      - name: Verify interaction-generated symmetry-breaking boundary
        run: |
          lean MathGraph/Calculus/InteractionGeneratedBoundary.lean
          echo 'CALCULUS_INTERACTION_GENERATED_BOUNDARY_GATE {"classification":"LEAN_VERIFIED_PRELOADED_ANCHOR_REPLACED_BY_RUNTIME_EQUIVARIANT_CONTACT_RESPONSE_WHILE_SYMMETRY_INVARIANT_RESPONSE_CHANNEL_CANNOT_TRANSMIT_ORIENTATION"}'
