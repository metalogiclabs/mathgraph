name: Trace the Ace V182 Objective Phase Transition
on:
  push:
    paths:
      - 'experiments/trace_the_ace_v182/**'
      - '.github/workflows/trace-ace-v182-objective-phase-transition.yml'
  workflow_dispatch:
jobs:
  v182:
    runs-on: [self-hosted, trace-ace-gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check persistent inputs
        run: |
          test -f /workspace/trace_the_ace/train_features_TMQTWsB.csv
          test -f /workspace/trace_the_ace/train_labels_44ujmj2.csv
          test -d /workspace/trace_the_ace/transcripts_extracted
      - name: Run objective phase-transition test
        run: python3 experiments/trace_the_ace_v182/run_v182_objective_phase_transition.py
      - name: Show result
        if: always()
        run: cat /workspace/trace-ace-results/v182/v182_results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-the-ace-v182-results
          path: /workspace/trace-ace-results/v182/
          if-no-files-found: warn
