name: VDN ARC reusable observation transfer V28

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v28_reusable_observation_transfer.py"
      - ".github/workflows/vdn-arc-reusable-observation-v28.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-observation-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V28 reusable observation transfer
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v28_reusable_observation_transfer.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-reusable-observation-v28
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v28_reusable_observation_transfer/result.json
