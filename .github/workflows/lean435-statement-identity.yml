name: Lean 4.35 formal-source statement identity separator

on:
  pull_request:
    branches:
      - research/lean435-source-verified-receipt-20261014
    paths:
      - 'research/lean435_statement_binding/**'
      - 'research/lean435_receipt/ForgedChallenge.lean'
      - 'research/lean435_receipt/ForgedSolution.lean'
      - 'research/lean435_receipt/SourceAnchorHonest.lean'
      - 'research/lean435_receipt/SourceAnchorForged.lean'
      - 'research/lean435_receipt/lakefile.toml'
      - '.github/workflows/lean435-statement-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-separator:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install exact Lean 4.35.0 release
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.35.0
          elan default leanprover/lean4:v4.35.0
          lean --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Make the comparator sandbox available
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap --ro-bind / / --dev-bind /dev /dev --proc /proc --unshare-net /usr/bin/true

      - name: Run only the source identity separator
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 research/lean435_statement_binding/separate.py

      - name: Preserve all verdicts including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean435-statement-identity-separator
          path: research/lean435_statement_binding/evidence/
          if-no-files-found: warn
          retention-days: 90
