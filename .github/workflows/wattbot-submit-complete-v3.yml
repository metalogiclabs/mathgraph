name: WattBot V3 complete-corpus source-window submission
on:
  push:
    branches: [wattbot-complete-submit-v3]
    paths:
      - '.github/workflows/wattbot-submit-complete-v3.yml'
jobs:
  full-corpus-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned input/model/scoring dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf pytest
      - name: Verify synthetic citation integrity and zero-null CSV transport
        shell: bash
        run: |
          set -euo pipefail
          python experiments/wattbot2026/report_loader.py
          python experiments/wattbot2026/full_reader.py --self-test
          python experiments/wattbot2026/full_window_probe.py --self-test
          python experiments/wattbot2026/submit_full_reader.py --self-test
          python -m pytest -q experiments/wattbot2026/tests/test_query_window.py experiments/wattbot2026/tests/test_submission_gate.py
      - name: Generate all 317 official protected-test rows from full pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/submit_full_reader.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip" \
            --out "$RUNNER_TEMP/wattbot/mathgraph_full_v3.csv" \
            --policy window
          python experiments/wattbot2026/submission_gate.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip" \
            --submission "$RUNNER_TEMP/wattbot/mathgraph_full_v3.csv"
      - name: Submit only fully-qualified CSV to Kaggle WattBot 2026
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/wattbot/mathgraph_full_v3.csv"
          kaggle competitions submit -c WattBot2026 \
            -f "$RUNNER_TEMP/wattbot/mathgraph_full_v3.csv" \
            -m "MathGraph V3 full corpus, exact question-centred windows, null-safe submission; commit ${GITHUB_SHA:0:12}"
      - name: Read official submission authority only
        shell: bash
        run: |
          kaggle competitions submissions -c WattBot2026
          echo "Receipt != official Kaggle score. Wait for COMPLETE and compare to 0.333."
          echo "Source quotations are independently anchored, not formal scientific entailment."
      - name: Preserve privacy of protected test set
        run: echo "No TEST predictions, PDF bodies, prompts or credentials uploaded as artifacts."
