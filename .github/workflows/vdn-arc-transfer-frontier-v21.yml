name: VDN ARC transfer-frontier census V21

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v21_transfer_frontier_census.py"
      - ".github/workflows/vdn-arc-transfer-frontier-v21.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-frontier-census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V21 transfer-frontier census
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v21_transfer_frontier_census.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-transfer-frontier-v21
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v21_transfer_frontier_census/result.json
