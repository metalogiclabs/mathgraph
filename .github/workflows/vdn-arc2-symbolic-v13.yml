name: VDN ARC-AGI-2 symbolic composition v13
on:
  push:
    branches: [vdn-arc2-meta-v11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbolic-composition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(find data/evaluation -name '*.json' | wc -l)" -eq 120
      - name: Run symbolic relation composition test
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v13_symbolic_composition.py /tmp/ARC-AGI-2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-symbolic-v13
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v13_symbolic_composition/result.json
