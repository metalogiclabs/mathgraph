name: Crystal Chess Strategy Progress Theorem V1

on:
  push:
    branches:
      - crystal-chess-strategy-progress-theorem-v1
    paths:
      - "verified-developmental-navigation/lean/**"
      - ".github/workflows/crystal-chess-strategy-progress-theorem-v1.yml"
  workflow_dispatch:

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build strategy progress theorem
        working-directory: verified-developmental-navigation/lean
        run: |
          lake build
          grep -q "theorem no_avoidance_beyond_rank" VerifiedDevelopmentalNavigation/StrategyProgress.lean
          grep -q "theorem no_infinite_goal_avoiding_play" VerifiedDevelopmentalNavigation/StrategyProgress.lean
