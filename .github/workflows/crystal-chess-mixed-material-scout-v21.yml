name: Crystal Chess Mixed Material Scout V21

on:
  push:
    branches:
      - crystal-chess-mixed-material-scout-v21
    paths:
      - "experiments/crystal_chess_mixed_material_scout_v21.py"
      - ".github/workflows/crystal-chess-mixed-material-scout-v21.yml"
  workflow_dispatch:

jobs:
  mixed-material-scout:
    strategy:
      fail-fast: false
      matrix:
        piece: [Q, R, B, N]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify and compile
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_crystal.py
          python -m py_compile experiments/crystal_chess_mixed_material_scout_v21.py

      - name: Acquire exact source and target Syzygy authority
        env:
          PIECE: ${{ matrix.piece }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          wdl="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          dtz="https://tablebase.lichess.ovh/tables/standard/3-4-5-dtz"

          for stem in KPvK KQvK KRvK KBvK KNvK; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$stem.rtbw" "$wdl/$stem.rtbw"
            test -s "/tmp/syzygy/$stem.rtbw"
          done

          source_stem="K${PIECE}vK"
          curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$source_stem.rtbz" "$dtz/$source_stem.rtbz"
          test -s "/tmp/syzygy/$source_stem.rtbz"

          case "$PIECE" in
            Q) target_stem="KQPvK" ;;
            R) target_stem="KRPvK" ;;
            B) target_stem="KBPvK" ;;
            N) target_stem="KNPvK" ;;
          esac
          curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$target_stem.rtbw" "$wdl/$target_stem.rtbw"
          test -s "/tmp/syzygy/$target_stem.rtbw"
          sha256sum /tmp/syzygy/*.rtb* | tee /tmp/syzygy/SHA256SUMS

      - name: Run prospective mixed-material scout
        env:
          PIECE: ${{ matrix.piece }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/crystal-chess-v21-${PIECE}"
          cp /tmp/syzygy/SHA256SUMS "artifacts/crystal-chess-v21-${PIECE}/"
          python experiments/crystal_chess_mixed_material_scout_v21.py \
            --tablebase-dir /tmp/syzygy \
            --piece "$PIECE" \
            --sample-size 50000 \
            --seed 20260928 \
            --output "artifacts/crystal-chess-v21-${PIECE}/result.json" \
            | tee "artifacts/crystal-chess-v21-${PIECE}/run.log"
          grep -q "CRYSTAL_CHESS_MIXED_MATERIAL_SCOUT_V21=PASS" "artifacts/crystal-chess-v21-${PIECE}/run.log"

      - name: Upload V21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-mixed-material-scout-v21-${{ matrix.piece }}
          path: artifacts/crystal-chess-v21-${{ matrix.piece }}/
          if-no-files-found: error
