name: Capability Lineage Native Conformance

on:
  push:
    branches:
      - research/capability-closure-lineage-conformance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-mathgraph-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,all]'
      - name: Exact checkout and reference conformance
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pytest tests/test_capability_lineage_conformance.py tests/test_incremental_closure.py tests/test_mathgraph_warrant_resolution_core.py -q
      - name: Full declared MathGraph pytest suite
        run: |
          set -euo pipefail
          python -m pytest -q
      - name: Working tree remains clean
        if: always()
        run: git status --short
