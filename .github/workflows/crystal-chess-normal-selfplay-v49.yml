name: Crystal Chess Normal Selfplay V49

on:
  push:
    branches:
      - crystal-chess-normal-selfplay-v49
    paths:
      - "experiments/crystal_chess_normal_selfplay_v49.py"
      - ".github/workflows/crystal-chess-normal-selfplay-v49.yml"
      - "experiments/crystal_chess_normal_exposure_v22.py"
  workflow_dispatch:

jobs:
  normal-selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_normal_selfplay_v49.py
          python -m py_compile experiments/crystal_chess_normal_exposure_v22.py

      - name: Download frozen V20 UCI engine
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-residual-ladder-uci-v20
          path: /tmp/v20
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36361528666

      - name: Verify V20 artifact identity
        run: |
          set -euo pipefail
          test -s /tmp/v20/crystal-chess-v20
          test -s /tmp/v20/run-crystal-chess-v20
          test -s /tmp/v20/crystal_chess_residual_guard_ladder_v16.jsonl.gz
          test -s /tmp/v20/crystal_chess_roles_v17.jsonl.gz
          chmod +x /tmp/v20/crystal-chess-v20 /tmp/v20/run-crystal-chess-v20
          test "$(gzip -dc /tmp/v20/crystal_chess_residual_guard_ladder_v16.jsonl.gz | sha256sum | awk '{print $1}')" = "7c19923878b0fe4502871cc025582137471f93227c76dff537c1870da3401285"
          test "$(gzip -dc /tmp/v20/crystal_chess_roles_v17.jsonl.gz | sha256sum | awk '{print $1}')" = "028353c82c3fefdd7d9e36907916b9a1aec7c1c13da9a4b8710b4deef8298b99"

      - name: Build pinned Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/stockfish-bench.txt 2>&1

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Disservin/fastchess.git /tmp/fastchess
          git -C /tmp/fastchess checkout 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          make -C /tmp/fastchess -j2

      - name: UCI compliance
        env:
          STOCKFISH: /tmp/stockfish/src/stockfish
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v49
          /tmp/fastchess/fastchess --compliance /tmp/v20/run-crystal-chess-v20             | tee artifacts/crystal-chess-v49/uci-compliance.log

      - name: Generate untouched normal opening book
        run: |
          set -euo pipefail
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish/src/stockfish             --book artifacts/crystal-chess-v49/normal.epd             --manifest artifacts/crystal-chess-v49/normal_manifest.json             --openings 256 --plies 12 --depth 6 --multipv 4 --seed 20261101

      - name: Run paired normal-opening full games
        env:
          STOCKFISH: /tmp/stockfish/src/stockfish
        run: |
          set -euo pipefail
          /tmp/fastchess/fastchess             -engine cmd=/tmp/v20/run-crystal-chess-v20 name=CrystalV20             -engine cmd=/tmp/stockfish/src/stockfish name=StockfishBaseline             -each tc=0.5+0.005 option.Threads=1 option.Hash=16 option.Ponder=false             -openings file=artifacts/crystal-chess-v49/normal.epd format=epd order=sequential             -rounds 256 -repeat -concurrency 4             -pgnout file=artifacts/crystal-chess-v49/match.pgn             -log file=artifacts/crystal-chess-v49/fastchess.log level=info             | tee artifacts/crystal-chess-v49/fastchess.stdout

      - name: Analyse paired match
        run: |
          set -euo pipefail
          shortcuts="$(grep -c 'Crystal certified' artifacts/crystal-chess-v49/fastchess.log || true)"
          printf '%s\n' "$shortcuts" > artifacts/crystal-chess-v49/shortcut-count.txt
          python experiments/crystal_chess_normal_selfplay_v49.py             --pgn artifacts/crystal-chess-v49/match.pgn             --crystal-name CrystalV20             --shortcut-count artifacts/crystal-chess-v49/shortcut-count.txt             --output artifacts/crystal-chess-v49/result.json             | tee artifacts/crystal-chess-v49/analyse.log
          grep -q "CRYSTAL_CHESS_NORMAL_SELFPLAY_V49=PASS" artifacts/crystal-chess-v49/analyse.log
          cp /tmp/stockfish-bench.txt artifacts/crystal-chess-v49/
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > artifacts/crystal-chess-v49/STOCKFISH_PIN.txt
          printf '%s\n' "Disservin/fastchess@60d7a7a26c6b0582a15c112fb29a1829bef2adb3" > artifacts/crystal-chess-v49/FASTCHESS_PIN.txt

      - name: Upload V49 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-normal-selfplay-v49
          path: artifacts/crystal-chess-v49/
          if-no-files-found: error
