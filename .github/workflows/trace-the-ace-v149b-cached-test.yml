name: Trace the Ace V149b Cached Gain Test

on:
  workflow_run:
    workflows: ["Trace the Ace V148b Fold-Parallel V75 Cache"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download V148b durable cache
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v148b-durable-v75-crossfit-*
          path: durable-cache
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: metalogiclabs/mathgraph
      - name: Download V145 semantic bundle
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32792841883
          repository: metalogiclabs/mathgraph
      - name: Prepare CPU
        run: python -m pip install -q numpy pandas scipy scikit-learn
      - name: Run frozen-cache gain test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v149b-results
          python experiments/trace_the_ace_v149/run_v149_cached_routers.py \
            --bundle v145-portable/v146_bundle.npz \
            --cache durable-cache \
            --out v149b-results/v149b_results.json
      - name: Publish result
        if: always()
        shell: bash
        run: |
          R=v149b-results/v149b_results.json
          if [ -s "$R" ]; then
            python - "$R" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print('# V149b Cached Gain Test')
          print('\n**Continuous:**',r['continuous_decision'])
          print('**Comparative:**',r['comparative_decision'],'\n')
          for mode in ('continuous','comparative'):
              print('##',mode)
              for split in ('session','objective'):
                  x=r[mode][split]
                  print(f"- {split}: improvement={x['improvement']:.6f}, wins={x['fold_wins']}/5, bootstrap={x['bootstrap_improvement_95']}")
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v149b-${{ github.run_id }}
          path: v149b-results/v149b_results.json
          if-no-files-found: warn
          retention-days: 90
