name: Cross-interface Riesz symbol equality V13
on:
  push:
    branches: [navier-stokes-semantic-bridge-v1]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/PressureSymbolBridge.lean'
      - '.github/workflows/navier-stokes-pressure-symbol-v13.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/PressureSymbolBridge.lean'
      - '.github/workflows/navier-stokes-pressure-symbol-v13.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pressure-symbol-v13-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  symbol-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact original pressure interface
        run: |
          set -euo pipefail
          mkdir -p .pressure-symbol-env pressure-v13-evidence
          git rev-parse HEAD | tee pressure-v13-evidence/head-sha.txt
          cp experiments/navier_stokes_semantic_bridge_v1/PressureSymbolBridge.lean .pressure-symbol-env/PressureSymbolBridge.lean
          cp .pressure-symbol-env/PressureSymbolBridge.lean pressure-v13-evidence/PressureSymbolBridge.lean
          sha256sum .pressure-symbol-env/PressureSymbolBridge.lean > pressure-v13-evidence/source.sha256
          printf '%s\n' 'leanprover/lean4:v4.34.0-rc2' > .pressure-symbol-env/lean-toolchain
          cat > .pressure-symbol-env/lakefile.toml <<'EOF'
          name = "mathgraph_pressure_symbol_v13"
          version = "0.1.0"
          [[require]]
          name = "NavierStokesAndEuler"
          git = "https://github.com/openai/NavierStokesAndEuler.git"
          rev = "f9e8bc5b38b6e212696e8a30e3e91517af887bbd"
          [[lean_lib]]
          name = "PressureSymbolBridge"
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            .pressure-symbol-env/.lake
            .pressure-symbol-env/lake-manifest.json
          key: openai-four-loss-v6-lean434rc2-mathlib-pinned-f9e8bc5
      - name: Install upstream Lean toolchain
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh' \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned OpenAI pressure modules
        working-directory: .pressure-symbol-env
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/NavierStokesAndEuler rev-parse HEAD)" = 'f9e8bc5b38b6e212696e8a30e3e91517af887bbd'
          grep -q 'def rieszSymbol (i j : Fin 3)' .lake/packages/NavierStokesAndEuler/NavierStokes/R3PressureFourier.lean
          grep -q 'def rieszTest (i j : Fin 3)' .lake/packages/NavierStokesAndEuler/NavierStokes/R3/ComparisonFourierSetup.lean
          cp lake-manifest.json ../pressure-v13-evidence/lake-manifest.json
          lake env lean --version | tee ../pressure-v13-evidence/lean-version.txt
          lake exe cache get
      - name: Kernel-check symbol and transformed test agreement
        working-directory: .pressure-symbol-env
        run: |
          set -euo pipefail
          lake build PressureSymbolBridge 2>&1 | tee ../pressure-v13-evidence/build.log
          lake env lean -DwarningAsError=true PressureSymbolBridge.lean 2>&1 | tee ../pressure-v13-evidence/axioms.log
      - name: Seal exact source, axioms, and non-implication limits
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json,hashlib,os,re
          from pathlib import Path
          root=Path('pressure-v13-evidence')
          assert (root/'head-sha.txt').read_text().strip()==os.environ['EXPECTED_HEAD']
          log=(root/'axioms.log').read_text()
          prefix='MathGraph.PressureSymbolBridge.'
          expected={prefix+n for n in ('canonical_and_comparison_symbol_equal','comparison_rieszTest_canonical_symbol')}
          rows=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          rows += [(n,'') for n in re.findall(r"'([^']+)' does not depend on any axioms",log)]
          seen={}
          for n,a in rows:
            assert n not in seen,n
            used={s.strip() for s in a.split(',') if s.strip()}
            assert used<={'propext','Classical.choice','Quot.sound'},(n,sorted(used))
            seen[n]=sorted(used)
          assert set(seen)==expected,('unexpected theorem',sorted(expected.symmetric_difference(set(seen))))
          d={
            'schema':'mathgraph.same-Riesz-multiplier-two-pressure-interfaces-v13',
            'head_sha':os.environ['EXPECTED_HEAD'],
            'actual_OpenAI_sha':'f9e8bc5b38b6e212696e8a30e3e91517af887bbd',
            'comparison_and_L1_multiplier_symbol_equal':True,
            'comparison_Schwartz_test_uses_same_symbol':True,
            'distribution_pairing_adjointness_proved':False,
            'physical_flux_identification_proved':False,
            'source_10_19_estimate_proved':False,
            'paper_prose_semantics_approved':False,
            'production_admission_unchanged':True,
            'axiom_audit':seen,
            'file_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()},
          }
          (root/'result.json').write_text(json.dumps(d,sort_keys=True,indent=2)+'\n')
          print(json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-pressure-symbol-v13
          path: pressure-v13-evidence/
          if-no-files-found: error
