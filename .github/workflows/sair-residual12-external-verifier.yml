name: SAIR Residual-12 Expanding Three 120 Separator

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sair-residual12-external-verifier

permissions:
  contents: read

jobs:
  expanding-three-120:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen Stage-2 experiment
        uses: actions/checkout@v4
        with:
          repository: heathsanchez/equational-theories-lean-stage2
          ref: 78e4595e88ddbf300aa59af3b61d8630b9d0a233
          path: stage2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen state and preregistration
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum submissions/mathgraph_cleanroom/solver.py | cut -d' ' -f1)" = "652fba6799e9066368f135319023865a4a58399f7a7228f20b31ea59bdc8f39c"
          test "$(sha256sum experiments/mathgraph/residual12/released_residuals_unlabelled.json | cut -d' ' -f1)" = "6039b4deac53bf290389180c7b688448311e5fde3fd78e083b56147a7eeb6b24"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("experiments/mathgraph/residual12/expanding_three_120_preregistration.json")
          prereg = json.loads(path.read_text())
          assert prereg["status"] == "FROZEN_BEFORE_EXECUTION"
          assert prereg["intervention"]["budgets_seconds"] == [60, 120]
          assert prereg["inputs"]["selected_ids"] == [
              "evaluation_normal_0036",
              "evaluation_order5_0006",
              "evaluation_order5_0042",
          ]
          print(json.dumps({
              "schema": prereg["schema"],
              "status": prereg["status"],
              "selected_ids": prereg["inputs"]["selected_ids"],
          }, indent=2))
          PY
          python experiments/mathgraph/residual12/validate_development_graph.py
          python -m py_compile experiments/mathgraph/residual12/run_expanding_three_120_separator.py
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            stage2/.lake/packages
          key: sair-residual12-lean-${{ runner.os }}-${{ hashFiles('stage2/lean-toolchain', 'stage2/lake-manifest.json') }}
      - name: Build official Lean judge
        working-directory: stage2
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Run frozen 60-to-120-second separator
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python experiments/mathgraph/residual12/run_expanding_three_120_separator.py \
            --output experiments/mathgraph/residual12/expanding_three_120_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sair-residual12-expanding-three-120
          path: stage2/experiments/mathgraph/residual12/expanding_three_120_results.json
          if-no-files-found: warn
          retention-days: 30
