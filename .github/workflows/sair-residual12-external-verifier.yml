name: SAIR Residual-12 Full-800 Compact A-B

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sair-residual12-external-verifier

permissions:
  contents: read

jobs:
  paired-full-800:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out frozen Stage-2 verifier
        uses: actions/checkout@v4
        with:
          repository: heathsanchez/equational-theories-lean-stage2
          ref: 58efec6647d7ebe0d2b9d200552c1f4feb0c72a8
          path: stage2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation tools
        run: python -m pip install 'datasets>=3,<5' 'openai>=1,<3'
      - name: Verify frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd stage2
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.32.2"
          grep -q 905b95818eb32af7874a58b427f50c1711a5e96c lake-manifest.json
          test "$(sha256sum submissions/mathgraph_cleanroom/solver.py | cut -d' ' -f1)" = "a92eae8cce4fdf7c787c3218fa4f7eb1158c92a6b57f2920199ddbe6e7726a08"
          grep -q 'FROZEN_BEFORE_FULL_800_EXECUTION' experiments/mathgraph/residual12/full_800_compact_budget_preregistration.json
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            stage2/.lake/packages
          key: sair-residual12-lean-${{ runner.os }}-${{ hashFiles('stage2/lean-toolchain', 'stage2/lake-manifest.json') }}
      - name: Build official Lean judge
        working-directory: stage2
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Run frozen paired full-800 separator
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          PYTHONDONTWRITEBYTECODE=1 python \
            experiments/mathgraph/residual12/run_full_800_compact_budget_ab.py \
            --output experiments/mathgraph/residual12/full_800_compact_budget_ab_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sair-residual12-full-800-compact-ab
          path: stage2/experiments/mathgraph/residual12/full_800_compact_budget_ab_results.json
          if-no-files-found: warn
          retention-days: 30
