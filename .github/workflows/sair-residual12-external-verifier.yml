name: SAIR Residual-12 Independent Transfer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sair-residual12-external-verifier

permissions:
  contents: read

jobs:
  independent-family-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out frozen Stage-2 verifier
        uses: actions/checkout@v4
        with:
          repository: heathsanchez/equational-theories-lean-stage2
          ref: 4f8ac1fbb3b9c027dc3a159476c60665bb3b43ea
          path: stage2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd stage2
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.32.2"
          grep -q 905b95818eb32af7874a58b427f50c1711a5e96c lake-manifest.json
          test "$(sha256sum submissions/mathgraph_cleanroom/solver.py | cut -d' ' -f1)" = "a92eae8cce4fdf7c787c3218fa4f7eb1158c92a6b57f2920199ddbe6e7726a08"
          test "$(sha256sum experiments/mathgraph/residual12/independent_family_audit_inputs.json | cut -d' ' -f1)" = "075f7a3b8d0dd389c2d2a12d444af435eb921f622954185cb3d0f867d7cdb503"
          test "$(sha256sum experiments/mathgraph/residual12/independent_family_audit_labels.sealed.json | cut -d' ' -f1)" = "5c07bcfe3659f7abfa14b2594000bee01cb9618aed5901941b6dd67c771d987a"
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            stage2/.lake/packages
          key: sair-residual12-lean-${{ runner.os }}-${{ hashFiles('stage2/lean-toolchain', 'stage2/lake-manifest.json') }}
      - name: Build official Lean judge
        working-directory: stage2
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Run frozen label-blind separator
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          PYTHONDONTWRITEBYTECODE=1 python \
            experiments/mathgraph/residual12/run_independent_family_transfer.py \
            --output experiments/mathgraph/residual12/independent_family_transfer_raw.json
          sha256sum \
            experiments/mathgraph/residual12/independent_family_transfer_raw.json \
            > experiments/mathgraph/residual12/independent_family_transfer_raw.sha256
      - name: Reveal seal and evaluate frozen outcomes
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          python experiments/mathgraph/residual12/evaluate_independent_family_transfer.py \
            --raw experiments/mathgraph/residual12/independent_family_transfer_raw.json \
            --raw-hash experiments/mathgraph/residual12/independent_family_transfer_raw.sha256 \
            --inputs experiments/mathgraph/residual12/independent_family_audit_inputs.json \
            --labels experiments/mathgraph/residual12/independent_family_audit_labels.sealed.json \
            --output experiments/mathgraph/residual12/independent_family_transfer_evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sair-residual12-independent-family-transfer
          path: |
            stage2/experiments/mathgraph/residual12/independent_family_transfer_raw.json
            stage2/experiments/mathgraph/residual12/independent_family_transfer_raw.sha256
            stage2/experiments/mathgraph/residual12/independent_family_transfer_evaluation.json
          if-no-files-found: warn
          retention-days: 30
