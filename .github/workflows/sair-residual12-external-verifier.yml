name: SAIR Residual-12 Promotion Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sair-residual12-external-verifier

permissions:
  contents: read

jobs:
  qualify-promoted-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out promoted Stage-2 portfolio
        uses: actions/checkout@v4
        with:
          repository: heathsanchez/equational-theories-lean-stage2
          ref: 76ef25c02bd660efef75d752355214a84d9243b7
          path: stage2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install qualification tools
        run: python -m pip install 'pytest>=8,<9' 'datasets>=3,<5' 'openai>=1,<3'
      - name: Verify promoted hashes and branding boundary
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum submissions/mathgraph_cleanroom/solver.py | cut -d' ' -f1)" = "652fba6799e9066368f135319023865a4a58399f7a7228f20b31ea59bdc8f39c"
          test "$(sha256sum submissions/mathgraph_cleanroom_solo_gemma/solver.py | cut -d' ' -f1)" = "fdeaf9433434e2b50209a8ea3a75e04900525559f3c796bdbae048e1f8d26fa5"
          test "$(sha256sum submissions/mathgraph_cleanroom_solo_oss/solver.py | cut -d' ' -f1)" = "94b3167f38ea2def0d60fc2ba725a937ed7c7ff314970bb9609a4f068afd0e62"
          test "$(sha256sum submissions/mathgraph_cleanroom_marathon_gemma/solver.py | cut -d' ' -f1)" = "c37f1318fc0a89255677be8f76b5c5e83f6e5b683158b8c57a3fa19239ecb17f"
          test "$(sha256sum submissions/mathgraph_cleanroom_marathon_oss/solver.py | cut -d' ' -f1)" = "b99abceff7195f371b9fc5b4919e4b687727a979c15535f5802e9a77d2db27fc"
          python experiments/mathgraph/residual12/validate_development_graph.py
      - name: Run cleanroom and portfolio tests
        working-directory: stage2
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            tests/test_mathgraph_cleanroom_generalization.py \
            tests/test_mathgraph_cleanroom_finite_search.py \
            tests/test_mathgraph_final_portfolio.py
      - name: Run Solo and Marathon platform harnesses
        working-directory: stage2
        run: |
          python scripts/run_harness.py
          python scripts/run_marathon_harness.py
      - name: Cache Lean and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            stage2/.lake/packages
          key: sair-residual12-lean-${{ runner.os }}-${{ hashFiles('stage2/lean-toolchain', 'stage2/lake-manifest.json') }}
      - name: Build official Lean judge
        working-directory: stage2
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/setup.sh
      - name: Verify promoted Solo OSS entry on both marginal gains
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json
          from datasets import load_dataset
          from pathlib import Path
          from pipeline.proxy import load_config, run_solver

          wanted = {"evaluation_order5_0022", "evaluation_order5_0040"}
          dataset = load_dataset(
              "SAIRfoundation/equational-theories-selected-problems",
              "evaluation_order5", split="train"
          )
          print("columns=", list(dataset.column_names), flush=True)
          rows = [dict(row) for row in dataset if row["id"] in wanted]
          config = load_config()
          config["solver"]["timeout_seconds"] = 120
          config["judge"]["lean_timeout_seconds"] = 90
          config["sandbox"]["mode"] = "none"
          results = []
          for row in rows:
              problem = {k: v for k, v in row.items()
                         if k not in {"truth", "label", "is_true", "answer"}}
              result = run_solver(
                  Path("submissions/mathgraph_cleanroom_solo_oss"),
                  problem, config
              )
              statuses = [
                  event.get("response", {}).get("status", "unparsed")
                  for event in result.get("log", [])
                  if event.get("type") == "judge"
              ]
              results.append({
                  "id": row["id"], "solved": bool(result.get("solved")),
                  "verdict": result.get("verdict"),
                  "judge_statuses": statuses,
                  "llm_calls": result.get("llm_calls", 0),
              })
          output = {"track": "solo_oss", "rows": results}
          Path("experiments/mathgraph/residual12/promotion_solo_oss.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(output, indent=2), flush=True)
          if {row["id"] for row in results} != wanted:
              raise SystemExit("marginal input set differs")
          if not all(row["solved"] and row["verdict"] == "true"
                     and row["judge_statuses"] == ["accepted"]
                     and row["llm_calls"] == 0 for row in results):
              raise SystemExit("promoted Solo OSS entry failed a marginal gain")
          PY
      - name: Verify promoted Marathon OSS entry on both marginal gains
        working-directory: stage2
        shell: bash
        run: |
          set -euo pipefail
          source .env.judge
          python - <<'PY'
          import json
          from datasets import load_dataset
          from pathlib import Path

          wanted = {"evaluation_order5_0022", "evaluation_order5_0040"}
          dataset = load_dataset(
              "SAIRfoundation/equational-theories-selected-problems",
              "evaluation_order5", split="train"
          )
          print("columns=", list(dataset.column_names), flush=True)
          rows = [dict(row) for row in dataset if row["id"] in wanted]
          path = Path("/tmp/mathgraph_residual12_marathon.jsonl")
          path.write_text("".join(json.dumps(row) + "\n" for row in rows))
          PY
          python scripts/run_marathon.py \
            --solver submissions/mathgraph_cleanroom_marathon_oss \
            --manifest /tmp/mathgraph_residual12_marathon.jsonl \
            --budget-seconds 240 \
            --budget-tokens 0 \
            --output-dir /tmp/mathgraph_residual12_marathon_run
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          source = Path("/tmp/mathgraph_residual12_marathon_run/summary.json")
          summary = json.loads(source.read_text())
          print(json.dumps(summary, indent=2), flush=True)
          if summary.get("score") != 2 or summary.get("attempted") != 2:
              raise SystemExit("promoted Marathon OSS entry failed a marginal gain")
          shutil.copyfile(
              source,
              "experiments/mathgraph/residual12/promotion_marathon_oss.json"
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sair-residual12-promotion-qualification
          path: |
            stage2/experiments/mathgraph/residual12/promotion_solo_oss.json
            stage2/experiments/mathgraph/residual12/promotion_marathon_oss.json
          if-no-files-found: warn
          retention-days: 30
