name: MathGraph prospective Qwen two-sentinel migration audit
on:
  push:
    branches:
      - research/prospective-qwen-sentinels-v2-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preregistered-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout preregistration and audit code
        uses: actions/checkout@v4
        with:
          fetch-depth: 12
          persist-credentials: false
      - name: Checkout original C and Qwen-generated Rust at exact revision
        uses: actions/checkout@v4
        with:
          repository: ZoneOut12/C2VerifiableRust
          ref: 6c8b35b5dd8e94473b713b7edcf4bf4142f214e3
          path: target
          persist-credentials: false
      - name: Check preregistration ancestor and immutable source files
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'dceb85e8072d86f3f037ef1754a8c12d8da38657^{commit}'
          test "$(git -C target rev-parse HEAD)" = '6c8b35b5dd8e94473b713b7edcf4bf4142f214e3'
          test "$(git -C target hash-object data/tutorial_wp/ex-3-binary-search-answer.c)" = 'b4f00cac89395f618671bcd73f5b2828e4df3858'
          test "$(git -C target hash-object data/tutorial_wp/ex-3-search-answer.c)" = '72d7eafa47c1e4914101ee1a088ffd15688e6369'
          test "$(git -C target hash-object transpiled_rust/tutorial_wp/ex-3-binary-search-answer.rs)" = 'ca7bb488b2de916812715c790ed3b7cdf8c84e3d'
          test "$(git -C target hash-object transpiled_rust/tutorial_wp/ex-3-search-answer.rs)" = 'ba64d22cf4f6b6861e0c8af5bb203c47b4fd5fdf'
          test -z "$(git -C target status --porcelain)"
      - name: Test preregistered source-only oracle
        run: python3 -m unittest discover -s research/prospective_qwen_sentinels_v2 -p 'test_*.py' -v
      - name: Run both native C and unmodified Qwen Rust on 7231 cases
        run: python3 research/prospective_qwen_sentinels_v2/native_replay.py target research/prospective_qwen_sentinels_v2/evidence
      - name: Independent conventional contract comparator
        run: python3 research/prospective_qwen_sentinels_v2/conventional_baseline.py research/prospective_qwen_sentinels_v2/evidence
      - name: Falsify six real-output evidence perturbations
        run: python3 research/prospective_qwen_sentinels_v2/challenge.py research/prospective_qwen_sentinels_v2/evidence
      - name: Retain source, test, and build provenance
        if: always()
        shell: bash
        run: |
          mkdir -p research/prospective_qwen_sentinels_v2/evidence
          git rev-parse HEAD > research/prospective_qwen_sentinels_v2/evidence/mathgraph-commit.txt
          git -C target rev-parse HEAD > research/prospective_qwen_sentinels_v2/evidence/upstream-commit.txt
          git -C target status --porcelain > research/prospective_qwen_sentinels_v2/evidence/upstream-status.txt
          sha256sum research/prospective_qwen_sentinels_v2/*.py > research/prospective_qwen_sentinels_v2/evidence/checker-source-sha256.txt
          test -z "$(git -C target status --porcelain)"
      - name: Upload observations including failed case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-qwen-sentinels-v2
          path: research/prospective_qwen_sentinels_v2/
          if-no-files-found: warn
          retention-days: 90
