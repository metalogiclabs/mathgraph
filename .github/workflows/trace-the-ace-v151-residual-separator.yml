name: Trace the Ace V151 Residual Separator

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful V145 recovery run containing v146_bundle.npz
        required: true
        default: "32792841883"
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-the-ace-v151-residual-separator.yml'
      - 'experiments/trace_the_ace_v151/**'

permissions:
  contents: read
  actions: read

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve source run
        id: src
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"; else echo "run=32792841883" >> "$GITHUB_OUTPUT"; fi
      - name: Download V145 bundle
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.src.outputs.run }}
          repository: metalogiclabs/mathgraph
      - name: Verify bundle
        run: test -s v145-portable/v146_bundle.npz
      - name: Prepare CPU
        run: python -m pip install -q numpy pandas scipy scikit-learn
      - name: Run residual-relative separator
        run: |
          mkdir -p v151-results
          python experiments/trace_the_ace_v151/run_v151_residual_separator.py \
            --bundle v145-portable/v146_bundle.npz \
            --out v151-results/v151_results.json
      - name: Publish result
        if: always()
        run: |
          if [ -s v151-results/v151_results.json ]; then cat v151-results/v151_results.json; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v151-residual-separator-${{ github.run_id }}
          path: v151-results/v151_results.json
          if-no-files-found: warn
          retention-days: 30
