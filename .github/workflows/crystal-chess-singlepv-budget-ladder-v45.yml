name: Crystal Chess SinglePV Budget Ladder V45

on:
  push:
    branches:
      - crystal-chess-singlepv-budget-ladder-v45
    paths:
      - "experiments/crystal_chess_singlepv_budget_ladder_v45.py"
      - ".github/workflows/crystal-chess-singlepv-budget-ladder-v45.yml"
      - "experiments/crystal_chess_search_sufficiency_v25.py"
  workflow_dispatch:

jobs:
  singlepv-budget-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_singlepv_budget_ladder_v45.py

      - name: Download exact V44 authority
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-forced-consequence-audit-v44
          path: /tmp/v44
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36521246609

      - name: Verify V44 residual identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v44/result.json'))
          assert p['schema']=='mathgraph.crystal-chess.forced-consequence-audit.v44'
          assert len(p['rows'])==4
          assert all(r['forced']['400000']['authority_is_max'] for r in p['rows'])
          print('V44_EXACT_HARD_RESIDUAL=PASS')
          PY

      - name: Build pinned Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/stockfish-bench.txt 2>&1

      - name: Run single-PV budget ladder
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v45
          python experiments/crystal_chess_singlepv_budget_ladder_v45.py             --stockfish /tmp/stockfish/src/stockfish             --v44-result /tmp/v44/result.json             --output artifacts/crystal-chess-v45/result.json             | tee artifacts/crystal-chess-v45/run.log
          grep -Eq "CRYSTAL_CHESS_SINGLEPV_BUDGET_LADDER_V45=(V44_HARD_RESIDUAL_RECOVERED_BY_SUB100K_SINGLEPV|V44_HARD_RESIDUAL_PARTLY_RECOVERED_BY_SINGLEPV|V44_HARD_RESIDUAL_REQUIRES_NEAR_AUTHORITY_BUDGET)" artifacts/crystal-chess-v45/run.log
          cp /tmp/stockfish-bench.txt artifacts/crystal-chess-v45/

      - name: Upload V45 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-singlepv-budget-ladder-v45
          path: artifacts/crystal-chess-v45/
          if-no-files-found: error
