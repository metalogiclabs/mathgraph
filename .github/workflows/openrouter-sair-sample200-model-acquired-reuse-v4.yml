name: OpenRouter SAIR sample-200 model-acquired reuse V4

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model ID
        required: false
        default: google/gemma-4-31b-it
      provider:
        description: OpenRouter provider slug
        required: false
        default: deepinfra
  push:
    branches:
      - open-math-model-sustained-use-v1
    paths:
      - "scripts/run_openrouter_sair_sample200_model_acquired_reuse_v4.py"
      - ".github/workflows/openrouter-sair-sample200-model-acquired-reuse-v4.yml"

permissions:
  contents: read

jobs:
  sair-sample200-model-acquired-reuse-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ github.event.inputs.model || 'google/gemma-4-31b-it' }}
      OPENROUTER_PROVIDER: ${{ github.event.inputs.provider || 'deepinfra' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require OpenRouter API key
        run: |
          test -n "$OPENROUTER_API_KEY"

      - name: Run pinned public SAIR model-acquired reuse V4
        run: |
          python scripts/run_openrouter_sair_sample200_model_acquired_reuse_v4.py \
            --out-dir /tmp/openrouter-sair-sample200-v4 \
            --model "$OPENROUTER_MODEL" \
            --provider "$OPENROUTER_PROVIDER" \
            --acquisition-rounds 2

      - name: Audit V4 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/openrouter-sair-sample200-v4/report.json").read_text()
          )
          summary = {
              "verdict": report["verdict"],
              "model": report["model"],
              "provider": report["provider"],
              "sair_commit": report["sair_provenance"]["commit"],
              "acquisition_task_count": len(report["acquisition_tasks"]),
              "fresh_task_count": len(report["fresh_tasks"]),
              "acquisition_verified_count": sum(
                  bool(x["verified_capability_acquired"])
                  for x in report["acquisition_outcomes"]
              ),
              "promoted_capability_count": len(report["promoted_capabilities"]),
              "acquisition_cost": report["acquisition_cost"],
              "aggregate": report["aggregate"],
              "comparisons": report["comparisons"],
              "gates": report["gates"],
              "claim_boundary": report["claim_boundary"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert report["verdict"] == "PASS"
          assert all(report["gates"].values())
          assert report["sair_provenance"]["commit"] == "817a4653bf762584931d49c6714c9fcfab7df66a"
          assert len(report["acquisition_tasks"]) == 25
          assert len(report["fresh_tasks"]) == 75
          PY

      - name: Upload V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-sair-sample200-model-acquired-reuse-v4
          path: /tmp/openrouter-sair-sample200-v4/
          if-no-files-found: warn
