name: Crystal Swarm Runtime V6 Saturation
on:
  push:
    branches: [crystal-swarm-runtime-v6-saturation]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]"
      - name: Prove inherited semantic waists unchanged
        run: |
          git diff --exit-code 5c29aacfc86f79cda97a02b14b6ec384846be21f -- mathgraph/crystal.py
          git diff --exit-code 5c29aacfc86f79cda97a02b14b6ec384846be21f -- mathgraph/math_claim.py
          git diff --exit-code 5c29aacfc86f79cda97a02b14b6ec384846be21f -- mathgraph/graph_invariants.py
          git diff --exit-code 5c29aacfc86f79cda97a02b14b6ec384846be21f -- mathgraph/finite_relation.py
          git diff --exit-code 5c29aacfc86f79cda97a02b14b6ec384846be21f -- mathgraph/finite_falsifier.py
          git diff --exit-code 5c29aacfc86f79cda97a02b14b6ec384846be21f -- mathgraph/falsifier_adapter.py
          git diff --exit-code 5c29aacfc86f79cda97a02b14b6ec384846be21f -- mathgraph/falsifier_semantic_adapter.py
      - name: Qualify registered compiler providers
        run: |
          python -m pytest -q             tests/test_certificates.py             tests/test_evidence_manifest_replay.py             tests/test_lawbook_acceptance_contract.py             tests/test_crystal_adapter_contract.py             tests/test_discovery_scheduler.py             tests/test_compounding_engine.py             tests/test_core_invariants.py
      - name: Saturate replay adapters
        run: python scripts/run_crystal_swarm_runtime_v6_saturation.py
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-swarm-runtime-v6-saturation-evidence
          path: evidence/crystal-swarm-runtime-v6-saturation/result.json
          if-no-files-found: error
