name: VDN finite interface v41
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/finite_inevitability/run_v41_finite_interface_inevitability.py'
      - '.github/workflows/vdn-finite-interface-v41.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exhaustive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust all 3-state 2-action worlds
        run: python3 verified-developmental-navigation/case_studies/finite_inevitability/run_v41_finite_interface_inevitability.py
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-finite-interface-v41
          path: verified-developmental-navigation/case_studies/finite_inevitability/results_v41_finite_interface_inevitability/result.json
