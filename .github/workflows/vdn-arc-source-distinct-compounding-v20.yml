name: VDN ARC source-distinct compounding V20

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v20_source_distinct_compounding.py"
      - ".github/workflows/vdn-arc-source-distinct-compounding-v20.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-distinct-compounding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V20 source-distinct compounding
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v20_source_distinct_compounding.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-source-distinct-compounding-v20
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v20_source_distinct_compounding/result.json
