name: Deploy reviewed owned-fork Check pilot
on:
  push:
    branches: [pilot/check-pr-deploy-v1]
permissions:
  contents: read
concurrency:
  group: mathgraph-check-controlled-worker-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: mathgraph-check-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 3b22e4f292069acd4da882b45074a12a4207a86c}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: node --test integrations/mathgraph-check-github/*.test.mjs integrations/mathgraph-check-github/investigator-v1/*.test.mjs integrations/mathgraph-check-github/lean-investigator-v1/*.test.mjs integrations/mathgraph-check-github/pr-pilot-v1/*.test.mjs integrations/mathgraph-check-github/cloudflare/*.test.mjs
      - run: python3 -m unittest discover -s integrations/mathgraph-check-github/lean-investigator-v1 -p 'test_*.py'
      - name: Confirm App events and exact one-fork token scope
        env:
          APP_PRIVATE_KEY: ${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {appJWT} from './integrations/mathgraph-check-github/cloudflare/worker.mjs';
          import {githubClient} from './integrations/mathgraph-check-github/pr-pilot-v1/github.mjs';
          import {mintScopedToken} from './integrations/mathgraph-check-github/pr-pilot-v1/auth.mjs';
          const jwt=appJWT(process.env.APP_PRIVATE_KEY),headers={Authorization:'Bearer '+jwt,Accept:'application/vnd.github+json'};
          const response=await fetch('https://api.github.com/app',{headers});
          if(!response.ok)throw Error('APP_UNAVAILABLE');
          const app=await response.json();
          if(app.id!==5308912||!app.events.includes('issue_comment')||!app.events.includes('pull_request'))throw Error('APP_EVENTS_NOT_READY');
          const api=githubClient(jwt,{repository:'metalogiclabs/L4YAML'});
          const i=await api('/repos/metalogiclabs/L4YAML/installation');
          if(i.repository_selection!=='all')throw Error('ALL_OWNED_REPOSITORIES_NOT_ENABLED');
          const token=await mintScopedToken(api,i.id,'metalogiclabs/L4YAML',{contents:'read'});
          await githubClient(token,{repository:'metalogiclabs/L4YAML'})('/installation/token',{method:'DELETE'});
          console.log(JSON.stringify({app:app.id,events:app.events,selection:i.repository_selection,exact_fork_scope:true}));
          JS
      - name: Bundle reviewed source without writes
        run: npx --yes wrangler@4.129.1 deploy --dry-run --config integrations/mathgraph-check-github/cloudflare/wrangler.toml --outdir "$RUNNER_TEMP/pr-pilot-worker"
      - name: Deploy existing worker with preserved secrets and bounded pilot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = c3bc279612c15be71c7e4f605a462657
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.129.1 deploy --config integrations/mathgraph-check-github/cloudflare/wrangler.toml --var PR_PILOT_ENABLED:true --keep-vars
      - name: Verify live readiness
        run: curl --fail --silent --show-error https://mathgraph-check-webhook-pilot.metalogiclabs-check.workers.dev/ready
