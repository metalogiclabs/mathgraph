name: LeanEval cubic frontier

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-cubic-frontier.yml'
      - '.github/scripts/lean_eval_local_valuation.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-valuation-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run factor-local valuation experiment
        run: bash .github/scripts/lean_eval_local_valuation.sh
