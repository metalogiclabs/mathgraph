name: RH independent definition bridge

on:
  push:
    paths:
      - 'research/rh-definition-bridge/**'
      - '.github/workflows/rh-independent-definition-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/rh-definition-bridge
    steps:
      - uses: actions/checkout@v4
      - name: Install elan/Lean from pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: |
          "$HOME/.elan/bin/lake" update
      - name: Retrieve mathlib build cache
        run: |
          "$HOME/.elan/bin/lake" exe cache get
      - name: Type-check independent equivalence and record axioms
        run: |
          set -o pipefail
          "$HOME/.elan/bin/lake" env lean RHIndependent.lean 2>&1 | tee "$RUNNER_TEMP/rh-bridge.log"
          python3 - "$RUNNER_TEMP/rh-bridge.log" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding='utf-8').read()
          expected = ['RHBridge.mathlibZetaFits', 'RHBridge.zetaUnique', 'RHBridge.independentRHIffMathlib']
          permitted = {'propext', 'Quot.sound', 'Classical.choice'}
          for theorem in expected:
              match = re.search(r"(?m)^'?" + re.escape(theorem) + r"'? depends on axioms: \[([^\]]*)\]', log)
              no_axioms = re.search(r"(?m)^'?" + re.escape(theorem) + r"'? does not depend on any axioms", log)
              if match:
                  observed = {name.strip() for name in match.group(1).split(',') if name.strip()}
              elif no_axioms:
                  observed = set()
              else:
                  raise SystemExit(f'MISSING: checked axiom output for {theorem}')
              unexpected = observed - permitted
              print(f'{theorem}: axioms={sorted(observed)} unexpected={sorted(unexpected)}')
              if unexpected:
                  raise SystemExit(f'FAIL: unexpected axioms in {theorem}')
          if 'sorryAx' in log:
              raise SystemExit('FAIL: sorry axiom reported in compiler output')
          print('PASS: independent specification bridge with only permitted Lean foundational axioms')
          PY
