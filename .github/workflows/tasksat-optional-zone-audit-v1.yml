name: TaskSAT Crystal optional-zone audit v1

on:
  push:
    branches:
      - tasksat-crystal-optional-zone-audit-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout MathGraph experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch pinned TaskSAT
        run: |
          git clone https://github.com/nasa-jpl/tasksat.git /tmp/tasksat
          git -C /tmp/tasksat checkout f9d6063b45967a3fea578c47f54806aadaafe1b0
          test "$(git -C /tmp/tasksat rev-parse HEAD)" = "f9d6063b45967a3fea578c47f54806aadaafe1b0"

      - name: Install TaskSAT dependencies
        run: python -m pip install -r /tmp/tasksat/requirements.txt

      - name: Run exact semantic counterexample
        run: |
          python experiments/tasksat_optional_zone_audit_v1/audit.py /tmp/tasksat \
            | tee tasksat_optional_zone_audit_v1.log
          grep -q PASS_TASKSAT_OPTIONAL_ZONE_SEMANTIC_COUNTEREXAMPLE \
            tasksat_optional_zone_audit_v1.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: tasksat-optional-zone-audit-v1
          path: |
            tasksat_optional_zone_audit_v1_evidence.json
            tasksat_optional_zone_audit_v1.log
