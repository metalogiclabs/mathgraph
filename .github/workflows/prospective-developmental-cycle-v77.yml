name: V77 Prospective Developmental Cycle Transfer

on:
  push:
    branches: [prospective-developmental-cycle-v77]
    paths:
      - 'experiments/prospective_developmental_cycle_v77/**'
      - '.github/workflows/prospective-developmental-cycle-v77.yml'
  workflow_dispatch:

jobs:
  prospective-developmental-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Static check before fresh generation
        run: python3 -m py_compile experiments/prospective_developmental_cycle_v77/run.py

      - name: Install inherited frozen backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1

      - name: Fetch opened training universe only
        run: |
          set -euo pipefail
          mkdir -p external-v77
          curl -fsSL --retry 3 https://raw.githubusercontent.com/heathsanchez/equational-theories-lean-stage2/374eb40ba5389915deb174fbc12cc92346214dd1/examples/problems/eq_size5.txt -o external-v77/eq_size5.txt
          test "$(git hash-object external-v77/eq_size5.txt)" = "0deca9c8860fb60f2ae161ab7e3f458ec3b178ca"
          echo "V77_RULE=freeze_full_protocol_before_any_seven_op_source_generation"

      - name: Run V77 prospective developmental cycle
        run: |
          PYTHONPATH=. python3 experiments/prospective_developmental_cycle_v77/run.py \
            --opened-laws external-v77/eq_size5.txt \
            --out external-v77/results

      - name: Preserve V77 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v77-prospective-developmental-cycle
          path: external-v77/results/
