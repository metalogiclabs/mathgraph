name: V56 Opened Structural Constructor

on:
  push:
    branches: [external-capability-compounding-v56]
    paths:
      - 'experiments/external_capability_compounding_v56_structured/**'
      - '.github/workflows/external-capability-compounding-v56-structured.yml'
  workflow_dispatch:

jobs:
  structured:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: Freeze opened corpus
        run: |
          mkdir -p external-v56-structured
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v56-structured/a.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v56-structured/b.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v56-structured/a.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v56-structured/b.jsonl" | sha256sum -c -
      - name: Run structural constructors on opened cases
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v56_structured/probe.py --wb3000 external-v56-structured/a.jsonl --wb3500 external-v56-structured/b.jsonl --timeout-ms 2500 --out external-v56-structured/results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v56-opened-structural-constructor
          path: external-v56-structured/results/
