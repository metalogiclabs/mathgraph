name: Calculus core Lean kernel

on:
  push:
    branches:
      - calculus/core-v0
    paths:
      - 'MathGraph/Calculus/**'
      - '.github/workflows/calculus-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEAN_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.0
      - name: Verify calculus kernel
        run: |
          lean -o MathGraph/Calculus/Core.olean MathGraph/Calculus/Core.lean
          echo 'CALCULUS_CORE_GATE {"classification":"LEAN_VERIFIED_BASE_KERNEL"}'
      - name: Verify refinement algebra
        run: |
          lean -o MathGraph/Calculus/Refinement.olean MathGraph/Calculus/Refinement.lean
          echo 'CALCULUS_REFINEMENT_GATE {"classification":"LEAN_VERIFIED_INFORMATION_ALGEBRA"}'
      - name: Verify consequence-separation bridge
        run: |
          lean -o MathGraph/Calculus/Separation.olean MathGraph/Calculus/Separation.lean
          echo 'CALCULUS_SEPARATION_GATE {"classification":"LEAN_VERIFIED_CONSEQUENCE_SEPARATION_DUALITY"}'
      - name: Verify lawful separation representation
        run: |
          lean -o MathGraph/Calculus/Representation.olean MathGraph/Calculus/Representation.lean
          echo 'CALCULUS_REPRESENTATION_GATE {"classification":"LEAN_VERIFIED_LAWFUL_SEPARATION_REPRESENTABILITY"}'
      - name: Verify separation axiom necessity
        run: |
          lean MathGraph/Calculus/AxiomNecessity.lean
          echo 'CALCULUS_AXIOM_NECESSITY_GATE {"classification":"LEAN_VERIFIED_EXACT_REPRESENTABILITY_IFF_LAWFUL_SEPARATION"}'
      - name: Verify raw outcome grounding
        run: |
          lean -o MathGraph/Calculus/OutcomeGrounding.olean MathGraph/Calculus/OutcomeGrounding.lean
          echo 'CALCULUS_OUTCOME_GROUNDING_GATE {"classification":"LEAN_VERIFIED_STATE_APARTNESS_DERIVED_FROM_RAW_OUTCOME_INEQUALITY"}'
      - name: Verify equality ablation
        run: |
          lean -o MathGraph/Calculus/EqualityAblation.olean MathGraph/Calculus/EqualityAblation.lean
          echo 'CALCULUS_EQUALITY_ABLATION_GATE {"classification":"LEAN_VERIFIED_APARTNESS_AND_IDENTITY_FROM_RAW_PROP_TESTS_WITHOUT_OUTCOME_EQUALITY"}'
      - name: Verify incidence grounding
        run: |
          lean -o MathGraph/Calculus/IncidenceGrounding.olean MathGraph/Calculus/IncidenceGrounding.lean
          echo 'CALCULUS_INCIDENCE_GROUNDING_GATE {"classification":"LEAN_VERIFIED_STATIC_CALCULUS_FROM_BARE_TEST_STATE_INCIDENCE"}'
      - name: Verify witness-incidence grounding
        run: |
          lean -o MathGraph/Calculus/WitnessIncidenceGrounding.olean MathGraph/Calculus/WitnessIncidenceGrounding.lean
          echo 'CALCULUS_WITNESS_INCIDENCE_GATE {"classification":"LEAN_VERIFIED_CONSTRUCTIVE_STATIC_CORE_FROM_TYPE_VALUED_WITNESS_INCIDENCE_WITH_LOGICAL_REFLECTION_BOUNDARY"}'
      - name: Verify direct witness grounding
        run: |
          lean -o MathGraph/Calculus/DirectWitnessGrounding.olean MathGraph/Calculus/DirectWitnessGrounding.lean
          echo 'CALCULUS_DIRECT_WITNESS_GATE {"classification":"LEAN_VERIFIED_IDENTITY_REFINEMENT_FROM_DIRECT_WITNESS_TRANSPORT_WITHOUT_NONEMPTY"}'
      - name: Verify type-valued identity grounding
        run: |
          lean -o MathGraph/Calculus/TypedIdentityGrounding.olean MathGraph/Calculus/TypedIdentityGrounding.lean
          echo 'CALCULUS_TYPED_IDENTITY_GATE {"classification":"LEAN_VERIFIED_TYPE_VALUED_IDENTITY_COMPOSITION_AND_REFINEMENT_BELOW_PROP"}'
      - name: Verify directed transport grounding
        run: |
          lean -o MathGraph/Calculus/DirectedTransportGrounding.olean MathGraph/Calculus/DirectedTransportGrounding.lean
          echo 'CALCULUS_DIRECTED_TRANSPORT_GATE {"classification":"LEAN_VERIFIED_DIRECTED_TRANSPORT_PREORDER_WITH_MUTUAL_REACHABILITY_DERIVING_TYPED_IDENTITY"}'
      - name: Verify transport equality ablation
        run: |
          lean -o MathGraph/Calculus/TransportEqualityAblation.olean MathGraph/Calculus/TransportEqualityAblation.lean
          echo 'CALCULUS_TRANSPORT_EQUALITY_ABLATION_GATE {"classification":"LEAN_VERIFIED_MUTUAL_TRANSPORT_DOES_NOT_FORCE_STATE_EQUALITY"}'
      - name: Verify witness coordinate ablation
        run: |
          lean -o MathGraph/Calculus/CoordinateAblation.olean MathGraph/Calculus/CoordinateAblation.lean
          echo 'CALCULUS_COORDINATE_ABLATION_GATE {"classification":"LEAN_VERIFIED_ERASING_DISTINCTION_COORDINATES_CREATES_SPURIOUS_MUTUAL_TRANSPORT"}'
      - name: Verify state carrier ablation
        run: |
          lean -o MathGraph/Calculus/StateCarrierAblation.olean MathGraph/Calculus/StateCarrierAblation.lean
          echo 'CALCULUS_STATE_CARRIER_ABLATION_GATE {"classification":"LEAN_VERIFIED_STATE_CARRIER_ELIMINABLE_FROM_TRANSPORT_CORE"}'
      - name: Verify bare transport descent
        run: |
          lean -o MathGraph/Calculus/BareTransportAlgebra.olean MathGraph/Calculus/BareTransportAlgebra.lean
          echo 'CALCULUS_BARE_TRANSPORT_GATE {"classification":"LEAN_VERIFIED_COORDINATE_FREE_TRANSPORT_ALGEBRA_WITH_IDENTITY_AND_COMPOSITION_NECESSITY"}'
      - name: Verify raw transport genesis
        run: |
          lean -o MathGraph/Calculus/RawTransportGenesis.olean MathGraph/Calculus/RawTransportGenesis.lean
          echo 'CALCULUS_RAW_TRANSPORT_GENESIS_GATE {"classification":"LEAN_VERIFIED_IDENTITY_AND_COMPOSITION_GENERATED_BY_FREE_FINITE_CONTINUATION_FROM_RAW_DIRECTED_POSSIBILITY"}'
      - name: Verify rock bottom ablation
        run: |
          lean -o MathGraph/Calculus/RockBottomAblation.olean MathGraph/Calculus/RockBottomAblation.lean
          echo 'CALCULUS_ROCK_BOTTOM_GATE {"classification":"LEAN_VERIFIED_ENDPOINTS_REQUIRED_FOR_ANY_CONTINUATION_AND_RAW_GENERATORS_REQUIRED_FOR_CROSS_ENDPOINT_CHANGE"}'
      - name: Verify boundary typing ablation
        run: |
          lean MathGraph/Calculus/BoundaryTypingAblation.lean
          echo 'CALCULUS_BOUNDARY_TYPING_GATE {"classification":"LEAN_VERIFIED_ERASING_COMPOSABILITY_BOUNDARIES_CREATES_SPURIOUS_CONTINUATION"}'
      - name: Verify reconstruction stage 1
        run: |
          lean -o MathGraph/Calculus/ReconstructionFromBedrock.olean MathGraph/Calculus/ReconstructionFromBedrock.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE1_GATE {"classification":"LEAN_VERIFIED_IDENTITY_AND_REFINEMENT_RECONSTRUCTED_FROM_RAW_DIRECTED_BEDROCK"}'
      - name: Verify reconstruction stage 2
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage2Profiles.olean MathGraph/Calculus/ReconstructionStage2Profiles.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE2_GATE {"classification":"LEAN_VERIFIED_WITNESS_PROFILE_TRANSPORT_RECONSTRUCTED_FROM_BEDROCK_PATHS"}'
      - name: Verify reconstruction stage 3
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage3Logic.olean MathGraph/Calculus/ReconstructionStage3Logic.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE3_GATE {"classification":"LEAN_VERIFIED_PROP_CONSEQUENCE_REFLECTION_FROM_BEDROCK_WITH_EXPLICIT_CHOICE_BOUNDARY"}'
      - name: Verify reconstruction stage 4
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage4Separation.olean MathGraph/Calculus/ReconstructionStage4Separation.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE4_GATE {"classification":"LEAN_VERIFIED_LAWFUL_SEPARATION_RECONSTRUCTED_FROM_BEDROCK_REACHABILITY"}'
      - name: Verify reconstruction stage 5
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage5Refinement.olean MathGraph/Calculus/ReconstructionStage5Refinement.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE5_GATE {"classification":"LEAN_VERIFIED_INFORMATION_REFINEMENT_EMERGES_FROM_PROBE_EXTENSION_NOT_RAW_WORLD_ENRICHMENT"}'
      - name: Verify reconstruction stage 6
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage6Residual.olean MathGraph/Calculus/ReconstructionStage6Residual.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE6_GATE {"classification":"LEAN_VERIFIED_RESIDUAL_INFORMATION_GAIN_RECONSTRUCTED_AS_NEW_PROBE_SPLIT"}'
      - name: Verify reconstruction stage 7
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage7FirstDistinction.olean MathGraph/Calculus/ReconstructionStage7FirstDistinction.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE7_GATE {"classification":"LEAN_VERIFIED_FIRST_DISTINCTION_GENERATED_FROM_EMPTY_PROBE_INTERFACE_BY_REACHABILITY_RESIDUAL"}'
      - name: Verify reconstruction stage 8
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage8Selection.olean MathGraph/Calculus/ReconstructionStage8Selection.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE8_GATE {"classification":"LEAN_VERIFIED_SPLIT_OR_FORGET_SELECTION_LAW_RECONSTRUCTED_FROM_BEDROCK"}'
      - name: Verify reconstruction stage 9
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage9Saturation.olean MathGraph/Calculus/ReconstructionStage9Saturation.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE9_GATE {"classification":"LEAN_VERIFIED_FIRST_RECURSIVE_SELECTION_CYCLE_REACHES_SATURATION"}'
      - name: Verify reconstruction stage 10
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage10Sufficiency.olean MathGraph/Calculus/ReconstructionStage10Sufficiency.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE10_GATE {"classification":"LEAN_VERIFIED_RESIDUAL_SATURATION_IS_SUFFICIENT_FOR_FULL_REACHABILITY_IDENTITY"}'
      - name: Verify reconstruction stage 11
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage11MinimalSufficient.olean MathGraph/Calculus/ReconstructionStage11MinimalSufficient.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE11_GATE {"classification":"LEAN_VERIFIED_FIRST_MINIMAL_SUFFICIENT_INTERFACE_GENERATED_FROM_BEDROCK_BY_RESIDUAL_SELECTION"}'
      - name: Verify reconstruction stage 12
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage12FiniteTermination.olean MathGraph/Calculus/ReconstructionStage12FiniteTermination.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE12_GATE {"classification":"LEAN_VERIFIED_FINITE_RESIDUAL_SELECTION_TERMINATES_AT_SATURATED_SUFFICIENT_INTERFACE"}'
      - name: Verify reconstruction stage 13
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage13Development.olean MathGraph/Calculus/ReconstructionStage13Development.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE13_GATE {"classification":"LEAN_VERIFIED_ONE_CYCLE_RESIDUAL_SELECTED_PROMOTION_CHANGES_REACHABLE_CLOSURE_WITH_ABLATION_AND_NO_RESIDUAL_NEGATIVE"}'
      - name: Verify reconstruction stage 14
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage14ConstructorGenesis.olean MathGraph/Calculus/ReconstructionStage14ConstructorGenesis.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE14_GATE {"classification":"LEAN_VERIFIED_RESIDUAL_DRIVEN_CONSTRUCTOR_LANGUAGE_EXPANSION_CHANGES_REACHABLE_CLOSURE_WITH_EXACT_ABLATION"}'
      - name: Verify reconstruction stage 15
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage15RecursiveDevelopment.olean MathGraph/Calculus/ReconstructionStage15RecursiveDevelopment.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE15_GATE {"classification":"LEAN_VERIFIED_RECURSIVE_DEVELOPMENTAL_STATE_SELF_APPLICATION_REACTS_TO_ITS_OWN_NEW_RESIDUAL_AND_REACHES_FIXED_POINT"}'
      - name: Verify reconstruction stage 16
        run: |
          lean -o MathGraph/Calculus/ReconstructionStage16SchemaGenesis.olean MathGraph/Calculus/ReconstructionStage16SchemaGenesis.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE16_GATE {"classification":"LEAN_VERIFIED_RESIDUAL_SYNTHESIZES_FRESH_PARAMETRIC_CONSTRUCTOR_SCHEMA_WITHOUT_FINITE_NAMED_KIND_ENUMERATION"}'
      - name: Verify reconstruction stage 17
        run: |
          lean MathGraph/Calculus/ReconstructionStage17DirectGeneratorGenesis.lean
          echo 'CALCULUS_RECONSTRUCTION_STAGE17_GATE {"classification":"LEAN_VERIFIED_RESIDUAL_COMPILES_DIRECTLY_TO_RAW_GENERATOR_EVIDENCE_WITHOUT_INTERMEDIATE_SCHEMA_REPRESENTATION_AND_WITH_EXACT_ABLATION"}'
