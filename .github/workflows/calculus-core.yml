name: Calculus core Lean kernel

on:
  push:
    branches:
      - calculus/core-v0
    paths:
      - 'MathGraph/Calculus/**'
      - '.github/workflows/calculus-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEAN_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.0
      - name: Verify calculus kernel
        run: |
          lean -o MathGraph/Calculus/Core.olean MathGraph/Calculus/Core.lean
          echo 'CALCULUS_CORE_GATE {"classification":"LEAN_VERIFIED_BASE_KERNEL"}'
      - name: Verify refinement algebra
        run: |
          lean -o MathGraph/Calculus/Refinement.olean MathGraph/Calculus/Refinement.lean
          echo 'CALCULUS_REFINEMENT_GATE {"classification":"LEAN_VERIFIED_INFORMATION_ALGEBRA"}'
      - name: Verify consequence-separation bridge
        run: |
          lean -o MathGraph/Calculus/Separation.olean MathGraph/Calculus/Separation.lean
          echo 'CALCULUS_SEPARATION_GATE {"classification":"LEAN_VERIFIED_CONSEQUENCE_SEPARATION_DUALITY"}'
      - name: Verify lawful separation representation
        run: |
          lean -o MathGraph/Calculus/Representation.olean MathGraph/Calculus/Representation.lean
          echo 'CALCULUS_REPRESENTATION_GATE {"classification":"LEAN_VERIFIED_LAWFUL_SEPARATION_REPRESENTABILITY"}'
      - name: Verify separation axiom necessity
        run: |
          lean MathGraph/Calculus/AxiomNecessity.lean
          echo 'CALCULUS_AXIOM_NECESSITY_GATE {"classification":"LEAN_VERIFIED_EXACT_REPRESENTABILITY_IFF_LAWFUL_SEPARATION"}'
      - name: Verify raw outcome grounding
        run: |
          lean MathGraph/Calculus/OutcomeGrounding.lean
          echo 'CALCULUS_OUTCOME_GROUNDING_GATE {"classification":"LEAN_VERIFIED_STATE_APARTNESS_DERIVED_FROM_RAW_OUTCOME_INEQUALITY"}'
