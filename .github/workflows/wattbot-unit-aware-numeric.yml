name: WattBot supplied-answer-unit numeric qualification
on:
  push:
    branches: [wattbot-unit-aware-numeric-v1]
    paths:
      - 'experiments/wattbot2026/unit_aware_numeric_probe.py'
      - '.github/workflows/wattbot-unit-aware-numeric.yml'
jobs:
  unit-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official scorer and exact PDF dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Qualify source-literal arithmetic and type-safe unit laws
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/report_loader.py
          python experiments/wattbot2026/unit_aware_numeric_probe.py --self-test
      - name: Select numeric unit policy on DEV then evaluate reused TRAIN holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/unit_aware_numeric_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Evaluation boundary
        run: |
          echo "Official TEST answer_unit is a supplied allowed feature."
          echo "No hidden TEST value/citations, no protected submission or model calls."
          echo "Diagnostic only, no promotion to leaderboard without authority."
