name: VDN ARC-AGI-2 symbolic motif v18
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v18_symbolic_motif.py'
      - '.github/workflows/vdn-arc2-symbolic-motif-v18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbolic-motif:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(find data/evaluation -name '*.json' | wc -l)" -eq 120
      - name: Run generalized symbolic motif repair
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v18_symbolic_motif.py /tmp/ARC-AGI-2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-symbolic-motif-v18
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v18_symbolic_motif/result.json
