name: Stage2 798 causal gate
on:
  push:
    branches: [stage2-798-gate-20260831]
    paths: [.github/workflows/stage2-798-causal-gate.yml]
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/equational-theories-lean-stage2
          ref: fc59ebc329b6cf488ec775e2f59208437cd5f0a2
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build exact verified 0040 candidate
        run: |
          python experiments/mathgraph/build_behavioural_future_specialist.py --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'; b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          p.write_text(s.replace(a,'frontier_seconds = 30.0').replace(b,'given_seconds = 10.0'))
          PY
          cp /tmp/solver.py submissions/mathgraph/solver.py
          python -m py_compile submissions/mathgraph/solver.py
          rm -rf submissions/mathgraph/__pycache__
          test "$(find submissions/mathgraph -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Setup official judge
        env: {SKIP_DOCKER: '1'}
        run: bash scripts/setup.sh
      - run: python -m pip install 'openai>=1,<3'
      - name: Fetch normal evaluation data
        run: |
          mkdir -p /tmp/sair_eval
          curl -fL --retry 3 'https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data/evaluation_normal.jsonl' -o /tmp/sair_eval/evaluation_normal.jsonl
      - name: Uncensored official 0040 reproduction
        shell: bash
        run: |
          source .env.judge
          python - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT=Path('.').resolve(); sys.path.insert(0,str(ROOT))
          from pipeline.proxy import load_config, load_problems, run_solver
          rows={r['id']:r for r in load_problems('/tmp/sair_eval/evaluation_normal.jsonl')}
          rid='evaluation_normal_0040'
          config=json.loads(json.dumps(load_config()))
          config['solver']['timeout_seconds']=900
          config.setdefault('sandbox',{})['mode']='none'
          trace=[]
          result=run_solver(ROOT/'submissions/mathgraph', rows[rid], config, trace_hook=lambda e: trace.append(e))
          judge_events=[x for x in trace if x.get('type')=='judge']
          metrics=[line for x in trace for line in str(x.get('stderr','')).splitlines() if 'MATHGRAPH_METRICS' in line]
          out={'id':rid,'solved':bool(result.get('solved')),'verdict':result.get('verdict'),'judge_calls':result.get('judge_calls'),'llm_calls':result.get('llm_calls'),'judge_statuses':[(x.get('response') or {}).get('status') for x in judge_events],'stderr_metrics':metrics}
          print('UNCCENSORED_0040',json.dumps(out,sort_keys=True),flush=True)
          assert out['solved'] and out['verdict']=='true' and 'accepted' in out['judge_statuses'], out
          print('UNCCENSORED_0040_PASS',flush=True)
          PY
