name: Stage2 798 causal gate
on:
  push:
    branches: [stage2-798-gate-20260831]
    paths: [.github/workflows/stage2-798-causal-gate.yml]
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/equational-theories-lean-stage2
          ref: fc59ebc329b6cf488ec775e2f59208437cd5f0a2
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build exact frozen candidate
        run: |
          python experiments/mathgraph/build_behavioural_future_specialist.py --base submissions/mathgraph/solver.py --output /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/solver.py'); s=p.read_text()
          a='frontier_seconds = min(12.0, max(0.5, timeout / 40.0))'; b='given_seconds = min(5.0, max(0.5, timeout / 80.0))'
          assert s.count(a)==1 and s.count(b)==1
          p.write_text(s.replace(a,'frontier_seconds = 12.0').replace(b,'given_seconds = 5.0'))
          PY
          cp /tmp/solver.py submissions/mathgraph/solver.py
          python -m py_compile submissions/mathgraph/solver.py
          rm -rf submissions/mathgraph/__pycache__
          test "$(find submissions/mathgraph -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Setup official judge
        env: {SKIP_DOCKER: '1'}
        run: bash scripts/setup.sh
      - run: python -m pip install 'openai>=1,<3'
      - name: Fetch six residual data
        run: |
          mkdir -p /tmp/sair_eval
          base='https://huggingface.co/datasets/SAIRfoundation/equational-theories-selected-problems/resolve/main/data'
          for x in evaluation_normal evaluation_hard evaluation_order5; do curl -fL --retry 3 "$base/$x.jsonl" -o "/tmp/sair_eval/$x.jsonl"; done
      - name: Official causal gate
        shell: bash
        run: |
          source .env.judge
          python experiments/mathgraph/run_796_six_residual_probe.py --normal /tmp/sair_eval/evaluation_normal.jsonl --hard /tmp/sair_eval/evaluation_hard.jsonl --order5 /tmp/sair_eval/evaluation_order5.jsonl --timeout 180 --output /tmp/six.json
          cat /tmp/six.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/six.json')); s=set(d['solved']); need={'evaluation_hard_0196','evaluation_normal_0036','evaluation_normal_0040','evaluation_normal_0158'}
          assert need <= s, (sorted(need-s),sorted(s))
          print('CAUSAL_SIX_798_GATE_PASS',sorted(s))
          PY
