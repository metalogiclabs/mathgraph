name: Trace the Ace V164 Endpoint Alignment Census

on:
  push:
    paths:
      - '.github/workflows/trace-the-ace-v164-endpoint-alignment.yml'
      - 'experiments/trace_the_ace_v164/**'
  workflow_dispatch:

jobs:
  v164:
    runs-on: [self-hosted, trace-ace-gpu]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify private inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s /workspace/trace_the_ace/train_features_TMQTWsB.csv
          test -s /workspace/trace_the_ace/train_labels_44ujmj2.csv
          test "$(find /workspace/trace_the_ace/transcripts_extracted -type f -name '*.csv' | wc -l)" -ge 22000
      - name: Install dependencies
        run: python3 -m pip install -q pandas numpy
      - name: Run V164 census
        run: |
          mkdir -p /workspace/trace-ace-results/v164
          python3 experiments/trace_the_ace_v164/run_v164_endpoint_alignment_census.py \
            --features /workspace/trace_the_ace/train_features_TMQTWsB.csv \
            --labels /workspace/trace_the_ace/train_labels_44ujmj2.csv \
            --transcripts /workspace/trace_the_ace/transcripts_extracted \
            --out /workspace/trace-ace-results/v164/v164_results.json
      - name: Show verdict
        if: always()
        run: cat /workspace/trace-ace-results/v164/v164_results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-the-ace-v164-results
          path: /workspace/trace-ace-results/v164/v164_results.json
          if-no-files-found: warn
