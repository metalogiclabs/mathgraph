name: WattBot eight pinned report source audit
on:
  push:
    branches: [wattbot-report-sources-v1]
    paths:
      - 'experiments/wattbot2026/report_sources_probe.py'
      - '.github/workflows/wattbot-report-sources.yml'
jobs:
  report-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle requests pymupdf
      - name: HTTPS SSRF and HTML fixture controls
        run: python experiments/wattbot2026/report_sources_probe.py --self-test
      - name: Inspect exactly eight official report sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/report_sources_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Report authority
        run: echo "No report bytes or texts are preserved, logged, or committed."
