name: Native moteus phase validation
on:
  push:
    branches:
      - exp/uzh-rotation-validation-20261021
    paths:
      - .github/workflows/moteus-phase-native-validation.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout moteus pinned feature commit
        run: |
          git clone --recurse-submodules https://github.com/metalogiclabs/moteus.git moteus
          cd moteus
          git checkout 2055adfcc542650dd1bfeffe7385e8bf6096194e
          git submodule update --init --recursive
          git rev-parse HEAD
      - name: Install system-Python wheel builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-build python3-importlib-metadata python3-numpy python3-scipy python3-usb python3-pyelftools mypy
          /usr/bin/python3 -m build --version
          /usr/bin/python3 -c 'import importlib_metadata, numpy, scipy, usb, elftools; print("Python host dependencies OK")'
          mypy --version
      - name: Host tests
        working-directory: moteus
        run: tools/bazel test --config=host //:host
      - name: Firmware target build
        if: success() || failure()
        working-directory: moteus
        run: tools/bazel build --config=target //:target
