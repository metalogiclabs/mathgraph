name: LeanEval Sturm probe

on:
  pull_request:
    paths:
      - 'experiments/lean_eval/sturm/**'
      - '.github/workflows/lean-eval-sturm-probe.yml'
  workflow_dispatch:

jobs:
  sturm-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate frozen Sturm workspace
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
          lake exe cache get
          lake build
          lake exe lean-eval start-problem sturm /tmp/sturm
          cd /tmp/sturm
          lake update
          lake build ChallengeDeps Challenge
      - name: Install probe
        run: |
          cat "$GITHUB_WORKSPACE/experiments/lean_eval/sturm/CrossingBase.lean" > /tmp/sturm/Submission.lean
          printf '\n\n' >> /tmp/sturm/Submission.lean
          tail -n +2 "$GITHUB_WORKSPACE/experiments/lean_eval/sturm/TailComposition.lean" >> /tmp/sturm/Submission.lean
          printf '\n\n' >> /tmp/sturm/Submission.lean
          tail -n +3 "$GITHUB_WORKSPACE/experiments/lean_eval/sturm/SigmaLocal.lean" >> /tmp/sturm/Submission.lean
          printf '\n\n' >> /tmp/sturm/Submission.lean
          tail -n +4 "$GITHUB_WORKSPACE/experiments/lean_eval/sturm/Termination.lean" >> /tmp/sturm/Submission.lean
          printf '\n\n' >> /tmp/sturm/Submission.lean
          tail -n +6 "$GITHUB_WORKSPACE/experiments/lean_eval/sturm/Final.lean" >> /tmp/sturm/Submission.lean
          printf '\n\n' >> /tmp/sturm/Submission.lean
          tail -n +7 "$GITHUB_WORKSPACE/experiments/lean_eval/sturm/Global.lean" >> /tmp/sturm/Submission.lean
      - name: Compile and expose residual
        run: |
          set +e
          cd /tmp/sturm
          lake build Submission 2>&1 | tee /tmp/sturm-probe.log
          code=${PIPESTATUS[0]}
          echo "sturm_probe_exit=$code"
          exit 0
      - name: Upload verified submission package
        uses: actions/upload-artifact@v4
        with:
          name: lean-eval-sturm-verified
          path: |
            /tmp/sturm/Submission.lean
            /tmp/sturm-probe.log
