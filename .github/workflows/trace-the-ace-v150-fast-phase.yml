name: Trace the Ace V150 Fast Phase Change Triage

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful V145 recovery run containing v146_bundle.npz
        required: true
        default: "32792841883"

permissions:
  contents: read
  actions: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download V145 bundle
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          repository: metalogiclabs/mathgraph
      - name: Verify bundle
        run: test -s v145-portable/v146_bundle.npz
      - name: Prepare CPU
        run: python -m pip install -q numpy pandas scipy scikit-learn
      - name: Run fast phase-change triage
        run: |
          mkdir -p v150-results
          python experiments/trace_the_ace_v150/run_v150_fast_phase_change.py \
            --bundle v145-portable/v146_bundle.npz \
            --out v150-results/v150_results.json
      - name: Publish result
        if: always()
        run: |
          if [ -s v150-results/v150_results.json ]; then
            cat v150-results/v150_results.json
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v150-fast-phase-${{ github.run_id }}
          path: v150-results/v150_results.json
          if-no-files-found: warn
          retention-days: 30
