name: Crystal Chess Staged Execution V36

on:
  push:
    branches:
      - crystal-chess-search-staged-execution-v36
    paths:
      - "experiments/crystal_chess_search_staged_execution_v36.py"
      - ".github/workflows/crystal-chess-search-staged-execution-v36.yml"
      - "experiments/crystal_chess_search_two_level_dominance_v35.py"
      - "experiments/crystal_chess_search_backed_arbitration_v33.py"
      - "experiments/crystal_chess_search_relative_continuation_v30.py"
      - "experiments/crystal_chess_search_continuation_v28.py"
      - "experiments/crystal_chess_search_sufficiency_v25.py"
      - "experiments/crystal_chess_search_confirmation_v26.py"
      - "experiments/crystal_chess_normal_exposure_v22.py"
  workflow_dispatch:

jobs:
  staged-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_search_staged_execution_v36.py

      - name: Download frozen V25 guard
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-search-sufficiency-v25
          path: /tmp/v25
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36362896141

      - name: Download V35 semantic authority
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-search-two-level-dominance-v35
          path: /tmp/v35
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36513282542

      - name: Verify frozen V35 result
        run: |
          set -euo pipefail
          test -s /tmp/v35/result.json
          test -s /tmp/v35/fresh_a.epd
          test -s /tmp/v35/fresh_b.epd
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v35/result.json'))
          assert p['schema']=='mathgraph.crystal-chess.search-two-level-dominance.v35'
          assert p['source']['selected_variant']=='nested_interval_dominance'
          assert sum(int(x['wrong']) for x in p['targets']) == 0
          assert sum(int(x['accepted']) for x in p['targets']) == 21
          print('V35_FROZEN_SEMANTIC_LINEAGE=PASS')
          PY

      - name: Build pinned Stockfish authority
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/stockfish-bench.txt 2>&1

      - name: Generate untouched seeds 20261013 and 20261014
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v36
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish/src/stockfish             --book artifacts/crystal-chess-v36/fresh_a.epd             --manifest artifacts/crystal-chess-v36/fresh_a_manifest.json             --openings 256 --plies 12 --depth 6 --multipv 4 --seed 20261013
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish/src/stockfish             --book artifacts/crystal-chess-v36/fresh_b.epd             --manifest artifacts/crystal-chess-v36/fresh_b_manifest.json             --openings 256 --plies 12 --depth 6 --multipv 4 --seed 20261014

      - name: Test staged in-search execution prospectively
        run: |
          set -euo pipefail
          python experiments/crystal_chess_search_staged_execution_v36.py             --stockfish /tmp/stockfish/src/stockfish             --guard /tmp/v25/search_sufficiency_guard_v25.json.gz             --v35-result /tmp/v35/result.json             --prior-epd /tmp/v35/fresh_a.epd             --prior-epd /tmp/v35/fresh_b.epd             --fresh-epd-a artifacts/crystal-chess-v36/fresh_a.epd             --fresh-manifest-a artifacts/crystal-chess-v36/fresh_a_manifest.json             --fresh-epd-b artifacts/crystal-chess-v36/fresh_b.epd             --fresh-manifest-b artifacts/crystal-chess-v36/fresh_b_manifest.json             --output artifacts/crystal-chess-v36/result.json             | tee artifacts/crystal-chess-v36/run.log
          grep -Eq "CRYSTAL_CHESS_SEARCH_STAGED_EXECUTION_V36=(WARRANTED_REPLICATED_NORMAL_SEARCH_STAGED_EXECUTION_GAIN|FRESH_NORMAL_SEARCH_STAGED_EXECUTION_RESIDUAL)" artifacts/crystal-chess-v36/run.log
          cp /tmp/stockfish-bench.txt artifacts/crystal-chess-v36/
          cp /tmp/v25/search_sufficiency_guard_v25.json.gz artifacts/crystal-chess-v36/

      - name: Upload V36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-search-staged-execution-v36
          path: artifacts/crystal-chess-v36/
          if-no-files-found: error
