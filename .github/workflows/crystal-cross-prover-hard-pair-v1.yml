name: Crystal Cross-Prover Hard Pair V1

on:
  push:
    branches:
      - crystal-cross-prover-hard-pair-v1
    paths:
      - '.github/workflows/crystal-cross-prover-hard-pair-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Write hard-pair consumers
        run: |
          set -euo pipefail
          ROOT=/tmp/crystal-hard-pair
          mkdir -p "$ROOT"
          cat > "$ROOT/Surface.lean" <<'EOF'
          import Mathlib

          namespace CrystalCrossProverHardPair

          theorem parabola_meets_unit_circle :
              ∃ x y : ℝ, x ^ 2 + y ^ 2 = 1 ∧ y = x ^ 2 := by
            let s : ℝ := Real.sqrt 5
            let y : ℝ := (s - 1) / 2
            have hs0 : 0 ≤ s := by
              dsimp [s]
              exact Real.sqrt_nonneg 5
            have hs2 : s ^ 2 = 5 := by
              dsimp [s]
              exact Real.sq_sqrt (by norm_num)
            have hs1 : 1 ≤ s := by
              nlinarith
            have hy0 : 0 ≤ y := by
              dsimp [y]
              linarith
            have hyq : y ^ 2 + y = 1 := by
              dsimp [y]
              nlinarith
            refine ⟨Real.sqrt y, y, ?_, ?_⟩
            · have hx2 : (Real.sqrt y) ^ 2 = y := Real.sq_sqrt hy0
              nlinarith
            · exact (Real.sq_sqrt hy0).symm

          theorem every_depressed_cubic_has_real_root (c : ℝ) :
              ∃ x : ℝ, x ^ 3 - 3 * x + c = 0 := by
            let R : ℝ := |c| + 4
            let f : ℝ → ℝ := fun x => x ^ 3 - 3 * x + c
            have hR4 : 4 ≤ R := by
              dsimp [R]
              linarith [abs_nonneg c]
            have hR0 : 0 ≤ R := by linarith
            have hR2 : 4 ≤ R ^ 2 := by
              nlinarith [sq_nonneg (R - 4)]
            have hquad : 0 ≤ R ^ 2 - 4 := by linarith
            have hmul : 0 ≤ R * (R ^ 2 - 4) := mul_nonneg hR0 hquad
            have hc_up : c ≤ R - 4 := by
              dsimp [R]
              simpa using le_abs_self c
            have hc_down : -c ≤ R - 4 := by
              dsimp [R]
              simpa using neg_le_abs c
            have hleft : f (-R) ≤ 0 := by
              dsimp [f]
              nlinarith
            have hright : 0 ≤ f R := by
              dsimp [f]
              nlinarith
            have horder : -R ≤ R := by linarith
            have hf : Continuous f := by
              fun_prop
            have hz : 0 ∈ f '' Set.Icc (-R) R :=
              intermediate_value_Icc horder hf.continuousOn ⟨hleft, hright⟩
            rcases hz with ⟨x, -, hx⟩
            refine ⟨x, ?_⟩
            simpa [f] using hx

          end CrystalCrossProverHardPair
          EOF
          echo 'leanprover/lean4:v4.35.0-rc3' > "$ROOT/lean-toolchain"
          cat > "$ROOT/lakefile.toml" <<'EOF'
          name = "crystal-cross-prover-hard-pair"
          version = "0.1.0"
          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "3cb72cfd416d1b5ec4b930d67648ef036a5df24f"
          EOF
      - name: Kernel-check hard pair
        run: |
          set -euo pipefail
          cd /tmp/crystal-hard-pair
          lake update
          lake exe cache get
          lake env lean Surface.lean

  pvs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates libgmp10
      - name: Pin PVS and replay hard pair
        run: |
          set -euo pipefail
          curl -fL -o /tmp/pvs.tgz https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  /tmp/pvs.tgz" | sha256sum -c -
          mkdir -p /tmp/pvs-dist
          tar -xzf /tmp/pvs.tgz -C /tmp/pvs-dist
          PVS_BIN="$(find /tmp/pvs-dist -maxdepth 3 -type f -name pvs -perm -u+x | head -1)"
          PVS_DIR="$(dirname "$PVS_BIN")"
          git init /tmp/nasalib
          git -C /tmp/nasalib remote add origin https://github.com/nasa/pvslib.git
          git -C /tmp/nasalib fetch --depth=1 origin e426f69dc2680ad575491f93c5a51739ec8b25fa
          git -C /tmp/nasalib checkout --detach FETCH_HEAD
          git init /tmp/pvs_cad
          git -C /tmp/pvs_cad remote add origin https://github.com/j-tanner-slagel/pvs_cad.git
          git -C /tmp/pvs_cad fetch --depth=1 origin 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          git -C /tmp/pvs_cad checkout --detach FETCH_HEAD
          ln -sfn /tmp/nasalib "$PVS_DIR/nasalib"
          cd /tmp/pvs_cad/cad
          export PVS_LIBRARY_PATH=/tmp/nasalib
          "$PVS_DIR/proveit" -q --timeout 180 @cad_demo.d_cubic:d_meet | tee /tmp/pvs_hard_pair.log
          grep -q "Grand Totals:" /tmp/pvs_hard_pair.log
          if grep -Ei "unfinished|untried|unchecked" /tmp/pvs_hard_pair.log; then exit 1; fi
