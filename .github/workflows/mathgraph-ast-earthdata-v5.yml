name: MathGraph AST v5 — frozen Earthdata source trial
on:
  push:
    branches:
      - experiment/ast-obligation-earthdata-v5-20261118
    paths:
      - .github/workflows/mathgraph-ast-earthdata-v5.yml
      - experiments/source_obligation_trial/**
permissions:
  contents: read
jobs:
  frozen-source-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/source_obligation_trial
            experiments/source_obligation_selection
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore checksum-bound frozen payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asttrial"
          base64 -d experiments/source_obligation_trial/earthdata_v5_payload.tar.gz.b64 > "$RUNNER_TEMP/asttrial/payload.tar.gz"
          echo "f71eef7593c714ad68b5cd852d0eeab208514c9b41da5fe4083ba3efc9b34db8  $RUNNER_TEMP/asttrial/payload.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/asttrial/payload.tar.gz" -C "$RUNNER_TEMP/asttrial"
          cd "$RUNNER_TEMP/asttrial"
          echo "7e38038012ce147372d30b435b9e8e5fb6833b5bc92d892bb6373523dfba1743  mathgraph_ast_obligations_v5.js" | sha256sum -c -
          echo "39b2a6ca210b37b73e34c28f30f5a80a6e81fb7210fb9de582c6c67f663156b3  run_source_pinned_trial.js" | sha256sum -c -
          node -e "const m=require('./earthdata_trial_outcome.json'); if(m.resolved_source_ref!=='12e6b220e96aa39187831f22f738a405eec75e7f'||m.realized_paths.length!==8) process.exit(1)"
          sha256sum mathgraph_ast_obligations_v5.js run_source_pinned_trial.js earthdata_trial_outcome.json > source_checksums.txt
          echo "FROZEN_PAYLOAD_AND_PINS_MATCH"
      - name: Execute frozen scanner and negative-control tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asttrial"
          npm install --no-save --no-audit --no-fund typescript@5.8.3
          node --test mathgraph_ast_obligations_v5.test.js mathgraph_ast_obligations_v5.adversarial.test.js run_source_pinned_trial.test.js | tee tests.tap
      - name: Read exact Earthdata files and verify every blob before scanning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asttrial"
          node -e 'const fs=require("node:fs");const {trial}=require("./run_source_pinned_trial.js");const m=JSON.parse(fs.readFileSync("earthdata_trial_outcome.json","utf8"));const f=async(u,o={})=>{const headers={...(o.headers||{})};if(u.startsWith("https://api.github.com/"))headers.Authorization="Bearer "+process.env.GITHUB_TOKEN;const r=await fetch(u,{...o,headers});if(!r.ok)console.error("SOURCE_FETCH_FAILURE",r.status,u,(await r.clone().text()).slice(0,350));return r};trial(m,f).then(r=>process.stdout.write(JSON.stringify(r,null,2))).catch(e=>{console.error(e.stack||e);process.exitCode=1})' > earthdata_trial_result.json
          node -e "const r=require('./earthdata_trial_result.json');if(r.source_integrity!=='PER_BLOB_CHECKED'||r.scanned_files!==8||r.selected_files!==8||r.errors.length!==0||r.qualified_verifier_runs!==0) process.exit(1);console.log(JSON.stringify({ref:r.ref,files:r.scanned_files,hotspots:r.hit_count,top3:r.top3.map(h=>({file:h.file,id:h.id,score:h.score,judgment:h.judgment})),baseline:r.baseline_size_top3},null,2));"
          echo "SOURCE_BLOB_INTEGRITY_AND_ADVISORY_BOUNDARY_GREEN"
      - name: Retrospective exact-source Open MCT sensitivity control
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asttrial"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "https://raw.githubusercontent.com/nasa/openmct/e09bfaf47856b2b7ae2ea74334800b26fd27a41e/src/api/telemetry/TelemetryAPI.js" -o openmct_TelemetryAPI.js
          test "$(git hash-object openmct_TelemetryAPI.js)" = "944e467fc38a3b27b3e4e77dc6c75be20e34054a"
          node -e 'const fs=require("node:fs"),{scan}=require("./mathgraph_ast_obligations_v5");const src=fs.readFileSync("openmct_TelemetryAPI.js","utf8");const x=scan(src,"src/api/telemetry/TelemetryAPI.js");fs.writeFileSync("openmct_source_positive_control.json",JSON.stringify({repo:"nasa/openmct",commit:"e09bfaf47856b2b7ae2ea74334800b26fd27a41e",blob_sha1:"944e467fc38a3b27b3e4e77dc6c75be20e34054a",retrospective:true,analyzer:x},null,2));console.log(JSON.stringify({methods:x.method_count,loss_return_methods:x.loss_return_methods.length,hotspots:x.hotspots.length,top3:x.hotspots.slice(0,3).map(z=>({id:z.id,score:z.score,judgment:z.judgment}))},null,2));'
          echo "OPENMCT_SOURCE_REPRO_VERIFIED_NOT_AUTO_WARRANTED"
      - name: Retrospective full nine-file Open MCT slice and causal source contrast
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asttrial"
          node -e 'const fs=require("fs");const names=["BatchingWebSocket.js","DefaultMetadataProvider.js","TelemetryAPI.js","TelemetryCollection.js","TelemetryMetadataManager.js","TelemetryRequestInterceptor.js","TelemetryValueFormatter.js","WebSocketWorker.js","constants.js"];fs.writeFileSync("openmct_9file_manifest.json",JSON.stringify({repo:"nasa/openmct",resolved_source_ref:"e09bfaf47856b2b7ae2ea74334800b26fd27a41e",realized_paths:names.map(x=>"src/api/telemetry/"+x)}));'
          node -e 'const fs=require("fs"),{trial}=require("./run_source_pinned_trial.js");const m=JSON.parse(fs.readFileSync("openmct_9file_manifest.json"));const f=(u,o={})=>fetch(u,{...o,headers:{...(o.headers||{}),...(u.startsWith("https://api.github.com/")?{Authorization:"Bearer "+process.env.GITHUB_TOKEN}:{})}});trial(m,f).then(r=>process.stdout.write(JSON.stringify(r,null,2))).catch(e=>{console.error(e.stack||e);process.exitCode=1})' > openmct_9file_result.json
          node -e 'const r=require("./openmct_9file_result.json");if(r.scanned_files!==9||r.errors.length||r.source_integrity!=="PER_BLOB_CHECKED")process.exit(1);console.log(JSON.stringify({scope:"Open MCT nine files, retrospective",checked:r.scanned_files,hits:r.hit_count,top3:r.top3.map(x=>({file:x.file,id:x.id,score:x.score,loss_class:x.loss_class,judgment:x.judgment})),size_baseline:r.baseline_size_top3},null,2))'
          node -e 'const fs=require("fs"),{scan}=require("./mathgraph_ast_obligations_v5");const src=fs.readFileSync("openmct_TelemetryAPI.js","utf8");const match="this.#hashOptions(options)",replacement="JSON.stringify(options, this.sanitizeForSerialization.bind(this))";if(src.split(match).length!==2)process.exit(2);const before=scan(src,"src/api/telemetry/TelemetryAPI.js"),after=scan(src.replace(match,replacement),"src/api/telemetry/TelemetryAPI.js");const result={source_ref:"e09bfaf47856b2b7ae2ea74334800b26fd27a41e",scope:"retrospective in-memory contrast only; not full repair",source_changed_in_repo:false,before:before.hotspots,after:after.hotspots};fs.writeFileSync("openmct_inmemory_repair_contrast.json",JSON.stringify(result,null,2));console.log(JSON.stringify({before_count:before.hotspots.length,after_count:after.hotspots.length,before:before.hotspots.map(h=>({id:h.id,score:h.score,loss_class:h.loss_class})),after:after.hotspots.map(h=>({id:h.id,score:h.score,loss_class:h.loss_class}))},null,2))'
          echo "RETROSPECTIVE_FULL_SLICE_AND_INMEMORY_CONTRAST_COMPLETE"
      - name: Prospective exact-source Cesium v5 trial, no scanner changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asttrial"
          cp "$GITHUB_WORKSPACE/experiments/source_obligation_selection/cesium_20261118_frozen.json" cesium_frozen_manifest.json
          node -e 'const fs=require("fs"),{trial}=require("./run_source_pinned_trial.js");const m=require("./cesium_frozen_manifest.json");const f=(u,o={})=>fetch(u,{...o,headers:{...(o.headers||{}),...(u.startsWith("https://api.github.com/")?{Authorization:"Bearer "+process.env.GITHUB_TOKEN}:{})}});trial(m,f).then(r=>process.stdout.write(JSON.stringify(r,null,2))).catch(e=>{console.error(e.stack||e);process.exitCode=1})' > cesium_v5_prospective_result.json
          node -e 'const r=require("./cesium_v5_prospective_result.json");if(r.source_integrity!=="PER_BLOB_CHECKED"||r.scanned_files!==12||r.selected_files!==12||r.errors.length!==0||r.qualified_verifier_runs!==0)process.exit(1);console.log(JSON.stringify({repo:r.repo,ref:r.ref,checked:r.scanned_files,candidates:r.hit_count,top3:r.top3.map(x=>({file:x.file,id:x.id,score:x.score,loss_class:x.loss_class,judgment:x.judgment})),size_baseline:r.baseline_size_top3},null,2))'
          echo "CESIUM_FROZEN_V5_SOURCE_VERIFIED_ADVISORY_ONLY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthdata-ast-v5-bounded-result
          path: |
            ${{ runner.temp }}/asttrial/earthdata_trial_result.json
            ${{ runner.temp }}/asttrial/tests.tap
            ${{ runner.temp }}/asttrial/source_checksums.txt
            ${{ runner.temp }}/asttrial/openmct_source_positive_control.json
            ${{ runner.temp }}/asttrial/openmct_9file_result.json
            ${{ runner.temp }}/asttrial/openmct_inmemory_repair_contrast.json
            ${{ runner.temp }}/asttrial/cesium_v5_prospective_result.json
            ${{ runner.temp }}/asttrial/cesium_frozen_manifest.json
          if-no-files-found: warn
