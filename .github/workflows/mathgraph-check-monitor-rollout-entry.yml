name: MathGraph Check — controlled rollout entry
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Approved source branch (fixed)
        required: true
        type: choice
        options:
          - mathgraph-check-live-app-first-party-v1
permissions:
  contents: read
  actions: write
jobs:
  dispatch-gate:
    if: ${{ vars.MATHGRAPH_CF_MONITOR_ROLLOUT_APPROVED == 'true' && inputs.source_ref == 'mathgraph-check-live-app-first-party-v1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check exact approved source branch
        uses: actions/checkout@v4
        with:
          ref: mathgraph-check-live-app-first-party-v1
          persist-credentials: false
      - name: Dispatch protected deployment workflow on approved branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -f integrations/mathgraph-check-github/cloudflare/monitor-transition-v1.mjs
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/mathgraph-check-controlled-rollout.yml/dispatches \
            -f ref=mathgraph-check-live-app-first-party-v1
          echo "Protected rollout dispatched against approved branch. Deployment still requires the environment gate."
