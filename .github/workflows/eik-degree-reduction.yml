name: EIK certified polynomial degree reduction
on:
  push:
    branches: [research/eik-rrr-optimization-20261125]
    paths: ['.github/workflows/eik-degree-reduction.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [control, tl15, tl31, ta15, ta31, both15, both31, adaptive-tl, adaptive-ta, adaptive-both]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin inputs and reproduce locally tested source
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          mkdir evidence
          curl --fail --location --retry 3 https://conjectures.io/v1/competitions/exact-integer-kernels/submissions/48/source -o original.c
          python ../research/eik/variants.py original.c baseline.c
          case "$VARIANT" in
            control) cp baseline.c candidate.c ;;
            adaptive-*) python ../research/eik/adaptive.py baseline.c candidate.c "${VARIANT#adaptive-}" | tee evidence/envelope.json ;;
            *) python ../research/eik/degree.py baseline.c candidate.c "$VARIANT" | tee evidence/envelope.json ;;
          esac
          python - <<'PY'
          import os,hashlib,pathlib
          pins={
          'control':'3d9777afffd5aba80d52bf4926243aa3dbe1c1fa78b12f63ed597d634895e3b4',
          'tl15':'de04d27cac96dfb72e98e1de0167791b98055f96c1ce4a950acffd2705f46ec1',
          'tl31':'3387f5c7c144891c1588238e5e01bce2e262f98eddcd023a30cb7a7219fd729b',
          'ta15':'2b4efe6be85f2a1b6940578a5efbbe0cba14766de8e79d8219171d7a40079217',
          'ta31':'7478994699204244c4b799f0f833b4338295f3fc40fd55f51832514a50c3c699',
          'both15':'7a59f775d93e4a37f745e88fb997b0d3d132894a853751952a7dbd706e40434d',
          'both31':'f32769c47320cd837ddd6985b0949b2b9e5c8500e5bee5276b755d403c5e7c86',
          'adaptive-tl':'42491e53eb23c5aee642efb6bbde14f6bb4854b24d44111ab92327e6dca2faa9',
          'adaptive-ta':'676095fca1a199998c9fc7067fce223762c3892e49720dbc63f289d307ab8a6b',
          'adaptive-both':'8c6fb01dc70cc4328862acdf78d47f77eb6897e1eac95248b892fe6b2f4408e2'}
          actual=hashlib.sha256(pathlib.Path('candidate.c').read_bytes()).hexdigest()
          assert actual==pins[os.environ['VARIANT']],(actual,pins[os.environ['VARIANT']])
          PY
          cp candidate.c evidence/
          sha256sum original.c candidate.c > evidence/source.sha256
          git rev-parse HEAD > evidence/evaluator.sha
      - name: Install pinned official evaluator
        working-directory: kit
        run: |
          pip install --require-hashes -r requirements.txt
          python -m eik setup
      - name: Official static gate, score and independent outputs on all targets
        working-directory: kit
        continue-on-error: true
        run: |
          set -o pipefail
          python -m eik check candidate.c 2>&1 | tee evidence/check.log
          python -m eik measure candidate.c --seed 20261125 --out evidence/measure.json
          cat evidence/measure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-degree-${{ matrix.variant }}
          path: kit/evidence/
  combine:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      qualify: ${{ steps.select.outputs.qualify }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: eik-degree-*
          path: runs
      - name: Reconcile measurements and select independent improvements
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          mkdir evidence
          curl --fail --location --retry 3 https://conjectures.io/v1/competitions/exact-integer-kernels/submissions/48/source -o original.c
          pip install --require-hashes -r requirements.txt
          python -m eik setup
          python - <<'PY'
          import sys,json,pathlib,hashlib
          sys.path.insert(0,'../research/eik')
          VARIANTS=['tl15','tl31','ta15','ta31','both15','both31','adaptive-tl','adaptive-ta','adaptive-both']
          root=pathlib.Path('../runs')
          reports={}; failures={}
          for v in ['control']+VARIANTS:
              f=root/('eik-degree-'+v)/'measure.json'
              if not f.exists():
                  failures[v]='no completed measurement';continue
              r=json.loads(f.read_text())
              if r.get('verdict')!='passed':
                  failures[v]=r.get('reasons',[]);continue
              p=f.parent/'candidate.c'
              assert hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256']
              reports[v]=r
          c=reports['control']
          for v,r in reports.items():
              for key in ('seed','inputs_sha256'):assert r[key]==c[key],(v,key)
              assert r['fingerprint']['measurement']==c['fingerprint']['measurement'],v
          score=lambda r:r['scores']['rv32im']['S']
          single=min(reports,key=lambda v:score(reports[v]))
          winners=[v for v in VARIANTS if v in reports and score(reports[v])<score(c)]
          report={'control':score(c),'best_single':single,'scores':{v:score(r) for v,r in reports.items()},'rejected_or_missing':failures,'independent_improvements':winners}
          print(json.dumps(report,indent=2))
          pathlib.Path('evidence/selection.json').write_text(json.dumps(report,indent=2))
          # All six fixed and three adaptive cases include their own joint trials.
          # Do not apply overlapping transformations to the same coefficient rows.
          pathlib.Path('control.c').write_bytes((root/'eik-degree-control'/'candidate.c').read_bytes())
          pathlib.Path('best-single.c').write_bytes((root/('eik-degree-'+single)/'candidate.c').read_bytes())
          pathlib.Path('evidence/best-single.json').write_text(json.dumps(reports[single],indent=2))
          PY
      - name: Select best discovery result, test held-out seed, gate qualification
        id: select
        working-directory: kit
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('evidence')
          a=json.loads((p/'best-single.json').read_text())
          (p/'candidate.c').write_bytes(pathlib.Path('best-single.c').read_bytes())
          (p/'discovery.json').write_text(json.dumps(a,indent=2))
          PY
          python -m eik measure evidence/candidate.c --seed 20261127 --out evidence/heldout.json
          python -m eik measure control.c --seed 20261127 --out evidence/control-heldout.json
          curl --fail --location --max-time 20 https://conjectures.io/v1/competitions/exact-integer-kernels/boards -o evidence/live-boards.json || true
          python - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path('evidence')
          a=json.loads((p/'discovery.json').read_text());b=json.loads((p/'heldout.json').read_text())
          assert a['sha256']==b['sha256']==hashlib.sha256((p/'candidate.c').read_bytes()).hexdigest()
          threshold=28.2*0.97
          ctrl=json.loads((p/'control-heldout.json').read_text())
          assert b['inputs_sha256']==ctrl['inputs_sha256']
          assert b['fingerprint']['measurement']==ctrl['fingerprint']['measurement']
          qualifies=b['verdict']=='passed' and b['scores']['rv32im']['S']<ctrl['scores']['rv32im']['S'] and max(a['scores']['rv32im']['S'],b['scores']['rv32im']['S'])<=threshold
          print('heldout control',ctrl['scores']['rv32im']['S'])
          print('discovery',a['scores']['rv32im']['S'],'heldout',b['scores']['rv32im']['S'],'qualification trigger',qualifies)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('qualify='+str(qualifies).lower()+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-degree-selected
          path: kit/evidence/
  qualify:
    needs: combine
    if: needs.combine.outputs.qualify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        function: [sigmoid, tanh, exp]
        target: [host, rv32im, thumbv6m, thumbv7em]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: eik-degree-selected
          path: selected
      - name: Qualify every binary32 input without submission
        env:
          FN: ${{ matrix.function }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          mkdir evidence
          cp ../selected/candidate.c .
          pip install --require-hashes -r requirements.txt
          python -m eik setup
          if [ "$TARGET" = host ]; then
            python -m eik fullcheck candidate.c --function "$FN" --out evidence/report.json
          else
            sudo apt-get update
            sudo apt-get install -y qemu-user
            python -m eik targetcheck candidate.c --function "$FN" --target "$TARGET" --out evidence/report.json
          fi
          cat evidence/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-degree-full-${{ matrix.function }}-${{ matrix.target }}
          path: kit/evidence/
  reconcile-full:
    needs: qualify
    if: needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: eik-degree-full-*
          path: full
      - run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          pip install --require-hashes -r requirements.txt
          python -m eik merge ../full/*/report.json --require-targets rv32im,thumbv6m,thumbv7em --out final.json
          cat final.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-degree-final-qualification
          path: kit/final.json
