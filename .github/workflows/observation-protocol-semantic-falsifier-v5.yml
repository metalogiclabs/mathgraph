name: Observation protocol semantic falsifier V5
on:
  push:
    branches: [research/protocol-semantic-falsifier-v5-20261022]
  workflow_dispatch:
jobs:
  semantic-falsifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python research/generic_observation_v3/semantic_falsifier_v5.py
