name: Crystal Programme Controller Shared Calibration V1

on:
  push:
    branches: [crystal-program-controller-calibration-v1]
    paths:
      - 'experiments/crystal_program_controller_v1/shared_calibration_v1.json'
      - 'scripts/run_crystal_shared_calibration.py'
      - '.github/workflows/crystal-program-controller-calibration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebind calibration to exact source authorities
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          from pathlib import Path

          cfg=json.loads(Path(
              "experiments/crystal_program_controller_v1/shared_calibration_v1.json"
          ).read_text())

          def api(url):
              req=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept":"application/vnd.github+json",
                      "User-Agent":"crystal-program-controller-calibration-v1",
                  },
              )
              return json.load(urllib.request.urlopen(req,timeout=60))

          repos={"nucleus":"heathsanchez/test","cross-prover":"metalogiclabs/mathgraph"}
          for row in cfg["samples"]:
              repo=repos[row["campaign"]]
              run_id=row["source_run"]
              run=api(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
              assert run["conclusion"]=="success",(repo,run_id,run["conclusion"])
              assert run["head_sha"]==row["source_head"],(repo,run_id,run["head_sha"])

              jobs=api(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
              assert len(jobs)==1,(repo,run_id,len(jobs))
              job=jobs[0]
              assert job["conclusion"]=="success",job
              start=dt.datetime.fromisoformat(job["started_at"].replace("Z","+00:00"))
              end=dt.datetime.fromisoformat(job["completed_at"].replace("Z","+00:00"))
              wall=int((end-start).total_seconds())
              assert wall==row["job_wall_seconds"],(repo,run_id,wall,row["job_wall_seconds"])

              artifacts=api(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts")["artifacts"]
              art=next(a for a in artifacts if a["id"]==row["source_artifact"])
              assert art["digest"]==row["source_artifact_digest"],(
                  repo,run_id,art["digest"],row["source_artifact_digest"]
              )
              print("CALIBRATION_SOURCE_OK",row["campaign"],run_id,wall,art["id"])
          PY

      - name: Compute fail-closed calibrated programme decision
        run: python scripts/run_crystal_shared_calibration.py

      - name: Assert calibrated HOLD
        run: |
          python - <<'PY'
          import json
          p=json.load(open("artifacts/crystal_program_controller_v1/shared_calibration_decision.json"))
          assert p["status"]=="HOLD_ZERO_CALIBRATED_CONTRACTION",p
          assert p["sample_count"]==2,p
          assert p["positive_sample_count"]==0,p
          assert p["selected_campaign_id"] is None,p
          assert p["selected_candidate_id"] is None,p
          print("CRYSTAL_SHARED_CALIBRATION=PASS HOLD_ZERO_CALIBRATED_CONTRACTION")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-program-controller-shared-calibration-v1
          path: |
            experiments/crystal_program_controller_v1/shared_calibration_v1.json
            artifacts/crystal_program_controller_v1/shared_calibration_decision.json
          if-no-files-found: error
