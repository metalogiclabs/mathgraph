name: Trace the Ace V146 Fast Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V145 recovery run containing portable artifact"
        required: true
        default: "32792841883"
        type: string
      limit:
        description: "Rows for fast diagnostic"
        required: true
        default: "2500"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  fast:
    name: Fast residual signal diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download portable V145 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify bundle
        shell: bash
        run: test -s v145-portable/v146_bundle.npz
      - name: Prepare CPU environment
        shell: bash
        run: python -m pip install -q numpy pandas scipy scikit-learn
      - name: Run fast diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v146-fast-results
          python experiments/trace_the_ace_v146/run_v146_fast_diagnostic.py \
            --bundle v145-portable/v146_bundle.npz \
            --limit "${{ inputs.limit }}" \
            --out v146-fast-results/v146_fast_results.json
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          R=v146-fast-results/v146_fast_results.json
          if [ -s "$R" ]; then
            python3 - "$R" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print("# V146 Fast Diagnostic")
          print("\nTriage only — not submission evidence.\n")
          print("| Split | Main improvement | Shuffled improvement | Main - shuffled | Fold wins |")
          print("|---|---:|---:|---:|---:|")
          for k in ("session","objective"):
              x=r[k]; s=r["shuffled"][k]
              print(f"| {k} | {x['improvement']:.6f} | {s['improvement']:.6f} | {r['signal_over_shuffle'][k]:.6f} | {x['fold_wins']}/5 |")
          PY
          fi
      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v146-fast-${{ github.run_id }}
          path: v146-fast-results/v146_fast_results.json
          if-no-files-found: warn
          retention-days: 30
