name: V78 Prospective Autonomous Horizon Controller

on:
  push:
    branches: [autonomous-horizon-controller-v78]
    paths:
      - 'experiments/autonomous_horizon_controller_v78/**'
      - '.github/workflows/autonomous-horizon-controller-v78.yml'
  workflow_dispatch:

jobs:
  prospective-autonomous-horizon-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Static check before fresh generation
        run: python3 -m py_compile experiments/autonomous_horizon_controller_v78/run.py

      - name: Install inherited frozen backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1

      - name: Fetch opened training universe only
        run: |
          set -euo pipefail
          mkdir -p external-v78
          curl -fsSL --retry 3 https://raw.githubusercontent.com/heathsanchez/equational-theories-lean-stage2/374eb40ba5389915deb174fbc12cc92346214dd1/examples/problems/eq_size5.txt -o external-v78/eq_size5.txt
          test "$(git hash-object external-v78/eq_size5.txt)" = "0deca9c8860fb60f2ae161ab7e3f458ec3b178ca"
          echo "V78_RULE=freeze_controller_before_any_eight_op_source_generation"

      - name: Run V78 autonomous controller
        run: |
          PYTHONPATH=. python3 experiments/autonomous_horizon_controller_v78/run.py \
            --opened-laws external-v78/eq_size5.txt \
            --out external-v78/results

      - name: Preserve V78 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v78-prospective-autonomous-horizon-controller
          path: external-v78/results/
