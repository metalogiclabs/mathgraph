name: SAFE Euler213 native causal audit
on:
  push:
    branches: [experiment/safe-euler213-20261124]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sedaro/safe
          ref: f9ed45abc53b28afb7e287e605173275f7fe92c9
          path: upstream-safe
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Pinned toolchain and independent math libraries
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - name: Original, candidate and withdrawal with independent oracles
        run: python research/safe-euler213-20261124/audit.py upstream-safe receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-euler213-native-causal-receipts
          path: receipts/
