name: Source pressure protected energy future V18
on:
  push:
    branches: [navier-stokes-pressure-legacy-v17]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/SourcePressureFuture.lean'
      - '.github/workflows/navier-stokes-source-pressure-future-v18.yml'
  pull_request:
    branches: [navier-stokes-semantic-bridge-v1]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/SourcePressureFuture.lean'
      - '.github/workflows/navier-stokes-source-pressure-future-v18.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-protected-future-v18-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-envelope-downstream-consequence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze original V10 source and candidate
        run: |
          set -euo pipefail
          mkdir -p .source-future-env pressure-v18-evidence
          git rev-parse HEAD | tee pressure-v18-evidence/head-sha.txt
          ROOT=experiments/navier_stokes_semantic_bridge_v1
          test "$(git hash-object "$ROOT/PressureEnvelopeObstruction.lean")" = '9c7d5352fbf5cecd45042e468a33f9a66f508488'
          cp "$ROOT/PressureEnvelopeObstruction.lean" .source-future-env/PressureEnvelopeObstruction.lean
          cp "$ROOT/SourcePressureFuture.lean" .source-future-env/SourcePressureFuture.lean
          cp .source-future-env/SourcePressureFuture.lean pressure-v18-evidence/SourcePressureFuture.lean
          sha256sum .source-future-env/{PressureEnvelopeObstruction,SourcePressureFuture}.lean > pressure-v18-evidence/sources.sha256
          printf '%s\n' 'leanprover/lean4:v4.34.0-rc2' > .source-future-env/lean-toolchain
          cat > .source-future-env/lakefile.toml <<'EOF'
          name = "mathgraph_protected_pressure_future_v18"
          version = "0.1.0"
          [[require]]
          name = "NavierStokesAndEuler"
          git = "https://github.com/openai/NavierStokesAndEuler.git"
          rev = "f9e8bc5b38b6e212696e8a30e3e91517af887bbd"
          [[lean_lib]]
          name = "PressureEnvelopeObstruction"
          [[lean_lib]]
          name = "SourcePressureFuture"
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            .source-future-env/.lake
            .source-future-env/lake-manifest.json
          key: legacy-pressure-v17-lean434rc2-upstream-f9e8bc5
      - name: Install original Lean toolchain
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh' \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify actual original OpenAI pressure and Young lemmas
        working-directory: .source-future-env
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/NavierStokesAndEuler rev-parse HEAD)" = 'f9e8bc5b38b6e212696e8a30e3e91517af887bbd'
          grep -q 'theorem exists_scaled_shifted_rpow_absorption' .lake/packages/NavierStokesAndEuler/NavierStokes/R3/ComparisonYoung.lean
          grep -q 'theorem absorb_sobolev_errors' .lake/packages/NavierStokesAndEuler/NavierStokes/R3EnergyAbsorption.lean
          cp lake-manifest.json ../pressure-v18-evidence/lake-manifest.json
          lake env lean --version | tee ../pressure-v18-evidence/lean-version.txt
          lake exe cache get
      - name: Kernel-check source envelope downstream absorption and energy-rate certificate
        working-directory: .source-future-env
        run: |
          set -euo pipefail
          lake build SourcePressureFuture 2>&1 | tee ../pressure-v18-evidence/build.log
          lake env lean -DwarningAsError=true SourcePressureFuture.lean 2>&1 | tee ../pressure-v18-evidence/axioms.log
      - name: Audit exact future scope, named theorems, and no source proof promotion
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('pressure-v18-evidence')
          assert (root/'head-sha.txt').read_text().strip()==os.environ['EXPECTED_HEAD']
          log=(root/'axioms.log').read_text()
          expected={'MathGraph.SourcePressureFuture.'+x for x in (
              'source_envelope_le_shifted',
              'source_envelope_le_gradient_shift',
              'exists_source_pressure_envelope_absorption',
              'exists_source_pressure_energy_rate'
          )}
          rows=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          rows += [(n,'') for n in re.findall(r"'([^']+)' does not depend on any axioms",log)]
          seen={}
          for n,a in rows:
            assert n not in seen,n
            used={s.strip() for s in a.split(',') if s.strip()}
            assert used <= {'propext','Classical.choice','Quot.sound'},(n,sorted(used))
            seen[n]=sorted(used)
          assert set(seen)==expected,('theorem audit mismatch',sorted(expected.symmetric_difference(set(seen))))
          record={
            'schema':'mathgraph.source-pressure-observational-future-v18',
            'head_sha':os.environ['EXPECTED_HEAD'],
            'upstream_sha':'f9e8bc5b38b6e212696e8a30e3e91517af887bbd',
            'scope':'CONDITIONAL_SCALAR_SOURCE_ENVELOPE_AND_ENERGY_RATE',
            'source_envelope':'R^{-1}*(B+1)*(B^(.5)+R^{-.75}*B^(.75))',
            'source_pressure_bound_proved':False,
            'source_envelope_assumed_in_downstream_rate':True,
            'independent_NL_contract_approved':False,
            'source_implication_to_subquadratic_energy_rate':True,
            'source_and_formal_envelopes_numerically_equivalent':False,
            'physical_pressure_pairing_identity_newly_proved':False,
            'global_Navier_Stokes_conclusion_proved':False,
            'production_admission_changed':False,
            'axiom_audit':seen,
            'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          }
          (root/'result.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          print(json.dumps(record,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-pressure-future-v18
          path: pressure-v18-evidence/
          if-no-files-found: error
