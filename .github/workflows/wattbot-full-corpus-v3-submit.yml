name: WattBot V3 duplicate supersession guard
on:
  push:
    branches: [wattbot-full-corpus-public-v3]
    paths:
      - '.github/workflows/wattbot-full-corpus-v3-submit.yml'
permissions:
  contents: read
concurrency:
  group: wattbot-v3-full-corpus-single-submission
  cancel-in-progress: true
jobs:
  no-duplicate-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve causal lineage and avoid duplicate Kaggle uploads
        run: |
          echo "SUPERSEDED: earlier runs 37970373027 and 37970501410 on this branch."
          echo "Equivalent independently authored V3 source-window upload is already underway:"
          echo "https://github.com/metalogiclabs/mathgraph/actions/runs/37970521510"
          echo "Do not submit this duplicate branch. Do not spend any model API budget."
          echo "External Kaggle score and ranking remain authoritative and unknown for V3."
