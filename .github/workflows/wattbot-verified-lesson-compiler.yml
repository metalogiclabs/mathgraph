name: WattBot verified development-lesson capability transfer
on:
  push:
    branches: [wattbot-verified-lesson-compiler-v1]
    paths:
      - '.github/workflows/wattbot-verified-lesson-compiler.yml'
      - 'experiments/wattbot2026/verified_lesson.py'
      - 'experiments/wattbot2026/derivation_router_probe.py'
jobs:
  typed-exemplar-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scorer and PDF dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Verify holdout exclusion and two-example bounded capability memory
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/verified_lesson.py
          python experiments/wattbot2026/derivation_router_probe.py --self-test
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Score developmental lessons using SAME six source pages and original replies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/derivation_router_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Scope and cost certification
        run: |
          echo "Only 182 development TRAIN worked examples may enter second prompt."
          echo "Target 63 TRAIN holdout examples excluded; no TEST labels or manual answer mapping."
          echo "Second-pass source evidence unchanged: six exact-window pinned PDF passages."
          echo "Additional conservative model spending bounded by USD 0.16."
          echo "No Kaggle submission; scientific entailment stays CANDIDATE."
