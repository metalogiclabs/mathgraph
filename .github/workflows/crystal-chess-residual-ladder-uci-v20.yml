name: Crystal Chess Residual Ladder UCI V20

on:
  push:
    branches:
      - crystal-chess-residual-ladder-uci-v20
    paths:
      - "experiments/crystal_chess_stockfish_ladder_uci_v20.py"
      - "experiments/crystal_chess_stockfish_ladder_benchmark_v20.py"
      - ".github/workflows/crystal-chess-residual-ladder-uci-v20.yml"
  workflow_dispatch:

jobs:
  residual-ladder-system:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2" "pyinstaller>=6,<7"

      - name: Requalify Crystal and compile V20
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_crystal.py
          python -m py_compile experiments/crystal_chess_stockfish_ladder_uci_v20.py
          python -m py_compile experiments/crystal_chess_stockfish_ladder_benchmark_v20.py

      - name: Download frozen V17 role map
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-stockfish-hybrid-uci-v17
          path: /tmp/v17
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36360365229

      - name: Download frozen V19 ladder evidence
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-residual-ladder-transfer-v19
          path: /tmp/v19
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36361073335

      - name: Verify frozen runtime authorities
        run: |
          set -euo pipefail
          roles=/tmp/v17/crystal_chess_roles_v17.jsonl.gz
          ladder=/tmp/v19/crystal_chess_residual_guard_ladder_v16.jsonl.gz
          test -s "$roles"
          test -s "$ladder"
          test "$(gzip -dc "$roles" | sha256sum | awk '{print $1}')" = "028353c82c3fefdd7d9e36907916b9a1aec7c1c13da9a4b8710b4deef8298b99"
          test "$(gzip -dc "$ladder" | sha256sum | awk '{print $1}')" = "7c19923878b0fe4502871cc025582137471f93227c76dff537c1870da3401285"

      - name: Acquire exact Syzygy verifier authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          w345="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          w6="https://tablebase.lichess.ovh/tables/standard/6-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw KPPvK.rtbw KPPPvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$w345/$f"
            test -s "/tmp/syzygy/$f"
          done
          curl --fail --location --retry 5 --retry-delay 2 -o /tmp/syzygy/KPPPPvK.rtbw "$w6/KPPPPvK.rtbw"
          test -s /tmp/syzygy/KPPPPvK.rtbw
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Build pinned Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Disservin/fastchess.git /tmp/fastchess
          git -C /tmp/fastchess checkout 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          make -C /tmp/fastchess -j2

      - name: Run residual-ladder real UCI systems benchmark
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v20
          python experiments/crystal_chess_stockfish_ladder_benchmark_v20.py \
            --stockfish /tmp/stockfish/src/stockfish \
            --hybrid-script experiments/crystal_chess_stockfish_ladder_uci_v20.py \
            --guard /tmp/v19/crystal_chess_residual_guard_ladder_v16.jsonl.gz \
            --roles /tmp/v17/crystal_chess_roles_v17.jsonl.gz \
            --tablebase-dir /tmp/syzygy \
            --kppvk 400 \
            --kpppvk 400 \
            --kppppvk 400 \
            --nodes 5000 \
            --seed 20260928 \
            --output artifacts/crystal-chess-v20/crystal_chess_stockfish_ladder_benchmark_v20.json \
            | tee artifacts/crystal-chess-v20/run.log
          grep -q "CRYSTAL_CHESS_STOCKFISH_LADDER_UCI_V20=WARRANTED_PINNED_STOCKFISH_FAIL_CLOSED_UCI_SYSTEM_GAIN" artifacts/crystal-chess-v20/run.log

      - name: Package self-contained V20 UCI engine
        run: |
          set -euo pipefail
          pyinstaller --onefile --clean --name crystal-chess-v20 experiments/crystal_chess_stockfish_ladder_uci_v20.py
          cp dist/crystal-chess-v20 artifacts/crystal-chess-v20/
          cp /tmp/v19/crystal_chess_residual_guard_ladder_v16.jsonl.gz artifacts/crystal-chess-v20/
          cp /tmp/v17/crystal_chess_roles_v17.jsonl.gz artifacts/crystal-chess-v20/
          cat > artifacts/crystal-chess-v20/run-crystal-chess-v20 <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "$0")" && pwd)"
          : "${STOCKFISH:?Set STOCKFISH to the fallback Stockfish executable}"
          exec "$here/crystal-chess-v20" \
            --fallback "$STOCKFISH" \
            --guard "$here/crystal_chess_residual_guard_ladder_v16.jsonl.gz" \
            --roles "$here/crystal_chess_roles_v17.jsonl.gz"
          EOF
          chmod +x artifacts/crystal-chess-v20/run-crystal-chess-v20

      - name: Fastchess UCI compliance for V20
        env:
          STOCKFISH: /tmp/stockfish/src/stockfish
        run: |
          set -euo pipefail
          /tmp/fastchess/fastchess --compliance artifacts/crystal-chess-v20/run-crystal-chess-v20 \
            | tee artifacts/crystal-chess-v20/uci-compliance.log

      - name: Record exact authorities
        run: |
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > artifacts/crystal-chess-v20/STOCKFISH_PIN.txt
          printf '%s\n' "Disservin/fastchess@60d7a7a26c6b0582a15c112fb29a1829bef2adb3" > artifacts/crystal-chess-v20/FASTCHESS_PIN.txt
          printf '%s\n' "residual-ladder@7c19923878b0fe4502871cc025582137471f93227c76dff537c1870da3401285" > artifacts/crystal-chess-v20/LADDER_PIN.txt
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v20/

      - name: Upload V20 evidence and runnable engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-residual-ladder-uci-v20
          path: artifacts/crystal-chess-v20/
          if-no-files-found: error
