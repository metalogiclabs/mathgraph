name: LeanEval capability ladder

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-capability-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavioural-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - annals_absolute_profinite_rigidity
          - annals_algebraic_integers
          - annals_bose_gases
          - annals_bounded_multiplicative_functions
          - annals_chowla_and_twin_prime_over_fq_t
          - annals_conjecture_of_marton
          - annals_dirichlet_weyl_bound
          - annals_duffin_schaeffer_conjecture
          - annals_enumerating_number_fields
          - annals_equiangular_lines_fixed_angle
          - annals_erdos_faber_lovasz_conjecture
          - annals_erdos_supersingular_primes
          - annals_flat_littlewood_poly
          - annals_fractional_expectation_thresholds
          - annals_good_lt_codes
          - annals_improved_bounds_sunflower_lemma
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Behavioural future composition
        id: quotient
        working-directory: /tmp/${{ matrix.target }}
        run: |
          set +e
          cp Challenge.lean /tmp/original.lean
          : > /tmp/behaviour.tsv
          solved=0
          # Representative continuations chosen to expose future-obligation behaviour,
          # not merely repeat the first cold portfolio.
          for tactic in simp_aesop simp_grind aesop_all grind_all norm_linarith field_ring positivity exact_assumption; do
            cp /tmp/original.lean Submission.lean
            TACTIC="$tactic" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          bodies={
            'simp_aesop':'simp_all <;> aesop',
            'simp_grind':'simp_all <;> grind',
            'aesop_all':'aesop (add safe (by intros; assumption))',
            'grind_all':'grind',
            'norm_linarith':'norm_num at * <;> try linarith <;> try nlinarith',
            'field_ring':'try field_simp <;> try ring <;> try ring_nf <;> aesop',
            'positivity':'try positivity <;> try norm_num <;> aesop',
            'exact_assumption':'first | assumption | exact Classical.choice (show Nonempty _ from inferInstance) | aesop'
          }
          b=bodies[os.environ['TACTIC']]
          s,n=re.subn(r'by\s*\n\s*sorry\b','by\n  '+b,s)
          open('Submission.lean','w').write(s)
          print('holes_replaced',n)
          PY
            lake build Submission > "/tmp/${TARGET}-${tactic}.log" 2>&1
            b=$?
            sig=$(python3 - "/tmp/${TARGET}-${tactic}.log" <<'PY'
          import re,sys,hashlib
          s=open(sys.argv[1],errors='ignore').read()
          goals=re.findall(r'(?:Initial goal:|unsolved goals|⊢)[\s\S]{0,700}',s)
          x=(goals[-1] if goals else s[-1200:])
          x=re.sub(r'/tmp/[^ ]+','<PATH>',x)
          x=re.sub(r'\d+\.\d+s','<TIME>',x)
          print(hashlib.sha256(x.encode()).hexdigest()[:12])
          PY
          )
            printf '%s\t%s\t%s\n' "$tactic" "$b" "$sig" >> /tmp/behaviour.tsv
            if [ "$b" -eq 0 ]; then
              lake test > "/tmp/${TARGET}-${tactic}-test.log" 2>&1
              t=$?
              if [ "$t" -eq 0 ]; then
                solved=1
                cp Submission.lean "/tmp/${TARGET}-SOLVED.lean"
                echo "winner=$tactic" >> "$GITHUB_OUTPUT"
                break
              fi
            fi
          done
          echo "solved=$solved" >> "$GITHUB_OUTPUT"
          echo "TARGET=$TARGET"
          cat /tmp/behaviour.tsv
          python3 - <<'PY'
          from collections import defaultdict
          rows=[]
          for line in open('/tmp/behaviour.tsv'):
              t,b,s=line.rstrip().split('\t'); rows.append((t,b,s))
          q=defaultdict(list)
          for t,b,s in rows:q[(b,s)].append(t)
          print('BEHAVIOURAL_CLASSES',len(q),'OF',len(rows))
          for k,v in q.items(): print(k,','.join(v))
          PY
          for f in /tmp/${TARGET}-*.log; do echo "--- $f"; tail -n 18 "$f"; done
          exit 0
      - name: Exact solve marker
        if: steps.quotient.outputs.solved == '1'
        run: echo "GREEN_EXACT_BEHAVIOURAL_SOLVE target=$TARGET winner=${{ steps.quotient.outputs.winner }}"
      - name: Upload behavioural residual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioural-${{ matrix.target }}
          path: |
            /tmp/behaviour.tsv
            /tmp/${{ matrix.target }}-*.log
            /tmp/${{ matrix.target }}-SOLVED.lean
          if-no-files-found: ignore
