name: LeanEval capability ladder

on:
  pull_request:
    paths:
      - '.github/workflows/lean-eval-capability-ladder.yml'
      - 'competitions/lean_eval/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-eval-capability-ladder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_EVAL_SHA: de48559590eb8cff2125e8e933b3e13bb8a3ff98
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build one frozen LeanEval workspace
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem abel_ruffini /tmp/abel_ruffini
          cd /tmp/abel_ruffini
          lake update

      - name: API preflight
        working-directory: /tmp/abel_ruffini
        run: |
          cat > Preflight.lean <<'EOF'
          import Mathlib
          #check (solvableByRad ℚ ℂ).algebraMap_mem
          #check solvableByRad.rad_mem
          #check (solvableByRad ℚ ℂ).mul_mem
          #check (solvableByRad ℚ ℂ).sub_mem
          #check (solvableByRad ℚ ℂ).div_mem
          #check (solvableByRad ℚ ℂ).pow_mem
          #check algebraMap.coe_ratCast
          EOF
          lake env lean Preflight.lean | tee /tmp/preflight.log

      - name: Batch capability checkpoints
        working-directory: /tmp/abel_ruffini
        run: |
          set +e
          printf 'checkpoint\texit\n' > /tmp/ladder.tsv

          cat > QuarticReconstruct.lean <<'EOF'
          import Mathlib

          theorem square_radical
              (z : ℂ) (hz : z ∈ solvableByRad ℚ ℂ)
              (s : ℂ) (hs : s^2 = z) : s ∈ solvableByRad ℚ ℂ := by
            apply solvableByRad.rad_mem (by norm_num : (2 : ℕ) ≠ 0)
            rw [hs]
            exact hz

          theorem quartic_final_reconstruct
              (P Q R y z s : ℂ)
              (hP : P ∈ solvableByRad ℚ ℂ)
              (hQ : Q ∈ solvableByRad ℚ ℂ)
              (_hR : R ∈ solvableByRad ℚ ℂ)
              (hz : z ∈ solvableByRad ℚ ℂ)
              (hs : s^2 = z)
              (hs0 : s ≠ 0)
              (hy : y^2 + s*y + (z + P)/2 - Q/(2*s) = 0) :
              y ∈ solvableByRad ℚ ℂ := by
            have hs_mem := square_radical z hz s hs
            have htwo : (2 : ℂ) ∈ solvableByRad ℚ ℂ := by
              have h := (solvableByRad ℚ ℂ).algebraMap_mem (2 : ℚ)
              norm_num at h ⊢
            have hfour : (4 : ℂ) ∈ solvableByRad ℚ ℂ := by
              have h := (solvableByRad ℚ ℂ).algebraMap_mem (4 : ℚ)
              norm_num at h ⊢
            have hsden : (2*s) ∈ solvableByRad ℚ ℂ := (solvableByRad ℚ ℂ).mul_mem htwo hs_mem
            have hc : ((z + P)/2 - Q/(2*s)) ∈ solvableByRad ℚ ℂ := by
              exact (solvableByRad ℚ ℂ).sub_mem
                ((solvableByRad ℚ ℂ).div_mem ((solvableByRad ℚ ℂ).add_mem hz hP) htwo)
                ((solvableByRad ℚ ℂ).div_mem hQ hsden)
            have hdisc : (s^2 - 4 * ((z + P)/2 - Q/(2*s))) ∈ solvableByRad ℚ ℂ := by
              exact (solvableByRad ℚ ℂ).sub_mem
                ((solvableByRad ℚ ℂ).pow_mem hs_mem 2)
                ((solvableByRad ℚ ℂ).mul_mem hfour hc)
            let t : ℂ := 2*y + s
            have ht2 : t^2 = s^2 - 4 * ((z + P)/2 - Q/(2*s)) := by
              dsimp [t]
              linear_combination 4 * hy
            have ht : t ∈ solvableByRad ℚ ℂ := by
              apply solvableByRad.rad_mem (by norm_num : (2 : ℕ) ≠ 0)
              rw [ht2]
              exact hdisc
            have hyform : y = (t - s) / 2 := by
              dsimp [t]
              ring
            rw [hyform]
            exact (solvableByRad ℚ ℂ).div_mem ((solvableByRad ℚ ℂ).sub_mem ht hs_mem) htwo
          EOF
          lake env lean QuarticReconstruct.lean > /tmp/quartic-reconstruct.log 2>&1
          q1=$?
          printf 'quartic_reconstruct\t%s\n' "$q1" >> /tmp/ladder.tsv

          cat > QuarticZeroBranch.lean <<'EOF'
          import Mathlib

          theorem quadratic_zero_linear_branch
              (y c : ℂ)
              (hc : c ∈ solvableByRad ℚ ℂ)
              (hy : y^2 + c = 0) : y ∈ solvableByRad ℚ ℂ := by
            have hnegc : (-c) ∈ solvableByRad ℚ ℂ := (solvableByRad ℚ ℂ).neg_mem hc
            apply solvableByRad.rad_mem (by norm_num : (2 : ℕ) ≠ 0)
            have : y^2 = -c := by linear_combination hy
            rw [this]
            exact hnegc
          EOF
          lake env lean QuarticZeroBranch.lean > /tmp/quartic-zero.log 2>&1
          q0=$?
          printf 'quartic_zero_branch\t%s\n' "$q0" >> /tmp/ladder.tsv

          cat > TranslateBack.lean <<'EOF'
          import Mathlib

          theorem affine_translate_back
              (a b : ℚ) (y x : ℂ)
              (ha : (a : ℂ) ≠ 0)
              (hy : y ∈ solvableByRad ℚ ℂ)
              (hrel : y = 4 * (a : ℂ) * x + (b : ℂ)) :
              x ∈ solvableByRad ℚ ℂ := by
            have hb : (b : ℂ) ∈ solvableByRad ℚ ℂ := by
              have h := (solvableByRad ℚ ℂ).algebraMap_mem b
              simpa [algebraMap.coe_ratCast] using h
            have hden : (4 * (a : ℂ)) ∈ solvableByRad ℚ ℂ := by
              have h := (solvableByRad ℚ ℂ).algebraMap_mem (4*a)
              simpa [algebraMap.coe_ratCast] using h
            have hx : x = (y - (b : ℂ)) / (4 * (a : ℂ)) := by
              rw [hrel]
              field_simp [ha]
              ring
            rw [hx]
            exact (solvableByRad ℚ ℂ).div_mem ((solvableByRad ℚ ℂ).sub_mem hy hb) hden
          EOF
          lake env lean TranslateBack.lean > /tmp/translate-back.log 2>&1
          qt=$?
          printf 'translate_back\t%s\n' "$qt" >> /tmp/ladder.tsv

          cat > DegreeFiveBoundary.lean <<'EOF'
          import Mathlib
          import Archive.Wiedijk100Theorems.AbelRuffini

          open Polynomial

          theorem high_degree_obstruction (n : ℕ) (hn : 5 ≤ n) :
              ¬ (∀ p : ℚ[X], p.natDegree = n → ∀ x : ℂ, aeval x p = 0 →
                  x ∈ solvableByRad ℚ ℂ) := by
            intro hall
            let bad : ℚ[X] := AbelRuffini.Φ ℚ 4 2
            obtain ⟨y, hy⟩ := (IsAlgClosed.splits (bad.map (algebraMap ℚ ℂ))).exists_eval_eq_zero (by
              simp [bad, AbelRuffini.degree_Phi])
            have hyroot : aeval y bad = 0 := by simpa [aeval_def] using hy
            have hynot : y ∉ solvableByRad ℚ ℂ := by
              apply AbelRuffini.not_solvable_by_rad' y
              simpa [bad, aeval_def] using hyroot
            let p : ℚ[X] := bad * X ^ (n - 5)
            have hbad0 : bad ≠ 0 := (AbelRuffini.monic_Phi 4 2).ne_zero
            have hdeg : p.natDegree = n := by
              rw [show p = bad * X ^ (n - 5) by rfl, natDegree_mul hbad0 (pow_ne_zero _ X_ne_zero)]
              simp [bad, AbelRuffini.natDegree_Phi]
              omega
            have hroot : aeval y p = 0 := by simp [p, hyroot]
            exact hynot (hall p hdeg y hroot)
          EOF
          lake env lean DegreeFiveBoundary.lean > /tmp/degree-five.log 2>&1
          q5=$?
          printf 'degree5_obstruction\t%s\n' "$q5" >> /tmp/ladder.tsv

          cat /tmp/ladder.tsv
          {
            echo '## LeanEval capability ladder'
            echo '```text'
            cat /tmp/ladder.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Compile universal quartic
        working-directory: /tmp/abel_ruffini
        run: |
          cp "$GITHUB_WORKSPACE/competitions/lean_eval/CubicUniversal.lean" CubicUniversal.lean
          cp "$GITHUB_WORKSPACE/competitions/lean_eval/QuarticUniversal.lean" QuarticUniversal.lean
          mkdir -p .lake/build/lib/lean
          set +e
          lake env lean -o .lake/build/lib/lean/CubicUniversal.olean CubicUniversal.lean > /tmp/cubic-dependency.log 2>&1
          dep=$?
          echo "cubic_dependency_exit=$dep"
          if [ "$dep" -ne 0 ]; then
            printf 'cubic_dependency\t%s\n' "$dep" >> /tmp/ladder.tsv
            tail -n 160 /tmp/cubic-dependency.log
            exit 0
          fi
          lake env lean QuarticUniversal.lean > /tmp/quartic-universal.log 2>&1
          code=$?
          echo "quartic_universal_exit=$code"
          printf 'quartic_universal\t%s\n' "$code" >> /tmp/ladder.tsv
          tail -n 240 /tmp/quartic-universal.log
          {
            echo '## Universal quartic'
            echo '```text'
            echo "cubic_dependency_exit=$dep"
            echo "quartic_universal_exit=$code"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload all residuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-eval-capability-ladder
          path: |
            /tmp/preflight.log
            /tmp/ladder.tsv
            /tmp/quartic-reconstruct.log
            /tmp/quartic-zero.log
            /tmp/translate-back.log
            /tmp/degree-five.log
            /tmp/cubic-dependency.log
            /tmp/quartic-universal.log
