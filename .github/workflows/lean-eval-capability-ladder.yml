name: LeanEval capability ladder

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-capability-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lemma-genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: annals_erdos_supersingular_primes
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Derive and verify the minimal logical cut
        id: bridge
        working-directory: /tmp/${{ env.TARGET }}
        run: |
          set +e
          cat > Submission.lean <<'LEAN'
          import ChallengeDeps
          import Mathlib.Analysis.Complex.Exponential

          set_option autoImplicit false
          namespace ErdosSupersingularPrimes
          open Int Real

          def k₀ : ℕ := sorry

          theorem core_to_main
              (core : ∀ (k : ℕ), k ≥ k₀ → ∀ (s : Solution k), s.l.Prime →
                s.y ≠ 0 → s.d ≠ 0 → s.l ≤ exp (10 ^ k))
              (k : ℕ) (hk : k ≥ k₀) (s : Solution k) (hs : s.l.Prime) :
              s.y = 0 ∨ s.d = 0 ∨ s.l ≤ exp (10 ^ k) := by
            by_cases hy : s.y = 0
            · exact Or.inl hy
            by_cases hd : s.d = 0
            · exact Or.inr (Or.inl hd)
            exact Or.inr (Or.inr (core k hk s hs hy hd))

          theorem theorem_2 (k : ℕ) (hk : k ≥ k₀) (s : Solution k) (hs : s.l.Prime) :
              s.y = 0 ∨ s.d = 0 ∨ s.l ≤ exp (10 ^ k) := by
            sorry
          end ErdosSupersingularPrimes
          LEAN
          lake build Submission > /tmp/bridge.log 2>&1
          code=$?
          echo "bridge_build=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "LEMMA_GENESIS_BRIDGE_VERIFIED interface=nondegenerate_core_bound"
          fi
          exit 0
      - name: Exhaust old language on generated core lemma
        id: core
        working-directory: /tmp/${{ env.TARGET }}
        run: |
          set +e
          cat > /tmp/core-template.lean <<'LEAN'
          import ChallengeDeps
          import Mathlib.Analysis.Complex.Exponential

          set_option autoImplicit false
          namespace ErdosSupersingularPrimes
          open Int Real

          def k₀ : ℕ := sorry

          theorem generated_core_bound (k : ℕ) (hk : k ≥ k₀) (s : Solution k)
              (hs : s.l.Prime) (hy : s.y ≠ 0) (hd : s.d ≠ 0) :
              s.l ≤ exp (10 ^ k) := by
            sorry
          end ErdosSupersingularPrimes
          LEAN

          python3 - <<'PY' > /tmp/core-candidates.tsv
          prims = [
            ('simp','try simp_all'),
            ('aesop','try aesop'),
            ('grind','try grind'),
            ('norm','try norm_num at *'),
            ('linarith','try linarith'),
            ('nlinarith','try nlinarith'),
            ('positivity','try positivity'),
            ('ringnf','try ring_nf'),
            ('fieldsimp','try field_simp'),
            ('elim','try solve_by_elim'),
            ('contra','try contradiction'),
            ('tauto','try tauto'),
          ]
          rows=list(prims)
          rows += [(n1+'__'+n2,b1+'\n  '+b2) for n1,b1 in prims for n2,b2 in prims]
          for n,b in rows: print(n+'\t'+b.replace('\n','\\n'))
          PY

          : > /tmp/core-results.tsv
          solved=0
          tested=0
          total=$(wc -l < /tmp/core-candidates.tsv)
          while IFS=$'\t' read -r name body; do
            tested=$((tested+1))
            cp /tmp/core-template.lean Submission.lean
            BODY="$body" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          b=os.environ['BODY'].replace('\\n','\n')
          s,n=re.subn(r'by\s*\n\s*sorry\b','by\n  '+b,s,count=1)
          open('Submission.lean','w').write(s)
          PY
            lake build Submission > "/tmp/core-${name}.log" 2>&1
            bcode=$?
            sig=$(python3 - "/tmp/core-${name}.log" <<'PY'
          import re,sys,hashlib
          s=open(sys.argv[1],errors='ignore').read()
          chunks=re.findall(r'(?:Initial goal:|unsolved goals|⊢)[\s\S]{0,1000}',s)
          x=(chunks[-1] if chunks else s[-1800:])
          x=re.sub(r'/tmp/[^ ]+','<PATH>',x)
          x=re.sub(r'\d+\.\d+s','<TIME>',x)
          print(hashlib.sha256(x.encode()).hexdigest()[:16])
          PY
          )
            printf '%s\t%s\t%s\n' "$name" "$bcode" "$sig" >> /tmp/core-results.tsv
            if [ "$bcode" -eq 0 ]; then
              solved=1
              cp Submission.lean /tmp/CORE-SOLVED.lean
              echo "winner=$name" >> "$GITHUB_OUTPUT"
              break
            fi
          done < /tmp/core-candidates.tsv
          echo "solved=$solved" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from collections import Counter
          rows=[x.rstrip().split('\t') for x in open('/tmp/core-results.tsv')]
          c=Counter(r[2] for r in rows if len(r)==3)
          print('CORE_CANDIDATES_DECLARED',sum(1 for _ in open('/tmp/core-candidates.tsv')))
          print('CORE_CANDIDATES_ENUMERATED',len(rows))
          print('CORE_RESIDUAL_CLASSES',len(c))
          for sig,n in c.most_common(): print('CORE_SIG',sig,'COUNT',n)
          PY
          if [ "$solved" -eq 0 ] && [ "$tested" -eq "$total" ]; then
            echo "CERTIFIED_CORE_NONMEMBERSHIP interface=nondegenerate_core_bound enumerated=$tested"
          fi
          exit 0
      - name: Decisive lemma gate
        run: |
          if [ "${{ steps.bridge.outputs.bridge_build }}" = "0" ] && [ "${{ steps.core.outputs.solved }}" != "1" ] && [ "${{ steps.core.outputs.tested }}" = "${{ steps.core.outputs.total }}" ]; then
            echo 'LEMMA_GENESIS_GATE {"bridge":0,"core_old_language":1,"classification":"MINIMAL_CORE_OBSTRUCTION_CERTIFIED"}'
          elif [ "${{ steps.core.outputs.solved }}" = "1" ]; then
            echo 'LEMMA_GENESIS_GATE {"bridge":0,"core_old_language":0,"classification":"CORE_REACHED"}'
          else
            echo 'LEMMA_GENESIS_GATE {"bridge":${{ steps.bridge.outputs.bridge_build }},"classification":"INCONCLUSIVE"}'
          fi
      - name: Upload lemma evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemma-genesis-erdos-supersingular
          path: |
            /tmp/bridge.log
            /tmp/core-template.lean
            /tmp/core-candidates.tsv
            /tmp/core-results.tsv
            /tmp/core-*.log
            /tmp/CORE-SOLVED.lean
          if-no-files-found: ignore
