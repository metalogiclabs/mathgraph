name: LeanEval capability ladder

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-capability-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promoted-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - annals_absolute_profinite_rigidity
          - annals_algebraic_integers
          - annals_bose_gases
          - annals_bounded_multiplicative_functions
          - annals_chowla_and_twin_prime_over_fq_t
          - annals_conjecture_of_marton
          - annals_dirichlet_weyl_bound
          - annals_duffin_schaeffer_conjecture
          - annals_enumerating_number_fields
          - annals_equiangular_lines_fixed_angle
          - annals_erdos_faber_lovasz_conjecture
          - annals_erdos_supersingular_primes
          - annals_flat_littlewood_poly
          - annals_fractional_expectation_thresholds
          - annals_good_lt_codes
          - annals_improved_bounds_sunflower_lemma
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Promoted theorem retrieval and elimination
        id: retrieval
        working-directory: /tmp/${{ matrix.target }}
        run: |
          set +e
          cp Challenge.lean /tmp/original.lean
          : > /tmp/retrieval.tsv
          solved=0
          for tactic in library_search exact_q apply_q solve_by_elim aesop_q classical_aesop contradiction tauto; do
            cp /tmp/original.lean Submission.lean
            TACTIC="$tactic" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          bodies={
            'library_search':'library_search',
            'exact_q':'exact?',
            'apply_q':'apply?',
            'solve_by_elim':'solve_by_elim',
            'aesop_q':'aesop?',
            'classical_aesop':'classical\n  aesop',
            'contradiction':'contradiction',
            'tauto':'tauto'
          }
          b=bodies[os.environ['TACTIC']]
          s,n=re.subn(r'by\s*\n\s*sorry\b','by\n  '+b,s)
          open('Submission.lean','w').write(s)
          print('holes_replaced',n)
          PY
            lake build Submission > "/tmp/${TARGET}-${tactic}.log" 2>&1
            b=$?
            t=99
            if [ "$b" -eq 0 ]; then
              lake test > "/tmp/${TARGET}-${tactic}-test.log" 2>&1
              t=$?
            fi
            category=$(python3 - "/tmp/${TARGET}-${tactic}.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors='ignore').read()
          if 'no applicable theorem' in s.lower() or 'library_search' in s and 'failed' in s.lower(): c='NO_LIBRARY_THEOREM'
          elif 'Tactic `aesop` failed' in s or 'made no progress' in s: c='NO_AUTOMATION_PROGRESS'
          elif 'unsolved goals' in s: c='UNSOLVED_GOAL'
          elif 'type mismatch' in s: c='TYPE_MISMATCH'
          elif 'unknown tactic' in s or 'unexpected token' in s: c='TACTIC_SYNTAX'
          elif 'error:' in s: c='OTHER_ERROR'
          else: c='BUILD_OK'
          print(c)
          PY
          )
            printf '%s\t%s\t%s\t%s\n' "$tactic" "$b" "$t" "$category" >> /tmp/retrieval.tsv
            if [ "$b" -eq 0 ] && [ "$t" -eq 0 ]; then
              solved=1
              cp Submission.lean "/tmp/${TARGET}-SOLVED.lean"
              echo "winner=$tactic" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          echo "solved=$solved" >> "$GITHUB_OUTPUT"
          echo "TARGET=$TARGET"
          cat /tmp/retrieval.tsv
          for f in /tmp/${TARGET}-*.log; do echo "--- $f"; tail -n 16 "$f"; done
          exit 0
      - name: Exact solve marker
        if: steps.retrieval.outputs.solved == '1'
        run: echo "GREEN_EXACT_PROMOTED_SOLVE target=$TARGET winner=${{ steps.retrieval.outputs.winner }}"
      - name: Upload promoted residual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promoted-${{ matrix.target }}
          path: |
            /tmp/retrieval.tsv
            /tmp/${{ matrix.target }}-*.log
            /tmp/${{ matrix.target }}-SOLVED.lean
          if-no-files-found: ignore
