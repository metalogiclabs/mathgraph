name: LeanEval capability ladder

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-capability-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - annals_absolute_profinite_rigidity
          - annals_algebraic_integers
          - annals_bose_gases
          - annals_bounded_multiplicative_functions
          - annals_chowla_and_twin_prime_over_fq_t
          - annals_conjecture_of_marton
          - annals_dirichlet_weyl_bound
          - annals_duffin_schaeffer_conjecture
          - annals_enumerating_number_fields
          - annals_equiangular_lines_fixed_angle
          - annals_erdos_faber_lovasz_conjecture
          - annals_erdos_supersingular_primes
          - annals_flat_littlewood_poly
          - annals_fractional_expectation_thresholds
          - annals_good_lt_codes
          - annals_improved_bounds_sunflower_lemma
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Generate, compile, verify, and replay extensions
        id: extend
        working-directory: /tmp/${{ matrix.target }}
        run: |
          set +e
          cp Challenge.lean /tmp/original.lean
          : > /tmp/observer.tsv
          : > /tmp/generated.tsv
          : > /tmp/extension-results.tsv

          # New observation language: interrogate Lean for structurally relevant
          # continuations. These observers do not count as solutions; their emitted
          # suggestions are compiled and externally checked below.
          for obs in exactq applyq rwq simpq aesopq; do
            cp /tmp/original.lean Submission.lean
            OBS="$obs" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          body={
            'exactq':'exact?',
            'applyq':'apply?',
            'rwq':'rw?',
            'simpq':'simp?',
            'aesopq':'aesop?',
          }[os.environ['OBS']]
          s,n=re.subn(r'by\s*\n\s*sorry\b','by\n  '+body,s)
          open('Submission.lean','w').write(s)
          print('holes_replaced',n)
          PY
            lake build Submission > "/tmp/${TARGET}-observer-${obs}.log" 2>&1
            printf '%s\t%s\n' "$obs" "$?" >> /tmp/observer.tsv
          done

          # Compile all distinct `Try this:` suggestions into executable candidates.
          python3 - <<'PY'
          import glob,re,os
          target=os.environ['TARGET']
          seen=set(); out=[]
          for p in sorted(glob.glob(f'/tmp/{target}-observer-*.log')):
              obs=p.rsplit('-',1)[-1].split('.')[0]
              txt=open(p,errors='ignore').read()
              # Lean suggestions are normally single-line after `Try this:`.
              for m in re.finditer(r'Try this:\s*([^\n\r]+)',txt):
                  body=m.group(1).strip()
                  body=re.sub(r'\x1b\[[0-9;]*m','',body)
                  if body and body not in seen:
                      seen.add(body); out.append((obs,body))
          with open('/tmp/generated.tsv','w') as f:
              for i,(obs,body) in enumerate(out):
                  f.write(f'g{i:03d}\t{obs}\t{body}\n')
          print('GENERATED_EXTENSION_CANDIDATES',len(out))
          PY

          solved=0
          winner=''
          generated=$(wc -l < /tmp/generated.tsv)

          # Every generated continuation is tested alone and with a frozen replay
          # tail from L0. This is L1 = L0 + compiled suggestion, not a larger blind
          # tactic sweep.
          while IFS=$'\t' read -r gid obs body; do
            [ -z "$gid" ] && continue
            for tail in none simp aesop grind elim; do
              cp /tmp/original.lean Submission.lean
              GID="$gid" BODY="$body" TAIL="$tail" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          b=os.environ['BODY']
          tail={
            'none':'',
            'simp':'\n  all_goals try simp_all',
            'aesop':'\n  all_goals try aesop',
            'grind':'\n  all_goals try grind',
            'elim':'\n  all_goals try solve_by_elim',
          }[os.environ['TAIL']]
          s,n=re.subn(r'by\s*\n\s*sorry\b','by\n  '+b+tail,s)
          open('Submission.lean','w').write(s)
          PY
              lake build Submission > "/tmp/${TARGET}-extension-${gid}-${tail}.log" 2>&1
              bcode=$?
              tcode=99
              if [ "$bcode" -eq 0 ]; then
                lake test > "/tmp/${TARGET}-extension-${gid}-${tail}-test.log" 2>&1
                tcode=$?
              fi
              sig=$(python3 - "/tmp/${TARGET}-extension-${gid}-${tail}.log" <<'PY'
          import re,sys,hashlib
          s=open(sys.argv[1],errors='ignore').read()
          chunks=re.findall(r'(?:Initial goal:|unsolved goals|⊢)[\s\S]{0,1000}',s)
          x=(chunks[-1] if chunks else s[-1800:])
          x=re.sub(r'/tmp/[^ ]+','<PATH>',x)
          x=re.sub(r'\d+\.\d+s','<TIME>',x)
          print(hashlib.sha256(x.encode()).hexdigest()[:16])
          PY
          )
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$gid" "$obs" "$tail" "$bcode" "$tcode" "$sig" >> /tmp/extension-results.tsv
              if [ "$bcode" -eq 0 ] && [ "$tcode" -eq 0 ]; then
                solved=1
                winner="${gid}-${tail}"
                cp Submission.lean "/tmp/${TARGET}-SOLVED.lean"
                break 2
              fi
            done
          done < /tmp/generated.tsv

          echo "solved=$solved" >> "$GITHUB_OUTPUT"
          echo "winner=$winner" >> "$GITHUB_OUTPUT"
          echo "generated=$generated" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          from collections import Counter,defaultdict
          import os
          target=os.environ['TARGET']
          rows=[]
          for line in open('/tmp/extension-results.tsv'):
              p=line.rstrip().split('\t')
              if len(p)==6: rows.append(p)
          sig=Counter(r[5] for r in rows)
          obs=defaultdict(set)
          for r in rows: obs[r[1]].add(r[5])
          print('TARGET',target)
          print('EXTENSION_PROGRAMS_TESTED',len(rows))
          print('EXTENSION_RESIDUAL_CLASSES',len(sig))
          for k,v in sorted(obs.items()): print('OBSERVER',k,'DISTINCT_FUTURES',len(v))
          for s,n in sig.most_common(12): print('EXT_SIG',s,'COUNT',n)
          PY

          if [ "$solved" -eq 0 ]; then
            echo "EXTENSION_FRONTIER_MEASURED target=$TARGET generated=$generated"
          fi
          exit 0
      - name: Exact promoted solve marker
        if: steps.extend.outputs.solved == '1'
        run: echo "GREEN_EXACT_PROMOTED_EXTENSION_SOLVE target=$TARGET winner=${{ steps.extend.outputs.winner }}"
      - name: Extension frontier marker
        if: steps.extend.outputs.solved != '1'
        run: echo "EXTENSION_REPLAY_COMPLETE target=$TARGET generated=${{ steps.extend.outputs.generated }}"
      - name: Upload extension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.target }}
          path: |
            /tmp/observer.tsv
            /tmp/generated.tsv
            /tmp/extension-results.tsv
            /tmp/${{ matrix.target }}-observer-*.log
            /tmp/${{ matrix.target }}-extension-*.log
            /tmp/${{ matrix.target }}-SOLVED.lean
          if-no-files-found: ignore
