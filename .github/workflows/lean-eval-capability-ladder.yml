name: LeanEval capability ladder

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-capability-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-consequence-genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: annals_erdos_supersingular_primes
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Generate verified structural consequence interfaces
        id: consequences
        working-directory: /tmp/${{ env.TARGET }}
        run: |
          set +e
          cat > /tmp/base.lean <<'LEAN'
          import ChallengeDeps
          import Mathlib.Analysis.Complex.Exponential

          set_option autoImplicit false
          namespace ErdosSupersingularPrimes
          open Int Real

          def k₀ : ℕ := sorry

          theorem generated_core_bound (k : ℕ) (hk : k ≥ k₀) (s : Solution k)
              (hs : s.l.Prime) (hy : s.y ≠ 0) (hd : s.d ≠ 0) :
              s.l ≤ exp (10 ^ k) := by
            sorry
          end ErdosSupersingularPrimes
          LEAN

          cat > /tmp/interfaces.tsv <<'EOF'
          sham	s.l = s.l	exact rfl
          prime_two_le	2 ≤ s.l	exact hs.two_le
          prime_pos	0 < s.l	exact hs.pos
          prime_ne_zero	s.l ≠ 0	exact hs.ne_zero
          prime_ne_one	s.l ≠ 1	exact hs.ne_one
          y_pow_ne_zero	s.y ^ s.l ≠ 0	exact pow_ne_zero _ hy
          product_nonzero	(∏ i ∈ Finset.range k, (s.n + i * s.d)) ≠ 0	have hpow : s.y ^ s.l ≠ 0 := pow_ne_zero _ hy; rw [← s.eq] at hpow; exact hpow
          factor_nonzero	∀ i ∈ Finset.range k, (s.n + i * s.d) ≠ 0	exact Finset.prod_ne_zero_iff.mp (by rw [s.eq]; exact pow_ne_zero _ hy)
          gcd_one	Int.gcd s.n s.d = 1	exact s.gcd
          EOF
          sed -i 's/^          //' /tmp/interfaces.tsv

          : > /tmp/verified-interfaces.tsv
          while IFS=$'\t' read -r name prop proof; do
            cp /tmp/base.lean Submission.lean
            PROP="$prop" PROOF="$proof" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          repl=("  have hDelta : " + os.environ['PROP'] + " := by\n"
                + "    " + os.environ['PROOF'] + "\n"
                + "  sorry\n"
                + "end ErdosSupersingularPrimes")
          s,n=re.subn(r'  sorry\nend ErdosSupersingularPrimes',lambda _: repl,s,count=1)
          if n != 1: raise SystemExit(f'interface hole replacements={n}')
          open('Submission.lean','w').write(s)
          PY
            pycode=$?
            if [ "$pycode" -ne 0 ]; then
              echo "HARNESS_FATAL phase=interface name=$name python_exit=$pycode"
              exit "$pycode"
            fi
            lake build Submission > "/tmp/interface-${name}.log" 2>&1
            code=$?
            echo "INTERFACE_VERIFY name=$name exit=$code"
            if [ "$code" -eq 0 ]; then
              printf '%s\t%s\t%s\n' "$name" "$prop" "$proof" >> /tmp/verified-interfaces.tsv
            fi
          done < /tmp/interfaces.tsv
          verified=$(wc -l < /tmp/verified-interfaces.tsv)
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_STRUCTURAL_INTERFACES count=$verified"
          exit 0
      - name: Replay primitive old language after each verified interface
        id: replay
        working-directory: /tmp/${{ env.TARGET }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/tails.tsv
          prims = [
            ('simp','try simp_all'), ('aesop','try aesop'), ('grind','try grind'),
            ('norm','try norm_num at *'), ('linarith','try linarith'),
            ('nlinarith','try nlinarith'), ('positivity','try positivity'),
            ('ringnf','try ring_nf'), ('fieldsimp','try field_simp'),
            ('elim','try solve_by_elim'), ('contra','try contradiction'), ('tauto','try tauto')]
          for n,b in prims: print(n+'\t'+b)
          PY
          : > /tmp/replay.tsv
          solved=0
          winner=''
          while IFS=$'\t' read -r iname prop proof; do
            while IFS=$'\t' read -r tname body; do
              cp /tmp/base.lean Submission.lean
              PROP="$prop" PROOF="$proof" BODY="$body" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          body=os.environ['BODY']
          repl=("  have hDelta : " + os.environ['PROP'] + " := by\n"
                + "    " + os.environ['PROOF'] + "\n"
                + "  " + body + "\n"
                + "end ErdosSupersingularPrimes")
          s,n=re.subn(r'  sorry\nend ErdosSupersingularPrimes',lambda _: repl,s,count=1)
          if n != 1: raise SystemExit(f'replay hole replacements={n}')
          open('Submission.lean','w').write(s)
          PY
              pycode=$?
              if [ "$pycode" -ne 0 ]; then
                echo "HARNESS_FATAL phase=replay interface=$iname tail=$tname python_exit=$pycode"
                exit "$pycode"
              fi
              lake build Submission > "/tmp/replay-${iname}-${tname}.log" 2>&1
              code=$?
              sig=$(python3 - "/tmp/replay-${iname}-${tname}.log" <<'PY'
          import re,sys,hashlib
          s=open(sys.argv[1],errors='ignore').read()
          chunks=re.findall(r'(?:Initial goal:|unsolved goals|⊢)[\s\S]{0,1200}',s)
          x=(chunks[-1] if chunks else s[-2200:])
          x=re.sub(r'^hDelta\s*:.*$', '', x, flags=re.M)
          x=re.sub(r'/tmp/[^ ]+','<PATH>',x)
          x=re.sub(r'\d+\.\d+s','<TIME>',x)
          x='\n'.join(line for line in x.splitlines() if line.strip())
          print(hashlib.sha256(x.encode()).hexdigest()[:16])
          PY
          )
              printf '%s\t%s\t%s\t%s\n' "$iname" "$tname" "$code" "$sig" >> /tmp/replay.tsv
              if [ "$code" -eq 0 ]; then
                solved=1
                winner="${iname}:${tname}"
                cp Submission.lean /tmp/STRUCTURAL-SOLVED.lean
                break 2
              fi
            done < /tmp/tails.tsv
          done < /tmp/verified-interfaces.tsv
          echo "solved=$solved" >> "$GITHUB_OUTPUT"
          echo "winner=$winner" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from collections import defaultdict
          rows=[x.rstrip().split('\t') for x in open('/tmp/replay.tsv') if x.strip()]
          by=defaultdict(list)
          for r in rows:
              if len(r)==4: by[r[0]].append(r)
          sham=set(r[3] for r in by.get('sham',[]))
          changed=[]
          print('STRUCTURAL_REPLAY_PROGRAMS',len(rows))
          print('SHAM_RESIDUAL_CLASSES',len(sham))
          for name,rs in sorted(by.items()):
              sig=set(r[3] for r in rs)
              delta=len(sig-sham)
              print('INTERFACE_FRONTIER',name,'PROGRAMS',len(rs),'CLASSES',len(sig),'NOVEL_VS_SHAM',delta)
              if name!='sham' and sig != sham: changed.append(name)
          print('CONSEQUENCE_CHANGING_INTERFACES',','.join(changed) if changed else 'NONE')
          open('/tmp/changing.txt','w').write('\n'.join(changed))
          PY
          changing=$(grep -c . /tmp/changing.txt 2>/dev/null || true)
          echo "changing=$changing" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Structural consequence gate
        run: |
          if [ "${{ steps.replay.outputs.solved }}" = "1" ]; then
            echo 'STRUCTURAL_CONSEQUENCE_GATE {"classification":"EXACT_REACHED","winner":"${{ steps.replay.outputs.winner }}"}'
          elif [ "${{ steps.replay.outputs.changing }}" -gt 0 ]; then
            echo 'STRUCTURAL_CONSEQUENCE_GATE {"classification":"CONSEQUENCE_SEPARATION","changing":${{ steps.replay.outputs.changing }}}'
          else
            echo 'STRUCTURAL_CONSEQUENCE_GATE {"classification":"STRUCTURAL_INTERFACE_EXHAUSTED","changing":0}'
          fi
      - name: Upload structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-consequence-erdos-supersingular
          path: |
            /tmp/interfaces.tsv
            /tmp/verified-interfaces.tsv
            /tmp/interface-*.log
            /tmp/tails.tsv
            /tmp/replay.tsv
            /tmp/replay-*.log
            /tmp/changing.txt
            /tmp/STRUCTURAL-SOLVED.lean
          if-no-files-found: ignore
