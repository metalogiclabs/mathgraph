name: LeanEval capability ladder

on:
  push:
    branches:
      - lean-eval-multitarget-sweep
    paths:
      - '.github/workflows/lean-eval-capability-ladder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - annals_absolute_profinite_rigidity
          - annals_algebraic_integers
          - annals_bose_gases
          - annals_bounded_multiplicative_functions
          - annals_chowla_and_twin_prime_over_fq_t
          - annals_conjecture_of_marton
          - annals_dirichlet_weyl_bound
          - annals_duffin_schaeffer_conjecture
          - annals_enumerating_number_fields
          - annals_equiangular_lines_fixed_angle
          - annals_erdos_faber_lovasz_conjecture
          - annals_erdos_supersingular_primes
          - annals_flat_littlewood_poly
          - annals_fractional_expectation_thresholds
          - annals_good_lt_codes
          - annals_improved_bounds_sunflower_lemma
    env:
      LEAN_EVAL_SHA: 9b82c4083e71e93c7d6aa43a960cd492ae53a35d
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare frozen target
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem "$TARGET" "/tmp/$TARGET"
          cd "/tmp/$TARGET"
          lake update
      - name: Exhaust frozen depth-2 proof language
        id: closure
        working-directory: /tmp/${{ matrix.target }}
        run: |
          set +e
          cp Challenge.lean /tmp/original.lean
          python3 - <<'PY' > /tmp/candidates.tsv
          prims = [
            ('simp','try simp_all'),
            ('aesop','try aesop'),
            ('grind','try grind'),
            ('norm','try norm_num at *'),
            ('linarith','try linarith'),
            ('nlinarith','try nlinarith'),
            ('positivity','try positivity'),
            ('ringnf','try ring_nf'),
            ('fieldsimp','try field_simp'),
            ('elim','try solve_by_elim'),
            ('contra','try contradiction'),
            ('tauto','try tauto'),
          ]
          rows=[]
          for n,b in prims: rows.append((n,b))
          for n1,b1 in prims:
            for n2,b2 in prims:
              rows.append((n1+'__'+n2,b1+'\n  '+b2))
          for n,b in rows:
            print(n+'\t'+b.replace('\n','\\n'))
          PY
          total=$(wc -l < /tmp/candidates.tsv)
          : > /tmp/closure.tsv
          : > /tmp/signatures.tsv
          solved=0
          tested=0
          while IFS=$'\t' read -r name body; do
            tested=$((tested+1))
            cp /tmp/original.lean Submission.lean
            NAME="$name" BODY="$body" python3 - <<'PY'
          import os,re
          s=open('Submission.lean').read()
          b=os.environ['BODY'].replace('\\n','\n')
          s,n=re.subn(r'by\s*\n\s*sorry\b','by\n  '+b,s)
          open('Submission.lean','w').write(s)
          if n != 1: print('HOLE_REPLACEMENT_COUNT',n)
          PY
            lake build Submission > "/tmp/${TARGET}-closure-${name}.log" 2>&1
            b=$?
            t=99
            if [ "$b" -eq 0 ]; then
              lake test > "/tmp/${TARGET}-closure-${name}-test.log" 2>&1
              t=$?
            fi
            sig=$(python3 - "/tmp/${TARGET}-closure-${name}.log" <<'PY'
          import re,sys,hashlib
          s=open(sys.argv[1],errors='ignore').read()
          chunks=re.findall(r'(?:Initial goal:|unsolved goals|⊢)[\s\S]{0,900}',s)
          x=(chunks[-1] if chunks else s[-1500:])
          x=re.sub(r'/tmp/[^ ]+','<PATH>',x)
          x=re.sub(r'\d+\.\d+s','<TIME>',x)
          print(hashlib.sha256(x.encode()).hexdigest()[:16])
          PY
          )
            printf '%s\t%s\t%s\t%s\n' "$name" "$b" "$t" "$sig" >> /tmp/closure.tsv
            printf '%s\t%s\n' "$name" "$sig" >> /tmp/signatures.tsv
            if [ "$b" -eq 0 ] && [ "$t" -eq 0 ]; then
              solved=1
              cp Submission.lean "/tmp/${TARGET}-SOLVED.lean"
              echo "winner=$name" >> "$GITHUB_OUTPUT"
              break
            fi
          done < /tmp/candidates.tsv
          echo "solved=$solved" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "declared=$total" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from collections import Counter
          rows=[line.rstrip().split('\t') for line in open('/tmp/closure.tsv')]
          c=Counter(r[3] for r in rows)
          print('TARGET',__import__('os').environ['TARGET'])
          print('CLOSURE_DECLARED',sum(1 for _ in open('/tmp/candidates.tsv')))
          print('CLOSURE_ENUMERATED',len(rows))
          print('RESIDUAL_SIGNATURE_CLASSES',len(c))
          for sig,n in c.most_common(): print('SIG',sig,'COUNT',n)
          PY
          if [ "$solved" -eq 0 ] && [ "$tested" -eq "$total" ]; then
            echo "CERTIFIED_BOUNDED_NONMEMBERSHIP target=$TARGET language=depth2_12_primitives enumerated=$tested"
          fi
          exit 0
      - name: Exact solve marker
        if: steps.closure.outputs.solved == '1'
        run: echo "GREEN_EXACT_CLOSURE_SOLVE target=$TARGET winner=${{ steps.closure.outputs.winner }}"
      - name: Certified nonmembership marker
        if: steps.closure.outputs.solved != '1' && steps.closure.outputs.tested == steps.closure.outputs.declared
        run: echo "RED_CERTIFIED_BOUNDED_NONMEMBERSHIP target=$TARGET enumerated=${{ steps.closure.outputs.tested }}"
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-${{ matrix.target }}
          path: |
            /tmp/candidates.tsv
            /tmp/closure.tsv
            /tmp/signatures.tsv
            /tmp/${{ matrix.target }}-closure-*.log
            /tmp/${{ matrix.target }}-SOLVED.lean
          if-no-files-found: ignore
