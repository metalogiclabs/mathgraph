name: Nemotron external source-native pilot (untrusted candidate)
on:
  workflow_dispatch:
  push:
    branches: [experiment/nebius-public-pilot-20261028]
permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        arm: [source_bound, conventional]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: django/django
          ref: b79088306513d5ed76d31ac40ab3c15f858946ea
          path: source_django
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticated inference only; never execute generated source here
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: python public_external_pilot.py propose --arm "${{ matrix.arm }}" --root source_django --output proposal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: untrusted-nemotron-function-${{ matrix.arm }}
          path: proposal.json
          if-no-files-found: error

  independent_evaluation:
    needs: inference
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    strategy:
      matrix:
        arm: [source_bound, conventional]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: django/django
          ref: b79088306513d5ed76d31ac40ab3c15f858946ea
          path: source_django
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source-integrity and model-interface regressions without secrets
        run: python -m unittest -q test_public_external_pilot test_external_candidate_stage test_external_model_proposal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: untrusted-nemotron-function-${{ matrix.arm }}
      - name: Install source-native Django runtime dependencies
        run: python -m pip install 'asgiref>=3.2,<4' 'sqlparse>=0.2,<1' pytz
      - name: Evaluate in disposable runner without inference secret
        run: |
          if test -f proposal.json; then
            python public_external_pilot.py evaluate --arm "${{ matrix.arm }}" --root source_django --input proposal.json --output external-pilot-result.json
          else
            python public_external_pilot.py no-result --arm "${{ matrix.arm }}" --output external-pilot-result.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-native-pilot-receipt-${{ matrix.arm }}
          path: external-pilot-result.json
          if-no-files-found: warn
