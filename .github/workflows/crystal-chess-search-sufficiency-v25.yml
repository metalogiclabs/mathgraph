name: Crystal Chess Search Sufficiency V25

on:
  push:
    branches:
      - crystal-chess-search-sufficiency-v25
    paths:
      - "experiments/crystal_chess_search_sufficiency_v25.py"
      - ".github/workflows/crystal-chess-search-sufficiency-v25.yml"
  workflow_dispatch:

jobs:
  search-sufficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_search_sufficiency_v25.py

      - name: Download frozen V22 normal-game corpus
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-normal-exposure-v22
          path: /tmp/v22
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36361812786

      - name: Build pinned Stockfish authority
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/stockfish-bench.txt 2>&1

      - name: Acquire and qualify normal-search sufficiency guard
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v25
          python experiments/crystal_chess_search_sufficiency_v25.py             --stockfish /tmp/stockfish/src/stockfish             --pgn /tmp/v22/match.pgn             --max-per-split 220             --output artifacts/crystal-chess-v25/result.json             --guard-output artifacts/crystal-chess-v25/search_sufficiency_guard_v25.json.gz             | tee artifacts/crystal-chess-v25/run.log
          grep -Eq "CRYSTAL_CHESS_SEARCH_SUFFICIENCY_V25=(WARRANTED_PROSPECTIVE_NORMAL_SEARCH_SUFFICIENCY_GUARD|NORMAL_SEARCH_SUFFICIENCY_EXACT_RESIDUAL|NO_ZERO_ERROR_NORMAL_SEARCH_GUARD)" artifacts/crystal-chess-v25/run.log
          cp /tmp/stockfish-bench.txt artifacts/crystal-chess-v25/
          sha256sum /tmp/v22/match.pgn > artifacts/crystal-chess-v25/V22_PGN_SHA256.txt
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > artifacts/crystal-chess-v25/STOCKFISH_PIN.txt

      - name: Upload V25 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-search-sufficiency-v25
          path: artifacts/crystal-chess-v25/
          if-no-files-found: error
