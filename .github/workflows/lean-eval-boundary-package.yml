name: LeanEval boundary package

on:
  pull_request:
    paths:
      - '.github/workflows/lean-eval-boundary-package.yml'
      - 'competitions/lean_eval/AbelRuffiniCapabilityBoundary.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-eval-boundary-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_EVAL_SHA: de48559590eb8cff2125e8e933b3e13bb8a3ff98
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build frozen LeanEval workspace
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          test "$(git rev-parse HEAD)" = "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem abel_ruffini /tmp/abel_ruffini
          cd /tmp/abel_ruffini
          lake update
      - name: Build archived Abel-Ruffini dependency
        working-directory: /tmp/abel_ruffini
        run: |
          mkdir -p .lake/packages/mathlib/.lake/build/lib/lean/Archive/Wiedijk100Theorems
          lake env lean \
            -o .lake/packages/mathlib/.lake/build/lib/lean/Archive/Wiedijk100Theorems/AbelRuffini.olean \
            .lake/packages/mathlib/Archive/Wiedijk100Theorems/AbelRuffini.lean
      - name: Compile exact boundary package
        working-directory: /tmp/abel_ruffini
        run: |
          cp "$GITHUB_WORKSPACE/competitions/lean_eval/AbelRuffiniCapabilityBoundary.lean" ./AbelRuffiniCapabilityBoundary.lean
          set +e
          lake env lean AbelRuffiniCapabilityBoundary.lean > /tmp/boundary-package.log 2>&1
          code=$?
          echo "boundary_package_exit=$code" | tee /tmp/boundary-package-summary.txt
          tail -n 200 /tmp/boundary-package.log
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-eval-boundary-package
          path: |
            /tmp/boundary-package.log
            /tmp/boundary-package-summary.txt
