name: MathGraph Check authenticated attempt collector
on:
  pull_request:
    paths:
      - 'integrations/mathgraph-check-github/github-attempt-collector-v1*'
      - '.github/workflows/mathgraph-check-attempt-collector.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/mathgraph-check-github/github-attempt-collector-v1.test.mjs integrations/mathgraph-check-github/living-warrant-cycle-v1.test.mjs
