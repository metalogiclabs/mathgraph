name: Crystal Chess V0

on:
  push:
    branches:
      - crystal-chess-v0
    paths:
      - "experiments/crystal_chess_kpvk_v0.py"
      - ".github/workflows/crystal-chess-v0.yml"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  kpvk-consequential-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Acquire exact 3-piece Syzygy WDL authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Execute exhaustive state quotient and bounded action audit
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v0
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v0/
          python experiments/crystal_chess_kpvk_v0.py --tablebase-dir /tmp/syzygy --action-limit 50000 --output artifacts/crystal-chess-v0/crystal_chess_kpvk_v0.json | tee artifacts/crystal-chess-v0/run.log
          grep -q "CRYSTAL_CHESS_KPVK_V0=PASS" artifacts/crystal-chess-v0/run.log

      - name: Upload Crystal Chess evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-kpvk-v0
          path: artifacts/crystal-chess-v0/
          if-no-files-found: error
