name: Crystal Transparent Wrapper Discovery V1

on:
  push:
    branches:
      - crystal-corpus-expansion-pfr-v1
    paths:
      - 'mathgraph/lean_transparent_wrapper_discovery.py'
      - 'tests/test_lean_transparent_wrapper_discovery.py'
      - 'experiments/crystal_transparent_wrapper_discovery_v1/**'
      - 'evidence/crystal-transparent-wrapper-bridge-v1.json'
      - '.github/workflows/crystal-transparent-wrapper-discovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MathGraph
        run: python -m pip install -e ".[all]"

      - name: Test discovery grammar
        run: python -m pytest -q tests/test_lean_transparent_wrapper_discovery.py

      - name: Sparse checkout exact corpus surfaces
        run: |
          set -euo pipefail
          mkdir -p /tmp/crystal-wrapper-corpora
          clone_sparse () {
            repo="$1"; commit="$2"; dest="$3"; shift 3
            git init "$dest"
            git -C "$dest" remote add origin "https://github.com/$repo.git"
            git -C "$dest" sparse-checkout init --cone
            git -C "$dest" sparse-checkout set "$@"
            git -C "$dest" fetch --depth=1 origin "$commit"
            git -C "$dest" checkout --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$commit"
          }

          clone_sparse teorth/pfr             eb5557e9556a89a3418c4e8bdd717a5cf736c060             /tmp/crystal-wrapper-corpora/pfr PFR

          clone_sparse anthropics/fermats-last-theorem             6e837e75355538c7f80bab5b956861e86c4eacc2             /tmp/crystal-wrapper-corpora/anthropic Definitions Theorems

          clone_sparse isomorphic-ai/fermat             07b35d10984632caa14b1af26ec5dec2363ee920             /tmp/crystal-wrapper-corpora/isomorphic Fermat

          clone_sparse ImperialCollegeLondon/FLT             eb6df2b018f81920cd48dd510417f0b7790c305e             /tmp/crystal-wrapper-corpora/imperial FLT

      - name: Discover different-name transparent wrapper candidates
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal_transparent_wrapper_discovery_v1
          python - <<'PY'
          import json
          from pathlib import Path

          from mathgraph.lean_transparent_wrapper_discovery import scan_local_roots

          manifest=json.loads(
              Path("experiments/crystal_transparent_wrapper_discovery_v1/manifest.json").read_text()
          )
          roots={
              "teorth-pfr":"/tmp/crystal-wrapper-corpora/pfr",
              "anthropic-flt":"/tmp/crystal-wrapper-corpora/anthropic",
              "isomorphic-fermat":"/tmp/crystal-wrapper-corpora/isomorphic",
              "imperial-flt":"/tmp/crystal-wrapper-corpora/imperial",
          }
          out=scan_local_roots(
              manifest,
              roots,
              source_corpora=manifest["source_corpora"],
          )
          Path("artifacts/crystal_transparent_wrapper_discovery_v1/discovery.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )

          control=manifest["recovery_control"]
          hits=[
              row for row in out["candidates"]
              if row["wrapper"].split(".")[-1]==control["wrapper"]
              and row["consumer_corpus"]==control["consumer_corpus"]
              and row["consumer_declaration"]==control["consumer_declaration"]
              and row["fingerprint"]==control["canonical_fingerprint"]
          ]
          if not hits:
              print("WRAPPERS", json.dumps([
                  x for x in out["wrappers"]
                  if "FiniteRange" in x["wrapper"] or "FiniteRange" in x["full_name"]
              ], sort_keys=True))
              print("FINITE_RANGE_CANDIDATES", json.dumps([
                  x for x in out["candidates"]
                  if "FiniteRange" in x["wrapper"]
                  or "finiteRange" in x["consumer_declaration"]
              ], sort_keys=True))
              print("ANTHROPIC_FINITE_RANGE_DECLS", json.dumps([
                  [x["consumer_declaration"],x["consumer_premise_type"],x["fingerprint"]]
                  for x in out["candidates"]
                  if x["consumer_corpus"]=="anthropic-flt"
              ][:100], sort_keys=True))
              raise AssertionError(
                  "failed to mechanically recover independently qualified FiniteRange bridge"
              )

          authority=json.loads(
              Path("evidence/crystal-transparent-wrapper-bridge-v1.json").read_text()
          )
          assert authority["status"]=="WARRANTED_BOUNDED_REUSABLE"

          selected={
              "schema":"mathgraph.transparent-wrapper-discovery-qualified-hit.v1",
              "status":"WARRANTED_BOUNDED_DISCOVERY_HIT",
              "candidate":hits[0],
              "qualification_authority":{
                  "run_id":authority["authority"]["run_id"],
                  "artifact_id":authority["authority"]["artifact_id"],
                  "artifact_digest":authority["authority"]["artifact_digest"],
              },
              "discovery_claim":(
                  "The source-level one-field Prop wrapper grammar recovered the "
                  "previously qualified differently-named PFR→Anthropic bridge "
                  "without being given the wrapper or consumer name."
              ),
              "other_candidates_status":"CANDIDATE_REQUIRES_VERIFIER",
          }
          Path("artifacts/crystal_transparent_wrapper_discovery_v1/qualified_hit.json").write_text(
              json.dumps(selected,indent=2,sort_keys=True)+"\n"
          )

          summary={
              "wrapper_count":out["wrapper_count"],
              "candidate_count":out["candidate_count"],
              "qualified_control_hits":len(hits),
              "candidate_pairs":[
                  [x["wrapper"],x["consumer_corpus"],x["consumer_declaration"]]
                  for x in out["candidates"][:50]
              ],
          }
          Path("artifacts/crystal_transparent_wrapper_discovery_v1/summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-transparent-wrapper-discovery-v1
          path: artifacts/crystal_transparent_wrapper_discovery_v1/
