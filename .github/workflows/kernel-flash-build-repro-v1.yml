name: Flash binary reproducibility control V1
on:
  push:
    branches: [research/check-kernel-persisted-reuse-20261104]
    paths:
      - .github/workflows/kernel-flash-build-repro-v1.yml
permissions: {contents: read}
jobs:
  independent-build-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Fetch identical pinned Flash source
        shell: bash
        run: |
          set -euo pipefail
          git init flash
          git -C flash remote add origin https://github.com/metalogiclabs/mathgraph-lean-kernel.git
          git -C flash fetch --depth=1 origin 32eada63bf5d1815bc8d39dd4b4047dc98eff20d
          git -C flash checkout --detach FETCH_HEAD
          test "$(git -C flash rev-parse HEAD)" = '32eada63bf5d1815bc8d39dd4b4047dc98eff20d'
          mkdir -p reproducibility-evidence reproducibility-work
          git -C flash rev-parse HEAD > reproducibility-evidence/flash-commit.txt
      - name: Use the same recorded toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustc --version --verbose > reproducibility-evidence/rustc.txt
          cargo --version > reproducibility-evidence/cargo.txt
      - name: A first clean build
        shell: bash
        run: |
          set -euo pipefail
          cd flash
          cargo build --release --locked
          cp target/release/sokonanoda ../reproducibility-work/a.bin
          sha256sum ../reproducibility-work/a.bin > ../reproducibility-evidence/build-a.txt
      - name: B same-path fresh package rebuild, dependency artifacts retained
        shell: bash
        run: |
          set -euo pipefail
          cd flash
          cargo clean --release -p sokonanoda
          cargo build --release --locked
          cp target/release/sokonanoda ../reproducibility-work/b.bin
          sha256sum ../reproducibility-work/b.bin > ../reproducibility-evidence/build-b.txt
      - name: C different-path independent full build
        shell: bash
        run: |
          set -euo pipefail
          git init flash-alt
          git -C flash-alt fetch --depth=1 ../flash HEAD
          git -C flash-alt checkout --detach FETCH_HEAD
          test "$(git -C flash-alt rev-parse HEAD)" = '32eada63bf5d1815bc8d39dd4b4047dc98eff20d'
          cd flash-alt
          cargo build --release --locked
          cp target/release/sokonanoda ../reproducibility-work/c.bin
          sha256sum ../reproducibility-work/c.bin > ../reproducibility-evidence/build-c.txt
      - name: D original path, entire release dependency graph rebuilt
        shell: bash
        run: |
          set -euo pipefail
          cd flash
          cargo clean --release
          cargo build --release --locked
          cp target/release/sokonanoda ../reproducibility-work/d.bin
          sha256sum ../reproducibility-work/d.bin > ../reproducibility-evidence/build-d.txt
      - name: Record exact matching versus changed bytes without suppressing failures
        shell: bash
        run: |
          set -euo pipefail
          if cmp -s reproducibility-work/a.bin reproducibility-work/b.bin; then
            echo 'A_B_SAME_PATH_REBUILD=IDENTICAL' | tee reproducibility-evidence/verdict.txt
          else
            echo 'A_B_SAME_PATH_REBUILD=DIFFERENT' | tee reproducibility-evidence/verdict.txt
          fi
          if cmp -s reproducibility-work/a.bin reproducibility-work/c.bin; then
            echo 'A_C_DIFFERENT_PATH=IDENTICAL' | tee -a reproducibility-evidence/verdict.txt
          else
            echo 'A_C_DIFFERENT_PATH=DIFFERENT' | tee -a reproducibility-evidence/verdict.txt
          fi
          if cmp -s reproducibility-work/a.bin reproducibility-work/d.bin; then
            echo 'A_D_SAME_PATH_FULL_CLEAN=IDENTICAL' | tee -a reproducibility-evidence/verdict.txt
          else
            echo 'A_D_SAME_PATH_FULL_CLEAN=DIFFERENT' | tee -a reproducibility-evidence/verdict.txt
          fi
          sha256sum flash/test_resources/ProofIrrelUnderBVar/export \
            flash/test_resources/ProofIrrelUnderBVar/config.json \
            >> reproducibility-evidence/source-hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flash-binary-reproducibility-v1
          path: reproducibility-evidence/
          if-no-files-found: error
