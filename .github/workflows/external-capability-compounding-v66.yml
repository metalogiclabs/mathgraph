name: V66 Fresh Recurrence-Stream Capability Compounding

on:
  push:
    branches: [external-capability-compounding-v66]
    paths:
      - 'experiments/external_capability_compounding_v66/**'
      - '.github/workflows/external-capability-compounding-v66.yml'
  workflow_dispatch:

jobs:
  fresh-recurrence-compounding:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install frozen route backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1

      - name: Freeze external corpus bytes
        run: |
          set -euo pipefail
          mkdir -p external-v66
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v66/book3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v66/book3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v66/book3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v66/book3500.jsonl" | sha256sum -c -
          echo "V66_FRESH_A=book3000_rows_2900_2980"
          echo "V66_RECURRENCE_SCAN=book3500_rows_2900_3500"
          echo "V66_TARGET_SELECTION=source_applicability_only"

      - name: Run frozen V66 recurrence protocol
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v66/run.py \
            --book3000 external-v66/book3000.jsonl \
            --book3500 external-v66/book3500.jsonl \
            --out external-v66/results

      - name: Preserve V66 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v66-fresh-recurrence-capability-compounding
          path: external-v66/results/
