name: L4YAML SerializationWellFormed v1

on:
  push:
    branches: [l4yaml-serialization-wellformed-v1]
    paths:
      - 'experiments/l4yaml-serialization/**'
      - '.github/workflows/l4yaml-serialization-wellformed-v1.yml'
  workflow_dispatch:

jobs:
  serialization-wellformed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout MathGraph
        uses: actions/checkout@v4

      - name: Checkout pinned L4YAML fix-a state
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: 326e4bdfd599fa74e7601bdd84632845a3353ccb
          path: upstream
          submodules: recursive

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean
        working-directory: upstream
        run: |
          elan toolchain install "$(cat lean-toolchain)" || true

      - name: Build dependencies
        working-directory: upstream
        run: |
          lake build L4YAML.Scanner.Scanner L4YAML.Parser.TokenParser L4YAML.Parser.Composition

      - name: Kernel-check SerializationWellFormed
        run: |
          cp experiments/l4yaml-serialization/SerializationWellFormed.lean upstream/SerializationWellFormed.lean
          cp experiments/l4yaml-serialization/Census.lean upstream/Census.lean
          cp experiments/l4yaml-serialization/SourceEvents.lean upstream/SourceEvents.lean
          cd upstream
          lake env lean -o .lake/build/lib/lean/SerializationWellFormed.olean SerializationWellFormed.lean
          lake env lean SourceEvents.lean
          lake env lean Census.lean
