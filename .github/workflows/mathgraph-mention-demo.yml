name: MathGraph mention demo
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize]
permissions:
  contents: read
jobs:
  check-or-fix:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'metalogiclabs/mathgraph' &&
      github.event.issue.pull_request &&
      github.event.sender.id == 32909488 &&
      github.event.comment.user.id == 32909488 &&
      github.run_attempt == 1 &&
      (github.event.comment.body == '@MathGraph -check' || github.event.comment.body == '@MathGraph -fix')
    concurrency:
      group: mathgraph-mention-demo-pilot
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef7c0e013f49454d6846daa0bf00e9c3e165b6f4
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify trusted controller tests
        run: node --test integrations/mathgraph-check-github/mention-*.test.mjs
      - name: Select the configured publisher
        id: publisher
        env:
          APP_PRIVATE_KEY: ${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a repository-scoped MathGraph Check token
        id: mathgraph-app
        continue-on-error: true
        if: steps.publisher.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23lioiUs5KfHD7mkkw
          private-key: ${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}
          owner: metalogiclabs
          repositories: mathgraph
          permission-issues: write
          permission-contents: write
          permission-pull-requests: write
      - name: Report the publishing identity
        env:
          APP_REQUESTED: ${{ steps.publisher.outputs.enabled }}
          APP_SLUG: ${{ steps.mathgraph-app.outputs.app-slug }}
        run: |
          if [ "$APP_REQUESTED" = "true" ] && [ -z "$APP_SLUG" ]; then
            echo "::warning::MathGraph Check App installation is unavailable. Publishing as github-actions[bot]."
          fi
      - name: Acknowledge the command before Lean setup
        id: demo-command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATHGRAPH_APP_TOKEN: ${{ steps.mathgraph-app.outputs.token }}
          MATHGRAPH_APP_SLUG: ${{ steps.mathgraph-app.outputs.app-slug }}
          MATHGRAPH_DEMO_PHASE: prepare
        run: node integrations/mathgraph-check-github/mention-actions-demo-v1.mjs
      - name: Prepare isolated pinned Lean
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mathgraph-lean-image/lean"
          curl --proto '=https' --tlsv1.2 -fL --retry 2 \
            https://github.com/leanprover/lean4/releases/download/v4.28.0/lean-4.28.0-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          echo "ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/mathgraph-lean-image/lean"
          docker build -t mathgraph-lean-demo:v1 -f integrations/mathgraph-check-github/Dockerfile.native-demo "$RUNNER_TEMP/mathgraph-lean-image"
          docker image inspect --format '{{.Id}}' mathgraph-lean-demo:v1
      - name: Prepare pinned Mathlib for the published Artin exercise
        if: steps.demo-command.outputs.case == 'artin-generators'
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/mathgraph-lean-image/lean/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/mathgraph-artin-env"
          cd "$RUNNER_TEMP/mathgraph-artin-env"
          printf '%s\n' 'leanprover/lean4:v4.28.0' > lean-toolchain
          cat > lakefile.lean <<'LEAN'
          import Lake
          open Lake DSL
          package MathGraphArtinMention where
          require mathlib from git "https://github.com/leanprover-community/mathlib4.git" @ "8f9d9cff6bd728b17a24e163c9402775d9e6a365"
          LEAN
          lake update
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lake-manifest.json'));if(d.packages.find(p=>p.name==='mathlib')?.rev!=='8f9d9cff6bd728b17a24e163c9402775d9e6a365')throw Error('MATHLIB_REVISION_MISMATCH')"
          lake exe cache get
          echo "MATHGRAPH_NATIVE_DEPS=$RUNNER_TEMP/mathgraph-artin-env/.lake/packages" >> "$GITHUB_ENV"
      - name: Run one authorized bounded check or repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MATHGRAPH_APP_TOKEN: ${{ steps.mathgraph-app.outputs.token }}
          MATHGRAPH_APP_SLUG: ${{ steps.mathgraph-app.outputs.app-slug }}
        run: node integrations/mathgraph-check-github/mention-actions-demo-v1.mjs
      - name: Settle an interrupted progress card
        if: failure() || cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATHGRAPH_APP_TOKEN: ${{ steps.mathgraph-app.outputs.token }}
          MATHGRAPH_APP_SLUG: ${{ steps.mathgraph-app.outputs.app-slug }}
          MATHGRAPH_DEMO_PHASE: finalize
        run: node integrations/mathgraph-check-github/mention-actions-demo-v1.mjs
      - name: Preserve native receipt and any verified repair
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mathgraph-native-mention-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mathgraph-native-*.json
            ${{ runner.temp }}/mathgraph-verified-repair.lean
            ${{ runner.temp }}/mathgraph-artin-env/lake-manifest.json
          if-no-files-found: ignore
          retention-days: 14

  withdraw-stale-results:
    if: github.event_name == 'pull_request_target' && github.repository == 'metalogiclabs/mathgraph'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: mathgraph-mention-demo-pilot
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef7c0e013f49454d6846daa0bf00e9c3e165b6f4
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Select the configured publisher
        id: publisher
        env:
          APP_PRIVATE_KEY: ${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a repository-scoped MathGraph Check token
        id: mathgraph-app
        continue-on-error: true
        if: steps.publisher.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23lioiUs5KfHD7mkkw
          private-key: ${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}
          owner: metalogiclabs
          repositories: mathgraph
          permission-issues: write
      - name: Report the publishing identity
        env:
          APP_REQUESTED: ${{ steps.publisher.outputs.enabled }}
          APP_SLUG: ${{ steps.mathgraph-app.outputs.app-slug }}
        run: |
          if [ "$APP_REQUESTED" = "true" ] && [ -z "$APP_SLUG" ]; then
            echo "::warning::MathGraph Check App installation is unavailable. Publishing as github-actions[bot]."
          fi
      - name: Withdraw source-stale observations without model access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATHGRAPH_APP_TOKEN: ${{ steps.mathgraph-app.outputs.token }}
          MATHGRAPH_APP_SLUG: ${{ steps.mathgraph-app.outputs.app-slug }}
        run: node integrations/mathgraph-check-github/mention-actions-demo-v1.mjs
