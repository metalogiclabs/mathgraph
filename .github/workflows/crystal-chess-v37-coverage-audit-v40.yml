name: Crystal Chess V37 Coverage Audit V40

on:
  push:
    branches:
      - crystal-chess-v37-coverage-audit-v40
    paths:
      - "experiments/crystal_chess_v37_coverage_audit_v40.py"
      - ".github/workflows/crystal-chess-v37-coverage-audit-v40.yml"
      - "experiments/crystal_chess_adaptive_interface_compiler_v38.py"
      - "experiments/crystal_chess_root_reply_zeroing_v37.py"
      - "experiments/crystal_chess_root_pv_interface_v36.py"
      - "experiments/crystal_chess_search_sufficiency_v25.py"
      - "experiments/crystal_chess_search_confirmation_v26.py"
  workflow_dispatch:

jobs:
  v37-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_v37_coverage_audit_v40.py

      - name: Download frozen V25 guard
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-search-sufficiency-v25
          path: /tmp/v25
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36362896141

      - name: Download V39 fresh books
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-sentinel-compiler-v39
          path: /tmp/v39
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36505157227

      - name: Build pinned Stockfish authority
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/stockfish-bench.txt 2>&1

      - name: Audit full frozen V37 coverage on V39 targets
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v40
          python experiments/crystal_chess_v37_coverage_audit_v40.py             --stockfish /tmp/stockfish/src/stockfish             --guard /tmp/v25/search_sufficiency_guard_v25.json.gz             --epd-a /tmp/v39/fresh_a.epd             --manifest-a /tmp/v39/fresh_a_manifest.json             --epd-b /tmp/v39/fresh_b.epd             --manifest-b /tmp/v39/fresh_b_manifest.json             --output artifacts/crystal-chess-v40/result.json             | tee artifacts/crystal-chess-v40/run.log
          grep -Eq "CRYSTAL_CHESS_V37_COVERAGE_AUDIT_V40=(V37_SEMANTIC_COVERAGE_ABSENT_ON_V39_TARGET|V39_SENTINEL_RECALL_FAILURE_V37_SEMANTICS_SURVIVE|V37_SEMANTIC_TRANSFER_FAILURE)" artifacts/crystal-chess-v40/run.log
          cp /tmp/stockfish-bench.txt artifacts/crystal-chess-v40/
          cp /tmp/v25/search_sufficiency_guard_v25.json.gz artifacts/crystal-chess-v40/

      - name: Upload V40 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-v37-coverage-audit-v40
          path: artifacts/crystal-chess-v40/
          if-no-files-found: error
