name: Capability Lineage Adversarial SCC
on:
  push:
    branches: [research/capability-closure-lineage-conformance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qualified SCC canonical differential tests
        run: python -m unittest discover -s tests -p test_qualified_consequence_closure.py -v
      - name: Independent SCC adversarial comparison
        run: |
          mkdir -p "$RUNNER_TEMP/adversarial"
          python -m experiments.capability_lineage_adversarial --steps 100 --out "$RUNNER_TEMP/adversarial/results.csv"
          git rev-parse HEAD > "$RUNNER_TEMP/adversarial/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-lineage-adversarial-scc
          path: ${{ runner.temp }}/adversarial/
          if-no-files-found: warn
