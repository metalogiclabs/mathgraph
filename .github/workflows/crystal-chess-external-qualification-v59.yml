name: Crystal Chess External Qualification V59

on:
  push:
    branches:
      - crystal-chess-external-qualification-v59
    paths:
      - "external/chess/v59/**"
      - ".github/workflows/crystal-chess-external-qualification-v59.yml"
  workflow_dispatch:

jobs:
  qualify-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned Stockfish master
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          test "$(git -C /tmp/stockfish rev-parse HEAD)" = "0a215d6c9e48856ef630013b8ab8312941a59057"

      - name: Apply and verify frozen patch
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/external/chess/v59/stockfish-clock-gate-64ms.patch"
          git -C /tmp/stockfish apply --check "$patch"
          git -C /tmp/stockfish apply "$patch"
          git -C /tmp/stockfish diff --check
          test "$(git -C /tmp/stockfish diff --name-only)" = "src/search.cpp"
          git -C /tmp/stockfish diff --numstat -- src/search.cpp | awk '$1==4 && $2==0 && $3=="src/search.cpp"{ok=1} END{exit ok?0:1}'
          git -C /tmp/stockfish diff -- src/search.cpp | tee /tmp/applied.patch
          grep -q "tm.optimum() <= 64" /tmp/applied.patch

      - name: Build baseline
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/baseline
          git -C /tmp/baseline checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/baseline/src -j2 build ARCH=x86-64
          /tmp/baseline/src/stockfish bench 16 1 3 default depth > /tmp/baseline.bench 2>&1
          /tmp/baseline/src/stockfish bench > /tmp/baseline.default.bench 2>&1

      - name: Build candidate and verify fixed-depth bench identity
        run: |
          set -euo pipefail
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth > /tmp/candidate.bench 2>&1
          /tmp/stockfish/src/stockfish bench > /tmp/candidate.default.bench 2>&1
          base_nodes="$(grep -E 'Nodes searched' /tmp/baseline.bench | tail -1 | tr -dc '0-9')"
          cand_nodes="$(grep -E 'Nodes searched' /tmp/candidate.bench | tail -1 | tr -dc '0-9')"
          base_default="$(grep -E 'Nodes searched' /tmp/baseline.default.bench | tail -1 | tr -dc '0-9')"
          cand_default="$(grep -E 'Nodes searched' /tmp/candidate.default.bench | tail -1 | tr -dc '0-9')"
          printf 'baseline_nodes=%s\ncandidate_nodes=%s\nbaseline_default=%s\ncandidate_default=%s\n' "$base_nodes" "$cand_nodes" "$base_default" "$cand_default"
          test -n "$base_nodes"
          test -n "$base_default"
          test "$base_nodes" = "$cand_nodes"
          test "$base_default" = "$cand_default"

      - name: Seal qualification evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v59
          cp external/chess/v59/stockfish-clock-gate-64ms.patch artifacts/crystal-chess-v59/
          cp external/chess/v59/README.md artifacts/crystal-chess-v59/
          cp /tmp/baseline.bench artifacts/crystal-chess-v59/
          cp /tmp/candidate.bench artifacts/crystal-chess-v59/
          cp /tmp/baseline.default.bench artifacts/crystal-chess-v59/
          cp /tmp/candidate.default.bench artifacts/crystal-chess-v59/
          signature="$(grep -E 'Nodes searched' /tmp/candidate.default.bench | tail -1 | tr -dc '0-9')"
          printf 'Bench: %s\n' "$signature" > artifacts/crystal-chess-v59/BENCH_SIGNATURE.txt
          sha256sum artifacts/crystal-chess-v59/stockfish-clock-gate-64ms.patch > artifacts/crystal-chess-v59/PATCH_SHA256.txt
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > artifacts/crystal-chess-v59/STOCKFISH_PIN.txt
          printf '%s\n' "CRYSTAL_CHESS_EXTERNAL_QUALIFICATION_V59=PASS" | tee artifacts/crystal-chess-v59/QUALIFICATION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-external-qualification-v59
          path: artifacts/crystal-chess-v59/
          if-no-files-found: error
