name: WattBot full-source verified Flash-Lite QA holdout
on:
  push:
    branches: [wattbot-full-rag-v1]
    paths:
      - 'experiments/wattbot2026/full_reader.py'
      - 'experiments/wattbot2026/report_loader.py'
      - '.github/workflows/wattbot-full-reader.yml'
jobs:
  official-train-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 43
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PDF and scoring dependencies
        run: python -m pip install kaggle requests pandas pymupdf
      - name: Synthetic provenance and safe URL controls
        run: |
          python experiments/wattbot2026/report_loader.py
          python experiments/wattbot2026/full_reader.py --self-test
      - name: Score 24-vs-114 arXiv and report-augmented QA against official train holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/full_reader.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Preserve private corpus and score authority
        run: |
          echo "No PDF bytes, competition rows, LLM prompt transcripts or predictions uploaded as artifacts."
          echo "Only aggregate scores and document failure categories are logged."
