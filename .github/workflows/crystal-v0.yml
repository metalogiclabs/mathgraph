name: MathGraph Crystal V0

on:
  push:
    branches:
      - mathgraph-crystal-v0
  workflow_dispatch:

jobs:
  crystal-v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository test dependencies
        run: python -m pip install -e ".[all]"
      - name: Run crystal representation gate
        run: python -m pytest -q tests/test_crystal.py tests/test_crystal_source_pinned.py tests/test_crystal_quantitative.py
      - name: Recheck external TLA+ Peterson model
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathgraph-tla
          cd /tmp/mathgraph-tla
          curl -fsSL -o Peterson.tla https://raw.githubusercontent.com/tlaplus/Examples/c9e45d0e4695a8552d31105b93dff21456b7be69/specifications/locks_auxiliary_vars/Peterson.tla
          curl -fsSL -o Peterson.cfg https://raw.githubusercontent.com/tlaplus/Examples/c9e45d0e4695a8552d31105b93dff21456b7be69/specifications/locks_auxiliary_vars/Peterson.cfg
          curl -fsSL -o Lock.tla https://raw.githubusercontent.com/tlaplus/Examples/c9e45d0e4695a8552d31105b93dff21456b7be69/specifications/locks_auxiliary_vars/Lock.tla
          curl -fsSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  tla2tools.jar" | sha1sum -c -
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "Peterson.tla": "1c56470b957d680e7989d460c92738019a87a4b4",
              "Peterson.cfg": "ae8a5c6b21ea19334c8d019deb0a1ed5ea5c44f4",
              "Lock.tla": "d8ce7721d26ab726bf9a1f163a16b186f01931eb",
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              got = hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data
              ).hexdigest()
              assert got == sha, (name, got, sha)
          PY
          python - <<'PY'
          from pathlib import Path

          # TLC does not ship the proof-only TLAPS.tla module. Build a
          # model-check view from the exact pinned sources by removing only
          # the TLAPS import and proof sections. Spec, invariants, refinement
          # mapping, and configured PROPERTY remain byte-for-byte otherwise.
          for name in ("Peterson.tla", "Lock.tla"):
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              text = text.replace(", TLAPS", "")
              marker = "\n-------------------------------------------------------------------------------\n\nLEMMA"
              if marker in text:
                  text = text.split(marker, 1)[0] + "\n===============================================================================\n"
              p.write_text(text, encoding="utf-8")
          PY
          java -cp tla2tools.jar tlc2.TLC -workers 1 -config Peterson.cfg Peterson.tla | tee tlc.log
          grep -q "Model checking completed. No error has been found." tlc.log
          grep -q "77 states generated, 42 distinct states found" tlc.log
          grep -q "The depth of the complete state graph search is 11" tlc.log
      - name: Probe PRISM quantitative separator
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathgraph-prism
          cd /tmp/mathgraph-prism
          curl -fsSL -o robot.prism https://raw.githubusercontent.com/prismmodelchecker/prism/1eee02217bfdfbaad09dc34f27d6eeea5cde1020/prism-examples/imdps/simple/robot.prism
          curl -fsSL -o robot.props https://raw.githubusercontent.com/prismmodelchecker/prism/1eee02217bfdfbaad09dc34f27d6eeea5cde1020/prism-examples/imdps/simple/robot.props
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "robot.prism": "0b836883421726aaba676713c0656335206120d3",
              "robot.props": "53794f1ba7dac57fa5720ab138a5051e444ac402",
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()
              assert got == sha, (name, got, sha)
          PY
          curl -fsSL -o prism.tar.gz https://github.com/prismmodelchecker/prism/releases/download/v4.10.1/prism-4.10.1-linux64-x86.tar.gz
          echo "9f2135b1d49293cdc9b16b1756a24f99beff320b78134825c1f477f43942ab17  prism.tar.gz" | sha256sum -c -
          tar -xzf prism.tar.gz
          PRISM="$(find "$PWD" -type f -path '*/bin/prism' | head -1)"
          test -n "$PRISM"
          chmod +x "$PRISM"
          PRISM_ROOT="$(dirname "$(dirname "$PRISM")")"
          sed -i "s|^PRISM_DIR=.*|PRISM_DIR=$PRISM_ROOT|" "$PRISM"
          MODEL="$PWD/robot.prism"
          PROPS="$PWD/robot.props"
          LOG="$PWD/prism.log"
          cd "$(dirname "$PRISM")"
          ./prism "$MODEL" "$PROPS" -const delta=0.1 | tee "$LOG"
          grep -q "Result:" "$LOG"
          python - "$LOG" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          values = [float(x) for x in re.findall(r"Result: ([0-9.]+)", text)]
          assert len(values) == 4, values
          p_worst, p_best, r_worst, r_best = values
          assert 0.399 < p_worst < 0.401, values
          assert 0.599 < p_best < 0.601, values
          assert p_best - p_worst > 0.19, values
          assert 1.224 < r_worst < 1.226, values
          assert 1.210 < r_best < 1.212, values
          PY
      - name: Probe PRISM continuous-time rate separator
        run: |
          set -euo pipefail
          cd /tmp/mathgraph-prism
          curl -fsSL -o cell.sm https://raw.githubusercontent.com/prismmodelchecker/prism/1eee02217bfdfbaad09dc34f27d6eeea5cde1020/prism-examples/ctmcs/cell/cell.sm
          curl -fsSL -o cell.csl https://raw.githubusercontent.com/prismmodelchecker/prism/1eee02217bfdfbaad09dc34f27d6eeea5cde1020/prism-examples/ctmcs/cell/cell.csl
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "cell.sm": "91f88503b565779d6cfd2b77ed856b2f09ce953b",
              "cell.csl": "13b54bc990ed3133816d9ae3c056f442330afb9b",
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()
              assert got == sha, (name, got, sha)
          src = Path("cell.sm").read_text(encoding="utf-8")
          assert "const double lambda1=49;" in src
          fast = src.replace("const double lambda1=49;", "const double lambda1=98;")
          assert fast != src
          Path("cell_fast.sm").write_text(fast, encoding="utf-8")
          PY
          PRISM="$(find "$PWD" -type f -path '*/bin/prism' | head -1)"
          PRISM_ROOT="$(dirname "$(dirname "$PRISM")")"
          sed -i "s|^PRISM_DIR=.*|PRISM_DIR=$PRISM_ROOT|" "$PRISM"
          BASE="$PWD/cell.sm"
          FAST="$PWD/cell_fast.sm"
          CSL="$PWD/cell.csl"
          BASELOG="$PWD/cell_base.log"
          FASTLOG="$PWD/cell_fast.log"
          cd "$(dirname "$PRISM")"
          ./prism "$BASE" "$CSL" -prop 2 -const N=10,T=0.1 | tee "$BASELOG"
          ./prism "$FAST" "$CSL" -prop 2 -const N=10,T=0.1 | tee "$FASTLOG"
          python - "$BASELOG" "$FASTLOG" <<'PY'
          import re
          import sys
          from pathlib import Path

          vals = []
          for path in sys.argv[1:]:
              text = Path(path).read_text(encoding="utf-8")
              results = [float(x) for x in re.findall(r"Result: ([0-9.Ee+-]+)", text)]
              assert len(results) == 1, (path, results)
              vals.append(results[0])
          base, fast = vals
          print(f"CTMC_RATE_SEPARATOR base={base} fast={fast} gap={fast-base}")
          assert abs(fast - base) > 1e-4, vals
          PY
      - name: Probe PRISM partial-observation separator
        run: |
          set -euo pipefail
          cd /tmp/mathgraph-prism
          curl -fsSL -o guess.prism https://raw.githubusercontent.com/prismmodelchecker/prism/1eee02217bfdfbaad09dc34f27d6eeea5cde1020/prism-examples/pomdps/simple/guess.prism
          curl -fsSL -o guess.props https://raw.githubusercontent.com/prismmodelchecker/prism/1eee02217bfdfbaad09dc34f27d6eeea5cde1020/prism-examples/pomdps/simple/guess.props
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "guess.prism": "961f8bd540c9d1e1afa15d45413e9a17bee22277",
              "guess.props": "19500169192331d81956fca3d7cf0f5fb2d51b4b",
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()
              assert got == sha, (name, got, sha)

          src = Path("guess.prism").read_text(encoding="utf-8")
          assert "pomdp" in src
          assert "observables s endobservables" in src
          full = src.replace("pomdp", "mdp", 1).replace(
              "observables s endobservables\n\n", ""
          )
          Path("guess_full.prism").write_text(full, encoding="utf-8")
          PY
          PRISM="$(find "$PWD" -type f -path '*/bin/prism' | head -1)"
          PRISM_ROOT="$(dirname "$(dirname "$PRISM")")"
          sed -i "s|^PRISM_DIR=.*|PRISM_DIR=$PRISM_ROOT|" "$PRISM"
          POMDP="$PWD/guess.prism"
          FULL="$PWD/guess_full.prism"
          PROPS="$PWD/guess.props"
          PLOG="$PWD/guess_pomdp.log"
          FLOG="$PWD/guess_full.log"
          cd "$(dirname "$PRISM")"
          ./prism "$POMDP" "$PROPS" | tee "$PLOG"
          ./prism "$FULL" "$PROPS" | tee "$FLOG"
          python - "$PLOG" "$FLOG" <<'PY'
          import re
          import sys
          from pathlib import Path

          vals = []
          for path in sys.argv[1:]:
              text = Path(path).read_text(encoding="utf-8")
              results = [float(x) for x in re.findall(r"Result: ([0-9.Ee+-]+)", text)]
              assert len(results) == 1, (path, results)
              vals.append(results[0])
          partial, full = vals
          print(f"OBSERVATION_SEPARATOR partial={partial} full={full} gap={full-partial}")
          assert 0.59 < partial < 0.61, vals
          assert 0.999 < full <= 1.000001, vals
          assert full - partial > 0.39, vals
          PY
