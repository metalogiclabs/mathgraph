name: MathGraph Crystal V0

on:
  push:
    branches:
      - mathgraph-crystal-v0
  workflow_dispatch:

jobs:
  crystal-v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Run crystal representation gate
        run: python -m pytest -q tests/test_crystal.py
