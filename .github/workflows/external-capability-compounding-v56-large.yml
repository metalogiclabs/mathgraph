name: V56 Large Finite Opened Probe

on:
  push:
    branches: [external-capability-compounding-v56]
    paths:
      - 'experiments/external_capability_compounding_v56_large/**'
      - '.github/workflows/external-capability-compounding-v56-large.yml'
  workflow_dispatch:

jobs:
  large-finite-opened:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned exact-model backend
        run: python3 -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: Freeze external corpus bytes
        run: |
          mkdir -p external-v56-large
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v56-large/wb3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v56-large/wb3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v56-large/wb3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v56-large/wb3500.jsonl" | sha256sum -c -
      - name: Recover opened order-5/6 capabilities from equations only
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v56_large/probe.py \
            --wrong-book-3000 external-v56-large/wb3000.jsonl \
            --wrong-book-3500 external-v56-large/wb3500.jsonl \
            --timeout-ms 12000 \
            --out external-v56-large/results
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v56-large-finite-opened-probe
          path: external-v56-large/results/
