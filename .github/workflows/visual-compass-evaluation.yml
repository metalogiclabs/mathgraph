name: Visual compass independent replay
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - '.github/workflows/visual-compass-evaluation.yml'
      - 'experiments/uzh_rotation/visual_compass.py'
  workflow_dispatch:
jobs:
  visual-compass:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1 opencv-python-headless==4.10.0.84
      - name: Evaluate poster and boxes
        run: |
          for scene in poster_rotation boxes_rotation; do
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 600 "https://rpg.ifi.uzh.ch/datasets/davis/${scene}.zip" -o "${scene}.zip"
            python experiments/uzh_rotation/visual_compass.py "${scene}.zip" --frames 450 --output "${scene}_compass.json"
            python experiments/uzh_rotation/visual_compass.py "${scene}.zip" --frames 450 --strip-width 48 --output "${scene}_strip48.json"
            python experiments/uzh_rotation/visual_compass.py "${scene}.zip" --frames 450 --blackout-start 280 --blackout-length 90 --output "${scene}_blackout.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-compass-results
          path: |
            *_compass.json
            *_strip48.json
            *_blackout.json
          if-no-files-found: warn
