name: Trace the Ace V156 V75 Prior Graft

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: V145 portable source run
        required: false
        default: '32792841883'
  push:
    paths:
      - 'experiments/trace_the_ace_v156/**'
      - '.github/workflows/trace-the-ace-v156-v75-prior-graft.yml'

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fold: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve source run
        id: src
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=32792841883" >> "$GITHUB_OUTPUT"
          fi
      - name: Download V145 bundle
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.src.outputs.run }}
          repository: metalogiclabs/mathgraph
      - name: Verify bundle
        run: test -s v145-portable/v146_bundle.npz
      - name: Prepare CPU
        run: python -m pip install -q numpy pandas scipy scikit-learn
      - name: Run V75 graft fold
        run: |
          mkdir -p v156-fold
          python experiments/trace_the_ace_v156/run_v156_v75_prior_graft.py \
            --bundle v145-portable/v146_bundle.npz \
            --fold ${{ matrix.fold }} \
            --out v156-fold/v156_fold_${{ matrix.fold }}.json
      - name: Publish fold
        run: cat v156-fold/v156_fold_${{ matrix.fold }}.json
      - name: Upload fold
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v156-fold-${{ matrix.fold }}-${{ github.run_id }}
          path: v156-fold/v156_fold_${{ matrix.fold }}.json
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download folds
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v156-fold-*-${{ github.run_id }}
          path: v156-folds
          merge-multiple: false
      - name: Aggregate
        run: |
          mkdir -p v156-results
          python experiments/trace_the_ace_v156/run_v156_v75_prior_graft.py \
            --merge-root v156-folds \
            --out v156-results/v156_results.json
      - name: Publish result
        run: cat v156-results/v156_results.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v156-v75-prior-graft-${{ github.run_id }}
          path: v156-results/v156_results.json
          retention-days: 30
