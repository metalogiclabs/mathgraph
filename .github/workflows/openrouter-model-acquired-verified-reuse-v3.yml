name: OpenRouter model-acquired verified reuse V3

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model ID
        required: false
        default: google/gemma-4-31b-it
      provider:
        description: OpenRouter provider slug
        required: false
        default: deepinfra
  push:
    branches:
      - open-math-model-sustained-use-v1
    paths:
      - "scripts/run_openrouter_model_acquired_verified_reuse_v3.py"
      - ".github/workflows/openrouter-model-acquired-verified-reuse-v3.yml"

permissions:
  contents: read

jobs:
  model-acquired-verified-reuse-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ github.event.inputs.model || 'google/gemma-4-31b-it' }}
      OPENROUTER_PROVIDER: ${{ github.event.inputs.provider || 'deepinfra' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require OpenRouter API key
        run: |
          test -n "$OPENROUTER_API_KEY"

      - name: Run model-acquired verified reuse V3
        run: |
          python scripts/run_openrouter_model_acquired_verified_reuse_v3.py \
            --out-dir /tmp/openrouter-model-acquired-v3 \
            --model "$OPENROUTER_MODEL" \
            --provider "$OPENROUTER_PROVIDER" \
            --acquisition-rounds 3

      - name: Audit V3 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/openrouter-model-acquired-v3/report.json").read_text()
          )
          print(json.dumps({
              "verdict": report["verdict"],
              "model": report["model"],
              "provider": report["provider"],
              "acquisition_outcomes": report["acquisition_outcomes"],
              "acquisition_cost": report["acquisition_cost"],
              "promoted_capability_count": len(report["promoted_capabilities"]),
              "aggregate": report["aggregate"],
              "comparisons": report["comparisons"],
              "gates": report["gates"],
              "claim_boundary": report["claim_boundary"],
          }, indent=2, sort_keys=True))
          assert report["verdict"] == "PASS"
          assert all(report["gates"].values())
          assert len(report["acquisition_tasks"]) == 4
          assert len(report["fresh_tasks"]) == 7
          assert len(report["promoted_capabilities"]) >= 1
          PY

      - name: Upload V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-model-acquired-verified-reuse-v3
          path: /tmp/openrouter-model-acquired-v3/
          if-no-files-found: warn
