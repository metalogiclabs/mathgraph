name: Crystal Chess Clock Gate Replication V56

on:
  push:
    branches:
      - crystal-chess-clock-gate-replication-v56
    paths:
      - ".github/workflows/crystal-chess-clock-gate-replication-v56.yml"
      - "experiments/crystal_chess_apply_clock_gate_v56.py"
      - "experiments/crystal_chess_timemgmt_ablation_v51.py"
      - "experiments/crystal_chess_normal_exposure_v22.py"
  workflow_dispatch:

jobs:
  replication:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fast
            tc: "1+0.01"
            seed: 20261110
          - label: mid
            tc: "2+0.02"
            seed: 20261111
          - label: slow
            tc: "5+0.05"
            seed: 20261112
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_apply_clock_gate_v56.py
          python -m py_compile experiments/crystal_chess_timemgmt_ablation_v51.py
          python -m py_compile experiments/crystal_chess_normal_exposure_v22.py

      - name: Build pinned baseline Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish-base
          git -C /tmp/stockfish-base checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish-base/src -j2 build ARCH=x86-64
          /tmp/stockfish-base/src/stockfish bench 16 1 3 default depth > /tmp/baseline-bench.txt 2>&1

      - name: Build frozen V56 candidate
        run: |
          set -euo pipefail
          cp -a /tmp/stockfish-base /tmp/stockfish-cand
          mkdir -p "artifacts/crystal-chess-v56/${{ matrix.label }}"
          python experiments/crystal_chess_apply_clock_gate_v56.py --search-cpp /tmp/stockfish-cand/src/search.cpp
          git -C /tmp/stockfish-cand diff -- src/search.cpp > "artifacts/crystal-chess-v56/${{ matrix.label }}/stockfish.patch"
          test -s "artifacts/crystal-chess-v56/${{ matrix.label }}/stockfish.patch"
          sha256sum "artifacts/crystal-chess-v56/${{ matrix.label }}/stockfish.patch" > "artifacts/crystal-chess-v56/${{ matrix.label }}/PATCH_SHA256.txt"
          make -C /tmp/stockfish-cand/src -j2 build ARCH=x86-64
          /tmp/stockfish-cand/src/stockfish bench 16 1 3 default depth > "artifacts/crystal-chess-v56/${{ matrix.label }}/candidate-bench.txt" 2>&1

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Disservin/fastchess.git /tmp/fastchess
          git -C /tmp/fastchess checkout 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          make -C /tmp/fastchess -j2

      - name: Generate untouched openings
        run: |
          set -euo pipefail
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish-base/src/stockfish             --book "artifacts/crystal-chess-v56/${{ matrix.label }}/normal.epd"             --manifest "artifacts/crystal-chess-v56/${{ matrix.label }}/normal_manifest.json"             --openings 1024 --plies 12 --depth 6 --multipv 4 --seed ${{ matrix.seed }}

      - name: Run 2048-game paired replication
        run: |
          set -euo pipefail
          /tmp/fastchess/fastchess             -engine cmd=/tmp/stockfish-cand/src/stockfish name=CrystalClockGateV56             -engine cmd=/tmp/stockfish-base/src/stockfish name=StockfishBaseline             -each tc=${{ matrix.tc }} option.Threads=1 option.Hash=16 option.Ponder=false             -openings file="artifacts/crystal-chess-v56/${{ matrix.label }}/normal.epd" format=epd order=sequential             -rounds 1024 -repeat -concurrency 4             -pgnout file="artifacts/crystal-chess-v56/${{ matrix.label }}/match.pgn"             -log file="artifacts/crystal-chess-v56/${{ matrix.label }}/fastchess.log" level=info             | tee "artifacts/crystal-chess-v56/${{ matrix.label }}/fastchess.stdout"

      - name: Analyse replication Elo
        run: |
          set -euo pipefail
          python experiments/crystal_chess_timemgmt_ablation_v51.py             --pgn "artifacts/crystal-chess-v56/${{ matrix.label }}/match.pgn"             --candidate-name CrystalClockGateV56             --variant "clock_gate_64ms_${{ matrix.label }}"             --output "artifacts/crystal-chess-v56/${{ matrix.label }}/result.json"             | tee "artifacts/crystal-chess-v56/${{ matrix.label }}/analyse.log"
          grep -q "CRYSTAL_CHESS_TIMEMGMT_ABLATION_V51=PASS" "artifacts/crystal-chess-v56/${{ matrix.label }}/analyse.log"
          cp /tmp/baseline-bench.txt "artifacts/crystal-chess-v56/${{ matrix.label }}/"
          printf '%s\n' "V55 frozen gate: tm.optimum() <= 64ms; V56 independent replication only, no retuning." > "artifacts/crystal-chess-v56/${{ matrix.label }}/LINEAGE.txt"

      - name: Upload V56 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-clock-gate-replication-v56-${{ matrix.label }}
          path: artifacts/crystal-chess-v56/${{ matrix.label }}/
          if-no-files-found: error
