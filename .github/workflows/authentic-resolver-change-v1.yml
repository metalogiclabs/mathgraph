name: Authentic Resolver Source Change V1
on:
  push:
    branches:
      - research/authentic-resolver-change-release-v1-20261021
  pull_request:
    paths:
      - 'research/authentic_resolver_change_v1/**'
      - 'mathgraph_check/warrant_resolution.py'
      - '.github/workflows/authentic-resolver-change-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-change:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin native pytest runner
        run: python -m pip install pytest==9.0.3
      - name: Acquire exact pinned source fixtures required by existing native tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resolve-sources"
          curl --fail --location --silent --show-error --retry 3 --max-time 60             https://raw.githubusercontent.com/openai/math/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/history.md             -o "$RUNNER_TEMP/resolve-sources/history.md"
          curl --fail --location --silent --show-error --retry 3 --max-time 90             -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11657687808/zip"             -o "$RUNNER_TEMP/resolve-sources/l4yaml-v1.zip"
          curl --fail --location --silent --show-error --retry 3 --max-time 90             -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11657314389/zip"             -o "$RUNNER_TEMP/resolve-sources/l4yaml-v2.zip"
          echo "41c2a2d470014b3628695c7aabf5fd0c93f6f687621fca172062f22b59ed6a1e  $RUNNER_TEMP/resolve-sources/history.md" | sha256sum -c -
          echo "b75581017d6620481c77e52b350e8bb8631d11747a92789f7887cde527807086  $RUNNER_TEMP/resolve-sources/l4yaml-v1.zip" | sha256sum -c -
          echo "61fc93815e3329c0490324f52897a94d3417044a5cf16a8e1e0f0109aa0e515e  $RUNNER_TEMP/resolve-sources/l4yaml-v2.zip" | sha256sum -c -
          echo "MATHGRAPH_OPENAI_HISTORY_MD=$RUNNER_TEMP/resolve-sources/history.md" >> "$GITHUB_ENV"
          echo "MATHGRAPH_V1_EVIDENCE_ZIP=$RUNNER_TEMP/resolve-sources/l4yaml-v1.zip" >> "$GITHUB_ENV"
          echo "MATHGRAPH_V2_EVIDENCE_ZIP=$RUNNER_TEMP/resolve-sources/l4yaml-v2.zip" >> "$GITHUB_ENV"
      - name: Actual resolver code change, independent parity and baseline
        run: |
          python -m py_compile mathgraph_check/warrant_resolution.py research/authentic_resolver_change_v1/experiment.py
          PYTHONPATH=. python research/authentic_resolver_change_v1/experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-resolver-change-v1-native
          path: research/authentic_resolver_change_v1/result.json
          if-no-files-found: warn
