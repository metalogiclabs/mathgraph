name: VDN ARC-AGI-2 v21 relation product
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v21_relation_product.py'
      - '.github/workflows/vdn-arc2-v21.yml'
permissions:
  contents: read
jobs:
  relation-product:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/arc2
          cd /tmp/arc2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
      - run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v21_relation_product.py /tmp/arc2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-v21
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v21_relation_product/result.json
