name: PKC R15 independent numerical warrant
on:
  push:
    branches: ['experiment/pkc-r15-warrant-20261125']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone https://github.com/nasa-jpl/PropertyKindCalculus.git pkc
          git -C pkc checkout --detach 97153d3fad3cb8e5e018d2df5f7aeb4a406ff7e4
          cp R15Probe.lean pkc/
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - working-directory: pkc
        run: |
          set -eo pipefail
          lake exe cache get || true
          lake build +PropertyKindCalculus.Uncertainty.Adequacy32
          lake env lean --run R15Probe.lean | tee r15.txt
          sha256sum R15Probe.lean r15.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-warrant-evidence
          path: |
            pkc/R15Probe.lean
            pkc/r15.txt
            pkc/SHA256SUMS
