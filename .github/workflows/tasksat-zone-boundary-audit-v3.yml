name: TaskSAT Crystal zone-boundary audit v3

on:
  push:
    branches:
      - tasksat-crystal-optional-zone-audit-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch pinned TaskSAT
        run: |
          git clone https://github.com/nasa-jpl/tasksat.git /tmp/tasksat
          git -C /tmp/tasksat checkout f9d6063b45967a3fea578c47f54806aadaafe1b0
          test "$(git -C /tmp/tasksat rev-parse HEAD)" = "f9d6063b45967a3fea578c47f54806aadaafe1b0"
      - name: Install dependencies
        run: python -m pip install -r /tmp/tasksat/requirements.txt
      - name: Run boundary semantics audit
        run: |
          python experiments/tasksat_optional_zone_audit_v1/audit_v3.py /tmp/tasksat | tee tasksat_zone_boundary_audit_v3.log
          grep -q PASS_TASKSAT_ZONE_BOUNDARY_SEMANTIC_AUDIT tasksat_zone_boundary_audit_v3.log
      - uses: actions/upload-artifact@v4
        with:
          name: tasksat-zone-boundary-audit-v3
          path: |
            tasksat_zone_boundary_audit_v3_evidence.json
            tasksat_zone_boundary_audit_v3.log
