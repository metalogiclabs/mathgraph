name: Observation protocol V4 bounded test
on:
  push:
    branches: [research/observation-protocol-v4-20261022]
  workflow_dispatch:
jobs:
  protocol-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - run: python research/generic_observation_v3/protocol_v4.py
