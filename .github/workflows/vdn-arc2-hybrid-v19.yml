name: VDN ARC-AGI-2 hybrid relation v19
on:
  push:
    branches: [vdn-arc2-meta-v11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybrid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Run hybrid relation test
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v19_hybrid_relation.py /tmp/ARC-AGI-2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-hybrid-v19
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v19_hybrid_relation/result.json
