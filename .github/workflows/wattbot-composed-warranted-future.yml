name: WattBot compose refusal, second-pass and citation future
on:
  push:
    branches: [wattbot-composed-warranted-future-v1]
    paths:
      - '.github/workflows/wattbot-composed-warranted-future.yml'
      - 'experiments/wattbot2026/residual_second_pass_probe.py'
      - 'experiments/wattbot2026/abstention_boundary.py'
      - 'experiments/wattbot2026/citation_refinement.py'
jobs:
  same-response-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact scored proof and source PDF dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Verify abstention, evidence quotient and pinned reader contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/abstention_boundary.py
          python experiments/wattbot2026/citation_refinement.py
          python experiments/wattbot2026/residual_second_pass_probe.py --self-test
      - name: Compare admissible composition against individual controls on identical TRAIN first replies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/residual_second_pass_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Authority and cost
        run: |
          echo "Same primary replies, optional K10 second reply after quotation failure, no answer labels during inference."
          echo "Keep exactly warranted source-page quotations; preserve explicit is_blank evidence field contract."
          echo "Unverified source reranking does not become scientific evidence."
          echo "Additional reserved OpenRouter price capped at USD 0.16; official TRAIN only."
          echo "No Kaggle TEST, submission, private label rows or source PDF artifacts."
