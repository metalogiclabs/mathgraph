name: VDN ARC-AGI-2 v32b bounded oracle reachability
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v32b_oracle_reachability_bounded.py'
      - '.github/workflows/vdn-arc2-v32b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/arc2
          cd /tmp/arc2 && git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Bounded oracle search
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v32b_oracle_reachability_bounded.py /tmp/arc2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-v32b
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v32b_oracle_reachability_bounded/result.json
