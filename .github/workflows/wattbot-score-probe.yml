name: WattBot official scorer baseline
on:
  push:
    branches: [wattbot-2026-v1]
    paths:
      - 'experiments/wattbot2026/official_score_probe.py'
      - '.github/workflows/wattbot-score-probe.yml'
jobs:
  pinned-scorer-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle pandas numpy
      - name: Run pinned official scorer on non-informative training baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/official_score_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
