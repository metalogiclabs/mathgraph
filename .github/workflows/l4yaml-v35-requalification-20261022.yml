name: L4YAML exact-source independent requalification

on:
  push:
    branches:
      - research/l4yaml-v35-requalification-20261022

permissions:
  contents: read

jobs:
  pinned-source-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout existing MathGraph independent verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout unmodified upstream exact commit
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: c65755071dd91025b043b6f5e51ddb6578e9746b
          path: target
          submodules: false
          persist-credentials: false

      - name: Verify repository identity and source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target remote get-url origin)" = "https://github.com/nasa-jpl/L4YAML"
          test "$(git -C target rev-parse HEAD)" = "c65755071dd91025b043b6f5e51ddb6578e9746b"
          test "$(cat target/lean-toolchain)" = "leanprover/lean4:v4.35.0"
          sha256sum research/l4yaml_schema_style_v1/Probe.lean \
            research/l4yaml_schema_style_v1/analyze.py \
            research/l4yaml_schema_style_v1/test_verifier.py
          test -z "$(git -C target status --short)"

      - name: Install declared Lean 4.35 toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile source-native schema API and emitter
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          cd target
          lake build L4YAML.Schema.Api L4YAML.Schema.Deriving L4YAML.Output.Dump \
            2>&1 | tee "$RUNNER_TEMP/l4yaml-v35-schema-build.log"

      - name: Replay unchanged independent Lean semantic probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/l4yaml_schema_style_v1/results
          cd target
          lake env lean ../research/l4yaml_schema_style_v1/Probe.lean \
            2>&1 | tee ../research/l4yaml_schema_style_v1/results/current-native.log
          test -z "$(git status --short)"

      - name: Configure independent YAML readers
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Independently verify all semantic checks are green
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "PyYAML==6.0.3" "ruamel.yaml==0.18.17"
          python research/l4yaml_schema_style_v1/analyze.py \
            --lean-log research/l4yaml_schema_style_v1/results/current-native.log \
            --out research/l4yaml_schema_style_v1/results/current-fixed-receipt.json \
            --expect fixed-green \
            --upstream-sha c65755071dd91025b043b6f5e51ddb6578e9746b

      - name: Reject wrong red expectation and verify harness controls
        shell: bash
        run: |
          set -euo pipefail
          if python research/l4yaml_schema_style_v1/analyze.py \
            --lean-log research/l4yaml_schema_style_v1/results/current-native.log \
            --out research/l4yaml_schema_style_v1/results/incorrect-original-receipt.json \
            --expect original-red \
            --upstream-sha c65755071dd91025b043b6f5e51ddb6578e9746b; then
            echo "FAIL: current source admitted under original-RED expectation"
            exit 1
          fi
          test ! -e research/l4yaml_schema_style_v1/results/incorrect-original-receipt.json
          python research/l4yaml_schema_style_v1/test_verifier.py

      - name: Execute upstream schema and cross-module deriving tests
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd target
          lake build schemadump derivingconsumer \
            2>&1 | tee "$RUNNER_TEMP/l4yaml-v35-regression-build.log"
          lake exe schemadump | tee "$RUNNER_TEMP/l4yaml-v35-schemadump.log"
          lake exe derivingconsumer | tee "$RUNNER_TEMP/l4yaml-v35-derivingconsumer.log"
          python - "$RUNNER_TEMP/l4yaml-v35-schemadump.log" "$RUNNER_TEMP/l4yaml-v35-derivingconsumer.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          for p in map(Path, sys.argv[1:]):
              raw = p.read_text()
              summaries = re.findall(r'^=== Results: (\d+)/(\d+) passed ===$', raw, flags=re.M)
              assert len(summaries) == 1, f'{p}: missing or ambiguous test summary'
              passed, total = map(int, summaries[0])
              assert total > 0 and passed == total, f'{p}: only {passed}/{total} passed'
              assert not re.search(r'^\s*✗ |\bFAILED\b', raw, flags=re.M), f'{p}: failure marker'
              print(f'INDEPENDENT_UPSTREAM_SUITE_PASS {p.name}: {passed}/{total}')
          PY
          test -z "$(git status --short)"

      - name: Build independent external module-system consumer package
        shell: bash
        timeout-minutes: 50
        run: |
          set -euo pipefail
          cd research/l4yaml_external_consumer_v35
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          lake build Probe 2>&1 | tee "$RUNNER_TEMP/l4yaml-v35-external-consumer.log"
          test "$(git -C .lake/packages/L4YAML rev-parse HEAD)" = "c65755071dd91025b043b6f5e51ddb6578e9746b"
          test "$(git -C .lake/packages/L4YAML remote get-url origin)" = "https://github.com/nasa-jpl/L4YAML.git"
          test -z "$(git -C .lake/packages/L4YAML status --short)"
          echo "INDEPENDENT_EXTERNAL_MODULE_CONSUMER_PASS"

      - name: Preserve exact-head audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4yaml-v35-source-requalification
          path: |
            research/l4yaml_schema_style_v1/Probe.lean
            research/l4yaml_schema_style_v1/analyze.py
            research/l4yaml_schema_style_v1/test_verifier.py
            research/l4yaml_schema_style_v1/results/
            research/l4yaml_external_consumer_v35/Probe.lean
            research/l4yaml_external_consumer_v35/lakefile.lean
            research/l4yaml_external_consumer_v35/lean-toolchain
            ${{ runner.temp }}/l4yaml-v35-schema-build.log
            ${{ runner.temp }}/l4yaml-v35-regression-build.log
            ${{ runner.temp }}/l4yaml-v35-schemadump.log
            ${{ runner.temp }}/l4yaml-v35-derivingconsumer.log
            ${{ runner.temp }}/l4yaml-v35-external-consumer.log
          if-no-files-found: ignore
