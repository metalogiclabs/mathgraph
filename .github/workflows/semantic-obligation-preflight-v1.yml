name: Pre-exposure API obligation proposer self-tests
on:
  push:
    branches:
      - research/semantic-obligation-induction-v1-20261019
    paths:
      - 'research/semantic_obligation_induction_v1/**'
      - '.github/workflows/semantic-obligation-preflight-v1.yml'
  pull_request:
    paths:
      - 'research/semantic_obligation_induction_v1/**'
      - '.github/workflows/semantic-obligation-preflight-v1.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify only synthetic public APIs; no held-out source opened
        run: python research/semantic_obligation_induction_v1/preflight.py
