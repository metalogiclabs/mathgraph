name: Crystal Chess Effort Confirmation V54

on:
  push:
    branches:
      - crystal-chess-effort-confirmation-v54
    paths:
      - ".github/workflows/crystal-chess-effort-confirmation-v54.yml"
      - "experiments/crystal_chess_timemgmt_ablation_v51.py"
      - "experiments/crystal_chess_normal_exposure_v22.py"
  workflow_dispatch:

jobs:
  confirmation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fast
            tc: "1+0.01"
            openings: 2048
            rounds: 2048
            seed: 20261105
          - label: slow
            tc: "5+0.05"
            openings: 512
            rounds: 512
            seed: 20261106
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_timemgmt_ablation_v51.py
          python -m py_compile experiments/crystal_chess_normal_exposure_v22.py

      - name: Build pinned baseline Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish-base
          git -C /tmp/stockfish-base checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish-base/src -j2 build ARCH=x86-64
          /tmp/stockfish-base/src/stockfish bench 16 1 3 default depth > /tmp/baseline-bench.txt 2>&1

      - name: Reproduce frozen V51/V53 effort patch
        run: |
          set -euo pipefail
          cp -a /tmp/stockfish-base /tmp/stockfish-cand
          mkdir -p "artifacts/crystal-chess-v54/${{ matrix.label }}"
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('/tmp/stockfish-cand/src/search.cpp')
          s=p.read_text()
          effort=r'''double highBestMoveEffort = std::clamp\(
          \s*interpolate\(i64\(nodesEffort\), i64\(75800\), i64\(104510\), 0\.969, 0\.714\), 0\.693, 0\.838\);'''
          s,n=re.subn(effort,'double highBestMoveEffort = 1.0;',s,count=1)
          assert n==1, ('effort patch drift',n)
          p.write_text(s)
          PY
          git -C /tmp/stockfish-cand diff -- src/search.cpp > "artifacts/crystal-chess-v54/${{ matrix.label }}/stockfish.patch"
          test -s "artifacts/crystal-chess-v54/${{ matrix.label }}/stockfish.patch"
          sha256sum "artifacts/crystal-chess-v54/${{ matrix.label }}/stockfish.patch" | tee "artifacts/crystal-chess-v54/${{ matrix.label }}/PATCH_SHA256.txt"
          make -C /tmp/stockfish-cand/src -j2 build ARCH=x86-64
          /tmp/stockfish-cand/src/stockfish bench 16 1 3 default depth > "artifacts/crystal-chess-v54/${{ matrix.label }}/candidate-bench.txt" 2>&1

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Disservin/fastchess.git /tmp/fastchess
          git -C /tmp/fastchess checkout 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          make -C /tmp/fastchess -j2

      - name: Generate untouched openings
        run: |
          set -euo pipefail
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish-base/src/stockfish             --book "artifacts/crystal-chess-v54/${{ matrix.label }}/normal.epd"             --manifest "artifacts/crystal-chess-v54/${{ matrix.label }}/normal_manifest.json"             --openings ${{ matrix.openings }} --plies 12 --depth 6 --multipv 4 --seed ${{ matrix.seed }}

      - name: Run paired confirmation match
        run: |
          set -euo pipefail
          /tmp/fastchess/fastchess             -engine cmd=/tmp/stockfish-cand/src/stockfish name=CrystalEffortV54             -engine cmd=/tmp/stockfish-base/src/stockfish name=StockfishBaseline             -each tc=${{ matrix.tc }} option.Threads=1 option.Hash=16 option.Ponder=false             -openings file="artifacts/crystal-chess-v54/${{ matrix.label }}/normal.epd" format=epd order=sequential             -rounds ${{ matrix.rounds }} -repeat -concurrency 4             -pgnout file="artifacts/crystal-chess-v54/${{ matrix.label }}/match.pgn"             -log file="artifacts/crystal-chess-v54/${{ matrix.label }}/fastchess.log" level=info             | tee "artifacts/crystal-chess-v54/${{ matrix.label }}/fastchess.stdout"

      - name: Analyse confirmation Elo
        run: |
          set -euo pipefail
          python experiments/crystal_chess_timemgmt_ablation_v51.py             --pgn "artifacts/crystal-chess-v54/${{ matrix.label }}/match.pgn"             --candidate-name CrystalEffortV54             --variant effort             --output "artifacts/crystal-chess-v54/${{ matrix.label }}/result.json"             | tee "artifacts/crystal-chess-v54/${{ matrix.label }}/analyse.log"
          grep -q "CRYSTAL_CHESS_TIMEMGMT_ABLATION_V51=PASS" "artifacts/crystal-chess-v54/${{ matrix.label }}/analyse.log"
          cp /tmp/baseline-bench.txt "artifacts/crystal-chess-v54/${{ matrix.label }}/"
          printf '%s\n' "V51 effort +13.579 Elo / 512 games; V53 effort +6.278 Elo / 2048 games; V54 frozen confirmatory only" > "artifacts/crystal-chess-v54/${{ matrix.label }}/LINEAGE.txt"
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > "artifacts/crystal-chess-v54/${{ matrix.label }}/STOCKFISH_PIN.txt"
          printf '%s\n' "Disservin/fastchess@60d7a7a26c6b0582a15c112fb29a1829bef2adb3" > "artifacts/crystal-chess-v54/${{ matrix.label }}/FASTCHESS_PIN.txt"

      - name: Upload V54 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-effort-confirmation-v54-${{ matrix.label }}
          path: artifacts/crystal-chess-v54/${{ matrix.label }}/
          if-no-files-found: error
