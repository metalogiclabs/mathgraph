name: VDN ARC embedding-context future quotient V16

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v16_embedding_context_future_quotient.py"
      - ".github/workflows/vdn-arc-embedding-v16.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedding-context-future-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V16 embedding-context quotient
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v16_embedding_context_future_quotient.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-embedding-v16
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v16_embedding_context_future_quotient/result.json
