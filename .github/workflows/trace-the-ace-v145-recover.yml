name: Trace the Ace V145 Cache Recovery

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted GPU runner label"
        required: true
        default: trace-ace-gpu
        type: string
      data_root:
        description: "Directory containing Trace the Ace train files and transcripts zip"
        required: true
        default: /root/trace_the_ace
        type: string
      model:
        description: "Frozen semantic judge"
        required: true
        default: Qwen/Qwen3-8B-AWQ
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: trace-ace-v145-cache-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Rebuild and persist V145 semantic cache
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 720
    env:
      HF_HOME: /root/hf-cache
      V145_GPU_MEMORY: "0.90"
      V145_MAX_MODEL_LEN: "4096"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify source data and GPU
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          test -s "${{ inputs.data_root }}/train_features_TMQTWsB.csv"
          test -s "${{ inputs.data_root }}/train_labels_44ujmj2.csv"
          test -s "${{ inputs.data_root }}/trace_the_ace_transcripts_v123_single_run_fresh.zip"
      - name: Prepare CUDA 12.8 compatible environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /root/venvs/trace-ace-v145-recovery-cu128
          python3 -m venv /root/venvs/trace-ace-v145-recovery-cu128 --system-site-packages
          source /root/venvs/trace-ace-v145-recovery-cu128/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "vllm==0.10.2" \
            "transformers>=4.51" \
            numpy pandas scipy scikit-learn \
            --extra-index-url https://download.pytorch.org/whl/cu128
          python - <<'PY'
          import torch, vllm
          print('torch', torch.__version__)
          print('torch CUDA', torch.version.cuda)
          print('vllm', vllm.__version__)
          print('cuda available', torch.cuda.is_available())
          assert torch.cuda.is_available(), 'CUDA unavailable after pinned install'
          assert str(torch.version.cuda).startswith('12.8'), f'unexpected torch CUDA build: {torch.version.cuda}'
          PY
      - name: Rebuild V145 cache
        shell: bash
        run: |
          set -euo pipefail
          source /root/venvs/trace-ace-v145-recovery-cu128/bin/activate
          ROOT=/root/trace-ace-results/v145-recovery-${{ github.run_id }}
          mkdir -p "$ROOT/work"
          python experiments/trace_the_ace_v145/run_v145_semantic_gate.py \
            --features "${{ inputs.data_root }}/train_features_TMQTWsB.csv" \
            --labels "${{ inputs.data_root }}/train_labels_44ujmj2.csv" \
            --transcripts "${{ inputs.data_root }}/trace_the_ace_transcripts_v123_single_run_fresh.zip" \
            --model "${{ inputs.model }}" \
            --limit 8000 \
            --control-limit 2500 \
            --work "$ROOT/work" \
            --out "$ROOT/v145_results.json"
          python experiments/trace_the_ace_v145/export_v146_bundle.py \
            --features "${{ inputs.data_root }}/train_features_TMQTWsB.csv" \
            --labels "${{ inputs.data_root }}/train_labels_44ujmj2.csv" \
            --transcripts "${{ inputs.data_root }}/trace_the_ace_transcripts_v123_single_run_fresh.zip" \
            --v145-work "$ROOT/work" \
            --limit 8000 \
            --control-limit 2500 \
            --out "$ROOT/v146_bundle.npz"
      - name: Upload durable CPU-ready evidence
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v145-portable-${{ github.run_id }}
          path: |
            /root/trace-ace-results/v145-recovery-${{ github.run_id }}/v145_results.json
            /root/trace-ace-results/v145-recovery-${{ github.run_id }}/v146_bundle.npz
            /root/trace-ace-results/v145-recovery-${{ github.run_id }}/work/semantic_scores.jsonl
            /root/trace-ace-results/v145-recovery-${{ github.run_id }}/work/objective_swap_scores.jsonl
            /root/trace-ace-results/v145-recovery-${{ github.run_id }}/work/evidence_empty_scores.jsonl
          if-no-files-found: error
          retention-days: 90
