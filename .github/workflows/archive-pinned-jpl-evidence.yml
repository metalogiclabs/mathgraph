name: Preserve pinned JPL evidence as draft release assets
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ARCHIVE_PINNED_JPL_EVIDENCE to create a draft release'
        required: true
        type: string
jobs:
  archive:
    if: inputs.confirm == 'ARCHIVE_PINNED_JPL_EVIDENCE'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download and independently hash-check original artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jpl-evidence"
          for entry in "11657687808 l4yaml-v1.zip" "11657314389 l4yaml-v2.zip"; do
            set -- $entry
            curl --fail --location --silent --show-error --retry 3 --max-time 120 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              -o "$RUNNER_TEMP/jpl-evidence/$2"
          done
          cd "$RUNNER_TEMP/jpl-evidence"
          echo "b75581017d6620481c77e52b350e8bb8631d11747a92789f7887cde527807086  l4yaml-v1.zip" | sha256sum -c -
          echo "61fc93815e3329c0490324f52897a94d3417044a5cf16a8e1e0f0109aa0e515e  l4yaml-v2.zip" | sha256sum -c -
          sha256sum *.zip > SHA256SUMS
      - name: Create nonpublished immutable-name evidence archive draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=mathgraph-jpl-evidence-20261011-v1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Archive release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/jpl-evidence/l4yaml-v1.zip" \
            "$RUNNER_TEMP/jpl-evidence/l4yaml-v2.zip" \
            "$RUNNER_TEMP/jpl-evidence/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Pinned JPL evidence archive (review required)" \
            --notes "Draft archive of SHA-256 checked historical JPL evidence. Not production, not a new verification claim. Review and publish only after provenance and retention review."
