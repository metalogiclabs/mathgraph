name: Check axiom admission candidate
on:
  push:
    branches:
      - experiment/check-axiom-admission-v1
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/check-axiom-admission-v0/**'
      - '.github/workflows/check-axiom-admission-candidate.yml'
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit controls (mocked Lean output)
        run: python3 -m unittest discover -s experiments/check-axiom-admission-v0 -p 'test_*.py' -v
      - name: Install Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run real Lean admission controls
        run: |
          python3 experiments/check-axiom-admission-v0/run.py --lean "$HOME/.elan/bin/lean" --out "$RUNNER_TEMP/axiom-admission"
      - name: Replay production capstone gate and withdrawal
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/axiom-admission/production"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/mathgraph-commit.txt"
          lean --version > "$out/lean-version.txt"
          replay() {
            local arm="$1" revision="$2" digest="$3"
            local evidence="$out/$arm"
            local work
            work="$(mktemp -d)"
            mkdir -p "$evidence" "$work/L4YAML"
            printf '%s\n' "$revision" > "$evidence/l4yaml-commit.txt"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/metalogiclabs/L4YAML/$revision/L4YAML/CapstoneAttr.lean" \
              -o "$work/L4YAML/CapstoneAttr.lean"
            cd "$work"
            echo "$digest  L4YAML/CapstoneAttr.lean" | sha256sum --check | tee "$evidence/source-check.txt"
            cp L4YAML/CapstoneAttr.lean "$evidence/"
            lean -o L4YAML/CapstoneAttr.olean L4YAML/CapstoneAttr.lean > "$evidence/build.log" 2>&1
            export LEAN_PATH="$work"
            cat > Positive.lean <<'EOF'
          import L4YAML.CapstoneAttr

          @[capstone] theorem kernelControl : True := True.intro
          @[capstone] theorem permittedControl (p q : Prop) (h : p ↔ q) : p = q := propext h
          @[capstone] theorem nativeControl : (List.range 40).length = 40 := by native_decide
          #assert_capstone_axioms
          EOF
            cat > Private.lean <<'EOF'
          import L4YAML.CapstoneAttr

          private axiom privateAssumption : False
          @[capstone] theorem privateClaim : False := privateAssumption
          #assert_capstone_axioms
          EOF
            cp Positive.lean Private.lean "$evidence/"
            lean Positive.lean > "$evidence/positive.log" 2>&1
            grep -Fx 'kernelControl: pure' "$evidence/positive.log"
            grep -Fx 'permittedControl: pure' "$evidence/positive.log"
            grep -Fx 'nativeControl: native' "$evidence/positive.log"
            local status=0
            lean Private.lean > "$evidence/private.log" 2>&1 || status=$?
            echo "$status" > "$evidence/private-exit.txt"
            if [[ "$arm" == repaired ]]; then
              test "$status" -eq 1
              grep -E 'error: capstone privateClaim depends on non-allowed axioms: .*privateAssumption' "$evidence/private.log"
              test "$(grep -c 'error:' "$evidence/private.log")" -eq 1
            else
              test "$status" -eq 0
              grep -F 'privateClaim: native' "$evidence/private.log"
            fi
          }
          original=14eb6dbab845d2ac61f171a9ed61906d3f9ffb2f
          original_hash=40db6218a9eb955739604a3540faaf9a9e70bfde09fee6ad91b83b43139a602d
          replay original "$original" "$original_hash"
          replay repaired 4b84e402ba48e2396dbbf68e452334e49b44c6c8 8ec732423ed9a7db9997de9aeb18d3661154ab14fc396301bf596cd3bf7fbc59
          replay withdrawn "$original" "$original_hash"
      - name: Preserve exact experiment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-admission-candidate
          path: ${{ runner.temp }}/axiom-admission/
          if-no-files-found: warn
