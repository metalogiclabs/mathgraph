name: VDN ARC full evaluation support V22

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v22_full_eval_support_census.py"
      - ".github/workflows/vdn-arc-full-eval-support-v22.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-eval-support-census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V22 full evaluation support census
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v22_full_eval_support_census.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-full-eval-support-v22
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v22_full_eval_support_census/result.json
