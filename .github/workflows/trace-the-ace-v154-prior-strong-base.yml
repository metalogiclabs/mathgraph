name: Trace the Ace V154 Prior Strong Base

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: V145 portable source run
        required: false
        default: '32792841883'
  push:
    paths:
      - 'experiments/trace_the_ace_v154/**'
      - '.github/workflows/trace-the-ace-v154-prior-strong-base.yml'

jobs:
  v154:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve source run
        id: src
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=32792841883" >> "$GITHUB_OUTPUT"
          fi
      - name: Download V145 bundle
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.src.outputs.run }}
          repository: metalogiclabs/mathgraph
      - name: Verify bundle
        run: test -s v145-portable/v146_bundle.npz
      - name: Prepare CPU
        run: python -m pip install -q numpy pandas scipy scikit-learn
      - name: Run strong-base prior gate
        run: |
          mkdir -p v154-results
          python experiments/trace_the_ace_v154/run_v154_prior_on_strong_base.py \
            --bundle v145-portable/v146_bundle.npz \
            --out v154-results/v154_results.json
      - name: Publish result
        run: cat v154-results/v154_results.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v154-prior-strong-base-${{ github.run_id }}
          path: v154-results/v154_results.json
          retention-days: 30
