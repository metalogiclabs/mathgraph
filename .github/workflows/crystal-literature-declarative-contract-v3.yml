name: Crystal Literature Declarative Contract V3

on:
  push:
    branches:
      - crystal-literature-declarative-contract-v3
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -e ".[all]"
      - name: Prove Crystal and claim dialect unchanged
        run: |
          git diff --exit-code 043a670231475020c8aa0297b477f7ccdab7867c -- mathgraph/crystal.py
          git diff --exit-code 043a670231475020c8aa0297b477f7ccdab7867c -- mathgraph/math_claim.py
      - name: Prove interpreter is source-agnostic
        run: |
          ! grep -Eiq 'tuza|vixra|2608\.06538|2609\.0064|riemann' mathgraph/extraction_contract.py
      - name: Rebuild live source snapshots
        run: python scripts/run_crystal_literature_source_fidelity_v1.py
      - name: Qualify declarative contracts
        run: python scripts/run_crystal_literature_declarative_contract_v3.py
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-literature-declarative-contract-v3-evidence
          path: |
            evidence/crystal-literature-declarative-contract-v3/
            evidence/crystal-literature-source-fidelity-v1/
          if-no-files-found: error
