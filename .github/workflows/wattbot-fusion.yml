name: WattBot type-gated numeric-extractive fusion
on:
  push:
    branches: [wattbot-type-gated-qa-v1]
    paths:
      - 'experiments/wattbot2026/fusion_probe.py'
      - '.github/workflows/wattbot-fusion.yml'
jobs:
  scorer-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned question-answering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'huggingface_hub<1.0' scikit-learn pandas kaggle requests pymupdf
      - name: Verify candidate composition logic on synthetic fixture
        run: python experiments/wattbot2026/fusion_probe.py --self-test
      - name: Execute fixed 24-PDF type-gated QA ablation against official scorer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/fusion_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Record evidence boundary
        run: |
          echo "Only aggregate training metrics logged."
          echo "Private competition CSVs, PDFs, derived predictions, source quotations and model caches remain ephemeral."
