name: MathGraph Check real same-SHA attempt readback
on:
  pull_request:
    paths:
      - 'integrations/mathgraph-check-github/real-rerun-readback-v1.mjs'
      - '.github/workflows/mathgraph-check-real-rerun-readback.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == 'metalogiclabs/mathgraph' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read back two native attempts from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node integrations/mathgraph-check-github/real-rerun-readback-v1.mjs
