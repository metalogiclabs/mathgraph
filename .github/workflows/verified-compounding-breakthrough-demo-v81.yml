name: V81 Verified Compounding Breakthrough Demo

on:
  push:
    branches: [verified-compounding-breakthrough-demo-v81]
    paths:
      - 'mathgraph/developmental_artifacts.py'
      - 'mathgraph/breakthrough_lineage.py'
      - 'experiments/verified_compounding_breakthrough_v81/**'
      - 'scripts/run_verified_compounding_breakthrough_demo.py'
      - 'tests/test_developmental_artifacts.py'
      - 'tests/test_breakthrough_lineage.py'
      - 'tests/test_verified_compounding_breakthrough_demo.py'
      - 'docs/evidence/verified_compounding_breakthrough_demo_v81.md'
      - '.github/workflows/verified-compounding-breakthrough-demo-v81.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v81-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned runtime and test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            pytest>=8.0 numpy>=1.24 pandas>=2.0 cvc5==1.3.1

      - name: Compile V81 implementation
        run: |
          python3 -m py_compile \
            mathgraph/developmental_artifacts.py \
            mathgraph/breakthrough_lineage.py \
            experiments/verified_compounding_breakthrough_v81/run.py \
            scripts/run_verified_compounding_breakthrough_demo.py

      - name: Test developmental artifacts
        run: pytest tests/test_developmental_artifacts.py -q

      - name: Test breakthrough lineage
        run: pytest tests/test_breakthrough_lineage.py -q

      - name: Test V81 breakthrough protocol
        run: pytest tests/test_verified_compounding_breakthrough_demo.py -q

      - name: Fetch pinned opened training universe
        run: |
          set -euo pipefail
          mkdir -p external-v81
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/heathsanchez/equational-theories-lean-stage2/374eb40ba5389915deb174fbc12cc92346214dd1/examples/problems/eq_size5.txt \
            -o external-v81/eq_size5.txt
          test "$(git hash-object external-v81/eq_size5.txt)" = "0deca9c8860fb60f2ae161ab7e3f458ec3b178ca"
          echo "V81_RULE=freeze_full_protocol_before_any_ten_op_source_generation"

      - name: Run full V81 breakthrough demo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=. python3 scripts/run_verified_compounding_breakthrough_demo.py \
            --opened-laws external-v81/eq_size5.txt \
            --out-dir external-v81/breakthrough

      - name: Preserve V81 breakthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v81-verified-compounding-breakthrough-demo
          path: external-v81/breakthrough/
          if-no-files-found: warn
