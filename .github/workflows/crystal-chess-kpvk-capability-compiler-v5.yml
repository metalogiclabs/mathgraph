name: Crystal Chess KPvK Capability Compiler V5

on:
  push:
    branches:
      - crystal-chess-kpvk-capability-compiler-v5
    paths:
      - "experiments/crystal_chess_kpvk_capability_compiler_v5.py"
      - "experiments/crystal_chess_guarded_pruning_v4.py"
      - "experiments/crystal_chess_guarded_separator_v3.py"
      - "experiments/crystal_chess_action_congruence_v1.py"
      - "experiments/crystal_chess_kpvk_v0.py"
      - ".github/workflows/crystal-chess-kpvk-capability-compiler-v5.yml"
  workflow_dispatch:

jobs:
  compile-exact-kpvk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999"

      - name: Acquire exact WDL authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Compile and exhaustively replay observable-only capability bank
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-kpvk-capability-v5
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-kpvk-capability-v5/
          python experiments/crystal_chess_kpvk_capability_compiler_v5.py \
            --tablebase-dir /tmp/syzygy \
            --promising-limit 100 \
            --clauses-per-rule 12 \
            --collapse-clauses 24 \
            --min-safe 30 \
            --output artifacts/crystal-chess-kpvk-capability-v5/result.json \
            | tee artifacts/crystal-chess-kpvk-capability-v5/run.log
          grep -q "CRYSTAL_CHESS_KPVK_CAPABILITY_V5=WARRANTED_EXACT_KPVK_CAPABILITY_BANK" artifacts/crystal-chess-kpvk-capability-v5/run.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-kpvk-capability-v5
          path: artifacts/crystal-chess-kpvk-capability-v5/
          if-no-files-found: error
