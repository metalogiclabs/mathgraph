name: VDN ARC-AGI-2 strict motif union v19
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v19_strict_motif_union.py'
      - '.github/workflows/vdn-arc2-strict-motif-v19.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-motif:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Run strict motif union
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v19_strict_motif_union.py /tmp/ARC-AGI-2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-strict-motif-v19
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v19_strict_motif_union/result.json
