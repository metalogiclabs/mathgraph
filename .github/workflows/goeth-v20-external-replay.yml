name: GOETH V20 External Native Replay (Fork Only)
on:
  push:
    branches:
      - research/goeth-v20-external-qualification
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact first-party GOETH experiment commit
        uses: actions/checkout@v4
        with:
          repository: metalogiclabs/go-ethereum
          # Cross-repository checkout resolves branch refs; the exact SHA
          # assertion in the next step rejects any moved branch head.
          ref: bal-engine-concurrent-v20
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Pin input source and upstream Geth tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goeth-v20"
          test "$(git rev-parse HEAD)" = "be33043dc27407a62471bfde1d50b6f99bfc9e6"
          {
            echo "MATHGRAPH_QUALIFICATION_SOURCE=${GITHUB_SHA}"
            echo "GOETH_RESEARCH_COMMIT=$(git rev-parse HEAD)"
            echo "GOETH_RESEARCH_TREE=$(git rev-parse HEAD^{tree})"
          } | tee "$RUNNER_TEMP/goeth-v20/source.txt"
          git config user.name "Metalogic CI"
          git config user.email "ci@mathgraph.org"
          git fetch --no-tags https://github.com/ethereum/go-ethereum.git 3a6c2e3b35ef8caa3d39dcbea3fe9f09099cca8c
          git merge --no-edit FETCH_HEAD
          echo "GOETH_MERGED_SOURCE_TREE=$(git rev-parse HEAD^{tree})" | tee -a "$RUNNER_TEMP/goeth-v20/source.txt"
      - name: Execute authenticated serial and concurrent FCU schedules
        run: |
          set -euo pipefail
          gofmt -w eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_engine_concurrent_v20_test.go
          test -z "$(gofmt -l eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_engine_concurrent_v20_test.go)"
          set +e
          go test -tags balexperiment ./eth/catalyst -run '^TestBALV20(SerialInvalidFCUClearsPending|ConcurrentLateAdmissionDoesNotRestoreInvalidatedPending)$' -count=1 -v -timeout=35m 2>&1 | tee "$RUNNER_TEMP/goeth-v20/tests.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$RUNNER_TEMP/goeth-v20/go_test_exit.txt"
          if ! grep -q 'MG_BAL_V20_SERIAL_CONTROL_PASS authenticated_valid_then_invalid_clear' "$RUNNER_TEMP/goeth-v20/tests.log"; then
            echo "V20_RESULT=UNKNOWN;reason=missing_serial_positive_control" | tee "$RUNNER_TEMP/goeth-v20/boundary.txt"
            exit 1
          fi
          if [ "$result" -ne 0 ] &&
             grep -q 'MG_BAL_V20_ORDER first_authenticated_fcu_waiting_before_admission' "$RUNNER_TEMP/goeth-v20/tests.log" &&
             grep -q 'MG_BAL_V20_ORDER second_authenticated_fcu_completed_invalidated_empty_witness' "$RUNNER_TEMP/goeth-v20/tests.log" &&
             grep -q 'MG_BAL_V20_OBSTRUCTION STALE_FCU_REINSTALLED_PENDING_WITNESS' "$RUNNER_TEMP/goeth-v20/tests.log"; then
            echo "V20_RESULT=NAMED_OBSTRUCTION;scope=fork_only_authenticated_invalid_supersession;general_concurrent_fcu=UNKNOWN" | tee "$RUNNER_TEMP/goeth-v20/boundary.txt"
          elif [ "$result" -eq 0 ] &&
               grep -q 'MG_BAL_V20_CONCURRENT_CONTROL_PASS pending_empty_after_older_fcu_completed' "$RUNNER_TEMP/goeth-v20/tests.log"; then
            echo "V20_RESULT=BOUNDED_SAFE;scope=fork_only_authenticated_invalid_supersession;general_concurrent_fcu=UNKNOWN" | tee "$RUNNER_TEMP/goeth-v20/boundary.txt"
          else
            echo "V20_RESULT=UNKNOWN;reason=unclassified_failure_or_regression;general_concurrent_fcu=UNKNOWN" | tee "$RUNNER_TEMP/goeth-v20/boundary.txt"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goeth-v20-external-native-evidence
          path: ${{ runner.temp }}/goeth-v20/
          if-no-files-found: ignore
