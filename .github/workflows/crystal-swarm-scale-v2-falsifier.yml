name: Crystal Swarm Scale V2 Falsifier
on:
  push:
    branches: [crystal-swarm-scale-v2-falsifier]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]"
      - name: Prove inherited semantic waists unchanged
        run: |
          git diff --exit-code 44f3e9c7da2074d532e6312740e6bbb7f20201d0 -- mathgraph/crystal.py
          git diff --exit-code 44f3e9c7da2074d532e6312740e6bbb7f20201d0 -- mathgraph/math_claim.py
          git diff --exit-code 44f3e9c7da2074d532e6312740e6bbb7f20201d0 -- mathgraph/graph_invariants.py
          git diff --exit-code 44f3e9c7da2074d532e6312740e6bbb7f20201d0 -- mathgraph/finite_relation.py
      - name: Recheck inherited Crystal tests
        run: python -m pytest -q tests/test_crystal.py tests/test_crystal_math_claim_dialect_v0.py
      - name: Execute generic finite falsifier compiler
        run: python scripts/run_crystal_swarm_scale_v2_falsifier.py
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-swarm-scale-v2-falsifier-evidence
          path: evidence/crystal-swarm-scale-v2-falsifier/result.json
          if-no-files-found: error
