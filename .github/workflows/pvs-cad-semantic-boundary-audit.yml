name: PVS CAD Semantic Boundary Audit

on:
  workflow_dispatch:
  push:
    branches: [pvs-cad-semantic-boundary-audit-v1]
    paths:
      - 'experiments/pvs_cad/**'
      - '.github/workflows/pvs-cad-semantic-boundary-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pin upstream pvs_cad
        run: |
          git clone https://github.com/j-tanner-slagel/pvs_cad.git /tmp/pvs_cad
          cd /tmp/pvs_cad
          git checkout 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          test "$(git rev-parse HEAD)" = "8750362e99c2ba0e9a0307dcaa39b9766c562feb"

      - name: Install PVS 8.1 and NASALib
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/pvs-install
          cd /tmp/pvs-install
          URL=$(python3 - <<'PY'
          import json, urllib.request
          releases=json.load(urllib.request.urlopen("https://api.github.com/repos/SRI-CSL/PVS/releases"))
          rel=next(r for r in releases if r["tag_name"].startswith("pvs8.1"))
          cand=[a for a in rel["assets"] if a["name"] == "pvs-linux-x86_64.tgz"]
          if not cand: raise SystemExit("No Linux x86_64 PVS 8.1 asset")
          print(cand[0]["browser_download_url"])
          PY
          )
          curl -L "$URL" -o pvs.tar.gz
          mkdir pvs
          tar -xzf pvs.tar.gz -C pvs --strip-components=1
          echo "/tmp/pvs-install/pvs" >> "$GITHUB_PATH"
          git clone --depth 1 https://github.com/nasa/pvslib.git /tmp/pvslib
          echo "PVS_DIR=/tmp/pvs-install/pvs" >> "$GITHUB_ENV"
          echo "NASALIB=/tmp/pvslib" >> "$GITHUB_ENV"

      - name: Prepare isolated upstream audit
        run: |
          cp experiments/pvs_cad/BoundaryAudit.pvs /tmp/pvs_cad/cad/BoundaryAudit.pvs
          cd /tmp/pvs_cad
          PVS_DIR="$PVS_DIR" NASALIB="$NASALIB" tools/setup.sh

      - name: Start PVS server and typecheck audit
        working-directory: /tmp/pvs_cad
        run: |
          set -euo pipefail
          PVS_DIR="$PVS_DIR" NASALIB="$NASALIB" tools/cli/srv.sh BoundaryAudit | tee "$GITHUB_WORKSPACE/experiments/pvs_cad/server.log"
          ! grep -E "Typecheck error|Error:" "$GITHUB_WORKSPACE/experiments/pvs_cad/server.log"

      - name: Execute positive CAD boundary suite
        working-directory: /tmp/pvs_cad
        run: |
          set -euo pipefail
          cat > /tmp/cad-positive.cmds <<'EOF'
          control_linear (cad)
          control_quadratic (cad)
          zero_poly_eq (cad)
          repeated_root (cad)
          strict_boundary (cad)
          alternation (cad)
          renamed_alternation (cad)
          rational_coeff (cad)
          decimal_coeff (cad)
          connective_mix (cad)
          vacuous_true (cad)
          abstracted_function_sound (cad *)
          EOF
          PVS_DIR="$PVS_DIR" NASALIB="$NASALIB" PC_TIMEOUT=600             tools/cliprove.sh BoundaryAudit BoundaryAudit /tmp/cad-positive.cmds             | tee "$GITHUB_WORKSPACE/experiments/pvs_cad/cad-positive.log"
          test "$(grep -c 'QED$' "$GITHUB_WORKSPACE/experiments/pvs_cad/cad-positive.log")" -eq 12
          ! grep -q 'OPEN$' "$GITHUB_WORKSPACE/experiments/pvs_cad/cad-positive.log"

      - name: Execute expected-rejection canaries
        working-directory: /tmp/pvs_cad
        run: |
          set -euo pipefail
          cat > /tmp/cad-negative.cmds <<'EOF'
          nonpoly_variable_denominator (cad)
          hidden_definition (cad)
          grouped_binders (cad)
          subtype_false (cad)
          EOF
          PVS_DIR="$PVS_DIR" NASALIB="$NASALIB" PC_TIMEOUT=120             tools/cliprove.sh BoundaryAudit BoundaryAudit /tmp/cad-negative.cmds             | tee "$GITHUB_WORKSPACE/experiments/pvs_cad/cad-negative.log"
          test "$(grep -c 'OPEN$' "$GITHUB_WORKSPACE/experiments/pvs_cad/cad-negative.log")" -eq 4
          ! grep -q 'QED$' "$GITHUB_WORKSPACE/experiments/pvs_cad/cad-negative.log"

      - name: Fresh replay of positive saved proofs
        working-directory: /tmp/pvs_cad/cad
        run: |
          set -euo pipefail
          export PVS_LIBRARY_PATH="$NASALIB:/tmp/pvs_cad/cad"
          proveit -f @BoundaryAudit.control_linear:control_quadratic:zero_poly_eq:repeated_root:strict_boundary:alternation:renamed_alternation:rational_coeff:decimal_coeff:connective_mix:vacuous_true:abstracted_function_sound             | tee "$GITHUB_WORKSPACE/experiments/pvs_cad/replay.log"
          if grep -E "unfinished|unproved|untried|Missed|fewer subproofs|Error|ERROR" "$GITHUB_WORKSPACE/experiments/pvs_cad/replay.log"; then
            exit 1
          fi

      - name: Consolidate audit evidence
        run: |
          cat experiments/pvs_cad/server.log               experiments/pvs_cad/cad-positive.log               experiments/pvs_cad/cad-negative.log               experiments/pvs_cad/replay.log               > experiments/pvs_cad/audit.log

      - uses: actions/upload-artifact@v4
        with:
          name: pvs-cad-semantic-boundary-audit
          path: |
            experiments/pvs_cad/audit.log
            experiments/pvs_cad/server.log
            experiments/pvs_cad/cad-positive.log
            experiments/pvs_cad/cad-negative.log
            experiments/pvs_cad/replay.log
