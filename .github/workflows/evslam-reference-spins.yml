name: EvSLAM original reference 3D multi-turn drone qualification
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - '.github/workflows/evslam-reference-spins.yml'
      - 'experiments/uzh_rotation/evslam_reference_turns.py'
      - 'experiments/uzh_rotation/test_evslam_reference_turns.py'
  workflow_dispatch:
jobs:
  independently-verify-real-drone-reference-turns:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen reference-geometry dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1
      - name: Run independent finite and adversarial pose controls
        run: python -m unittest discover -s experiments/uzh_rotation -p 'test_evslam_reference_turns.py' -v
      - name: Fetch untouched publisher evaluation poses at exact pinned revision
        run: |
          mkdir -p original_evslam
          python - <<'PY'
          import subprocess
          repo="https://raw.githubusercontent.com/NAIL-HNU/EvSLAM_Dataset/f116a9fe305f3ad8b1a379e1bb52becfc87654dc/evaluation/ground_truth"
          objects={
           "drone_rot_norm_gt.txt":"809d83df4063376d0ee50f62095131e1d8940c00",
           "drone_rot_norm_ref_time.txt":"34a8c16d23a4418a0f206fe615898276bc61008d",
           "drone_rot_fast_gt.txt":"47a1bd5b54c0843d2535af42ebff0529950a5a6f",
           "drone_rot_fast_ref_time.txt":"b6c74a7e9167cf8750bc3f33b277b23a76181f21",
          }
          for name,sha in objects.items():
              subprocess.run(["curl","-fsSL","--retry","2",f"{repo}/{name}","-o",f"original_evslam/{name}"],check=True)
              actual=subprocess.run(["git","hash-object",f"original_evslam/{name}"],check=True,text=True,capture_output=True).stdout.strip()
              if actual!=sha:raise ValueError(f"original source git blob mismatch {name}: {actual}")
              print("ORIGINAL_EVSLAM_SOURCE_GIT_BLOB",name,actual)
          PY
      - name: Independent SciPy and manual body-axis angular qualification
        run: |
          python experiments/uzh_rotation/evslam_reference_turns.py \
            --source-dir original_evslam --output evslam_drone_turn_qualification.json
      - name: Audit boundary and consequential qualifications
        run: |
          python - <<'PY'
          import json
          report=json.load(open('evslam_drone_turn_qualification.json'))
          assert set(report["qualifications"])=={"drone_rot_norm","drone_rot_fast"}
          for name,res in report["qualifications"].items():
              assert res["ref_pose_alignment_fraction"]>.99
              assert res["source_pairwise_sampling_admissible"]
              assert res["independent_quaternion_derivations_max_rad_difference"]<1e-8
              assert res["recorded_body_y_2plus_revolutions_candidate"],(name,res)
              assert res["translation_path_m"]>0
              assert len(res["axis_results"]["y"]["reference_turn_boundary_times_s"])>=2
              assert not res["navigation_correction_permitted"]
              assert not res["camera_imu_temporal_alignment_verified"]
              assert not res["later_turn_camera_recognition_tested"]
              print("EVSLAM_MULTITURN_CANDIDATE_ONLY",name,res["longest_projected_yaw_body_y_turns"],
                    res["translation_path_m"])
          PY
      - name: Preserve independently replayable source-bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evslam-original-reference-body-axis-multiturn-qualification
          path: evslam_drone_turn_qualification.json
          if-no-files-found: warn
