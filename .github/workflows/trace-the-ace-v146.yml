name: Trace the Ace V146 Residual Router

on:
  workflow_run:
    workflows: ["Trace the Ace V145 Cache Recovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V145 recovery run containing the portable artifact"
        required: true
        default: "32792841883"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: trace-ace-v146-residual-routing
  cancel-in-progress: false

jobs:
  v146:
    name: Cross-fitted residual router
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Resolve V145 source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ inputs.source_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download portable V145 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Verify bundle
        shell: bash
        run: |
          set -euo pipefail
          find v145-portable -maxdepth 2 -type f -print
          test -s v145-portable/v146_bundle.npz
          test -s v145-portable/v145_results.json
      - name: Prepare CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy pandas scipy scikit-learn
          python experiments/trace_the_ace_v146/run_v146_residual_router.py --self-test
      - name: Run preregistered V146 gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v146-results
          python experiments/trace_the_ace_v146/run_v146_residual_router.py \
            --bundle v145-portable/v146_bundle.npz \
            --out v146-results/v146_results.json
      - name: Publish decision
        if: always()
        shell: bash
        run: |
          R=v146-results/v146_results.json
          if [ -s "$R" ]; then
            python3 - "$R" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print("# Trace the Ace V146")
          print(f"\n**Decision: `{r['decision']}`**\n")
          print("| Split | Base | Routed | Improvement | Fold wins | Coverage | Bootstrap 95% |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for k in ("session","objective"):
              x=r[k]
              print(f"| {k} | {x['base_logloss']:.6f} | {x['routed_logloss']:.6f} | {x['improvement']:.6f} | {x['fold_wins']}/5 | {x['mean_coverage']:.3f} | {x['bootstrap_improvement_95']} |")
          PY
          fi
      - name: Upload V146 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v146-${{ github.run_id }}
          path: v146-results/v146_results.json
          if-no-files-found: warn
          retention-days: 90
