name: DARK-GS real RGB column contrast and source-authority transfer
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths: ['.github/workflows/darkgs-real-column-v2.yml']
  workflow_dispatch:
jobs:
  development-360-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze v1 source and controls
        run: |
          test "$(git hash-object experiments/uzh_rotation/darkgs_camera_gyro_firstturn.py)" = 3642d669a8895bf789739dd3774f744d14023548
      - name: Pinned real-source ROS2 and conventional image processing
        run: pip install numpy==2.1.3 scipy==1.14.1 rosbags==0.11.9 Pillow==11.0.0 requests==2.32.3
      - name: Independent causal and false-visual-confidence controls
        run: python -m unittest discover -s experiments/uzh_rotation -p 'test_darkgs_column_v2.py' -v
      - name: Exposed development source original RGB column and gyro
        run: |
          python experiments/uzh_rotation/darkgs_column_v2.py \
            --source 360.zip --out darkgs_v2_exposed_source.json
      - name: Keep original-source nonauthorization
        run: |
          python - <<'PY'
          import json
          d=json.load(open('darkgs_v2_exposed_source.json'))
          assert d['name']=='360.zip' and not d['navigation_correction_authorized']
          assert d['status'].startswith(('SOURCE_','UNKNOWN_'))
          if 'result' in d:
              r=d['result']
              assert r['source_image_count']==600 and r['source_gyro_count']==13434
              assert r['reference_pair_analysis']['two_bit_error_limit_physically_authenticated'] is False
              assert r['navigation_correction_authorized'] is False
              print('ORIGINAL_REAL_COLUMN_INFORMATION',r['relative_unique_16bit_signatures'],
                    r['reference_pair_analysis'])
          PY
      - name: Retain exposed development sensor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkgs-real-column-v2-exposed-development
          path: darkgs_v2_exposed_source.json
          if-no-files-found: warn
  second-original-frozen-transfer:
    needs: development-360-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lock descriptor byte-identity before untouched second source
        run: |
          test "$(git hash-object experiments/uzh_rotation/darkgs_column_v2.py)" = 2a00bf9ec471a0d03edfe85d1622cb78b1c8efb7
      - name: Same original source reader dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1 rosbags==0.11.9 Pillow==11.0.0 requests==2.32.3
      - name: Source-distinct original camera and gyro acquisition
        run: |
          python experiments/uzh_rotation/darkgs_column_v2.py \
            --source 360_2.zip --out darkgs_v2_source_distinct.json
      - name: Independent acquisition and heading-authority boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('darkgs_v2_source_distinct.json'))
          assert d['name']=='360_2.zip'
          assert d['source_identity'][1]=='9a05e7d528241ad9a4f055170f3a710f'
          assert d['source_identity'][2]=='36da03f876b34c94e34b721e61bf114cfa04ec19857dba1db3899c41c599dfa1'
          assert not d['navigation_correction_authorized']
          if 'result' in d:
              r=d['result']
              assert r['source_image_count']==761 and r['source_gyro_count']==17413
              assert not r['navigation_correction_authorized']
              assert r['source_true_camera_gyro_offset_bound']=='UNKNOWN'
              print('FROZEN_SOURCE_TRANSFER_VISUAL_INFORMATION',r['relative_unique_16bit_signatures'],
                    r['reference_pair_analysis'])
          PY
      - name: Retain source-distinct real sensor negative or positive observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkgs-real-column-v2-frozen-second-source
          path: darkgs_v2_source_distinct.json
          if-no-files-found: warn
