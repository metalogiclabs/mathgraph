name: MathGraph.org V1 qualification

on:
  pull_request:
    branches: [main, website/mathgraph-brand-assets]
    paths:
      - 'website/**'
      - 'mathgraph_check/**'
      - 'tests/test_mathgraph_public_evidence_v1.py'
      - 'docs/superpowers/specs/2026-10-10-mathgraph-agent-interoperability-design.md'
      - 'docs/superpowers/plans/2026-10-10-mathgraph-agent-interoperability.md'
      - '.github/workflows/mathgraph-org-v1.yml'
  push:
    branches: [website/mathgraph-org-v1, codex/mathgraph-agent-interface]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact package manager
        run: npm install --global npm@12.2.0
      - name: Clean dependency installation
        run: npm ci
      - name: Qualify static product and isolated consumer
        run: npm run qualify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-org-v1-static-site
          path: website/dist/
          if-no-files-found: error

  evidence-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve exact archived proof and execution receipts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mathgraph-evidence"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11657687808/zip" \
            -o "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v1.zip"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11657314389/zip" \
            -o "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v2.zip"
          echo "b75581017d6620481c77e52b350e8bb8631d11747a92789f7887cde527807086  $RUNNER_TEMP/mathgraph-evidence/l4yaml-v1.zip" | sha256sum -c -
          echo "61fc93815e3329c0490324f52897a94d3417044a5cf16a8e1e0f0109aa0e515e  $RUNNER_TEMP/mathgraph-evidence/l4yaml-v2.zip" | sha256sum -c -
      - name: Re-run qualified publisher and resolver gate
        env:
          MATHGRAPH_V1_EVIDENCE_ZIP: ${{ runner.temp }}/mathgraph-evidence/l4yaml-v1.zip
          MATHGRAPH_V2_EVIDENCE_ZIP: ${{ runner.temp }}/mathgraph-evidence/l4yaml-v2.zip
        run: python -m unittest discover -s tests -p 'test_mathgraph_public_evidence_v1.py' -v
      - name: Regenerate and compare immutable publication files
        run: |
          set -euo pipefail
          python -m mathgraph_check.public_receipts \
            --v1-zip "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v1.zip" \
            --v2-zip "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v2.zip" \
            --out "$RUNNER_TEMP/generated-record"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/record.json "$RUNNER_TEMP/generated-record/record.json"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/evidence.json "$RUNNER_TEMP/generated-record/evidence.json"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/qualified-release.html "$RUNNER_TEMP/generated-record/index.html"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/scoped-status.svg "$RUNNER_TEMP/generated-record/badge.svg"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/openapi.preview.json "$RUNNER_TEMP/generated-record/openapi.json"
          echo MATHGRAPH_ORG_PUBLICATION_IDENTITY_GREEN
