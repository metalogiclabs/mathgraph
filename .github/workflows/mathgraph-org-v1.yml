name: MathGraph.org V1 qualification

on:
  pull_request:
    branches: [main, website/mathgraph-brand-assets]
    paths:
      - 'website/**'
      - 'mathgraph_check/**'
      - 'tests/test_mathgraph_public_evidence_v1.py'
      - 'tests/test_mathgraph_resolve_publication_v1.py'
      - 'tests/test_mathgraph_warrant_resolution_core.py'
      - 'tests/test_mathgraph_living_warrants_v1.py'
      - 'conformance/resolve_v1/**'
      - 'conformance/source_catalogue_v1/**'
      - 'conformance/import_v1/**'
      - 'conformance/discover_v1/**'
      - 'conformance/capability_v1/**'
      - 'conformance/interoperability_v1/**'
      - 'protocol/registries/**'
      - 'protocol/schemas/**'
      - 'catalogues/mathlib-v4.34.1-foundations-v1.source.json'
      - 'website/public/catalogues/mathlib/v4.34.1/**'
      - 'scripts/qualify_mathlib_source_catalogue_v1.py'
      - 'scripts/package_mathgraph_resolve_v1.py'
      - 'scripts/publish_mathgraph_resolve_v1.py'
      - 'evidence/living_warrant_openai_jpl_20261010.json'
      - 'docs/mathgraph_resolve_v1_threat_model.md'
      - 'docs/mathgraph_resolve_v1_reproduction.md'
      - 'docs/superpowers/specs/2026-10-11-mathgraph-resolve-record-002-design.md'
      - 'docs/superpowers/specs/2026-10-10-mathgraph-agent-interoperability-design.md'
      - 'docs/superpowers/plans/2026-10-10-mathgraph-agent-interoperability.md'
      - '.github/workflows/mathgraph-org-v1.yml'
  push:
    branches: [website/mathgraph-org-v1, codex/mathgraph-agent-interface, codex/mathgraph-resolve-record-002, codex/living-knowledge-network]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.17'
      - name: Install exact package manager
        run: npm install --global npm@12.2.0
      - name: Clean dependency installation
        run: npm ci
      - name: Replay committed authority-free source catalogue
        run: |
          python -I -S -B ../conformance/source_catalogue_v1/consumer.py \
            --catalogue-root public/catalogues/mathlib/v4.34.1 \
            --policy ../conformance/source_catalogue_v1/trust-policy.json \
            --policy-sha256 c3cdec2b2c784728621bb8c25a055a1e73d67d3c1c922b7ab62b09003399e1c9 \
            --audit-imports
      - name: Qualify static product and isolated consumer
        run: npm run qualify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mathgraph-org-v1-static-site-${{ github.run_id }}
          path: website/dist/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  browser-accessibility:
    needs: website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.17'
      - name: Install exact package manager
        run: npm install --global npm@12.2.0
      - name: Clean dependency installation
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mathgraph-org-v1-static-site-${{ github.run_id }}
          path: website/dist
      - name: Install lockfile-matched Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility qualification against exact static artifact
        id: qualification
        env:
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/mathgraph-browser-evidence
        run: |
          mkdir -p "$BROWSER_EVIDENCE_DIR"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const environment = (name) => process.env[name] ?? null;
          const metadata = {
            schema: 'mathgraph.ci-run-metadata.v1',
            GITHUB_SHA: environment('GITHUB_SHA'),
            GITHUB_RUN_ID: environment('GITHUB_RUN_ID'),
            GITHUB_RUN_ATTEMPT: environment('GITHUB_RUN_ATTEMPT'),
            GITHUB_JOB: environment('GITHUB_JOB'),
            RUNNER_OS: environment('RUNNER_OS'),
            RUNNER_ARCH: environment('RUNNER_ARCH'),
            ImageOS: environment('ImageOS'),
            ImageVersion: environment('ImageVersion'),
            NODE_VERSION: process.version,
            NPM_VERSION: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            status: 'STARTED',
          };
          writeFileSync(
            join(process.env.BROWSER_EVIDENCE_DIR, 'run-metadata.json'),
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE
          npm run test:browser
      - name: Finalize browser evidence metadata
        if: always()
        env:
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/mathgraph-browser-evidence
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const root = process.env.BROWSER_EVIDENCE_DIR;
          mkdirSync(root, { recursive: true });
          const path = join(root, 'run-metadata.json');
          const metadata = existsSync(path)
            ? JSON.parse(readFileSync(path, 'utf8'))
            : {
                schema: 'mathgraph.ci-run-metadata.v1',
                GITHUB_SHA: process.env.GITHUB_SHA ?? null,
                GITHUB_RUN_ID: process.env.GITHUB_RUN_ID ?? null,
                GITHUB_RUN_ATTEMPT: process.env.GITHUB_RUN_ATTEMPT ?? null,
                GITHUB_JOB: process.env.GITHUB_JOB ?? null,
                status: 'NOT_STARTED',
              };
          metadata.status = process.env.QUALIFICATION_OUTCOME?.toUpperCase() ?? 'UNKNOWN';
          metadata.completed_at = new Date().toISOString();
          writeFileSync(path, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mathgraph-living-network-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mathgraph-browser-evidence/
          if-no-files-found: error
          retention-days: 14

  performance:
    needs: website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install exact package manager
        run: npm install --global npm@12.2.0
      - name: Clean dependency installation
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mathgraph-org-v1-static-site-${{ github.run_id }}
          path: website/dist
      - name: Install lockfile-matched Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static and browser performance budgets against exact static artifact
        id: qualification
        env:
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/mathgraph-performance-evidence
        run: |
          mkdir -p "$BROWSER_EVIDENCE_DIR"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const environment = (name) => process.env[name] ?? null;
          const metadata = {
            schema: 'mathgraph.ci-run-metadata.v1',
            GITHUB_SHA: environment('GITHUB_SHA'),
            GITHUB_RUN_ID: environment('GITHUB_RUN_ID'),
            GITHUB_RUN_ATTEMPT: environment('GITHUB_RUN_ATTEMPT'),
            GITHUB_JOB: environment('GITHUB_JOB'),
            RUNNER_OS: environment('RUNNER_OS'),
            RUNNER_ARCH: environment('RUNNER_ARCH'),
            ImageOS: environment('ImageOS'),
            ImageVersion: environment('ImageVersion'),
            NODE_VERSION: process.version,
            NPM_VERSION: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            status: 'STARTED',
          };
          writeFileSync(
            join(process.env.BROWSER_EVIDENCE_DIR, 'run-metadata.json'),
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE
          npm run test:performance
      - name: Finalize performance evidence metadata
        if: always()
        env:
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/mathgraph-performance-evidence
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const root = process.env.BROWSER_EVIDENCE_DIR;
          mkdirSync(root, { recursive: true });
          const path = join(root, 'run-metadata.json');
          const metadata = existsSync(path)
            ? JSON.parse(readFileSync(path, 'utf8'))
            : {
                schema: 'mathgraph.ci-run-metadata.v1',
                GITHUB_SHA: process.env.GITHUB_SHA ?? null,
                GITHUB_RUN_ID: process.env.GITHUB_RUN_ID ?? null,
                GITHUB_RUN_ATTEMPT: process.env.GITHUB_RUN_ATTEMPT ?? null,
                GITHUB_JOB: process.env.GITHUB_JOB ?? null,
                status: 'NOT_STARTED',
              };
          metadata.status = process.env.QUALIFICATION_OUTCOME?.toUpperCase() ?? 'UNKNOWN';
          metadata.completed_at = new Date().toISOString();
          writeFileSync(path, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mathgraph-living-network-performance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mathgraph-performance-evidence/
          if-no-files-found: error
          retention-days: 14

  evidence-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.17'
      - name: Retrieve exact archived proof and execution receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mathgraph-evidence"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11657687808/zip" \
            -o "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v1.zip"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11657314389/zip" \
            -o "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v2.zip"
          echo "b75581017d6620481c77e52b350e8bb8631d11747a92789f7887cde527807086  $RUNNER_TEMP/mathgraph-evidence/l4yaml-v1.zip" | sha256sum -c -
          echo "61fc93815e3329c0490324f52897a94d3417044a5cf16a8e1e0f0109aa0e515e  $RUNNER_TEMP/mathgraph-evidence/l4yaml-v2.zip" | sha256sum -c -
      - name: Re-run qualified publisher and resolver gate
        env:
          MATHGRAPH_V1_EVIDENCE_ZIP: ${{ runner.temp }}/mathgraph-evidence/l4yaml-v1.zip
          MATHGRAPH_V2_EVIDENCE_ZIP: ${{ runner.temp }}/mathgraph-evidence/l4yaml-v2.zip
        run: python -m unittest discover -s tests -p 'test_mathgraph_public_evidence_v1.py' -v
      - name: Regenerate and compare immutable publication files
        run: |
          set -euo pipefail
          python -m mathgraph_check.public_receipts \
            --v1-zip "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v1.zip" \
            --v2-zip "$RUNNER_TEMP/mathgraph-evidence/l4yaml-v2.zip" \
            --out "$RUNNER_TEMP/generated-record"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/record.json "$RUNNER_TEMP/generated-record/record.json"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/evidence.json "$RUNNER_TEMP/generated-record/evidence.json"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/qualified-release.html "$RUNNER_TEMP/generated-record/index.html"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/scoped-status.svg "$RUNNER_TEMP/generated-record/badge.svg"
          cmp website/public/evidence/mg-l4yaml-source-check-20261010/openapi.preview.json "$RUNNER_TEMP/generated-record/openapi.json"
          echo MATHGRAPH_ORG_PUBLICATION_IDENTITY_GREEN
      - name: Qualify exact Resolve publication and standalone replay
        env:
          MATHGRAPH_V1_EVIDENCE_ZIP: ${{ runner.temp }}/mathgraph-evidence/l4yaml-v1.zip
          MATHGRAPH_V2_EVIDENCE_ZIP: ${{ runner.temp }}/mathgraph-evidence/l4yaml-v2.zip
        run: |
          set -euo pipefail
          python -m pip install pytest==9.0.3 PyYAML==6.0.3
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/openai/math/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/history.md \
            -o "$RUNNER_TEMP/mathgraph-evidence/history.md"
          export MATHGRAPH_OPENAI_HISTORY_MD="$RUNNER_TEMP/mathgraph-evidence/history.md"
          echo "41c2a2d470014b3628695c7aabf5fd0c93f6f687621fca172062f22b59ed6a1e  $MATHGRAPH_OPENAI_HISTORY_MD" | sha256sum -c -
          python scripts/package_mathgraph_resolve_v1.py --history "$MATHGRAPH_OPENAI_HISTORY_MD" --check
          python scripts/publish_mathgraph_resolve_v1.py --check
          python -m pytest conformance/resolve_v1/test_consumer.py \
            tests/test_mathgraph_resolve_publication_v1.py \
            tests/test_mathgraph_warrant_resolution_core.py \
            tests/test_mathgraph_living_warrants_v1.py -q
          cmp conformance/resolve_v1/consumer.py website/public/evidence/mg-living-warrant-openai-jpl-20261010/offline/consumer.py
          cmp conformance/resolve_v1/fixtures/bundle.json website/public/evidence/mg-living-warrant-openai-jpl-20261010/offline/bundle.json
          cmp conformance/resolve_v1/trust-policy.json website/public/evidence/mg-living-warrant-openai-jpl-20261010/offline/trust-policy.json
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.load(path.read_text(), Loader=yaml.BaseLoader)
          print('WORKFLOW_YAML_PARSE_GREEN')
          PY
          git diff --exit-code
