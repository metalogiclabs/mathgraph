name: WattBot protected answer-value type distinction
on:
  push:
    branches: [wattbot-typed-answer-normalization-v1]
    paths:
      - '.github/workflows/wattbot-typed-answer-normalization.yml'
      - 'experiments/wattbot2026/answer_type_normalization.py'
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
jobs:
  type-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official scorer and PDF dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Verify exact semantic distinction in candidate output shapes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/answer_type_normalization.py
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Compare six answer-value type policies with IDENTICAL reader replies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Protected future
        run: |
          echo "No target gold tolerance bands or answer labels used in inference."
          echo "Numeric tolerance bands are SCORE ranges, actual reported ranges are RESULT tuples."
          echo "Any midpoint is a candidate heuristic, not scientific entailment."
          echo "Official TRAIN score only, no protected TEST and no Kaggle submission."
