name: Crystal Chess Progressive Hard Falsifier V47H

on:
  push:
    branches:
      - crystal-chess-progressive-hard-falsifier-v47h
    paths:
      - "experiments/crystal_chess_progressive_hard_falsifier_v47h.py"
      - ".github/workflows/crystal-chess-progressive-hard-falsifier-v47h.yml"
      - "experiments/crystal_chess_progressive_stopping_v47.py"
      - "experiments/crystal_chess_search_sufficiency_v25.py"
  workflow_dispatch:

jobs:
  hard-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999" "numpy>=2,<3" "scikit-learn>=1.5,<2"
          python -m py_compile experiments/crystal_chess_progressive_hard_falsifier_v47h.py

      - name: Download exact V43 residual
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-residual-budget-ladder-v43
          path: /tmp/v43
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36520938383

      - name: Build pinned Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64

      - name: Falsify progressive rules on hard residual
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v47h
          python experiments/crystal_chess_progressive_hard_falsifier_v47h.py             --stockfish /tmp/stockfish/src/stockfish             --v43-result /tmp/v43/result.json             --output artifacts/crystal-chess-v47h/result.json             | tee artifacts/crystal-chess-v47h/run.log
          grep -Eq "CRYSTAL_CHESS_PROGRESSIVE_HARD_FALSIFIER_V47H=(HARD_RESIDUAL_LEAVES_PROGRESSIVE_RULES|HARD_RESIDUAL_FALSIFIES_ALL_PROGRESSIVE_RULES)" artifacts/crystal-chess-v47h/run.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-progressive-hard-falsifier-v47h
          path: artifacts/crystal-chess-v47h/
          if-no-files-found: error
