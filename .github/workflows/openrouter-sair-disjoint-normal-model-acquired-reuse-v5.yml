name: OpenRouter SAIR disjoint normal model-acquired reuse V5

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model ID
        required: false
        default: google/gemma-4-31b-it
      provider:
        description: OpenRouter provider slug
        required: false
        default: deepinfra
  push:
    branches:
      - open-math-model-sustained-use-v1
    paths:
      - "scripts/run_openrouter_sair_disjoint_normal_model_acquired_reuse_v5.py"
      - ".github/workflows/openrouter-sair-disjoint-normal-model-acquired-reuse-v5.yml"

permissions:
  contents: read

jobs:
  sair-disjoint-normal-model-acquired-reuse-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ github.event.inputs.model || 'google/gemma-4-31b-it' }}
      OPENROUTER_PROVIDER: ${{ github.event.inputs.provider || 'deepinfra' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require OpenRouter API key
        run: |
          test -n "$OPENROUTER_API_KEY"

      - name: Run disjoint public SAIR V5 replication
        run: |
          python scripts/run_openrouter_sair_disjoint_normal_model_acquired_reuse_v5.py \
            --out-dir /tmp/openrouter-sair-disjoint-normal-v5 \
            --model "$OPENROUTER_MODEL" \
            --provider "$OPENROUTER_PROVIDER" \
            --acquisition-rounds 2

      - name: Audit V5 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/openrouter-sair-disjoint-normal-v5/report.json").read_text()
          )
          summary = {
              "verdict": report["verdict"],
              "model": report["model"],
              "provider": report["provider"],
              "sair_commit": report["provenance"]["commit"],
              "acquisition_task_count": len(report["acquisition_tasks"]),
              "fresh_task_count": len(report["fresh_tasks"]),
              "reserve_task_count": len(report["reserve_manifest"]),
              "acquisition_verified_count": sum(
                  bool(x["verified_capability_acquired"])
                  for x in report["acquisition_outcomes"]
              ),
              "promoted_capability_count": len(report["promoted_capabilities"]),
              "acquisition_cost": report["acquisition_cost"],
              "aggregate": report["aggregate"],
              "comparisons": report["comparisons"],
              "gates": report["gates"],
              "claim_boundary": report["claim_boundary"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert report["verdict"] == "PASS"
          assert all(report["gates"].values())
          assert len(report["acquisition_tasks"]) == 50
          assert len(report["fresh_tasks"]) == 200
          assert len(report["reserve_manifest"]) == 250
          PY

      - name: Upload V5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-sair-disjoint-normal-model-acquired-reuse-v5
          path: /tmp/openrouter-sair-disjoint-normal-v5/
          if-no-files-found: warn
