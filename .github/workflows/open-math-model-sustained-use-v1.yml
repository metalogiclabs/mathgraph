name: Open Math Model sustained-use V1

on:
  workflow_dispatch:
  push:
    branches:
      - open-math-model-sustained-use-v1
    paths:
      - "scripts/run_open_math_model_sustained_use_pilot.py"
      - "scripts/run_model_sustained_use_eval.py"
      - "scripts/export_model_sustained_use_prompt_pack.py"
      - "scripts/assemble_model_sustained_use_transcript.py"
      - "scripts/run_sair_official_sample200_reuse_probe.py"
      - "scripts/run_sair_normal_reuse_replication_v1.py"
      - "scripts/run_sair_cross_set_transfer_v1.py"
      - "docs/open_math_model_sustained_use_v1.md"
      - ".github/workflows/open-math-model-sustained-use-v1.yml"

permissions:
  contents: read

jobs:
  mechanistic-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exact sustained-use fixture
        run: |
          python scripts/run_open_math_model_sustained_use_pilot.py \
            --out-dir /tmp/open-math-model-sustained-use-v1

      - name: Check exact fixture gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/open-math-model-sustained-use-v1/report.json")
          report = json.loads(path.read_text())
          mech = report["mechanistic_fixture"]
          econ = mech["sustained_use"]

          assert report["verdict"] == "PASS"
          assert all(mech["gates"].values())
          assert econ["cold_cost"] == 784
          assert econ["warm_cost"] == 28
          assert econ["compression_ratio"] == 28.0
          assert econ["sham_solution_count"] == 0
          assert econ["ablation_solution_count"] == 0
          assert econ["restart_solution_count"] > 0
          print("PASS_OPEN_MATH_MODEL_SUSTAINED_USE_V1")
          PY

      - name: Run model-facing protocol qualification
        run: |
          python scripts/run_model_sustained_use_eval.py \
            --provider deterministic \
            --out-dir /tmp/open-math-model-sustained-use-v1/model-pilot

      - name: Check model-facing protocol gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/open-math-model-sustained-use-v1/model-pilot/model_sustained_use_report.json")
          report = json.loads(path.read_text())
          assert report["provider"] == "deterministic_harness"
          assert report["provider_is_external_model"] is False
          assert report["verdict"] == "PASS"
          assert all(report["gates"].values())
          assert len(report["promoted_capabilities"]) >= 4
          assert report["aggregate"]["warm"]["reuse_hits"] > 0
          assert report["aggregate"]["restart"]["reuse_hits"] == report["aggregate"]["warm"]["reuse_hits"]
          assert report["aggregate"]["warm"]["materialized_table_cells"] < report["aggregate"]["cold"]["materialized_table_cells"]
          assert report["comparisons"]["warm_table_cell_reduction"] > 0
          print("PASS_MODEL_SUSTAINED_USE_PROTOCOL_V1")
          PY

      - name: Export external-model prompt pack
        run: |
          python scripts/export_model_sustained_use_prompt_pack.py \
            --out-dir /tmp/open-math-model-sustained-use-v1/external-prompt-pack

      - name: Check external-model prompt pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/open-math-model-sustained-use-v1/external-prompt-pack")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["bank_capability_count"] == 4
          assert manifest["fresh_task_count"] == 7
          assert manifest["request_count"] == 35
          assert set(manifest["conditions"]) == {"cold", "warm", "restart", "sham", "ablation"}
          assert (root / "preauthorized_verified_bank.json").exists()
          assert (root / "requests.jsonl").exists()
          print("PASS_EXTERNAL_MODEL_PROMPT_PACK_V1")
          PY

      - name: Qualify transcript assembly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/open-math-model-sustained-use-v1/external-prompt-pack")
          responses = root / "fixture_responses.jsonl"
          rows = []
          for line in (root / "requests.jsonl").read_text().splitlines():
              req = json.loads(line)
              rows.append({
                  "request_id": req["request_id"],
                  "model": "fixture/not-an-external-model",
                  "candidate": {"table": [[0]]},
                  "raw": "{\"table\":[[0]]}",
                  "usage": {"input_tokens": 1, "output_tokens": 1, "total_tokens": 2},
                  "latency_ms": 0.0,
              })
          responses.write_text("".join(json.dumps(row) + "\n" for row in rows))
          PY
          python scripts/assemble_model_sustained_use_transcript.py \
            --requests /tmp/open-math-model-sustained-use-v1/external-prompt-pack/requests.jsonl \
            --responses /tmp/open-math-model-sustained-use-v1/external-prompt-pack/fixture_responses.jsonl \
            --out-dir /tmp/open-math-model-sustained-use-v1/transcript-assembly-fixture
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/open-math-model-sustained-use-v1/transcript-assembly-fixture")
          manifest = json.loads((root / "transcript_manifest.json").read_text())
          assert manifest["request_count"] == 35
          assert manifest["response_count"] == 35
          assert manifest["models"] == ["fixture/not-an-external-model"]
          assert manifest["provider_token_usage_complete"] is True
          print("PASS_TRANSCRIPT_ASSEMBLY_V1")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: open-math-model-sustained-use-v1
          path: /tmp/open-math-model-sustained-use-v1/
          if-no-files-found: error


  sair-official-sample200-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pinned official SAIR sample-200 bounded reuse probe
        run: |
          python scripts/run_sair_official_sample200_reuse_probe.py \
            --out-dir /tmp/sair-official-sample200-reuse-v1

      - name: Audit public SAIR reuse evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/sair-official-sample200-reuse-v1")
          report = json.loads((root / "report.json").read_text())
          assert report["verdict"] == "PASS"
          assert report["provenance"]["commit"] == "817a4653bf762584931d49c6714c9fcfab7df66a"
          assert report["provenance"]["sample_problem_count"] == 200
          assert report["split"]["acquisition_false_count"] == 25
          assert report["split"]["fresh_false_count"] > 0
          assert len(report["capabilities"]) > 0
          assert report["true_controls"]["countermodels_found"] == 0
          assert report["gates"]["restart_exact"]
          assert report["gates"]["all_orderings_preserve_bounded_terminal_yield"]
          print("PASS_SAIR_OFFICIAL_SAMPLE200_BOUNDED_REUSE_V1")
          print(json.dumps(report["comparisons"], indent=2, sort_keys=True))
          PY

      - name: Upload public SAIR reuse evidence
        uses: actions/upload-artifact@v4
        with:
          name: sair-official-sample200-bounded-reuse-v1
          path: /tmp/sair-official-sample200-reuse-v1/
          if-no-files-found: error


  sair-normal-reuse-replication-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run frozen SAIR normal-set reuse replication
        run: |
          python scripts/run_sair_normal_reuse_replication_v1.py \
            --out-dir /tmp/sair-normal-reuse-replication-v1

      - name: Audit replication evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/sair-normal-reuse-replication-v1")
          report = json.loads((root / "report.json").read_text())
          assert report["verdict"] == "PASS"
          assert report["provenance"]["commit"] == "817a4653bf762584931d49c6714c9fcfab7df66a"
          assert report["provenance"]["excluded_pair_count"] == 200
          assert report["split"]["acquisition_false_count"] == 100
          assert report["split"]["fresh_false_count"] > 0
          assert len(report["capabilities"]) > 0
          assert report["true_controls"]["countermodels_found"] == 0
          assert report["gates"]["restart_exact"]
          assert report["gates"]["all_orderings_preserve_bounded_terminal_yield"]
          print("PASS_SAIR_NORMAL_REUSE_REPLICATION_V1")
          print(json.dumps(report["comparisons"], indent=2, sort_keys=True))
          PY

      - name: Upload SAIR normal replication evidence
        uses: actions/upload-artifact@v4
        with:
          name: sair-normal-reuse-replication-v1
          path: /tmp/sair-normal-reuse-replication-v1/
          if-no-files-found: error


  sair-cross-set-transfer-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run frozen cross-set verified capability transfer
        run: |
          python scripts/run_sair_cross_set_transfer_v1.py \
            --out-dir /tmp/sair-cross-set-transfer-v1

      - name: Audit cross-set transfer evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/sair-cross-set-transfer-v1")
          report = json.loads((root / "report.json").read_text())
          assert report["verdict"] == "PASS"
          assert report["provenance"]["commit"] == "817a4653bf762584931d49c6714c9fcfab7df66a"
          assert report["split"]["source_acquisition_false_count"] == 25
          assert report["split"]["target_false_count"] > 0
          assert len(report["capabilities"]) > 0
          assert report["true_controls"]["countermodels_found"] == 0
          assert report["gates"]["no_target_side_acquisition"]
          assert report["gates"]["restart_exact"]
          assert report["gates"]["all_orderings_preserve_bounded_terminal_yield"]
          print("PASS_SAIR_CROSS_SET_VERIFIED_CAPABILITY_TRANSFER_V1")
          print(json.dumps(report["comparisons"], indent=2, sort_keys=True))
          PY

      - name: Upload cross-set transfer evidence
        uses: actions/upload-artifact@v4
        with:
          name: sair-cross-set-transfer-v1
          path: /tmp/sair-cross-set-transfer-v1/
          if-no-files-found: error
