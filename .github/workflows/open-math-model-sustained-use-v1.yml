name: Open Math Model sustained-use V1

on:
  workflow_dispatch:
  push:
    branches:
      - open-math-model-sustained-use-v1
    paths:
      - "scripts/run_open_math_model_sustained_use_pilot.py"
      - "scripts/run_model_sustained_use_eval.py"
      - "scripts/export_model_sustained_use_prompt_pack.py"
      - "docs/open_math_model_sustained_use_v1.md"
      - ".github/workflows/open-math-model-sustained-use-v1.yml"

permissions:
  contents: read

jobs:
  mechanistic-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exact sustained-use fixture
        run: |
          python scripts/run_open_math_model_sustained_use_pilot.py \
            --out-dir /tmp/open-math-model-sustained-use-v1

      - name: Check exact fixture gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/open-math-model-sustained-use-v1/report.json")
          report = json.loads(path.read_text())
          mech = report["mechanistic_fixture"]
          econ = mech["sustained_use"]

          assert report["verdict"] == "PASS"
          assert all(mech["gates"].values())
          assert econ["cold_cost"] == 784
          assert econ["warm_cost"] == 28
          assert econ["compression_ratio"] == 28.0
          assert econ["sham_solution_count"] == 0
          assert econ["ablation_solution_count"] == 0
          assert econ["restart_solution_count"] > 0
          print("PASS_OPEN_MATH_MODEL_SUSTAINED_USE_V1")
          PY

      - name: Run model-facing protocol qualification
        run: |
          python scripts/run_model_sustained_use_eval.py \
            --provider deterministic \
            --out-dir /tmp/open-math-model-sustained-use-v1/model-pilot

      - name: Check model-facing protocol gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/open-math-model-sustained-use-v1/model-pilot/model_sustained_use_report.json")
          report = json.loads(path.read_text())
          assert report["provider"] == "deterministic_harness"
          assert report["provider_is_external_model"] is False
          assert report["verdict"] == "PASS"
          assert all(report["gates"].values())
          assert len(report["promoted_capabilities"]) >= 4
          assert report["aggregate"]["warm"]["reuse_hits"] > 0
          assert report["aggregate"]["restart"]["reuse_hits"] == report["aggregate"]["warm"]["reuse_hits"]
          assert report["aggregate"]["warm"]["materialized_table_cells"] < report["aggregate"]["cold"]["materialized_table_cells"]
          assert report["comparisons"]["warm_table_cell_reduction"] > 0
          print("PASS_MODEL_SUSTAINED_USE_PROTOCOL_V1")
          PY

      - name: Export external-model prompt pack
        run: |
          python scripts/export_model_sustained_use_prompt_pack.py \
            --out-dir /tmp/open-math-model-sustained-use-v1/external-prompt-pack

      - name: Check external-model prompt pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/open-math-model-sustained-use-v1/external-prompt-pack")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["bank_capability_count"] == 4
          assert manifest["fresh_task_count"] == 7
          assert manifest["request_count"] == 35
          assert set(manifest["conditions"]) == {"cold", "warm", "restart", "sham", "ablation"}
          assert (root / "preauthorized_verified_bank.json").exists()
          assert (root / "requests.jsonl").exists()
          print("PASS_EXTERNAL_MODEL_PROMPT_PACK_V1")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: open-math-model-sustained-use-v1
          path: /tmp/open-math-model-sustained-use-v1/
          if-no-files-found: error
