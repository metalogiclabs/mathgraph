name: WattBot V5b two-reader 317-row full qualification NO SUBMISSION
on:
  push:
    branches: [wattbot-verified-lesson-two-read-v5b]
    paths:
      - '.github/workflows/wattbot-v5b-full-qualification.yml'
jobs:
  qualified-v5b-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official source/model and validation dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf pytest
      - name: Prequalify pinned V4 admission, lesson memory, zero versus refusal and CSV
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/submit_verified_lesson_v5.py --self-test
          python -m pytest -q \
            experiments/wattbot2026/tests/test_query_window.py \
            experiments/wattbot2026/tests/test_submission_gate.py
      - name: Generate all 317 V5b original-plus-lesson model answers under one-dollar reserved cap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/submit_verified_lesson_v5.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip" \
            --out "$RUNNER_TEMP/wattbot/mathgraph_v5b_two_read.csv"
          python experiments/wattbot2026/submission_gate.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip" \
            --submission "$RUNNER_TEMP/wattbot/mathgraph_v5b_two_read.csv"
      - name: Preserve external competition authority
        run: |
          echo "Only private, ephemeral generated CSV in runner. No artifact upload."
          echo "No Kaggle competitions submit; no Kaggle quota spent."
          echo "Model estimated token costs reserved before EACH paired call."
          echo "Published score remains independently authenticated Kaggle V4 0.537."
