name: LeanEval Abel high-degree bridge

on:
  pull_request:
    paths:
      - '.github/workflows/lean-eval-abel-high-degree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abel-high-degree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_EVAL_SHA: de48559590eb8cff2125e8e933b3e13bb8a3ff98
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Clone frozen LeanEval
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem abel_ruffini /tmp/abel_ruffini
          cd /tmp/abel_ruffini
          lake update

      - name: Install high-degree obstruction helper
        working-directory: /tmp/abel_ruffini
        run: |
          cat > Submission.lean <<'EOF'
          import Mathlib
          import Archive.Wiedijk100Theorems.AbelRuffini
          import Submission.Helpers

          open Polynomial

          namespace Submission

          theorem high_degree_obstruction (n : ℕ) (hn : 5 ≤ n) :
              ¬ (∀ p : ℚ[X], p.natDegree = n → ∀ x : ℂ, aeval x p = 0 →
                  x ∈ solvableByRad ℚ ℂ) := by
            intro hall
            obtain ⟨x, hxalg, hxnot⟩ := AbelRuffini.exists_not_solvable_by_rad
            rcases hxalg with ⟨q, hq0, hqx⟩
            let bad : ℚ[X] := AbelRuffini.Φ ℚ 4 2
            have hbadroot : aeval x bad = 0 := by
              exact Classical.choose_spec (show ∃ y : ℂ, aeval y bad = 0 ∧ y ∉ solvableByRad ℚ ℂ by
                obtain ⟨y, hy⟩ := (IsAlgClosed.splits (bad.map (algebraMap ℚ ℂ))).exists_eval_eq_zero (by
                  simp [bad, AbelRuffini.degree_Phi])
                rw [← AbelRuffini.map_Phi 4 2 (algebraMap ℚ ℂ), eval_map] at hy
                exact ⟨y, hy, AbelRuffini.not_solvable_by_rad' y hy⟩)
            obtain ⟨y, hyroot, hynot⟩ : ∃ y : ℂ, aeval y bad = 0 ∧ y ∉ solvableByRad ℚ ℂ := by
              obtain ⟨y, hy⟩ := (IsAlgClosed.splits (bad.map (algebraMap ℚ ℂ))).exists_eval_eq_zero (by
                simp [bad, AbelRuffini.degree_Phi])
              rw [← AbelRuffini.map_Phi 4 2 (algebraMap ℚ ℂ), eval_map] at hy
              exact ⟨y, hy, AbelRuffini.not_solvable_by_rad' y hy⟩
            let p : ℚ[X] := bad * X ^ (n - 5)
            have hdeg : p.natDegree = n := by
              simp [p, bad, AbelRuffini.natDegree_Phi, hn]
            have hroot : aeval y p = 0 := by
              simp [p, hyroot]
            exact hynot (hall p hdeg y hroot)

          theorem abel_ruffini (n : ℕ) (_hn : 1 ≤ n) :
              (∀ p : ℚ[X], p.natDegree = n → ∀ x : ℂ, aeval x p = 0 →
                  x ∈ solvableByRad ℚ ℂ) ↔ n ≤ 4 := by
            constructor
            · intro h
              by_contra hnot
              have hn5 : 5 ≤ n := by omega
              exact high_degree_obstruction n hn5 h
            · intro hn
              sorry

          end Submission
          EOF

      - name: Build split proof and expose residual
        working-directory: /tmp/abel_ruffini
        run: |
          lake build 2>&1 | tee /tmp/abel-high-degree.log
          echo '## Abel-Ruffini high-degree bridge' >> "$GITHUB_STEP_SUMMARY"
          echo 'High-degree direction compiled; low-degree constructive direction intentionally remains the only sorry.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: lean-eval-abel-high-degree
          path: /tmp/abel-high-degree.log
