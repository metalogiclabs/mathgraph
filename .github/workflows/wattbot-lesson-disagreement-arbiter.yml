name: WattBot bounded disagreement arbitration against compiled lesson reader
on:
  push:
    branches: [wattbot-lesson-disagreement-arbiter-v1]
    paths:
      - '.github/workflows/wattbot-lesson-disagreement-arbiter.yml'
      - 'experiments/wattbot2026/derivation_router_probe.py'
jobs:
  disagreement-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official pinned scorer and scientific PDF dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Verify guarded disagreements and exact unchanged source identity
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/verified_lesson.py
          python experiments/wattbot2026/derivation_router_probe.py --self-test
      - name: Compare initial, lesson and disagreement-arbiter answers on identical TRAIN responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/derivation_router_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Protected scientific scope
        run: |
          echo "Third read is triggered ONLY by different nonblank candidate values."
          echo "Identical six pinned PDF evidence pages in all three model calls."
          echo "Two learned worked lessons come from 182 TRAIN dev examples, target holdout excluded."
          echo "First, lesson and critic responses kept fixed across all official scorer arms."
          echo "Source quote verifier checks literal occurrence, NOT semantic entailment."
          echo "Secondary model reservation <= USD 0.16, critic <= USD 0.12."
          echo "No Kaggle TEST labels or submission."
