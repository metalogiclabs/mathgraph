name: Nebius Autopilot Bounded Verification
on:
  pull_request:
    paths:
      - 'experiments/nebius_warranted_agent/**'
      - '.github/workflows/nebius-autopilot-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-finite-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout independently pinned upstream Pallets source
        uses: actions/checkout@v4
        with:
          repository: pallets/itsdangerous
          ref: 672971d66a2ef9f85151e53283113f33d642dabd
          path: upstream_itsdangerous
          persist-credentials: false
      - name: Install pinned upstream test runner
        run: python -m pip install pytest==8.4.2
      - name: Independent adversarial test suite
        run: python -m unittest -v test_autopilot test_cockpit test_separating_experiments test_separating_cockpit test_upstream_encoding_transfer test_upstream_transfer_cockpit test_upstream_nebius_agent
        env:
          MATHGRAPH_PINNED_UPSTREAM: ../../upstream_itsdangerous
        working-directory: experiments/nebius_warranted_agent
      - name: Reproduce offline agent loop and receipt withdrawal
        working-directory: experiments/nebius_warranted_agent
        run: |
          python autopilot.py --provider scripted --report offline-report.json > /dev/null
          python cockpit.py offline-report.json --output offline-cockpit.html
          python separating_experiments.py --report separating-report.json
          python separating_cockpit.py separating-report.json --output separating-cockpit.html
      - name: Source-native upstream mutation transfer and independent witness acquisition
        working-directory: experiments/nebius_warranted_agent
        run: |
          python upstream_encoding_transfer.py --upstream-checkout ../../upstream_itsdangerous --report upstream-transfer-report.json
          python upstream_transfer_cockpit.py upstream-transfer-report.json --output upstream-transfer-cockpit.html
      - name: Scripted model proposals against pinned upstream native tests
        working-directory: experiments/nebius_warranted_agent
        run: |
          python upstream_nebius_agent.py --provider scripted --upstream-checkout ../../upstream_itsdangerous --report upstream-agent-report.json
      - name: Retain offline audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebius-autopilot-offline-evidence
          path: |
            experiments/nebius_warranted_agent/offline-report.json
            experiments/nebius_warranted_agent/offline-cockpit.html
            experiments/nebius_warranted_agent/separating-report.json
            experiments/nebius_warranted_agent/separating-cockpit.html
            experiments/nebius_warranted_agent/upstream-transfer-report.json
            experiments/nebius_warranted_agent/upstream-transfer-cockpit.html
            experiments/nebius_warranted_agent/upstream-agent-report.json
          if-no-files-found: error
