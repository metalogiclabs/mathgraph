name: VDN ARC minimal causal memory V29

on:
  push:
    branches:
      - mathgraph/msi-arc-pikpi-v11-20260828
  workflow_dispatch:

jobs:
  minimal-causal-memory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V29 minimal causal memory
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v29_minimal_causal_memory.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-minimal-causal-memory-v29
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v29_minimal_causal_memory/result.json
