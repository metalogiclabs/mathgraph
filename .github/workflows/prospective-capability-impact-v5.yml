name: Prospective Capability Impact V5
on:
  push:
    branches:
      - research/prospective-capability-impact-v5-20261022
  pull_request:
    paths:
      - 'research/prospective_capability_impact_v5/**'
      - 'conformance/capability_v1/consumer.py'
      - '.github/workflows/prospective-capability-impact-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned pytest
        run: python -m pip install pytest==9.0.3
      - name: Execute source-independent boundary, negative controls and matched suites
        run: |
          python -m py_compile research/prospective_capability_impact_v5/experiment.py
          PYTHONPATH=. python research/prospective_capability_impact_v5/experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prospective-capability-impact-v5
          path: research/prospective_capability_impact_v5/result.json
          if-no-files-found: warn
