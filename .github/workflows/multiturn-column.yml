name: Multi-turn column compass qualification
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - 'experiments/uzh_rotation/multiturn_column_sim.py'
      - '.github/workflows/multiturn-column.yml'
  workflow_dispatch:
jobs:
  synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3
      - name: Synthetic 12-turn single-column benchmark
        run: python experiments/uzh_rotation/multiturn_column_sim.py --seed 27 --turns 12 --output multiturn.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiturn-qualification
          path: multiturn.json
