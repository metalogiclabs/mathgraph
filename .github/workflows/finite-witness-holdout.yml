name: Frozen finite bounded-noise compass holdout
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - '.github/workflows/finite-witness-holdout.yml'
  workflow_dispatch:
jobs:
  finite-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze the qualified estimator and auditor before unseen seeds
        run: |
          git diff --exit-code e53bbd0effbb77bcf2f1308e1eb8a601e2bc175c HEAD -- \
            experiments/uzh_rotation/finite_witness_compass.py \
            experiments/uzh_rotation/audit_finite_witness.py \
            experiments/uzh_rotation/test_finite_witness_compass.py \
            experiments/uzh_rotation/FINITE_WITNESS_PROTOCOL.md
      - name: Recheck bounded invariants and counterexamples
        run: python -m unittest discover -s experiments/uzh_rotation -p 'test_finite_witness_compass.py' -v
      - name: Run preregistered untouched finite holdouts and independent audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p finite_witness_holdout_artifacts
          for seed in 1013 2017 3019 4019; do
            for heading in 0 16 32 48; do
              for condition in breakable unbreakable occluded7; do
                file="finite_witness_holdout_artifacts/${seed}_${heading}_${condition}.json"
                if [ "$condition" = "occluded7" ]; then
                  python experiments/uzh_rotation/finite_witness_compass.py --seed "$seed" --true-bin "$heading" --kind breakable --occlude 7 --output "$file" > /dev/null
                else
                  python experiments/uzh_rotation/finite_witness_compass.py --seed "$seed" --true-bin "$heading" --kind "$condition" --output "$file" > /dev/null
                fi
                python experiments/uzh_rotation/audit_finite_witness.py "$file"
              done
            done
          done
      - name: Publish every acceptance, abstention and observation cost
        run: |
          python - <<'PY'
          import glob,json
          data=[json.load(open(p)) for p in sorted(glob.glob('finite_witness_holdout_artifacts/*.json'))]
          assert len(data)==48, len(data)
          violations=[]
          for r in data:
              a,c=r['acquired'],r['continuous']
              condition='unbreakable' if r['kind']=='unbreakable' else ('occluded7' if r['occluded_steps'] else 'breakable')
              print('FINITE_HOLDOUT',r['seed'],r['true_bin'],condition,'planned',a['status'],a['accepted_bin'],a['acquired_steps'],a['pair_checks'],'continuous',c['status'],c['accepted_bin'],len(c['acquired_steps']),c['decision_step'])
              if condition=='unbreakable':
                  if a['status']!='UNKNOWN_OBSTRUCTION' or c['status']!='UNKNOWN_AMBIGUOUS':
                      violations.append((r['seed'],r['true_bin'],condition,'false-confidence'))
              else:
                  if any(m['status']!='AUTHORIZED' or m['accepted_bin']!=r['true_bin'] for m in (a,c)):
                      violations.append((r['seed'],r['true_bin'],condition,'incorrect-or-missing'))
          print('FINITE_HOLDOUT_VIOLATIONS',violations)
          assert not violations
          PY
      - name: Retain complete holdout traces even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-witness-frozen-holdout-v1
          path: finite_witness_holdout_artifacts/
