name: Primary pressure-flux source audit V9
on:
  push:
    branches: [navier-stokes-semantic-bridge-v1]
    paths: ['.github/workflows/navier-stokes-pressure-source-v9.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/navier-stokes-pressure-source-v9.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pressure-primary-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin primary source identity and original Lean declaration
        run: |
          set -euo pipefail
          mkdir -p pressure-primary-v9-evidence
          git rev-parse HEAD | tee pressure-primary-v9-evidence/head-sha.txt
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            -A 'Mozilla/5.0 (semantic-correspondence-research; source pin check)' \
            'https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf' \
            -o /tmp/navier-primary.pdf
          echo '0e779481c4da40bd28d1e642e1d8ca57447d129610df28dfa5a11e9af8ae228f  /tmp/navier-primary.pdf' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --max-time 75 \
            'https://raw.githubusercontent.com/openai/NavierStokesAndEuler/f9e8bc5/NavierStokes/R3/PressureFlux.lean' \
            -o /tmp/PressureFlux.lean
          test "$(git hash-object /tmp/PressureFlux.lean)" = '542377decf40306a50ce2170783de99a384b8d41'
          pdftotext -layout /tmp/navier-primary.pdf /tmp/navier-primary.txt
      - name: Extract exact equation 10.19 and pressure theorem authority, without certifying their equivalence
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          t=Path('/tmp/navier-primary.txt').read_text()
          pages=t.split('\f')
          assert len([p for p in pages if p.strip()]) == 166
          candidates=[]
          for idx,p in enumerate(pages,1):
            for m in re.finditer(r'\(\s*10\.19\s*\)',p):
              lines=p.splitlines()
              line=p[:m.start()].count('\n')
              context='\n'.join(lines[max(0,line-13): min(len(lines),line+7)])
              candidates.append({'page':idx,'line':line+1,'context':context})
          assert len(candidates)==1,('10.19 ambiguous',[(c['page'],c['line']) for c in candidates])
          assert candidates[0]['page']==123,('PDF page drift',candidates[0]['page'])
          code=Path('/tmp/PressureFlux.lean').read_text()
          name='theorem exists_uniform_actual_pressure_flux_bound'
          start=code.index(name)
          end=code.index(' := by',start)
          statement=code[start:end]
          assert 'dissipationRoot' in statement and 'cutoffL6' in statement
          result={
            'schema':'mathgraph.pressure-primary-authority-v9',
            'head_sha':Path('pressure-primary-v9-evidence/head-sha.txt').read_text().strip(),
            'primary_pdf_sha256':'0e779481c4da40bd28d1e642e1d8ca57447d129610df28dfa5a11e9af8ae228f',
            'primary_equation_anchor':'10.19','primary_equation_pages':[x['page'] for x in candidates],
            'primary_exact_context':candidates[0]['context'],
            'formal_git_blob':'542377decf40306a50ce2170783de99a384b8d41',
            'formal_declaration':name.removeprefix('theorem '),
            'formal_statement_sha256':hashlib.sha256(statement.encode()).hexdigest(),
            'formal_has_extra_gradient_term':True,
            'mathematical_implication_certified':False,
            'source_semantics_certified':False,
            'source_argument_fidelity':'UNKNOWN',
            'can_promote_truth':False,
          }
          assert result['head_sha']==os.environ['EXPECTED_HEAD']
          out=Path('pressure-primary-v9-evidence/result.json')
          out.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          # This is a short excerpt used solely for internal source comparison;
          # do not reproduce the full manuscript in downstream outputs.
          print('PRIMARY_EQ_10_19_CONTEXT_BEGIN')
          print(candidates[0]['context'][:1800])
          print('PRIMARY_EQ_10_19_CONTEXT_END')
          print('SCOPED_PRIMARY_PRESSURE_SOURCE_IDENTITIES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pressure-primary-v9
          path: pressure-primary-v9-evidence/
          if-no-files-found: error
