name: WattBot V5b read-only external Kaggle authority
on:
  push:
    branches: [wattbot-verified-lesson-two-read-v5b]
    paths:
      - '.github/workflows/wattbot-v5b-external-status.yml'
jobs:
  kaggle-current-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only authenticated Kaggle CLI
        run: python -m pip install kaggle
      - name: Check most recent completed MathGraph submissions
        run: kaggle competitions submissions -c WattBot2026
      - name: Check exact external leader and current public rank
        run: kaggle competitions leaderboard WattBot2026 --show
      - name: Authenticated ranking and entry status
        run: kaggle competitions list --group entered -s WattBot2026 -v
      - name: Keep quota and secrets unchanged
        run: echo "Read-only official Kaggle authority; no submission, Kaggle TEST or model calls."
