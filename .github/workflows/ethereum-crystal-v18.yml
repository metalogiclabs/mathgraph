name: ethereum-crystal-v18-geth-disk-backed
on:
  push:
    branches: [ethereum-crystal-v18-geth-disk-backed]
  workflow_dispatch:
jobs:
  geth-disk-backed-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned EELS
        run: |
          git clone --filter=blob:none https://github.com/ethereum/execution-specs.git /tmp/eels
          cd /tmp/eels
          git checkout 84e7d2c266e3319fc3882e72f379282bb1c40f2d

      - uses: astral-sh/setup-uv@v6

      - name: Install EELS workspace
        working-directory: /tmp/eels
        run: uv sync --group test

      - name: Generate official Amsterdam BAL corpus
        working-directory: /tmp/eels
        run: |
          rm -rf /tmp/eels-v18-fixtures
          uv run fill --from Amsterdam --until Amsterdam --output=/tmp/eels-v18-fixtures --skip-index --no-html -n 2 tests/amsterdam/eip7928_block_level_access_lists

      - name: Export frozen held-out BAL RLP
        run: |
          uv run --project /tmp/eels python experiments/ethereum_crystal_v10/export_heldout_rlp.py /tmp/eels-v18-fixtures /tmp/crystal-v18-heldout.rlpbin
          sha256sum /tmp/crystal-v18-heldout.rlpbin | tee /tmp/crystal-v18-heldout.sha256

      - name: Checkout and patch pinned geth
        run: |
          git clone --filter=blob:none https://github.com/ethereum/go-ethereum.git /tmp/geth
          cd /tmp/geth
          git checkout 920c07774c65ebb3023536f85df642c44478b540
          test "$(git rev-parse HEAD)" = "920c07774c65ebb3023536f85df642c44478b540"
          cp "$GITHUB_WORKSPACE/experiments/ethereum_crystal_v13/crystal_apply_decoder.go" core/types/bal/crystal_apply_decoder.go
          python "$GITHUB_WORKSPACE/experiments/ethereum_crystal_v13/patch_geth.py"
          cp "$GITHUB_WORKSPACE/experiments/ethereum_crystal_v18/crystal_disk_catchup_test.go" eth/protocols/snap/crystal_disk_catchup_test.go
          gofmt -w core/types/bal/crystal_apply_decoder.go eth/protocols/snap/syncv2.go eth/protocols/snap/crystal_disk_catchup_test.go
          git diff --check
          git diff > /tmp/crystal-v18-geth.patch

      - name: Compile BAL and snap packages
        working-directory: /tmp/geth
        run: |
          go test ./core/types/bal -count=1
          go test ./eth/protocols/snap -run '^$' -count=1

      - name: Run disk-backed paired A/B gate
        working-directory: /tmp/geth
        env:
          CRYSTAL_BAL_CORPUS: /tmp/crystal-v18-heldout.rlpbin
          CRYSTAL_V18_RESULT: /tmp/crystal-v18-result.json
        run: |
          go test ./eth/protocols/snap -run '^TestCrystalDiskBackedCatchupAB$' -count=1 -v | tee /tmp/crystal-v18-test.txt
          grep -q 'ETHEREUM_CRYSTAL_V18_DISK_BACKED_AB=PASS' /tmp/crystal-v18-test.txt
          cat /tmp/crystal-v18-result.json
          python - <<'PY'
          import json
          p = "/tmp/crystal-v18-result.json"
          d = json.load(open(p))
          assert d["Protocol"] == "ETHEREUM_CRYSTAL_V18_GETH_DISK_BACKED_AB"
          assert d["Records"] == 1112
          assert d["SeedRecords"] == 556
          assert d["MeasuredRecords"] == 556
          assert d["TrialsPerRegime"] == 7
          assert len(d["Observations"]) == 28
          assert d["FinalDigest"]
          for regime in ("fresh_open", "prewarmed"):
              s = d["Regimes"][regime]
              print(
                  regime,
                  "apply_speedup=", s["ApplySpeedup"],
                  "durable_speedup=", s["DurableSpeedup"],
                  "full_apply_ns=", s["FullApplyMedianNS"],
                  "compact_apply_ns=", s["CompactApplyMedianNS"],
                  "full_durable_ns=", s["FullDurableMedianNS"],
                  "compact_durable_ns=", s["CompactDurableMedianNS"],
              )
          PY

      - name: Upload V18 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-crystal-v18-geth-disk-backed
          path: |
            /tmp/crystal-v18-result.json
            /tmp/crystal-v18-test.txt
            /tmp/crystal-v18-geth.patch
            /tmp/crystal-v18-heldout.sha256

      - name: Seal
        run: |
          echo "ETHEREUM_CRYSTAL_V18_GETH_DISK_BACKED=PASS"
          echo "GETH_PIN=920c07774c65ebb3023536f85df642c44478b540"
          echo "PERFORMANCE_DIRECTION_NOT_PRECOMMITTED=true"
          echo "NO_UPSTREAM_PR_CREATED=true"
