name: VDN ARC-AGI-2 v23 raw-trace induction
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v23_trace_induced_patch.py'
      - '.github/workflows/vdn-arc2-v23.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace-induced:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/arc2
          cd /tmp/arc2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(find data/evaluation -name '*.json' | wc -l)" -eq 120
      - name: Run raw-trace induced representation
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v23_trace_induced_patch.py /tmp/arc2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-v23
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v23_trace_induced_patch/result.json
