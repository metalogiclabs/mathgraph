name: Crystal Independent Admission V1
on:
  push:
    branches: [crystal-independent-admission-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[all]'
      - name: Frozen inherited gate
        run: python -m pytest -q tests/test_crystal_query_gateway_atp_v0.py tests/test_crystal_protected_continuation_core_v0.py tests/test_crystal_protected_continuation_adversarial_v1.py
      - name: Independent admission contract
        run: python -m pytest -q tests/test_crystal_independent_admission_v1.py
      - name: Source snapshot for reproducibility
        if: always()
        run: |
          mkdir -p /tmp/crystal-admission-evidence
          git archive --format=tar HEAD mathgraph adapters tests scripts examples pyproject.toml AGENTS.md > /tmp/crystal-admission-evidence/source.tar
          git rev-parse HEAD > /tmp/crystal-admission-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crystal-independent-admission-source
          path: /tmp/crystal-admission-evidence
          if-no-files-found: error
