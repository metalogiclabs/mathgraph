name: Crystal Chess Residual Compounding V4

on:
  push:
    branches:
      - crystal-chess-residual-compounding-v4
    paths:
      - "experiments/crystal_chess_kpvk_v0.py"
      - "experiments/crystal_chess_goal_certificate_v3.py"
      - "experiments/crystal_chess_residual_compounding_v4.py"
      - ".github/workflows/crystal-chess-residual-compounding-v4.yml"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  residual-compounding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Compile chess experiments
        run: |
          python -m py_compile experiments/crystal_chess_goal_certificate_v3.py
          python -m py_compile experiments/crystal_chess_residual_compounding_v4.py

      - name: Acquire exact 3-piece Syzygy WDL authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Acquire residual repair and reclose held-out d file
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v4
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v4/
          python experiments/crystal_chess_residual_compounding_v4.py             --tablebase-dir /tmp/syzygy             --output artifacts/crystal-chess-v4/crystal_chess_residual_compounding_v4.json             | tee artifacts/crystal-chess-v4/run.log
          grep -q "CRYSTAL_CHESS_RESIDUAL_COMPOUNDING_V4=PASS" artifacts/crystal-chess-v4/run.log

      - name: Upload Crystal Chess V4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-residual-compounding-v4
          path: artifacts/crystal-chess-v4/
          if-no-files-found: error
