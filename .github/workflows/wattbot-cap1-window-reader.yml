name: WattBot complete-corpus cap-one source reader qualification
on:
  push:
    branches: [wattbot-cap1-window-reader-v1]
    paths:
      - 'experiments/wattbot2026/cap1_window_probe.py'
      - '.github/workflows/wattbot-cap1-window-reader.yml'
jobs:
  cap-one-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source and official scorer dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Deterministic full-reader source-preservation self-tests
        shell: bash
        run: |
          set -euo pipefail
          python experiments/wattbot2026/full_reader.py --self-test
          python experiments/wattbot2026/cap1_window_probe.py --self-test
      - name: Evaluate development-selected source diversity on TRAIN holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/cap1_window_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Scope boundary
        run: |
          echo "Only reused 63-row TRAIN holdout; no Kaggle TEST or submission."
          echo "Explicitly compare against historical rather than paired LLM control."
