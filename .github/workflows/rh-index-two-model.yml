name: RH prebuild bounded countermodel controls

on:
  push:
    branches:
      - research/rh-definition-bridge-20261121
    paths:
      - 'research/rh-definition-bridge/index_two_patch_rank_one_model.py'
      - 'research/rh-definition-bridge/index_two_patch_rank_two_model.py'
      - 'research/rh-definition-bridge/quadratic_frobenius_negative_control.py'
      - 'research/rh-definition-bridge/countv_actual_host_character_contract.py'
      - 'research/rh-definition-bridge/counti_actual_gd_quadratic_contract.py'
      - '.github/workflows/rh-index-two-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive finite rank-one control
        run: |
          set -euo pipefail
          python3 research/rh-definition-bridge/index_two_patch_rank_one_model.py | tee "$RUNNER_TEMP/patch-model.log"
          grep -Fx 'PASS: finite-family countermodel and positive controls' "$RUNNER_TEMP/patch-model.log"
          grep -Fx 'rank=2 sign_characters=3 pairwise_compatible=8 no_global_character=4' "$RUNNER_TEMP/patch-model.log"
          grep -Fx 'rank=3 sign_characters=4 pairwise_compatible=280 no_global_character=0' "$RUNNER_TEMP/patch-model.log"
      - name: Exhaustive finite rank-two control
        run: |
          set -euo pipefail
          python3 research/rh-definition-bridge/index_two_patch_rank_two_model.py | tee "$RUNNER_TEMP/patch-rank-two.log"
          grep -Fx 'rank=3 rep_dim=2 sign_characters=6 compatible=280 nongluable=28' "$RUNNER_TEMP/patch-rank-two.log"
          grep -Fx 'rank=3 rep_dim=2 sign_characters=7 compatible=36 nongluable=0' "$RUNNER_TEMP/patch-rank-two.log"
          grep -Fx 'no_compatible_seventh_character_even_after_rank4_extension=9/9' "$RUNNER_TEMP/patch-rank-two.log"
          grep -Fx 'PASS: rank-two finite patching obstruction and seventh-character controls' "$RUNNER_TEMP/patch-rank-two.log"
      - name: Quadratic local Frobenius necessity control
        run: |
          set -euo pipefail
          python3 research/rh-definition-bridge/quadratic_frobenius_negative_control.py | tee "$RUNNER_TEMP/quadratic-model.log"
          grep -Fx 'PASS: congruence and local residue prerequisites for necessity of hTP' "$RUNNER_TEMP/quadratic-model.log"
          grep -Fx 'legendre_5_mod19=1 legendre_minus1_mod19=-1' "$RUNNER_TEMP/quadratic-model.log"
      - name: CountV actual Host/Dirichlet-character antecedent witness
        run: |
          set -euo pipefail
          python3 research/rh-definition-bridge/countv_actual_host_character_contract.py | tee "$RUNNER_TEMP/countv-actual-contract.log"
          grep -Fx 'PASS: exact arithmetic Host/character case split, k=12..18' "$RUNNER_TEMP/countv-actual-contract.log"
          grep -F 'k=13 ' "$RUNNER_TEMP/countv-actual-contract.log" | grep -F 'case=CountVs'
          grep -F 'k=14 ' "$RUNNER_TEMP/countv-actual-contract.log" | grep -F 'case=CountV'
      - name: CountI live GD quadratic-field and Galois-noncontainment witness
        run: |
          set -euo pipefail
          python3 research/rh-definition-bridge/counti_actual_gd_quadratic_contract.py | tee "$RUNNER_TEMP/counti-gd-contract.log"
          grep -Fx 'PASS: real CorG/GD and Host/CaseI arithmetic antecedent witness' "$RUNNER_TEMP/counti-gd-contract.log"
          grep -Fx 'GD_eta_exponent=591 mod5=1 mod59=1 mod7=3' "$RUNNER_TEMP/counti-gd-contract.log"
      - name: Retain evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh-prebuild-necessity-controls
          path: |
            ${{ runner.temp }}/patch-model.log
            ${{ runner.temp }}/patch-rank-two.log
            ${{ runner.temp }}/quadratic-model.log
            ${{ runner.temp }}/countv-actual-contract.log
            ${{ runner.temp }}/counti-gd-contract.log
          if-no-files-found: warn
