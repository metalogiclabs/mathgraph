name: WattBot expanded answer-literal certificate paired ablation
on:
  push:
    branches: [wattbot-expanded-value-certificate-v1]
    paths:
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
      - '.github/workflows/wattbot-expanded-value-certificate.yml'
jobs:
  paired-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen PDF/source scorer dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Test exact source-carrying candidate and refusal on insufficient evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Compare evidence expanded beyond six model excerpts using SAME 63 TRAIN model responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Epistemic and data boundary
        run: |
          echo "Page-literal matching can certify provenance but NOT semantic implication."
          echo "Model-supplied source IDs remain provisional. Same responses compared across variants."
          echo "Official TRAIN score only; no Kaggle TEST labels/submissions/private answer artifacts."
