name: Crystal Cross-Prover Auto Family V3

on:
  push:
    branches:
      - crystal-cross-prover-auto-family-v3
    paths:
      - 'experiments/crystal_cross_prover_auto_family_v3/**'
      - 'mathgraph/cross_prover_family_discovery.py'
      - 'tests/test_cross_prover_family_discovery.py'
      - '.github/workflows/crystal-cross-prover-auto-family-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - name: Test discovery kernel
        run: python -m pytest -q tests/test_cross_prover_family_discovery.py
      - name: Discover exact V3 family
        run: |
          set -euo pipefail
          mkdir -p /tmp/pvs-family artifacts/crystal_cross_prover_auto_family_v3
          BASE=https://raw.githubusercontent.com/j-tanner-slagel/pvs_cad/8750362e99c2ba0e9a0307dcaa39b9766c562feb/cad
          for f in cad_demo.pvs cad_demo.prf cad_examples.pvs cad_examples.prf cad_star_ex.pvs cad_star_ex.prf; do
            curl -fsSL -o "/tmp/pvs-family/$f" "$BASE/$f"
          done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from mathgraph.cross_prover_family_discovery import discover_family,render_lean_family
          m=json.loads(Path("experiments/crystal_cross_prover_auto_family_v3/manifest.json").read_text())
          pins={}
          for row in m["source"]["files"]:
              pins[Path(row["source_path"]).name]=row["source_blob_sha"]
              pins[Path(row["proof_path"]).name]=row["proof_blob_sha"]
          def git_blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          for name,want in pins.items():
              data=Path("/tmp/pvs-family",name).read_bytes()
              got=git_blob(data)
              assert got==want,(name,got,want)

          sources={k:Path("/tmp/pvs-family",f"{k}.pvs").read_text() for k in ("cad_demo","cad_examples","cad_star_ex")}
          proofs={k:Path("/tmp/pvs-family",f"{k}.prf").read_text() for k in ("cad_demo","cad_examples","cad_star_ex")}
          d=discover_family(sources,proofs)
          assert d["source_lemma_count"]==34,d
          assert d["supported_occurrence_count"]==19,d
          assert d["source_verified_occurrence_count"]==18,d
          assert d["source_unverified_supported_occurrence_count"]==1,d
          assert d["unsupported_occurrence_count"]==15,d
          assert d["unique_canonical_claim_count"]==18,d
          assert d["verified_unique_claim_count"]==18,d
          assert d["duplicate_semantic_group_count"]==1,d

          reused=set(m["reused_claim_ids"])
          fresh=set(m["new_constructor"]["new_claim_ids"])
          supported={x["claim_id"] for x in d["unique_claims"]}
          assert supported==reused|fresh,(sorted(supported),sorted(reused|fresh))
          by_claim={x["claim_id"]:x for x in d["unique_claims"]}
          assert all(by_claim[c]["certificate_schema"]=="algebraic_root_witness" for c in fresh)

          unsupported={f"{x['theory']}.{x['formula']}":x["status"] for x in d["unsupported_occurrences"]}
          for control in m["negative_controls"]:
              assert unsupported.get(control)=="UNKNOWN_UNSUPPORTED_GRAMMAR"
          for projected in m["projection_resolved_but_not_same_meaning"]:
              assert unsupported.get(projected)=="UNKNOWN_UNSUPPORTED_GRAMMAR"

          unverified=[x for x in d["supported_occurrences"] if x["source_proof_status"]=="NO_PINNED_PROOF"]
          assert len(unverified)==1 and unverified[0]["theory"]=="cad_demo" and unverified[0]["formula"]=="s_pos",unverified

          out=Path("artifacts/crystal_cross_prover_auto_family_v3")
          out.joinpath("discovery.json").write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          out.joinpath("Surface.lean").write_text(render_lean_family(d,skip_claim_ids=sorted(reused)))
          print(json.dumps({
              "source_lemmas":34,
              "supported_occurrences":19,
              "unique_claims":18,
              "reused_claims":14,
              "new_algebraic_root_claims":4,
              "raw_exact_unknowns":15,
              "parallel_projection_relations":4,
              "effective_unresolved_by_any_warranted_transport":11
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-auto-family-v3-discovery
          path: artifacts/crystal_cross_prover_auto_family_v3/

  pvs-replay:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates libgmp10
      - name: Install exact PVS
        run: |
          set -euo pipefail
          curl -fL -o /tmp/pvs.tgz https://github.com/SRI-CSL/PVS/releases/download/pvs8.1.2/pvs-linux-x86_64.tgz
          echo "5b7d859feff90fc7e566c669a36aaea0254e762c7a723260cf5fd7e1721fcf1b  /tmp/pvs.tgz" | sha256sum -c -
          mkdir -p /tmp/pvs-dist
          tar -xzf /tmp/pvs.tgz -C /tmp/pvs-dist
          PVS_BIN="$(find /tmp/pvs-dist -maxdepth 3 -type f -name pvs -perm -u+x | head -1)"
          PVS_DIR="$(dirname "$PVS_BIN")"
          echo "PVS_DIR=$PVS_DIR" >> "$GITHUB_ENV"
          "$PVS_BIN" --version
      - name: Pin source environment
        run: |
          set -euo pipefail
          git init /tmp/nasalib
          git -C /tmp/nasalib remote add origin https://github.com/nasa/pvslib.git
          git -C /tmp/nasalib fetch --depth=1 origin e426f69dc2680ad575491f93c5a51739ec8b25fa
          git -C /tmp/nasalib checkout --detach FETCH_HEAD
          git init /tmp/pvs_cad
          git -C /tmp/pvs_cad remote add origin https://github.com/j-tanner-slagel/pvs_cad.git
          git -C /tmp/pvs_cad fetch --depth=1 origin 8750362e99c2ba0e9a0307dcaa39b9766c562feb
          git -C /tmp/pvs_cad checkout --detach FETCH_HEAD
          ln -sfn /tmp/nasalib "$PVS_DIR/nasalib"
      - name: Replay four new source authorities
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal_cross_prover_auto_family_v3
          cd /tmp/pvs_cad/cad
          export PVS_LIBRARY_PATH=/tmp/nasalib
          "$PVS_DIR/proveit" -q --timeout 180 @cad_demo.d_cone:t_sqrt2 | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v3/pvs_demo.log"
          "$PVS_DIR/proveit" -q --timeout 180 @cad_examples.ex_circle | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v3/pvs_examples.log"
          "$PVS_DIR/proveit" -q --timeout 180 @cad_star_ex.s_root | tee "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v3/pvs_star.log"
          for log in "$GITHUB_WORKSPACE"/artifacts/crystal_cross_prover_auto_family_v3/pvs_*.log; do
            grep -q "Grand Totals:" "$log"
            if grep -Ei "unfinished|untried|unchecked" "$log"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-auto-family-v3-pvs
          path: artifacts/crystal_cross_prover_auto_family_v3/

  lean-replay:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cross-prover-auto-family-v3-discovery
          path: /tmp/family
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check four new consumers
        run: |
          set -euo pipefail
          ROOT=/tmp/crystal-cross-prover-family-v3-lean
          mkdir -p "$ROOT"
          cp /tmp/family/Surface.lean "$ROOT/Surface.lean"
          echo 'leanprover/lean4:v4.35.0-rc3' > "$ROOT/lean-toolchain"
          cat > "$ROOT/lakefile.toml" <<'EOF'
          name = "crystal-cross-prover-auto-family-v3"
          version = "0.1.0"
          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "3cb72cfd416d1b5ec4b930d67648ef036a5df24f"
          EOF
          cd "$ROOT"
          lake update
          lake exe cache get
          lake env lean Surface.lean
          mkdir -p "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v3"
          sha256sum Surface.lean > "$GITHUB_WORKSPACE/artifacts/crystal_cross_prover_auto_family_v3/lean_surface.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-prover-auto-family-v3-lean
          path: artifacts/crystal_cross_prover_auto_family_v3/

  promote:
    needs: [discover,pvs-replay,lean-replay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MathGraph
        run: python -m pip install -e ".[all]"
      - uses: actions/download-artifact@v4
        with:
          name: cross-prover-auto-family-v3-discovery
          path: /tmp/discovery
      - name: Promote V3
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal_cross_prover_auto_family_v3
          python - <<'PY'
          import json,os
          from pathlib import Path
          from mathgraph.cross_prover_family_discovery import compile_family_bundle
          d=json.loads(Path("/tmp/discovery/discovery.json").read_text())
          m=json.loads(Path("experiments/crystal_cross_prover_auto_family_v3/manifest.json").read_text())
          reused=sorted(m["reused_claim_ids"])
          fresh=sorted(m["new_constructor"]["new_claim_ids"])
          obj=compile_family_bundle(
              d,
              reused_claim_ids=reused,
              newly_qualified_claim_ids=fresh,
              evidence_refs=[
                  f"github-run:{os.environ['RUN_ID']}:pvs-replay",
                  f"github-run:{os.environ['RUN_ID']}:lean-replay",
                  "github-run:36638968224:promotion",
                  "github-run:36640121901:sufficient-interface-promotion"
              ],
          )
          out={
              "schema":"mathgraph.crystal-cross-prover-auto-family-result.v3",
              "status":"WARRANTED_BOUNDED_AUTOMATIC_CROSS_PROVER_FAMILY_V3",
              "run_id":int(os.environ["RUN_ID"]),
              "head_sha":os.environ["HEAD_SHA"],
              "parent_warrant_run":36638968224,
              "parallel_sufficient_interface_warrant_run":36640121901,
              "source_lemma_count":34,
              "supported_occurrence_count":19,
              "unique_canonical_claim_count":18,
              "reused_claim_count":14,
              "newly_qualified_claim_count":4,
              "new_constructor":"algebraic_root_witness",
              "raw_exact_unknowns":15,
              "parallel_projection_relations":4,
              "effective_unresolved_by_any_warranted_transport":11,
              "same_meaning_boundary":"Only the 18 canonical claims are exact semantic-linker meanings; the four projection relations remain INTERFACE_IMPLIES_SOURCE_INSTANCE.",
              "family_semantic_object_id":obj.id,
              "interfaces":list(obj.interfaces)
          }
          Path("artifacts/crystal_cross_prover_auto_family_v3/result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-cross-prover-auto-family-v3
          path: artifacts/crystal_cross_prover_auto_family_v3/result.json
