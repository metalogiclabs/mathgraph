name: EIK live board read-only receipt
on:
  push:
    branches: [research/eik-live-board-readonly-20261125]
    paths: ['.github/workflows/eik-live-board-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Query public endpoints using pinned miner client
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          date -u +%FT%TZ > evidence/utc.txt
          git clone -q https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          git -C kit checkout -q --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          git -C kit rev-parse HEAD > evidence/client-pin.txt
          python3 -c 'import requests' || python3 -m pip install --user requests
          for board in boards overall rv32im thumbv6m; do
            if [ "$board" = boards ]; then
              timeout 75s python3 kit/miner/submit.py boards > evidence/boards.json 2> evidence/boards.stderr
            else
              timeout 75s python3 kit/miner/submit.py leaderboard --board "$board" > "evidence/$board.json" 2> "evidence/$board.stderr"
            fi
            printf '%s %s\n' "$board" "$?" >> evidence/status.txt
          done
          cat evidence/status.txt
          for f in evidence/*.json; do
            echo "--- $f"
            head -c 12000 "$f"
            echo
          done
          sha256sum evidence/* > checksums.sha256
          mv checksums.sha256 evidence/
          python3 - <<'PY'
          import json,pathlib
          for name in ("boards","overall","rv32im","thumbv6m"):
              p=pathlib.Path("evidence")/(name+".json")
              try:
                  data=json.loads(p.read_text())
                  assert isinstance(data,(dict,list))
              except Exception as e:
                  raise SystemExit(f"UNKNOWN: invalid or missing {name} JSON: {e}")
          if any(not line.endswith(" 0") for line in pathlib.Path("evidence/status.txt").read_text().splitlines()):
              raise SystemExit("UNKNOWN: official client request failed")
          PY
      - name: Fetch public champion status and evaluation reports
        shell: bash
        run: |
          set -uo pipefail
          ids=$(python3 - <<'PY'
          import json,pathlib
          print(" ".join(map(str, sorted({json.loads((pathlib.Path("evidence")/(b+".json")).read_text())["reference"]["submission"] for b in ("overall","rv32im","thumbv6m")} - {None}))))
          PY
          )
          for id in $ids; do
            for cmd in status report; do
              timeout 75s python3 kit/miner/submit.py "$cmd" "$id" > "evidence/${cmd}-${id}.json" 2> "evidence/${cmd}-${id}.stderr"
              printf '%s %s %s\n' "$cmd" "$id" "$?" >> evidence/report-status.txt
            done
          done
          cat evidence/report-status.txt
          python3 - <<'PY'
          import json,pathlib
          for p in sorted(pathlib.Path("evidence").glob("*-*.json")):
              print("FILE",p,p.stat().st_size)
              try: d=json.loads(p.read_text())
              except Exception as e:
                  print("UNKNOWN",e); continue
              if p.stat().st_size < 45000:
                  print(json.dumps(d,indent=2))
              else:
                  def walk(v,path=""):
                      if isinstance(v,dict):
                          for k,w in v.items():
                              walk(w,path+"/"+k)
                      elif isinstance(v,list):
                          if len(v)<100:
                              for i,w in enumerate(v): walk(w,path+"/"+str(i))
                      elif any(k in path.lower() for k in ("score","seed","metric","ratio","instruction","board","promotion","champion","reference")):
                          print(path,str(v)[:250])
                  walk(d)
          PY
          rm evidence/checksums.sha256
          sha256sum evidence/* > checksums.sha256
          mv checksums.sha256 evidence/
      - name: Check report JSON
        run: |
          python3 - <<'PY'
          import json,pathlib
          status=pathlib.Path("evidence/report-status.txt").read_text().splitlines()
          assert status and all(s.endswith(" 0") for s in status), status
          for p in pathlib.Path("evidence").glob("*-*.json"): assert isinstance(json.loads(p.read_text()),(dict,list)), p
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-live-public-board-receipt
          path: evidence/
          if-no-files-found: error
          retention-days: 30
