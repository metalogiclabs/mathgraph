name: VDN ARC-AGI-2 v18 train edges
on:
  push:
    branches: [vdn-arc2-meta-v11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Diagnose training edge selection
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/diagnose_v18_train_edges.py /tmp/ARC-AGI-2/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc2-v18-train-edges
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v18_train_edges/result.json
