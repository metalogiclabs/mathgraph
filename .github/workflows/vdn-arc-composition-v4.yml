name: VDN ARC depth-2 composition v4

on:
  workflow_dispatch:
  push:
    branches:
      - vdn-arc-composition-v4
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v4_composition.py'
      - '.github/workflows/vdn-arc-composition-v4.yml'

jobs:
  depth2-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-2
        run: |
          git clone --quiet https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
          cd /tmp/ARC-AGI-2
          git checkout --quiet f3283f727488ad98fe575ea6a5ac981e4a188e49
          test "$(find data/training -name '*.json' | wc -l)" -eq 1000
          test "$(find data/evaluation -name '*.json' | wc -l)" -eq 120
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
          test "$(find data/training -name '*.json' | wc -l)" -eq 400
          test "$(find data/evaluation -name '*.json' | wc -l)" -eq 400
      - name: Test lawful depth-2 closure before representation invention
        run: |
          python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v4_composition.py \
            /tmp/ARC-AGI-2/data/training /tmp/ARC-AGI-2/data/evaluation \
            /tmp/ARC-AGI-1/data/training /tmp/ARC-AGI-1/data/evaluation
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-depth2-composition-v4
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v4_composition/result.json
