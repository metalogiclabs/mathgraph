name: Retire superseded research CI evidence archives

on:
  push:
    branches:
      - maintenance/retire-superseded-audit-artifacts-20261027
    paths:
      - .github/workflows/retire-superseded-research-artifacts.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  retire-specified-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and remove exactly the obsolete CI attachments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          base = "https://api.github.com/repos/metalogiclabs/mathgraph/actions/artifacts/"
          token = os.environ["GH_TOKEN"]
          cases = [
              (12709373125, 40449239924),
              (12709961659, 40449340968),
              (12710371982, 40449989871),
          ]
          expected_name = "mathgraph-pkc-tutorial-independent-assurance-v1"
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MathGraph-evidence-retention",
          }
          def api(url, method):
              request = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as ex:
                  return ex.code, ex.read()
          # A changed or unexpected archive must never be deleted.
          verified = []
          for artifact_id, source_run in cases:
              status, raw = api(base + str(artifact_id), "GET")
              if status == 404:
                  print(f"ALREADY_ABSENT {artifact_id}")
                  continue
              if status != 200:
                  raise SystemExit(f"PREFLIGHT_UNAVAILABLE {artifact_id} HTTP={status}")
              artifact = json.loads(raw)
              assert artifact["id"] == artifact_id
              assert artifact["name"] == expected_name, "wrong artifact family"
              assert artifact["workflow_run"]["id"] == source_run, "wrong source run"
              assert artifact["expired"] is False, "artifact already expired"
              verified.append(artifact_id)
              print(f"VERIFIED_TARGET {artifact_id} run={source_run}")
          for artifact_id in verified:
              status, raw = api(base + str(artifact_id), "DELETE")
              if status != 204:
                  raise SystemExit(f"DELETION_NOT_CONFIRMED {artifact_id} HTTP={status} {raw[:200]!r}")
              after, _ = api(base + str(artifact_id), "GET")
              if after != 404:
                  raise SystemExit(f"STILL_ACCESSIBLE {artifact_id} HTTP={after}")
              print(f"DELETION_CONFIRMED {artifact_id}")
          print("SPECIFIED_RESEARCH_ARCHIVES_RETIRED", len(verified))
          PY
