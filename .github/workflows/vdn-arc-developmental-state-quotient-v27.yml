name: VDN ARC developmental-state quotient V27

on:
  push:
    branches: ["mathgraph/msi-arc-pikpi-v11-20260828"]
    paths:
      - "verified-developmental-navigation/case_studies/arc_agi2_live/run_v27_developmental_state_quotient.py"
      - ".github/workflows/vdn-arc-developmental-state-quotient-v27.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developmental-state-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI-1
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V27 developmental-state quotient
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v27_developmental_state_quotient.py /tmp/ARC-AGI-1/data/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-developmental-state-quotient-v27
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v27_developmental_state_quotient/result.json
