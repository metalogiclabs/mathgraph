name: Trace the Ace V188 Sealed Session Ability
on:
  push:
    branches: [main]
    paths:
      - 'experiments/trace_the_ace_v188/**'
      - '.github/workflows/trace-ace-v188-sealed-session-ability.yml'
  workflow_dispatch:

jobs:
  v188:
    runs-on: [self-hosted, trace-ace-gpu]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs and headers
        run: |
          test -f /workspace/trace_the_ace/train_features_TMQTWsB.csv
          test -f /workspace/trace_the_ace/train_labels_44ujmj2.csv
          test -d /workspace/trace_the_ace/transcripts_extracted
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('/workspace/trace_the_ace/train_features_TMQTWsB.csv',nrows=2)
          y=pd.read_csv('/workspace/trace_the_ace/train_labels_44ujmj2.csv',nrows=2)
          print('FEATURE_HEADERS',list(x.columns)); print('LABEL_HEADERS',list(y.columns))
          PY
      - name: Run large fresh sealed judge
        run: python experiments/trace_the_ace_v188/run_v188_sealed_session_ability.py
      - name: Show result
        if: always()
        run: test -f /workspace/trace-ace-results/v188/v188_results.json && cat /workspace/trace-ace-results/v188/v188_results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-the-ace-v188-results
          path: /workspace/trace-ace-results/v188/
          if-no-files-found: warn
