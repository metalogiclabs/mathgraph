name: WattBot official scorer component ablations
on:
  push:
    branches: [wattbot-2026-holdout-v1]
    paths:
      - 'experiments/wattbot2026/score_ablation.py'
      - '.github/workflows/wattbot-score-ablation.yml'
jobs:
  scorer-components:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle pandas numpy
      - name: Diagnose official answer/citation rewards with isolated train-only oracle arms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/score_ablation.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Claim boundary
        run: echo "Gold-answer and gold-reference arms are non-deployable diagnostics; no test rows used."
