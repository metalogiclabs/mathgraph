name: WattBot GPT-6 Sol answer recovery same-response qualification
on:
  push:
    branches: [wattbot-gpt6-sol-answer-candidates-v1]
    paths:
      - '.github/workflows/wattbot-gpt6-sol-answer-candidates.yml'
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
jobs:
  gpt6-sol-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official scoring and PDF parsing dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Check original reader source pin and provisional-citation refusal
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/full_reader.py --self-test
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Compare strictly anchored and provisional GPT-6 Sol answers with same responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Scientific boundary and costs
        run: |
          echo "Pinned 63-row TRAIN previously inspected. All policy variants use identical model outputs."
          echo "Live GPT-6 Sol rate verified and conservative reserved API spend capped at USD 1.55."
          echo "No protected TEST labels or Kaggle submission; unsupported citations remain CANDIDATE."
