name: VDN finite interface v47
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/finite_inevitability/run_v47_optionality_convergence.py'
      - '.github/workflows/vdn-finite-interface-v47.yml'
  workflow_dispatch:
jobs:
  optionality-convergence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust optionality convergence worlds
        run: python3 verified-developmental-navigation/case_studies/finite_inevitability/run_v47_optionality_convergence.py
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-finite-interface-v47
          path: verified-developmental-navigation/case_studies/finite_inevitability/results_v47_optionality_convergence/result.json
