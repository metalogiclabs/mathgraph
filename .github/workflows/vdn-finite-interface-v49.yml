name: VDN finite interface v49
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/finite_inevitability/run_v49_minimal_probe_basis_convergence.py'
      - '.github/workflows/vdn-finite-interface-v49.yml'
  workflow_dispatch:
jobs:
  basis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust minimal probe bases
        run: python3 verified-developmental-navigation/case_studies/finite_inevitability/run_v49_minimal_probe_basis_convergence.py
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-finite-interface-v49
          path: verified-developmental-navigation/case_studies/finite_inevitability/results_v49_minimal_probe_basis_convergence/result.json
