name: Trace the Ace V176 Manifest Decontamination
on:
  push:
    paths:
      - 'experiments/trace_the_ace_v176/**'
      - '.github/workflows/trace-ace-v176-manifest-decontamination.yml'
  workflow_dispatch:
jobs:
  v176:
    runs-on: [self-hosted, trace-ace-gpu]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f /workspace/V157_RECOVERED_SUBMISSION.zip
          test -f /workspace/trace_the_ace/train_features_TMQTWsB.csv
          test -f /workspace/trace_the_ace/train_labels_44ujmj2.csv
          test -d /workspace/trace_the_ace/transcripts_extracted
      - name: Run V176 manifest decontamination
        run: python3 experiments/trace_the_ace_v176/run_v176_manifest_decontamination.py
      - run: cat /workspace/trace-ace-results/v176/v176_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: trace-the-ace-v176-results
          path: /workspace/trace-ace-results/v176/
