name: MathGraph Check - live GitHub webhook readback PR20
on:
  push:
    branches:
      - mathgraph-check-github-app-shadow-v0
    paths:
      - 'integrations/mathgraph-check-github/live-delivery-readback.mjs'
      - '.github/workflows/mathgraph-check-live-delivery-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read back signed App webhook delivery and Cloudflare readiness
        env:
          MATHGRAPH_CHECK_APP_PRIVATE_KEY: ${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}
        run: node integrations/mathgraph-check-github/live-delivery-readback.mjs
