name: WattBot tiered verification boundary and same-response score ablation
on:
  push:
    branches: [wattbot-tiered-value-recovery-v1]
    paths:
      - 'experiments/wattbot2026/value_anchor.py'
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
      - '.github/workflows/wattbot-tiered-value-recovery.yml'
jobs:
  paired-tiered-score:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact scientific PDF and score dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Verify prior literal-value-repair and unverified-value scopes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/value_anchor.py
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Compare strict, literal, provisional and tiered candidates on same LLM responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Boundary
        run: |
          echo "Causal ablation uses identical 63 TRAIN model responses across arms."
          echo "An exact numeric occurrence is source provenance, not scientific entailment."
          echo "Provisional citation source IDs remain CANDIDATE."
          echo "No protected TEST labels, Kaggle submissions or answer artifacts."
