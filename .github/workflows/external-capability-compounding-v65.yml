name: V65 Fresh Verified Proof Capability Compounding

on:
  push:
    branches: [external-capability-compounding-v65]
    paths:
      - 'experiments/external_capability_compounding_v65/**'
      - '.github/workflows/external-capability-compounding-v65.yml'
  workflow_dispatch:

jobs:
  fresh-proof-compounding:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen route backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1
      - name: Freeze untouched external bytes
        run: |
          set -euo pipefail
          mkdir -p external-v65
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v65/book3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v65/book3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v65/book3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v65/book3500.jsonl" | sha256sum -c -
          echo "V65_FRESH_PHASE_A=wrong-book-3000_rows_2820_2900"
          echo "V65_FRESH_PHASE_B=wrong-book-3500_rows_2820_2900"
      - name: Run frozen fresh V65 protocol
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v65/run.py \
            --book3000 external-v65/book3000.jsonl \
            --book3500 external-v65/book3500.jsonl \
            --out external-v65/results
      - name: Preserve V65 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v65-fresh-verified-proof-capability-compounding
          path: external-v65/results/
