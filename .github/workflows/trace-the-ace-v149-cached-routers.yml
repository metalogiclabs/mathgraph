name: Trace the Ace V149 Cached Router Replay

on:
  workflow_run:
    workflows: ["Trace the Ace V148 Durable V75 Crossfit Cache"]
    types: [completed]
  workflow_dispatch:
    inputs:
      v145_run_id:
        description: V145 portable evidence run
        required: true
        default: "32792841883"
      v148_run_id:
        description: Successful V148 durable crossfit cache run
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: trace-ace-v149-cached-router-replay
  cancel-in-progress: false

jobs:
  replay:
    name: Replay continuous and comparative routers
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve source runs
        id: src
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "v145=32792841883" >> "$GITHUB_OUTPUT"
            echo "v148=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "v145=${{ inputs.v145_run_id }}" >> "$GITHUB_OUTPUT"
            echo "v148=${{ inputs.v148_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download portable V145 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v145-portable-*
          path: v145-portable
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.src.outputs.v145 }}
          repository: metalogiclabs/mathgraph

      - name: Download durable V148 crossfit cache
        uses: actions/download-artifact@v4
        with:
          pattern: trace-ace-v148-durable-v75-crossfit-*
          path: v148-cache
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.src.outputs.v148 }}
          repository: metalogiclabs/mathgraph

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s v145-portable/v146_bundle.npz
          test -s v148-cache/manifest.json
          for s in full_session full_objective control_session control_objective; do
            test -s "v148-cache/${s}.npz"
            test -s "v148-cache/${s}.json"
          done

      - name: Prepare CPU environment
        shell: bash
        run: python -m pip install -q numpy pandas scipy scikit-learn

      - name: Run frozen-cache router replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v149-results
          python experiments/trace_the_ace_v149/run_v149_cached_routers.py \
            --bundle v145-portable/v146_bundle.npz \
            --cache v148-cache \
            --out v149-results/v149_results.json

      - name: Publish decisions
        if: always()
        shell: bash
        run: |
          R=v149-results/v149_results.json
          if [ -s "$R" ]; then
            python3 - "$R" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print('# Trace the Ace V149 — frozen-cache replay')
          print(f"\n**Continuous:** `{r['continuous_decision']}`")
          print(f"\n**Comparative:** `{r['comparative_decision']}`\n")
          print('| Router | Split | Improvement | Fold wins | Bootstrap 95% |')
          print('|---|---|---:|---:|---|')
          for mode in ('continuous','comparative'):
              for split in ('session','objective'):
                  x=r[mode][split]
                  print(f"| {mode} | {split} | {x['improvement']:.6f} | {x['fold_wins']}/5 | {x['bootstrap_improvement_95']} |")
          PY
          fi

      - name: Upload V149 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v149-${{ github.run_id }}
          path: v149-results/v149_results.json
          if-no-files-found: warn
          retention-days: 90
