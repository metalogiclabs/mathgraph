name: MathGraph Check investigator contract qualification

on:
  push:
    branches: [experiment/contract-mutation-admission-20261104]
  pull_request:
    paths:
      - 'integrations/mathgraph-check-github/investigator-v1/**'
      - '.github/workflows/check-investigator-contract-qualification.yml'

permissions:
  contents: read

jobs:
  contract-and-native-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install pytest==8.3.5
      - name: Check complete Check contract surface
        run: node --test integrations/mathgraph-check-github/*.test.mjs integrations/mathgraph-check-github/investigator-v1/*.test.mjs
      - name: Replay native source-execution controls
        run: python -m unittest discover -s integrations/mathgraph-check-github/investigator-v1 -p 'test_native.py'
