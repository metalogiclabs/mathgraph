name: V9 structured author verifier pre-exposure
on:
  push:
    branches:
      - research/structured-test-authority-v9-20261020
    paths:
      - 'research/structured_test_authority_v9/**'
      - '.github/workflows/structured-author-verifier-v9-preflight.yml'
  pull_request:
    paths:
      - 'research/structured_test_authority_v9/**'
      - '.github/workflows/structured-author-verifier-v9-preflight.yml'
permissions:
  contents: read
jobs:
  source-blind-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bottlepy/bottle
          ref: 8ec5fe29420d14998c0d86885083983eaea8b839
          path: exposed-bottle-v8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed baseline test runner
        run: python -m pip install 'pytest==8.3.5'
      - name: Synthetic exact test-ID, negative, structural config authority withdrawal; EXPOSED Bottle training only
        run: |
          set -euo pipefail
          python research/structured_test_authority_v9/preflight.py --exposed exposed-bottle-v8
