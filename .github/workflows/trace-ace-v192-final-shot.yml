name: Trace the Ace V193 Strict Public Proxy
on:
  push:
    branches: [mathgraph/trace-ace-final-shot-20260828]
    paths:
      - 'experiments/trace_the_ace_v193/**'
      - '.github/workflows/trace-ace-v192-final-shot.yml'
  workflow_dispatch:

jobs:
  v193_proxy:
    runs-on: [self-hosted, trace-ace-gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run strict untouched-session proxy
        run: python experiments/trace_the_ace_v193/run_v193_strict_public_proxy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-the-ace-v193-strict-proxy
          path: /workspace/trace-ace-results/v193/
          if-no-files-found: warn
