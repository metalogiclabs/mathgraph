name: V59 Opened Neighborhood Calibration

on:
  push:
    branches: [external-capability-compounding-v59]
    paths:
      - 'experiments/external_capability_compounding_v59/**'
      - '.github/workflows/external-capability-compounding-v59-calibration.yml'
  workflow_dispatch:

jobs:
  calibrate-neighborhood:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned solvers
        run: |
          python3 -m pip install --disable-pip-version-check z3-solver==4.13.3.0 cvc5==1.3.1

      - name: Recover exact V58 learned archive
        uses: actions/download-artifact@v4
        with:
          name: v58-fresh-external-capability-compounding
          path: v58-seed
          github-token: ${{ github.token }}
          repository: metalogiclabs/mathgraph
          run-id: 34959198383

      - name: Verify V58 archive provenance
        run: |
          echo "241f6223899b6decf77767d0ec182920417b65217846f8b68e24d7a13b2bd535  v58-seed/final_archive.json" | sha256sum -c -
          jq '.capabilities | length' v58-seed/final_archive.json

      - name: Freeze opened external corpus bytes
        run: |
          mkdir -p external-v59
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v59/wrong-book-3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v59/wrong-book-3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v59/wrong-book-3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v59/wrong-book-3500.jsonl" | sha256sum -c -

      - name: Calibrate only on already-open V58 rows
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v59/calibrate_neighborhood.py \
            --wrong-book-3000 external-v59/wrong-book-3000.jsonl \
            --wrong-book-3500 external-v59/wrong-book-3500.jsonl \
            --seed-archive v58-seed/final_archive.json \
            --out external-v59/calibration

      - name: Preserve calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v59-opened-neighborhood-calibration
          path: external-v59/calibration/
