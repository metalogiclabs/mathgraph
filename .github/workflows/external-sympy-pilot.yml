name: Nemotron external SymPy source-native pilot
on:
  workflow_dispatch:
  push:
    branches: [experiment/nebius-public-pilot-20261028]
permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        arm: [source_bound, conventional]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sympy/sympy
          ref: f57fe3f4b3f2cab225749e1b3b38ae1bf80b62f0
          path: source_sympy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticated Nemotron proposal without executing candidate
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: python public_sympy_pilot.py propose --arm "${{ matrix.arm }}" --root source_sympy --output proposal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: sympy-untrusted-proposal-${{ matrix.arm }}
          path: proposal.json
          if-no-files-found: error

  independent_evaluation:
    needs: inference
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions: {}
    strategy:
      matrix:
        arm: [source_bound, conventional]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sympy/sympy
          ref: f57fe3f4b3f2cab225749e1b3b38ae1bf80b62f0
          path: source_sympy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9'
      - name: Install exact-task historical numeric oracle dependency
        run: python3.9 -m pip install mpmath==1.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Independently replay exact source and stage boundary
        env:
          SYMPY_PINNED_UPSTREAM: source_sympy
          SYMPY_RUNTIME_PYTHON: python3.9
        run: python -m unittest -q test_public_sympy_pilot test_external_candidate_stage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: sympy-untrusted-proposal-${{ matrix.arm }}
      - name: Native test on a disposable runner without inference credentials
        run: |
          if test -f proposal.json; then
            python public_sympy_pilot.py evaluate --arm "${{ matrix.arm }}" --root source_sympy --runtime-python python3.9 --input proposal.json --output sympy-pilot-result.json
          else
            python public_sympy_pilot.py no-result --arm "${{ matrix.arm }}" --output sympy-pilot-result.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sympy-native-receipt-${{ matrix.arm }}
          path: sympy-pilot-result.json
          if-no-files-found: warn
