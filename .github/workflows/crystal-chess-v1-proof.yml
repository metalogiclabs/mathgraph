name: Crystal Chess V1 Proof Crystal

on:
  push:
    branches:
      - crystal-chess-v0
    paths:
      - "experiments/crystal_chess_kpvk_v0.py"
      - "experiments/crystal_chess_kpvk_proof_v1.py"
      - ".github/workflows/crystal-chess-v1-proof.yml"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  kpvk-proof-crystal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Acquire exact Syzygy WDL oracle
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Build and verify KPvK proof crystal
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v1
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v1/
          python experiments/crystal_chess_kpvk_proof_v1.py --tablebase-dir /tmp/syzygy --output artifacts/crystal-chess-v1/crystal_chess_kpvk_proof_v1.json | tee artifacts/crystal-chess-v1/run.log
          grep -q "CRYSTAL_CHESS_KPVK_PROOF_V1=PASS" artifacts/crystal-chess-v1/run.log

      - name: Upload proof-crystal evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-kpvk-proof-v1
          path: artifacts/crystal-chess-v1/
          if-no-files-found: error
