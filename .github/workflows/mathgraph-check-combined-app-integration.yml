name: MathGraph Check combined App webhook integration
on:
  push:
    branches:
      - research/mathgraph-check-live-integration-20261019
  pull_request:
    paths:
      - integrations/mathgraph-check-github/**
      - .github/workflows/mathgraph-check-combined-app-integration.yml
permissions:
  contents: read
  actions: read
jobs:
  combined-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing App tests and PKC YAML integration
        run: |
          set -euo pipefail
          node --test integrations/mathgraph-check-github/*.test.mjs
      - name: Rehearse App publisher using real pinned archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/metalogiclabs/mathgraph/actions/artifacts/12171240289/zip > /tmp/pkc-yaml-pinned.zip
          printf '%s  %s\n' '2bbd575f1d93759a734fa459f4f48be599411a44b91d0627b397d02d4f8b98f9' /tmp/pkc-yaml-pinned.zip | sha256sum -c -
          node integrations/mathgraph-check-github/pkc-yaml-positive-publisher-probe.mjs /tmp/pkc-yaml-pinned.zip

# Live publication remains disabled until a separate evidence-only carrier is pinned.
