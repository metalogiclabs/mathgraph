name: EIK exact affine coefficient folding
on:
  push:
    branches: [research/eik-rrr-optimization-20261125]
    paths: ['.github/workflows/eik-affine-fold.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [control, direct, reconstruct, signed, biased, small, small2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: eik-rrr-control
          run-id: 45545248898
          github-token: ${{ github.token }}
          path: prior
      - name: Pinned baseline and exact affine transformation
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          mkdir evidence
          cp ../prior/candidate.c baseline.c
          echo '3d9777afffd5aba80d52bf4926243aa3dbe1c1fa78b12f63ed597d634895e3b4  baseline.c' | sha256sum -c -
          if [ "$VARIANT" = control ]; then
            cp baseline.c candidate.c
          else
            python ../research/eik/fold.py baseline.c candidate.c "$VARIANT"
          fi
          python - <<'PY'
          import os,pathlib,hashlib
          pins={
            'control':'3d9777afffd5aba80d52bf4926243aa3dbe1c1fa78b12f63ed597d634895e3b4',
            'direct':'cf356a3e9012904fc55622226b025d10584a6554c5a5f5f55cd9e63c56380df2',
            'reconstruct':'e5e18c253cf8447affcee3b0e4bce37eba11cceb76aaf5e87b93fc44e37c9702',
            'signed':'deb97fdb76e83e7aea8e79e8516393f40c667ef700cd097b2412a37b3f6fa3e4',
            'small':'7da365fa0041b8f82990892e2c5ccfc1d1c8c0945282b38349f5d4eae0fa85ad',
            'biased':'30c37afc9d057a3a6a2132b57003187394938f56030603c26e70293ed1584acc',
            'small2':'8d0f021a26bd60a961066ae557e12581475ba8bec14ea6eec6ee94f55e8e7ff1'}
          actual=hashlib.sha256(pathlib.Path('candidate.c').read_bytes()).hexdigest()
          assert actual==pins[os.environ['VARIANT']],(actual,pins[os.environ['VARIANT']])
          PY
          cp candidate.c evidence/
          sha256sum baseline.c candidate.c > evidence/source.sha256
          git rev-parse HEAD > evidence/evaluator.sha
      - name: Install unchanged official evaluator
        working-directory: kit
        run: |
          pip install --require-hashes -r requirements.txt
          python -m eik setup
      - name: Official static gate and discovery measurement
        working-directory: kit
        run: |
          set -o pipefail
          python -m eik check candidate.c 2>&1 | tee evidence/check.log
          python -m eik measure candidate.c --seed 20261125 --out evidence/measure.json
          cat evidence/measure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-fold-${{ matrix.variant }}
          path: kit/evidence/
  select:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      qualify: ${{ steps.select.outputs.qualify }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: eik-fold-*
          path: runs
      - name: Exact paired comparison and non-overlapping composition
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          mkdir evidence
          pip install --require-hashes -r requirements.txt
          python -m eik setup
          python - <<'PY'
          import sys,json,pathlib,hashlib
          sys.path.insert(0,'../research/eik')
          import fold
          root=pathlib.Path('../runs')
          reports={}
          failures={}
          for v in ['control','direct','reconstruct','signed','biased','small','small2']:
              f=root/('eik-fold-'+v)/'measure.json'
              if not f.exists():
                  failures[v]='no completed report';continue
              r=json.loads(f.read_text())
              if r.get('verdict')!='passed':
                  failures[v]=r.get('reasons',[]);continue
              assert r['sha256']==hashlib.sha256((f.parent/'candidate.c').read_bytes()).hexdigest()
              reports[v]=r
          c=reports['control']
          for v,r in reports.items():
              assert r['inputs_sha256']==c['inputs_sha256']
              assert r['seed']==c['seed']
              assert r['fingerprint']['measurement']==c['fingerprint']['measurement']
          score=lambda v:reports[v]['scores']['rv32im']['S']
          base=root/'eik-fold-control'/'candidate.c'
          assert hashlib.sha256(base.read_bytes()).hexdigest()==fold.BASE
          pathlib.Path('control.c').write_bytes(base.read_bytes())
          best=min(reports,key=score)
          pathlib.Path('best.c').write_bytes((root/('eik-fold-'+best)/'candidate.c').read_bytes())
          pathlib.Path('evidence/best.json').write_text(json.dumps(reports[best],indent=2))
          winners=[v for v in reports if v!='control' and score(v)<score('control')]
          a=[v for v in winners if v in ('direct','reconstruct','signed','biased')]
          b=[v for v in winners if v in ('small','small2')]
          combo=[]
          if a and b:
              combo=[min(a,key=score),min(b,key=score)]
              s=base.read_text()
              for v in combo:s=fold.small(s,v=='small2') if v.startswith('small') else fold.ta(s,v)
              pathlib.Path('combined.c').write_text(s)
          summary={'scores':{v:score(v) for v in reports},'best':best,'failures':failures,'independent_improvements':winners,'combination':combo}
          print(json.dumps(summary,indent=2))
          pathlib.Path('evidence/selection.json').write_text(json.dumps(summary,indent=2))
          PY
          if [ -f combined.c ]; then
            python -m eik measure combined.c --seed 20261125 --out evidence/combined.json || true
          fi
      - name: Choose best correct discovery candidate; fresh paired test
        id: select
        working-directory: kit
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('evidence')
          a=json.loads((p/'best.json').read_text())
          b=json.loads((p/'combined.json').read_text()) if (p/'combined.json').exists() else {}
          source=pathlib.Path('best.c')
          if b.get('verdict')=='passed':
              assert b['sha256']==hashlib.sha256(pathlib.Path('combined.c').read_bytes()).hexdigest()
              assert b['inputs_sha256']==a['inputs_sha256']
              assert b['fingerprint']['measurement']==a['fingerprint']['measurement']
              if b['scores']['rv32im']['S']<a['scores']['rv32im']['S']:
                  source=pathlib.Path('combined.c');a=b
          (p/'candidate.c').write_bytes(source.read_bytes())
          (p/'discovery.json').write_text(json.dumps(a,indent=2))
          PY
          python -m eik measure evidence/candidate.c --seed 20261129 --out evidence/heldout.json
          python -m eik measure control.c --seed 20261129 --out evidence/control-heldout.json
          python - <<'PY'
          import json,pathlib,os,hashlib
          p=pathlib.Path('evidence')
          a,b,c=[json.loads((p/f).read_text()) for f in ['discovery.json','heldout.json','control-heldout.json']]
          assert a['sha256']==b['sha256']==hashlib.sha256((p/'candidate.c').read_bytes()).hexdigest()
          assert b['inputs_sha256']==c['inputs_sha256'] and b['fingerprint']['measurement']==c['fingerprint']['measurement']
          x,y,z=[r['scores']['rv32im']['S'] for r in [a,b,c]]
          # This is a historical screening threshold only: the live incumbent
          # is unavailable; never interpret as a guaranteed takeover.
          qualify=b['verdict']=='passed' and y<z and max(x,y)<=27.354
          print('discovery',x,'heldout',y,'heldout control',z,'exhaustive gate',qualify)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('qualify='+str(qualify).lower()+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-affine-selected
          path: kit/evidence/
  qualify:
    needs: select
    if: needs.select.outputs.qualify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        function: [sigmoid,tanh,exp]
        target: [host,rv32im,thumbv6m,thumbv7em]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: eik-affine-selected
          path: selected
      - name: Full native or target correctness
        env:
          FN: ${{ matrix.function }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          cp ../selected/candidate.c .
          mkdir evidence
          pip install --require-hashes -r requirements.txt
          python -m eik setup
          if [ "$TARGET" = host ]; then
            python -m eik fullcheck candidate.c --function "$FN" --out evidence/report.json
          else
            sudo apt-get update
            sudo apt-get install -y qemu-user
            python -m eik targetcheck candidate.c --function "$FN" --target "$TARGET" --out evidence/report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-affine-full-${{ matrix.function }}-${{ matrix.target }}
          path: kit/evidence/
  reconcile:
    needs: qualify
    if: needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: eik-affine-full-*
          path: full
      - run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          pip install --require-hashes -r requirements.txt
          python -m eik merge ../full/*/report.json --require-targets rv32im,thumbv6m,thumbv7em --out final.json
          cat final.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-affine-full-qualification
          path: kit/final.json
