name: WattBot compiled unit-aware numeric fallback paired qualification
on:
  push:
    branches: [wattbot-compiled-unit-fallback-v1]
    paths:
      - '.github/workflows/wattbot-compiled-unit-fallback.yml'
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
      - 'experiments/wattbot2026/unit_aware_numeric_probe.py'
jobs:
  unit-fallback-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official frozen corpus evaluation dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Qualify exact source+unit lineage with synthetic controls
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Score unit-aware fallback with identical Flash-Lite response stream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Source and score authority
        run: |
          echo "One LLM response set, multiple scoring arms; dev-selected numeric unit policy."
          echo "Only 63 reused TRAIN labels for post-inference official Score.py."
          echo "No protected TEST labels, Kaggle submission, raw PDF or answer artifacts."
