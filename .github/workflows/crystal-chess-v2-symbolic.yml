name: Crystal Chess V2 Symbolic Controller

on:
  push:
    branches:
      - crystal-chess-v0
    paths:
      - "experiments/crystal_chess_kpvk_v0.py"
      - "experiments/crystal_chess_kpvk_proof_v1.py"
      - "experiments/crystal_chess_kpvk_symbolic_v2.py"
      - ".github/workflows/crystal-chess-v2-symbolic.yml"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  kpvk-symbolic-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Acquire exact Syzygy WDL oracle
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Synthesize and exhaustively verify symbolic controller
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v2
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v2/
          python experiments/crystal_chess_kpvk_symbolic_v2.py --tablebase-dir /tmp/syzygy --output artifacts/crystal-chess-v2/crystal_chess_kpvk_symbolic_v2.json | tee artifacts/crystal-chess-v2/run.log
          grep -q "CRYSTAL_CHESS_KPVK_SYMBOLIC_V2=PASS" artifacts/crystal-chess-v2/run.log

      - name: Upload symbolic-controller evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-kpvk-symbolic-v2
          path: artifacts/crystal-chess-v2/
          if-no-files-found: error
