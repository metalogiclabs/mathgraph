name: VDN finite interface v43
on:
  push:
    branches: [vdn-recursive-meta-v14]
    paths:
      - 'verified-developmental-navigation/case_studies/finite_inevitability/run_v43_protected_interface_theorems.py'
      - '.github/workflows/vdn-finite-interface-v43.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theorem-census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust protected-interface laws
        run: python3 verified-developmental-navigation/case_studies/finite_inevitability/run_v43_protected_interface_theorems.py
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-finite-interface-v43
          path: verified-developmental-navigation/case_studies/finite_inevitability/results_v43_protected_interface_theorems/result.json
