name: Observer F1 V5 - Exposed Consequence Separation
on:
  push:
    branches:
      - research/source-observer-f1-guard-v2-20261026
    paths:
      - 'research/source_observation_constructor_v1/exposed_consequence_v5.py'
      - 'research/source_observation_constructor_v1/test_exposed_consequence_v5.py'
      - '.github/workflows/observer-f1-v5-exposed-consequence.yml'
  pull_request:
    paths:
      - 'research/source_observation_constructor_v1/exposed_consequence_v5.py'
      - 'research/source_observation_constructor_v1/test_exposed_consequence_v5.py'
      - '.github/workflows/observer-f1-v5-exposed-consequence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite observation parser + negative controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/f1-v5-oracle
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git hash-object research/structured_test_authority_v9/scan.py)" = 72f03feb5bd21e0d0b6fee6774232c8e513b0588
          python -B research/source_observation_constructor_v1/test_exposed_consequence_v5.py > evidence/f1-v5-oracle/result.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/f1-v5-oracle/result.json'))
          assert d['status']=='PASS_F1_V5_SOURCE_FREE_PREFLIGHT'
          assert d['independent_oracle_trials']==512
          assert d['protected_sources_access']=='NONE'
          print('PASS_F1_V5_SOURCE_FREE_ORACLE')
          PY
          git rev-parse HEAD > evidence/f1-v5-oracle/head.txt
          sha256sum evidence/f1-v5-oracle/{result.json,head.txt} > evidence/f1-v5-oracle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1-v5-source-free-oracle
          path: evidence/f1-v5-oracle/
          if-no-files-found: error

  controlled-real-source-consequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: trentm/python-markdown2
          ref: a3716b5e0aeba16b6e85965b2e5019d174328f36
          path: exposed-markdown2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed reference baseline test runner only
        run: python -m pip install 'pytest==8.3.5'
      - name: Original source pin and controlled mutation of temporary copy only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C exposed-markdown2 rev-parse HEAD)" = a3716b5e0aeba16b6e85965b2e5019d174328f36
          test "$(git -C exposed-markdown2 hash-object lib/markdown2.py)" = a55f7098ab952d547e7942ddc6b8626eaf15fcfc
          mkdir -p evidence/f1-v5-real
          python -B research/source_observation_constructor_v1/exposed_consequence_v5.py --source exposed-markdown2 --out evidence/f1-v5-real
      - name: Independent raw-log protected witness and mutation referee
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,pathlib,re
          out=pathlib.Path('evidence/f1-v5-real')
          d=json.loads((out/'result.json').read_text())
          assert d['heldout_source_access']=='NONE'
          assert d['status']=='WARRANTED_BOUNDED_INDUCED_FAULT_CONSEQUENCE',d['status']
          assert all(d['checks'][x] for x in ('original_passes_target',
                    'mutant_fails_protected_target','all_native_case_IDs_authenticated',
                    'equal_information_comparator_tie','original_source_unmodified',
                    'conventional_clean_passes_and_fault_fails')),d['checks']
          assert d['generic_decision_separation']=='TIE_ON_CLEAN_VS_FAULT_DECISION'
          before=(out/'original.log').read_text()
          after=(out/'candidate.log').read_text()
          informed=(out/'informed.log').read_text()
          assert re.search(r'^markdown2/tm/emphasis \.\.\. ok$',before,re.M)
          assert re.search(r'^markdown2/tm/emphasis \.\.\. (?:FAIL|ERROR)$',after,re.M)
          assert re.search(r'^markdown2/tm/emphasis \.\.\. (?:FAIL|ERROR)$',informed,re.M)
          src=pathlib.Path('exposed-markdown2/lib/markdown2.py').read_bytes()
          old=b'        if self._iab_processor.test(text):\n'
          new=b'        if False and self._iab_processor.test(text):  # F1_V5_CONTROLLED_FAULT\n'
          assert src.count(old)==1
          assert hashlib.sha256(src.replace(old,new)).hexdigest()==d['controlled_mutation']['mutated_sha256']
          assert hashlib.sha256(src).hexdigest()==d['controlled_mutation']['pristine_sha256']
          assert d['candidate']['identity']['cases']==d['same_information_rulebook']['identity']['cases']
          assert d['original']['identity']['declared']>0
          print('EXACT_SOURCE_PROTECTED_CONSEQUENCE_WITH_INFORMED_TIE')
          print('ORIGINAL_CASES',d['original']['identity']['declared'])
          print('MUTATED_CASES',d['candidate']['identity']['declared'])
          print('GENERIC_CLEAN_EXIT',d['generic_original']['exit'])
          print('GENERIC_MUTANT_EXIT',d['fixed_generic']['exit'])
          print('CONVENTIONAL_DECISION_COMPARISON',d['generic_decision_separation'])
          PY
          test -z "$(git -C exposed-markdown2 status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD > evidence/f1-v5-real/head.txt
          git hash-object research/source_observation_constructor_v1/exposed_consequence_v5.py > evidence/f1-v5-real/experiment-blob.txt
          sha256sum evidence/f1-v5-real/{result.json,original.log,generic_original.log,generic.log,candidate.log,informed.log,head.txt,experiment-blob.txt} > evidence/f1-v5-real/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1-v5-exposed-induced-fault-consequence
          path: |
            evidence/f1-v5-real/result.json
            evidence/f1-v5-real/original.log
            evidence/f1-v5-real/generic_original.log
            evidence/f1-v5-real/generic.log
            evidence/f1-v5-real/candidate.log
            evidence/f1-v5-real/informed.log
            evidence/f1-v5-real/head.txt
            evidence/f1-v5-real/experiment-blob.txt
            evidence/f1-v5-real/SHA256SUMS
          if-no-files-found: warn
