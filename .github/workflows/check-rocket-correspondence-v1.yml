name: Check rocket correspondence — source-only qualification

on:
  push:
    branches: [research/check-rocket-correspondence-v1-20261120, research/check-rocket-commonmode-v1-20261120]
  pull_request:
    paths:
      - 'experiments/check-rocket-correspondence-v1/**'
      - '.github/workflows/check-rocket-correspondence-v1.yml'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require parent source and prohibit protected runtime changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base="70733f1afab6eb3bcd1d66b32203a27c042a7759"
          subprocess.run(["git","merge-base","--is-ancestor",base,"HEAD"],check=True)
          changed=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed={
            "experiments/check-rocket-correspondence-v1/rocket_profile.py",
            "experiments/check-rocket-correspondence-v1/test_rocket_profile.py",
            "experiments/check-rocket-correspondence-v1/test_cross_boundary_warrant.py",
            "experiments/check-rocket-correspondence-v1/README.md",
            ".github/workflows/check-rocket-correspondence-v1.yml",
          }
          assert changed <= allowed, f"RELEASE_SCOPE_VIOLATION: {sorted(changed-allowed)}"
          assert "experiments/check-rocket-correspondence-v1/rocket_profile.py" in changed
          print("ROCKET_SOURCE_SCOPE_QUALIFIED",sorted(changed))
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Adversarial finite oracle and source-identity calibration
        run: |
          python3 -m compileall -q experiments/check-rocket-correspondence-v1/
          python3 -m unittest discover -v \
            -s experiments/check-rocket-correspondence-v1 \
            -p 'test_*.py'
      - name: Source-only artifact identity for review
        run: |
          mkdir -p /tmp/rocket-profile
          git rev-parse HEAD > /tmp/rocket-profile/source-commit.txt
          sha256sum experiments/check-rocket-correspondence-v1/rocket_profile.py \
            experiments/check-rocket-correspondence-v1/test_rocket_profile.py \
            experiments/check-rocket-correspondence-v1/test_cross_boundary_warrant.py \
            > /tmp/rocket-profile/source-digests.txt
          printf '%s\n' 'OVERALL=UNKNOWN' \
            'SEMANTIC=FINITE_ORACLE_ONLY' \
            'NATIVE=NOT_RERUN' \
            'OWNER_AUTHORIZATION=UNKNOWN' \
            'REPAIR=DENIED' \
            > /tmp/rocket-profile/qualification-scope.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rocket-profile-source-only
          path: /tmp/rocket-profile
          retention-days: 30
