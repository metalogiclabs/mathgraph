name: WattBot exact V5 release-policy same-response qualification
on:
  push:
    branches: [wattbot-lesson-release-policy-v1]
    paths:
      - '.github/workflows/wattbot-lesson-release-policy.yml'
      - 'experiments/wattbot2026/derivation_router_probe.py'
      - 'experiments/wattbot2026/submit_full_reader.py'
jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official scorer and source PDF validation dependencies
        run: python -m pip install kaggle pandas numpy requests pymupdf
      - name: Verify exact V4 recovery lineage and no protected examples
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/verified_lesson.py
          python experiments/wattbot2026/submit_full_reader.py --self-test
          python experiments/wattbot2026/derivation_router_probe.py --self-test
      - name: Same-response exact V4-style release-policy versus lessons and first-reader refusals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/derivation_router_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Release authority boundary
        run: |
          echo "Canonical release candidate logic uses exact V4 recovery and page checker."
          echo "Same first and second model responses for all TRAIN scorer arms."
          echo "No protected TEST answers or Kaggle submission; budgeted extra model USD .16."
