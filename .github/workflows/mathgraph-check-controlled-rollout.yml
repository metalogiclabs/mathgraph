name: MathGraph Check controlled Monitor rollout
on:
  pull_request:
    paths:
      - 'integrations/mathgraph-check-github/cloudflare/**'
      - '.github/workflows/mathgraph-check-controlled-rollout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathgraph-check-controlled-rollout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay signed ingress, queue, and withdrawal controls
        run: |
          set -euo pipefail
          node --test integrations/mathgraph-check-github/cloudflare/consumer.test.mjs integrations/mathgraph-check-github/cloudflare/ingress.test.mjs integrations/mathgraph-check-github/cloudflare/monitor-transition-v1.test.mjs
      - name: Wrangler production-config dry run (no write)
        run: npx --yes wrangler@4.129.1 deploy --dry-run --config integrations/mathgraph-check-github/cloudflare/wrangler.toml --outdir "$RUNNER_TEMP/cf-monitor-qualified"
  deploy:
    needs: qualify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mathgraph-check-live-app-first-party-v1' && vars.MATHGRAPH_CF_MONITOR_ROLLOUT_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    environment: mathgraph-check-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment credentials are present
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "c3bc279612c15be71c7e4f605a462657"
      - name: Deploy existing Worker only (preserve bindings and secrets)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.1 deploy --config integrations/mathgraph-check-github/cloudflare/wrangler.toml
