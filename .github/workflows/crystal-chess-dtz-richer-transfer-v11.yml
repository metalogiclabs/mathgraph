name: Crystal Chess DTZ Richer Transfer V11

on:
  push:
    branches:
      - crystal-chess-dtz-richer-transfer-v11
    paths:
      - "experiments/crystal_chess_kpvk_v0.py"
      - "experiments/crystal_chess_goal_certificate_v3.py"
      - "experiments/crystal_chess_dtz_certificate_v6.py"
      - "experiments/crystal_chess_richer_transfer_v5.py"
      - "experiments/crystal_chess_dtz_richer_transfer_v11.py"
      - ".github/workflows/crystal-chess-dtz-richer-transfer-v11.yml"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  dtz-richer-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Compile chess experiment
        run: python -m py_compile experiments/crystal_chess_dtz_richer_transfer_v11.py

      - name: Acquire exact Syzygy WDL + DTZ authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          wdl="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          dtz="https://tablebase.lichess.ovh/tables/standard/3-4-5-dtz"
          for stem in KPvK KPPvK; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$stem.rtbw" "$wdl/$stem.rtbw"
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$stem.rtbz" "$dtz/$stem.rtbz"
            test -s "/tmp/syzygy/$stem.rtbw"
            test -s "/tmp/syzygy/$stem.rtbz"
          done
          sha256sum /tmp/syzygy/*.rtb* | tee /tmp/syzygy/SHA256SUMS

      - name: Prospectively transfer exact progress capability
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v11
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v11/
          python experiments/crystal_chess_dtz_richer_transfer_v11.py             --tablebase-dir /tmp/syzygy             --sample-size 50000             --seed 20261002             --output artifacts/crystal-chess-v11/crystal_chess_dtz_richer_transfer_v11.json             | tee artifacts/crystal-chess-v11/run.log
          grep -q "CRYSTAL_CHESS_DTZ_RICHER_TRANSFER_V11=PASS" artifacts/crystal-chess-v11/run.log

      - name: Upload V11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-dtz-richer-transfer-v11
          path: artifacts/crystal-chess-v11/
          if-no-files-found: error
