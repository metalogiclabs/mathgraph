name: EIK bounded intermediates and packed coefficients
on:
  push:
    branches: [research/eik-rrr-optimization-20261125]
    paths: ['.github/workflows/eik-narrow2.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [control, tl-last, rt-second, rb-second, sq-first, nq-first, nx-packed, joint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: eik-exp-bound-selected
          run-id: 45563773878
          github-token: ${{ github.token }}
          path: prior
      - name: Reproduce exact local source
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          mkdir evidence
          cp ../prior/candidate.c baseline.c
          echo '832b81faf97490295a743292627aeab0cd9b9d8f0abf1eedd7d7d1d1c9119ca3  baseline.c' | sha256sum -c -
          if [ "$VARIANT" = control ]; then
            cp baseline.c candidate.c
          else
            python ../research/eik/narrow2.py baseline.c candidate.c "$VARIANT" | tee evidence/bounds.log
          fi
          python - <<'PY'
          import os,pathlib,hashlib
          pins={
          'control':'832b81faf97490295a743292627aeab0cd9b9d8f0abf1eedd7d7d1d1c9119ca3',
          'tl-last':'597018f2d86cdd6da1bfd4d42f69d475f0ba207cde37ca8d86239bd3b8eb7cf9',
          'rt-second':'47e13476e0b381c51428e8bad8f55c3df26072d14fe6e0876b151b759b7262a2',
          'rb-second':'75e52b71a08f88454a32daa4f631fbfdc2fae45ca0791e1babd3526d4a1bef31',
          'sq-first':'7ead346e8d2714faea96c9b47a512f7a00370f1734f6a2a5b35ff586b55dc8e7',
          'nq-first':'a84137e94a9c35786949519f2f511fc15c3512e425e4ce14c9ff0efe09056d0d',
          'nx-packed':'31bcf23ca6025c4b9d475ad3c273b3e60b5be57b2e804b37c28b00a857d1a955',
          'joint':'75faa8078e1c4982f1ce3430677114fc8991d292373aa266e2148d8a6351dc93'}
          h=hashlib.sha256(pathlib.Path('candidate.c').read_bytes()).hexdigest()
          assert h==pins[os.environ['VARIANT']],(h,pins[os.environ['VARIANT']])
          PY
          cp candidate.c evidence/
          sha256sum candidate.c > evidence/source.sha256
          git rev-parse HEAD > evidence/evaluator.sha
          pip install --require-hashes -r requirements.txt
          python -m eik setup
      - name: Official static gate, independent samples and paired measurements
        working-directory: kit
        run: |
          set -euxo pipefail
          python -m eik check candidate.c 2>&1 | tee evidence/check.log
          python -m eik measure candidate.c --seed 20261125 --out evidence/measure.json
          python -m eik measure candidate.c --seed 20261210 --out evidence/heldout.json
          cat evidence/measure.json
          cat evidence/heldout.json
      - name: Research-only instruction profile of exact control
        if: matrix.variant == 'control'
        continue-on-error: true
        working-directory: kit
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          from eik import inputs as I, toolchain as T
          from eik.emu import Core
          class Profile(Core):
              def __init__(self,*a):
                  super().__init__(*a)
                  self.freq=Counter(); self.ops={}
              def _block(self,u,addr,size,data):
                  super()._block(u,addr,size,data)
                  key=(addr,size)
                  self.freq[key]+=1
                  if key not in self.ops:
                      self.ops[key]=[(m,o) for _,_,m,o in self.dis.disasm_lite(bytes(u.mem_read(addr,size)),addr)]
          seed=20261125
          I.prepare_fresh_pools(seed)
          core=Profile(T.guest_image(Path('candidate.c').resolve(),'thumbv6m'),'thumbv6m')
          report={}
          for fn in ('sigmoid','tanh','exp'):
              report[fn]={}
              for group,words in I.draw(seed,fn).items():
                  core.freq.clear()
                  total=0
                  for w in words:
                      _,n=core.call(fn,w);total+=n
                  mn=Counter()
                  for key,count in core.freq.items():
                      for m,o in core.ops[key]:mn[m]+=count
                  assert sum(mn.values())==total
                  hot=sorted(core.freq,key=lambda k:len(core.ops[k])*core.freq[k],reverse=True)[:12]
                  report[fn][group]={'calls':len(words),'retired':total,'mnemonics':dict(mn.most_common()),'hot_blocks':[{'address':hex(k[0]),'visits':core.freq[k],'instructions':core.ops[k]} for k in hot]}
          Path('evidence/arm-profile.json').write_text(json.dumps(report,indent=2))
          for fn,groups in report.items():
              for g,d in groups.items():print(fn,g,d['retired']/d['calls'],list(d['mnemonics'].items())[:8])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-narrow2-${{ matrix.variant }}
          path: kit/evidence/
  reconcile:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      qualify: ${{ steps.decision.outputs.qualify }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eik-narrow2-*
          path: runs
      - id: decision
        name: Compare matched seeds; no composition of failed transformations
        run: |
          set -euo pipefail
          mkdir evidence
          python - <<'PY'
          import pathlib,json,hashlib,os
          result={};admitted={}
          for d in sorted(pathlib.Path('runs').glob('eik-narrow2-*')):
              v=d.name.removeprefix('eik-narrow2-')
              try:
                  a,b=[json.loads((d/f).read_text()) for f in ['measure.json','heldout.json']]
                  h=hashlib.sha256((d/'candidate.c').read_bytes()).hexdigest()
                  assert a['sha256']==b['sha256']==h and a['verdict']==b['verdict']=='passed'
                  result[v]={t:{'discovery':a['scores'][t]['S'],'heldout':b['scores'][t]['S'],'bytes':a['scores'][t].get('bytes')} for t in ['rv32im','thumbv6m','thumbv7em','overall']}
                  admitted[v]=(a,b,d)
              except Exception as e:result[v]={'not_admitted':repr(e)}
          assert 'control' in admitted
          c=admitted['control']
          for v,(a,b,d) in admitted.items():
              for r,ctrl in zip((a,b),c[:2]):
                  assert r['inputs_sha256']==ctrl['inputs_sha256'] and r['fingerprint']['measurement']==ctrl['fingerprint']['measurement']
          boards=['rv32im','thumbv6m','overall']
          score=lambda v,i,t:admitted[v][i]['scores'][t]['S']
          gain=lambda v,t:min(1-score(v,i,t)/score('control',i,t) for i in [0,1])
          winners={t:[v for v in admitted if v!='control' and gain(v,t)>0] for t in boards}
          best_by_board={t:max(winners[t],key=lambda v:gain(v,t)) if winners[t] else 'control' for t in boards}
          # This experiment is ARM-specific. Require paired improvement over the
          # already qualified ARM control; no claim of live takeover.
          eligible=[(v,'thumbv6m') for v in winners['thumbv6m'] if gain(v,'thumbv6m')>=0.005]
          best,board=max(eligible,key=lambda p:gain(*p)) if eligible else ('control',None)
          qualifies=bool(eligible)
          pathlib.Path('evidence/candidate.c').write_bytes((admitted[best][2]/'candidate.c').read_bytes())
          pathlib.Path('evidence/decision.json').write_text(json.dumps({'results':result,'paired_winners':winners,'best_by_board':best_by_board,'selected':best,'selected_board':board,'qualify':qualifies},indent=2))
          print(json.dumps(result,indent=2));print('paired winners',winners,'best',best_by_board,'qualification trigger',qualifies,best,board)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('qualify='+str(qualifies).lower()+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-narrow2-selected
          path: evidence/
  qualify:
    needs: reconcile
    if: needs.reconcile.outputs.qualify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        function: [sigmoid,tanh,exp]
        target: [host,rv32im,thumbv6m,thumbv7em]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: eik-narrow2-selected
          path: selected
      - name: Complete independent qualification
        env:
          FN: ${{ matrix.function }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          git clone https://github.com/conjectures-io/exact-integer-kernels-miner.git kit
          cd kit
          git checkout --detach 5a32428ad4aa23bce737d50a738ace24ddeeed2e
          cp ../selected/candidate.c .
          mkdir evidence
          sha256sum candidate.c > evidence/source.sha256
          pip install --require-hashes -r requirements.txt
          python -m eik setup
          if [ "$TARGET" = host ]; then
            python -m eik fullcheck candidate.c --function "$FN" --out evidence/report.json
          else
            sudo apt-get update
            sudo apt-get install -y qemu-user
            python -m eik targetcheck candidate.c --function "$FN" --target "$TARGET" --out evidence/report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eik-narrow2-full-${{ matrix.function }}-${{ matrix.target }}
          path: kit/evidence/
