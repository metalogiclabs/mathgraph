name: WattBot 48-source pinned corpus expansion
on:
  push:
    branches: [wattbot-corpus-expansion-v1]
    paths:
      - 'experiments/wattbot2026/corpus_expansion_probe.py'
      - '.github/workflows/wattbot-corpus-48.yml'
jobs:
  measure-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle pandas numpy scipy scikit-learn requests pymupdf
      - run: python experiments/wattbot2026/corpus_expansion_probe.py --self-test
      - name: Run 0-vs-24-vs-48 source retrieval diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/corpus_expansion_probe.py --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Preserve licensing boundary
        run: echo "No PDF bytes, generated chunks, row labels, or output predictions persisted beyond runner."
