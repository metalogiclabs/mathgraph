name: L4YAML source-pinned metamorphic smoke
on:
  push:
    branches:
      - experiment/check-blind-l4yaml-transfer-20261122
  pull_request:
    paths:
      - 'experiments/check-blind-l4yaml-transfer-20261122/**'
      - '.github/workflows/check-l4yaml-metamorphic.yml'
  workflow_dispatch:
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: mathgraph
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/L4YAML
          ref: 16562a74421f94cc0f8216eecf21f1ff58166fa7
          path: l4yaml
      - name: Install project-pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build actual parser consumer
        working-directory: l4yaml
        run: |
          lake build tryparse
          git status --porcelain --untracked-files=all
      - name: Prepare specification-backed smoke pair outside target tree
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"mathgraph-l4yaml-smoke"
          root.mkdir()
          (root/"base.yaml").write_bytes(b"a: 1\n")
          (root/"comment.yaml").write_bytes(b"# presentation comment\na: 1\n")
          exe=str(pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"l4yaml"/".lake"/"build"/"bin"/"tryparse")
          spec={"schema":"mathgraph.metamorphic-pairs.v0","pairs":[
            {"id":"comment-preserves-parse-acceptance",
             "requirement":"YAML comments are presentation details; adding a comment before a valid mapping must preserve parse acceptance.",
             "relation":"both_accept",
             "left":[exe,str(root/"base.yaml")],
             "right":[exe,str(root/"comment.yaml")]}]}
          (root/"spec.json").write_text(json.dumps(spec,indent=2)+"\n")
          PY
      - name: Run pinned paired consumer test
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python3 mathgraph/experiments/check-blind-l4yaml-transfer-20261122/metamorphic.py \
            --spec "$RUNNER_TEMP/mathgraph-l4yaml-smoke/spec.json" \
            --repo "$GITHUB_WORKSPACE/l4yaml" \
            --revision 16562a74421f94cc0f8216eecf21f1ff58166fa7 \
            --out "$RUNNER_TEMP/mathgraph-l4yaml-result"
      - name: Retain receipt and pair inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4yaml-metamorphic-smoke
          path: |
            ${{ runner.temp }}/mathgraph-l4yaml-smoke/
            ${{ runner.temp }}/mathgraph-l4yaml-result/
          if-no-files-found: warn
