name: Crystal Chess Continuation Selector V9

on:
  push:
    branches:
      - crystal-chess-continuation-selector-v9
    paths:
      - "experiments/crystal_chess_continuation_selector_v9.py"
      - ".github/workflows/crystal-chess-continuation-selector-v9.yml"
      - "experiments/crystal_chess_kpvk_v0.py"
      - "experiments/crystal_chess_goal_certificate_v3.py"
      - "experiments/crystal_chess_richer_transfer_v5.py"
      - "mathgraph/capability_calculus.py"
      - "tests/test_capability_calculus.py"
  workflow_dispatch:

jobs:
  continuation-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify calculus core
        run: |
          python -m pytest -q tests/test_capability_calculus.py
          python -m pytest -q tests/test_crystal.py

      - name: Compile experiment
        run: python -m py_compile experiments/crystal_chess_continuation_selector_v9.py

      - name: Acquire exact 3-5 piece Syzygy WDL authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw KPPvK.rtbw KPPPvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Train continuation selector and prospectively test 4p and 5p
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v9
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v9/
          python experiments/crystal_chess_continuation_selector_v9.py \
            --tablebase-dir /tmp/syzygy \
            --train-size 30000 \
            --test-size 30000 \
            --five-piece-size 30000 \
            --output artifacts/crystal-chess-v9/crystal_chess_continuation_selector_v9.json \
            | tee artifacts/crystal-chess-v9/run.log
          grep -q "CRYSTAL_CHESS_CONTINUATION_SELECTOR_V9=PASS" artifacts/crystal-chess-v9/run.log

      - name: Upload V9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-continuation-selector-v9
          path: artifacts/crystal-chess-v9/
          if-no-files-found: error
