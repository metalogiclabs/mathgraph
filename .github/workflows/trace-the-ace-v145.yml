name: Trace the Ace V145 Semantic Gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sniff uses 8,000 rows; full uses every training row"
        required: true
        default: sniff
        type: choice
        options: [sniff, full]
      runner:
        description: "GPU runner label"
        required: true
        default: trace-ace-gpu
        type: string
      data_root:
        description: "Persistent RunPod directory containing the three data files"
        required: true
        default: /workspace/trace_the_ace
        type: string
      model:
        description: "Frozen semantic judge"
        required: true
        default: Qwen/Qwen3-8B-AWQ
        type: string

permissions:
  contents: read

concurrency:
  group: trace-ace-v145
  cancel-in-progress: false

jobs:
  contract:
    name: Contract and parser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q numpy pandas scipy scikit-learn pytest
      - name: Compile and test the frozen gate
        run: |
          python -m py_compile experiments/trace_the_ace_v145/*.py
          pytest -q experiments/trace_the_ace_v145/test_v145_semantic_gate.py
          python experiments/trace_the_ace_v145/run_v145_semantic_gate.py --self-test

  semantic-gate:
    name: Frozen semantic gate (${{ inputs.mode }})
    needs: contract
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 720
    env:
      HF_HOME: /workspace/hf-cache
      V145_GPU_MEMORY: "0.90"
    steps:
      - uses: actions/checkout@v4
      - name: Verify GPU and inspect data headers
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          test -s "${{ inputs.data_root }}/train_features_TMQTWsB.csv"
          test -s "${{ inputs.data_root }}/train_labels_44ujmj2.csv"
          test -s "${{ inputs.data_root }}/trace_the_ace_transcripts_v123_single_run_fresh.zip"
          python3 - <<'PY'
          import csv
          from pathlib import Path
          root = Path("${{ inputs.data_root }}")
          for name in ("train_features_TMQTWsB.csv", "train_labels_44ujmj2.csv"):
              with (root/name).open(newline="") as f:
                  print(name, next(csv.reader(f)))
          PY
      - name: Prepare persistent environment
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /workspace/venvs/trace-ace-v145/bin/python ]; then
            python3 -m venv /workspace/venvs/trace-ace-v145 --system-site-packages
          fi
          source /workspace/venvs/trace-ace-v145/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q "vllm>=0.8" "transformers>=4.51" pandas scipy scikit-learn
      - name: Run preregistered V145 gate
        shell: bash
        run: |
          set -euo pipefail
          source /workspace/venvs/trace-ace-v145/bin/activate
          LIMIT=8000
          if [ "${{ inputs.mode }}" = "full" ]; then LIMIT=0; fi
          mkdir -p /workspace/trace-ace-results/v145-${{ github.run_id }}
          python experiments/trace_the_ace_v145/run_v145_semantic_gate.py \
            --features "${{ inputs.data_root }}/train_features_TMQTWsB.csv" \
            --labels "${{ inputs.data_root }}/train_labels_44ujmj2.csv" \
            --transcripts "${{ inputs.data_root }}/trace_the_ace_transcripts_v123_single_run_fresh.zip" \
            --model "${{ inputs.model }}" \
            --limit "$LIMIT" \
            --work "/workspace/trace-ace-results/v145-${{ github.run_id }}/work" \
            --out "/workspace/trace-ace-results/v145-${{ github.run_id }}/v145_results.json"
      - name: Publish decision summary
        if: always()
        shell: bash
        run: |
          RESULT="/workspace/trace-ace-results/v145-${{ github.run_id }}/v145_results.json"
          if [ -s "$RESULT" ]; then
            python3 - "$RESULT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          print("# Trace the Ace V145")
          print(f"\n**Decision: `{r['decision']}`**\n")
          print("| Split | Base | Semantic | Improvement | Fold wins | Bootstrap 95% |")
          print("|---|---:|---:|---:|---:|---:|")
          for k in ("session", "objective"):
              x=r[k]
              print(f"| {k} | {x['base_logloss']:.6f} | {x['semantic_augmented_logloss']:.6f} | {x['improvement']:.6f} | {x['fold_wins']}/5 | {x['bootstrap_improvement_95']} |")
          PY
          fi
      - name: Upload scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v145-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            /workspace/trace-ace-results/v145-${{ github.run_id }}/v145_results.json
            /workspace/trace-ace-results/v145-${{ github.run_id }}/work/*.jsonl
          if-no-files-found: warn
          retention-days: 30
