name: MathGraph Check v0 - source fidelity preflight
on:
  push:
    branches: [mathgraph-check-v0-source-fidelity]
  pull_request:
    branches: [navier-stokes-semantic-bridge-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test protected diagnostic boundary
        run: python -m unittest discover -s tests -p 'test_mathgraph_check_v0.py' -v
      - name: Preserve V1 comparator and negative controls
        run: |
          python - <<'PY'
          import sys, types, unittest
          from pathlib import Path
          # Keep original V1 tests independent of the large optional imports in
          # the historical monolithic mathgraph __init__.py.
          pkg = types.ModuleType("mathgraph")
          pkg.__path__ = [str(Path("mathgraph").resolve())]
          sys.modules["mathgraph"] = pkg
          suite = unittest.defaultTestLoader.discover(
              "tests", pattern="test_semantic_correspondence.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Generate deterministic human and agent reports
        run: |
          mkdir -p evidence
          python -m mathgraph_check examples/mathgraph_check_v0_navier.json \
            --json evidence/mathgraph-check-v0.json \
            --markdown evidence/mathgraph-check-v0.md
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/mathgraph-check-v0.json").read_text())
          assert d["diagnostic"] == "CANDIDATE_CONTRACT_DIVERGENCE"
          assert d["comparison"]["mismatches"] == ["loss"]
          assert d["epistemic"]["formal_kernel_verification"] == "UNKNOWN_NOT_RUN_BY_CHECK_V0"
          assert d["epistemic"]["informal_to_formal_fidelity"] == "UNKNOWN"
          assert d["epistemic"]["truth_promotion"] is False
          assert d["epistemic"]["verified_badge"] == "NOT_ISSUED"
          assert d["source_pins"]["source"]["status"] == "PIN_NOT_REPLAYED"
          print("MATHGRAPH_CHECK_V0_NON_PROMOTION_GREEN")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-check-v0-diagnostic
          path: evidence/mathgraph-check-v0.*
          if-no-files-found: warn

  real-original-surface:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare first-party source and pinned Lean inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/mgcheck-v0 evidence
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            -A 'Mozilla/5.0 (MathGraph-check source-fidelity preflight; exact pin)' \
            'https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf' \
            -o /tmp/mgcheck-v0/navier-stokes.pdf
          echo '0e779481c4da40bd28d1e642e1d8ca57447d129610df28dfa5a11e9af8ae228f  /tmp/mgcheck-v0/navier-stokes.pdf' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/openai/NavierStokesAndEuler/f9e8bc5/NavierStokes/SmoothFamilyTorusInverse.lean' \
            -o /tmp/mgcheck-v0/SmoothFamilyTorusInverse.lean
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/openai/NavierStokesAndEuler/f9e8bc5/NavierStokes/R3/PressureFlux.lean' \
            -o /tmp/mgcheck-v0/PressureFlux.lean
          test "$(git hash-object /tmp/mgcheck-v0/SmoothFamilyTorusInverse.lean)" = c607eb6f2460a3ba55dc2218072cd504bf6253bf
          test "$(git hash-object /tmp/mgcheck-v0/PressureFlux.lean)" = 542377decf40306a50ce2170783de99a384b8d41
      - name: Reuse V4 exact-source/exact-declaration probe, without truth promotion
        run: |
          set -euo pipefail
          python experiments/navier_stokes_semantic_bridge_v1/primary_claim_probe.py \
            --pdf /tmp/mgcheck-v0/navier-stokes.pdf \
            --inverse /tmp/mgcheck-v0/SmoothFamilyTorusInverse.lean \
            --pressure /tmp/mgcheck-v0/PressureFlux.lean \
            --out evidence/primary-claim-v4.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p=Path("/tmp/mgcheck-v0")
          evidence=json.loads(Path("evidence/primary-claim-v4.json").read_text())
          assert evidence["result"] == "VERIFIED_BYTE_IDENTITY_AND_SELECTED_SURFACE_MISMATCH"
          assert evidence["formal_source"]["inverse_jet_order"] == "w.length + 5"
          assert evidence["primary_source"]["four_more_derivatives_pages"]
          assert evidence["can_promote_truth"] is False
          # The 4/5 interpretation below remains a manually curated,
          # unendorsed pairing of two independently pinned source surfaces.
          data={
            "schema":"mathgraph.check.v0",
            "title":"OpenAI Navier-Stokes bounded 4-versus-5 derivative-loss diagnostic",
            "source_contract_origin":"MANUAL_UNREVIEWED",
            "protected_dimensions":["loss"],
            "source":{
              "anchor":"arxiv:2610.08144v1#four_more_derivatives",
              "file":"navier-stokes.pdf",
              "sha256":hashlib.sha256((p/"navier-stokes.pdf").read_bytes()).hexdigest(),
              "dimensions":{"loss":4}
            },
            "formal":{
              "anchor":"openai/NavierStokesAndEuler@f9e8bc5#norm_derivativeWord_inverse_le",
              "file":"SmoothFamilyTorusInverse.lean",
              "sha256":hashlib.sha256((p/"SmoothFamilyTorusInverse.lean").read_bytes()).hexdigest(),
              "dimensions":{"loss":5}
            }
          }
          (p/"real-claim.json").write_text(json.dumps(data,sort_keys=True,indent=2)+"\n")
          PY
          python -m mathgraph_check /tmp/mgcheck-v0/real-claim.json \
            --json evidence/mathgraph-check-v0-real-source.json \
            --markdown evidence/mathgraph-check-v0-real-source.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/mathgraph-check-v0-real-source.json").read_text())
          assert r["comparison"]["mismatches"] == ["loss"]
          assert r["source_pins"]["source"]["status"] == "LOCAL_SHA256_CHECKED"
          assert r["source_pins"]["formal"]["status"] == "LOCAL_SHA256_CHECKED"
          assert r["epistemic"]["truth_promotion"] is False
          assert r["epistemic"]["informal_to_formal_fidelity"] == "UNKNOWN"
          assert r["epistemic"]["formal_kernel_verification"] == "UNKNOWN_NOT_RUN_BY_CHECK_V0"
          assert r["epistemic"]["verified_badge"] == "NOT_ISSUED"
          print("MATHGRAPH_CHECK_V0_REAL_SOURCE_PINS_GREEN")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathgraph-check-v0-pinned-original
          path: |
            evidence/mathgraph-check-v0-real-source.json
            evidence/mathgraph-check-v0-real-source.md
            evidence/primary-claim-v4.json
          if-no-files-found: warn
