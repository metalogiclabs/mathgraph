name: L4YAML parser-boundary v1

on:
  push:
    branches: [l4yaml-parser-boundary-v1]
    paths:
      - 'experiments/l4yaml/**'
      - '.github/workflows/l4yaml-parser-boundary-v1.yml'
  workflow_dispatch:

jobs:
  parser-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout MathGraph experiment
        uses: actions/checkout@v4

      - name: Checkout pinned L4YAML
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: 16562a74421f94cc0f8216eecf21f1ff58166fa7
          path: upstream
          submodules: recursive

      - name: Cache pinned L4YAML build
        uses: actions/cache@v4
        with:
          path: upstream/.lake/build
          key: l4yaml-16562a74421f94cc0f8216eecf21f1ff58166fa7-${{ runner.os }}

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        working-directory: upstream
        run: |
          TOOLCHAIN="$(cat lean-toolchain)"
          elan toolchain install "$TOOLCHAIN" || true
          elan show

      - name: Build L4YAML
        working-directory: upstream
        run: lake build

      - name: Kernel-check L4YAML audit suite
        run: |
          cp experiments/l4yaml/ParserBoundaryProbe.lean upstream/ParserBoundaryProbe.lean
          cp experiments/l4yaml/FlowContinuation.lean upstream/FlowContinuation.lean
          cp experiments/l4yaml/ExactNestedFlow.lean upstream/ExactNestedFlow.lean
          cp experiments/l4yaml/CapstoneObstruction.lean upstream/CapstoneObstruction.lean
          cp experiments/l4yaml/SemanticObstruction.lean upstream/SemanticObstruction.lean
          cp experiments/l4yaml/CorrectedCapstone.lean upstream/CorrectedCapstone.lean
          cp experiments/l4yaml/TagHandleObstruction.lean upstream/TagHandleObstruction.lean
          cp experiments/l4yaml/BlockHeaderObstruction.lean upstream/BlockHeaderObstruction.lean
          cp experiments/l4yaml/NoGo.lean upstream/NoGo.lean
          cp experiments/l4yaml/LanguageRelation.lean upstream/LanguageRelation.lean
          cd upstream
          lake env lean ParserBoundaryProbe.lean
          lake env lean FlowContinuation.lean
          lake env lean ExactNestedFlow.lean
          lake env lean CapstoneObstruction.lean
          lake env lean SemanticObstruction.lean
          lake env lean CorrectedCapstone.lean
          lake env lean TagHandleObstruction.lean
          lake env lean BlockHeaderObstruction.lean
          lake env lean NoGo.lean
          lake env lean LanguageRelation.lean
