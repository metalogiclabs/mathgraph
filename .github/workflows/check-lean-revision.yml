name: Generated Lean compiler-guided revision
on:
  push:
    branches: [pilot/check-lean-revision-20261103]
permissions:
  contents: read
concurrency:
  group: check-lean-investigator-pilot
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: node --test integrations/mathgraph-check-github/*.test.mjs integrations/mathgraph-check-github/investigator-v1/*.test.mjs integrations/mathgraph-check-github/lean-investigator-v1/*.test.mjs
      - run: python3 -m unittest discover -s integrations/mathgraph-check-github/investigator-v1 -p 'test_*.py'
      - run: python3 -m unittest discover -s integrations/mathgraph-check-github/lean-investigator-v1 -p 'test_*.py'
  prepare:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Recover original probes and failed proposal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lean-investigator-assessment
          path: prior-lean-investigation
          run-id: 41519286478
          github-token: ${{ github.token }}
      - name: Authenticate and prepare one bounded revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node integrations/mathgraph-check-github/lean-investigator-v1/revision.mjs prior-lean-investigation lean-investigation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: lean-investigator-plan, path: lean-investigation/}
  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: lean-investigator-plan, path: lean-investigation}
      - name: Install pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
      - name: Offline generated Lean guard execution
        run: python3 integrations/mathgraph-check-github/lean-investigator-v1/native.py initial lean-investigation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: lean-investigator-native, path: lean-investigation/}
  propose-repair:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: lean-investigator-native, path: lean-investigation}
      - name: Propose repair only for a reproduced head failure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node integrations/mathgraph-check-github/lean-investigator-v1/driver.mjs repair lean-investigation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: lean-investigator-patch, path: lean-investigation/}
  verify-repair:
    needs: propose-repair
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: lean-investigator-patch, path: lean-investigation}
      - name: Install pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
      - name: Replay original, model patch and withdrawal
        run: python3 integrations/mathgraph-check-github/lean-investigator-v1/native.py repair lean-investigation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: lean-investigator-final, path: lean-investigation/}
  assess:
    needs: verify-repair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, checks: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: lean-investigator-final, path: lean-investigation}
      - name: Independent mechanical evidence admission
        run: node integrations/mathgraph-check-github/lean-investigator-v1/driver.mjs assess lean-investigation
      - name: Detect existing App publisher
        id: publisher
        env: {APP_PRIVATE_KEY: '${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}'}
        run: |
          if [ -n "$APP_PRIVATE_KEY" ]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; fi
      - name: Mint existing repository-scoped Check token
        id: app
        if: steps.publisher.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23lioiUs5KfHD7mkkw
          private-key: ${{ secrets.MATHGRAPH_CHECK_APP_PRIVATE_KEY }}
          owner: metalogiclabs
          repositories: mathgraph
          permission-checks: write
      - name: Publish source-bound advisory result
        env: {GH_TOKEN: '${{ steps.app.outputs.token }}'}
        run: node integrations/mathgraph-check-github/lean-investigator-v1/publish.mjs lean-investigation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: lean-investigator-assessment, path: lean-investigation/}
