name: Orekit attitude correspondence audit
on:
  push:
    branches: [experiment/orekit-attitude-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@60d2c8e17ef7d5b15559388ab6e3266c0092e942
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute pinned native controls
        run: python3 research/orekit-attitude-20261124/followup.py
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orekit-attitude-release-ablation-evidence
          path: orekit-followup-evidence/
          if-no-files-found: error
          retention-days: 90
