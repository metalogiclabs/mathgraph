name: Temporal one-column scan audit
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - 'experiments/uzh_rotation/temporal_line_scan.py'
      - '.github/workflows/temporal-line-scan.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1 opencv-python-headless==4.10.0.84
      - name: Run causal timestamped one-column audit
        run: |
          for scene in poster_rotation boxes_rotation; do
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 600 "https://rpg.ifi.uzh.ch/datasets/davis/${scene}.zip" -o "${scene}.zip"
            python experiments/uzh_rotation/temporal_line_scan.py "${scene}.zip" --frames 450 --bins 72 --blackout-start 280 --blackout-length 90 --output "${scene}_scan.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-line-scan-evidence
          path: '*_scan.json'
          if-no-files-found: warn
