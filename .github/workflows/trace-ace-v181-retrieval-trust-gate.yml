name: Trace the Ace V181 Retrieval Trust Gate
on:
  push:
    paths:
      - 'experiments/trace_the_ace_v181/**'
      - '.github/workflows/trace-ace-v181-retrieval-trust-gate.yml'
  workflow_dispatch:
jobs:
  v181:
    runs-on: [self-hosted, trace-ace-gpu]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check persistent inputs
        run: |
          test -f /workspace/trace_the_ace/train_features_TMQTWsB.csv
          test -f /workspace/trace_the_ace/train_labels_44ujmj2.csv
          test -d /workspace/trace_the_ace/transcripts_extracted
      - name: Run retrieval-trust gate
        run: python3 experiments/trace_the_ace_v181/run_v181_retrieval_trust_gate.py
      - name: Show result
        if: always()
        run: cat /workspace/trace-ace-results/v181/v181_results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-the-ace-v181-results
          path: /workspace/trace-ace-results/v181/
          if-no-files-found: warn
