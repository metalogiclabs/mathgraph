name: WattBot K10 second pass versus provisional-first evidence policy
on:
  push:
    branches: [wattbot-second-pass-provisional-v1]
    paths:
      - '.github/workflows/wattbot-second-pass-provisional.yml'
      - 'experiments/wattbot2026/residual_second_pass_probe.py'
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
jobs:
  second-pass-provisional:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned WattBot evaluator and PDF dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Verify original first-pass and independent quotation checker
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/wattbot2026
          python experiments/wattbot2026/residual_second_pass_probe.py --self-test
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Score second-pass verified and provisional policies on SAME original 63 TRAIN outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/residual_second_pass_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Budget and evidence boundary
        run: |
          echo "One first-pass model response and conditional extra call only for quote failures."
          echo "Extra model reservation <= USD 0.16, ordinary first pass separately bounded."
          echo "Quote verified != scientific entailment; provisional responses remain CANDIDATE."
          echo "No Kaggle TEST or submission; official TRAIN scorer only."
