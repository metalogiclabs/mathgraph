name: Report integrity native repair qualification
on:
  push:
    branches: [research/check-report-selfserve-v1-20261104]
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.35.0
      - run: python3 experiments/check-report-integrity-v1/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: report-integrity-native-repair, path: report-integrity-evidence, retention-days: 30}
