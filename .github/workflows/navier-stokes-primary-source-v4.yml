name: Primary-source Navier-Stokes inverse audit V4
on:
  push:
    branches: [navier-stokes-semantic-bridge-v1]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/primary_claim_probe.py'
      - '.github/workflows/navier-stokes-primary-source-v4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/primary_claim_probe.py'
      - '.github/workflows/navier-stokes-primary-source-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navier-primary-v4-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-original-versus-pinned-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze exact head, validate Python syntax and install PDF extractor
        run: |
          set -euo pipefail
          mkdir -p primary-v4-evidence /tmp/primary-v4
          git rev-parse HEAD | tee primary-v4-evidence/head-sha.txt
          python -m py_compile experiments/navier_stokes_semantic_bridge_v1/primary_claim_probe.py
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdftotext -v 2>&1 | head -2
      - name: Retrieve original manuscript and exact upstream source blobs
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            -A 'Mozilla/5.0 (semantic-correspondence-research; source pin check)' \
            'https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf' \
            -o /tmp/primary-v4/navier-stokes.pdf
          echo '0e779481c4da40bd28d1e642e1d8ca57447d129610df28dfa5a11e9af8ae228f  /tmp/primary-v4/navier-stokes.pdf' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/openai/NavierStokesAndEuler/f9e8bc5/NavierStokes/SmoothFamilyTorusInverse.lean' \
            -o /tmp/primary-v4/SmoothFamilyTorusInverse.lean
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/openai/NavierStokesAndEuler/f9e8bc5/NavierStokes/R3/PressureFlux.lean' \
            -o /tmp/primary-v4/PressureFlux.lean
          test "$(git hash-object /tmp/primary-v4/SmoothFamilyTorusInverse.lean)" = 'c607eb6f2460a3ba55dc2218072cd504bf6253bf'
          test "$(git hash-object /tmp/primary-v4/PressureFlux.lean)" = '542377decf40306a50ce2170783de99a384b8d41'
      - name: Check first-party source formula anchors against pinned Lean declarations
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python experiments/navier_stokes_semantic_bridge_v1/primary_claim_probe.py \
            --pdf /tmp/primary-v4/navier-stokes.pdf \
            --inverse /tmp/primary-v4/SmoothFamilyTorusInverse.lean \
            --pressure /tmp/primary-v4/PressureFlux.lean \
            --out primary-v4-evidence/result.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('primary-v4-evidence/result.json').read_text())
          assert d['result']=='VERIFIED_BYTE_IDENTITY_AND_SELECTED_SURFACE_MISMATCH'
          assert d['can_promote_truth'] is False
          assert d['nl_interpretation_independently_approved'] is False
          assert d['full_inverse_estimate_proved'] is False
          assert d['proof_argument_fidelity']=='UNKNOWN'
          head=Path('primary-v4-evidence/head-sha.txt').read_text().strip()
          assert head==os.environ['EXPECTED_SOURCE_SHA'], 'Source checkout mismatch'
          print('V4_SOURCE_IDENTITY_AND_LITERAL_SURFACE_CHECK_GREEN')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary-navier-claim-v4
          path: primary-v4-evidence/
          if-no-files-found: error
