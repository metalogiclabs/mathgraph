name: Crystal Chess Normal Exposure V22

on:
  push:
    branches:
      - crystal-chess-normal-exposure-v22
    paths:
      - "experiments/crystal_chess_stockfish_hybrid_uci_v17.py"
      - "experiments/crystal_chess_normal_exposure_v22.py"
      - ".github/workflows/crystal-chess-normal-exposure-v22.yml"
  workflow_dispatch:

jobs:
  normal-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-chess==1.999"

      - name: Compile V22 and runtime
        run: |
          python -m py_compile experiments/crystal_chess_stockfish_hybrid_uci_v17.py
          python -m py_compile experiments/crystal_chess_normal_exposure_v22.py

      - name: Download frozen residual ladder
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-residual-guard-ladder-v16
          path: /tmp/ladder
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36359443246

      - name: Download frozen role map
        uses: actions/download-artifact@v4
        with:
          name: crystal-chess-stockfish-hybrid-uci-v17
          path: /tmp/v17
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: metalogiclabs/mathgraph
          run-id: 36360365229

      - name: Verify frozen runtime assets
        run: |
          set -euo pipefail
          ladder=/tmp/ladder/crystal_chess_residual_guard_ladder_v16.jsonl.gz
          roles=/tmp/v17/crystal_chess_roles_v17.jsonl.gz
          test "$(gzip -dc "$ladder" | sha256sum | awk '{print $1}')" = "7c19923878b0fe4502871cc025582137471f93227c76dff537c1870da3401285"
          test "$(gzip -dc "$roles" | sha256sum | awk '{print $1}')" = "028353c82c3fefdd7d9e36907916b9a1aec7c1c13da9a4b8710b4deef8298b99"

      - name: Build pinned Stockfish
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Disservin/fastchess.git /tmp/fastchess
          git -C /tmp/fastchess checkout 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          make -C /tmp/fastchess -j2

      - name: Generate deterministic diverse normal openings
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v22
          python experiments/crystal_chess_normal_exposure_v22.py generate             --stockfish /tmp/stockfish/src/stockfish             --book artifacts/crystal-chess-v22/normal.epd             --manifest artifacts/crystal-chess-v22/opening_manifest.json             --openings 96             --plies 12             --depth 6             --multipv 4             --seed 20260928             | tee artifacts/crystal-chess-v22/generate.log
          grep -q "CRYSTAL_CHESS_NORMAL_BOOK_V22=PASS" artifacts/crystal-chess-v22/generate.log

      - name: Prepare V21 candidate launcher
        run: |
          cat > /tmp/crystal-v22 <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 "$GITHUB_WORKSPACE/experiments/crystal_chess_stockfish_hybrid_uci_v17.py"             --fallback /tmp/stockfish/src/stockfish             --guard /tmp/ladder/crystal_chess_residual_guard_ladder_v16.jsonl.gz             --roles /tmp/v17/crystal_chess_roles_v17.jsonl.gz
          EOF
          chmod +x /tmp/crystal-v22
          /tmp/fastchess/fastchess --compliance /tmp/crystal-v22 > artifacts/crystal-chess-v22/uci-compliance.log 2>&1

      - name: Run paired fixed-node normal games
        run: |
          set -euo pipefail
          /tmp/fastchess/fastchess             -engine cmd=/tmp/crystal-v22 name=CrystalV22 option.Threads=1 option.Hash=16             -engine cmd=/tmp/stockfish/src/stockfish name=StockfishBaseline option.Threads=1 option.Hash=16             -each nodes=5000             -rounds 96 -games 2 -concurrency 2             -openings file=artifacts/crystal-chess-v22/normal.epd format=epd order=sequential             -maxmoves 220             -pgnout file=artifacts/crystal-chess-v22/match.pgn notation=uci append=false nodes=true             -log file=artifacts/crystal-chess-v22/fastchess.log level=info append=false engine=true             -ratinginterval 48 -report penta=true             | tee artifacts/crystal-chess-v22/match.stdout.log

      - name: Analyse normal-game exposure
        run: |
          set -euo pipefail
          python experiments/crystal_chess_normal_exposure_v22.py analyse             --pgn artifacts/crystal-chess-v22/match.pgn             --log artifacts/crystal-chess-v22/fastchess.log             --crystal-name CrystalV22             --output artifacts/crystal-chess-v22/result.json             | tee artifacts/crystal-chess-v22/analyse.log
          grep -q "CRYSTAL_CHESS_NORMAL_EXPOSURE_V22=PASS" artifacts/crystal-chess-v22/analyse.log
          cp /tmp/ladder/crystal_chess_residual_guard_ladder_v16.jsonl.gz artifacts/crystal-chess-v22/
          cp /tmp/v17/crystal_chess_roles_v17.jsonl.gz artifacts/crystal-chess-v22/
          printf '%s\n' "official-stockfish/Stockfish@0a215d6c9e48856ef630013b8ab8312941a59057" > artifacts/crystal-chess-v22/STOCKFISH_PIN.txt
          printf '%s\n' "Disservin/fastchess@60d7a7a26c6b0582a15c112fb29a1829bef2adb3" > artifacts/crystal-chess-v22/FASTCHESS_PIN.txt

      - name: Upload V22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-normal-exposure-v22
          path: artifacts/crystal-chess-v22/
          if-no-files-found: error
