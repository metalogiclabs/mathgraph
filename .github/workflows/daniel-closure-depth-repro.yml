name: Daniel Reproductions

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/closure_relative_developmental_depth_v1/**"
      - "reproductions/daniel_closure_depth_v1/**"
      - "reproductions/daniel_typed_regime_growth_v1/**"
      - "reproductions/daniel_target_independent_regime_growth_v2/**"
      - "reproductions/daniel_coordinate_free_refinement_v3/**"
      - "reproductions/daniel_relational_law_synthesis_v4/**"
      - ".github/workflows/daniel-closure-depth-repro.yml"
  pull_request:
    paths:
      - "experiments/closure_relative_developmental_depth_v1/**"
      - "reproductions/daniel_closure_depth_v1/**"
      - "reproductions/daniel_typed_regime_growth_v1/**"
      - "reproductions/daniel_target_independent_regime_growth_v2/**"
      - "reproductions/daniel_coordinate_free_refinement_v3/**"
      - "reproductions/daniel_relational_law_synthesis_v4/**"
      - ".github/workflows/daniel-closure-depth-repro.yml"

permissions:
  contents: read

jobs:
  reproduce:
    name: Fresh checkout / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: |
          python -m py_compile \
            experiments/closure_relative_developmental_depth_v1/run.py \
            reproductions/daniel_closure_depth_v1/reproduce.py \
            reproductions/daniel_closure_depth_v1/alternate_grammar_audit.py
          if [ -f reproductions/daniel_typed_regime_growth_v1/reproduce.py ]; then
            python -m py_compile reproductions/daniel_typed_regime_growth_v1/reproduce.py
          fi
          if [ -f reproductions/daniel_target_independent_regime_growth_v2/reproduce.py ]; then
            python -m py_compile reproductions/daniel_target_independent_regime_growth_v2/reproduce.py
          fi
          if [ -f reproductions/daniel_target_independent_regime_growth_v2/reproduce_v2_1.py ]; then
            python -m py_compile reproductions/daniel_target_independent_regime_growth_v2/reproduce_v2_1.py
          fi
          if [ -f reproductions/daniel_coordinate_free_refinement_v3/reproduce.py ]; then
            python -m py_compile reproductions/daniel_coordinate_free_refinement_v3/reproduce.py
          fi
          if [ -f reproductions/daniel_relational_law_synthesis_v4/reproduce.py ]; then
            python -m py_compile reproductions/daniel_relational_law_synthesis_v4/reproduce.py
          fi

      - name: Reproduce closure-depth certificate
        run: python reproductions/daniel_closure_depth_v1/reproduce.py

      - name: Reproduce typed regime-growth certificate
        if: ${{ hashFiles('reproductions/daniel_typed_regime_growth_v1/reproduce.py') != '' }}
        run: python reproductions/daniel_typed_regime_growth_v1/reproduce.py

      - name: Reproduce target-independent exhaustive regime benchmark
        if: ${{ hashFiles('reproductions/daniel_target_independent_regime_growth_v2/reproduce.py') != '' }}
        run: python reproductions/daniel_target_independent_regime_growth_v2/reproduce.py

      - name: Reproduce repaired target-independent controls
        if: ${{ hashFiles('reproductions/daniel_target_independent_regime_growth_v2/reproduce_v2_1.py') != '' }}
        run: python reproductions/daniel_target_independent_regime_growth_v2/reproduce_v2_1.py

      - name: Reproduce coordinate-free refinement benchmark
        if: ${{ hashFiles('reproductions/daniel_coordinate_free_refinement_v3/reproduce.py') != '' }}
        run: python reproductions/daniel_coordinate_free_refinement_v3/reproduce.py

      - name: Reproduce generic relational law synthesis
        if: ${{ hashFiles('reproductions/daniel_relational_law_synthesis_v4/reproduce.py') != '' }}
        run: python reproductions/daniel_relational_law_synthesis_v4/reproduce.py

      - name: Verify checkout remains clean
        run: git diff --exit-code

  mathematical-note:
    name: Compile mathematical note
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended

      - name: Compile closure-depth TeX twice
        working-directory: reproductions/daniel_closure_depth_v1
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error MATHEMATICAL_NOTE.tex
          pdflatex -interaction=nonstopmode -halt-on-error MATHEMATICAL_NOTE.tex

      - name: Verify PDF produced
        run: test -s reproductions/daniel_closure_depth_v1/MATHEMATICAL_NOTE.pdf
