name: Daniel Closure Depth Reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/closure_relative_developmental_depth_v1/**"
      - "reproductions/daniel_closure_depth_v1/**"
      - ".github/workflows/daniel-closure-depth-repro.yml"
  pull_request:
    paths:
      - "experiments/closure_relative_developmental_depth_v1/**"
      - "reproductions/daniel_closure_depth_v1/**"
      - ".github/workflows/daniel-closure-depth-repro.yml"

permissions:
  contents: read

jobs:
  reproduce:
    name: Fresh checkout / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Reproduce exact certificate
        run: python reproductions/daniel_closure_depth_v1/reproduce.py

      - name: Verify checkout remains clean
        run: git diff --exit-code
