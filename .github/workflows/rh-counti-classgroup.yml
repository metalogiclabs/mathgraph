name: RH CountI auxiliary field certified class group

on:
  push:
    branches:
      - research/rh-definition-bridge-20261121
    paths:
      - 'research/rh-counti-aux/degree8_class_group.gp'
      - '.github/workflows/rh-counti-classgroup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class-group:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq pari-gp
          gp --version
      - name: Compute class group and require unconditional certificate
        run: |
          set -euo pipefail
          gp -q < research/rh-counti-aux/degree8_class_group.gp | tee "$RUNNER_TEMP/classgroup.log"
          grep -Fx 'FIELD_DEGREE=8' "$RUNNER_TEMP/classgroup.log"
          grep -Fx 'DISCRIMINANT=189333765625' "$RUNNER_TEMP/classgroup.log"
          grep -Fx 'CERTIFIED=1' "$RUNNER_TEMP/classgroup.log"
          grep -Fx 'PASS: certified F=Q(zeta5,sqrt(-59)) class group' "$RUNNER_TEMP/classgroup.log"
      - name: Preserve exact arithmetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-counti-classgroup-gp
          path: ${{ runner.temp }}/classgroup.log
          if-no-files-found: warn
