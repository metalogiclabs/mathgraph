name: Crystal Chess External Package V60

on:
  push:
    branches:
      - crystal-chess-external-package-v60
    paths:
      - "external/crystal-chess-v60/**"
      - ".github/workflows/crystal-chess-external-package-v60.yml"
  workflow_dispatch:

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify clean application and reconstructed diff
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout 0a215d6c9e48856ef630013b8ab8312941a59057
          git -C /tmp/stockfish apply --check "$GITHUB_WORKSPACE/external/crystal-chess-v60/stockfish-0a215d6c-crystal-v56.patch"
          git -C /tmp/stockfish apply "$GITHUB_WORKSPACE/external/crystal-chess-v60/stockfish-0a215d6c-crystal-v56.patch"
          git -C /tmp/stockfish diff -- src/search.cpp > /tmp/reproduced.patch
          diff -u "$GITHUB_WORKSPACE/external/crystal-chess-v60/stockfish-0a215d6c-crystal-v56.patch" /tmp/reproduced.patch
          sha256sum "$GITHUB_WORKSPACE/external/crystal-chess-v60/stockfish-0a215d6c-crystal-v56.patch"

      - name: Build and bench frozen external candidate
        run: |
          set -euo pipefail
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64
          /tmp/stockfish/src/stockfish bench 16 1 3 default depth | tee /tmp/bench.txt
          grep -F 'if (mainThread->tm.optimum() <= 64)' /tmp/stockfish/src/search.cpp
          grep -F 'highBestMoveEffort = 1.0;' /tmp/stockfish/src/search.cpp
          echo "CRYSTAL_CHESS_EXTERNAL_PACKAGE_V60=PASS"

      - name: Upload frozen source package
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-external-package-v60
          path: external/crystal-chess-v60/
          if-no-files-found: error
