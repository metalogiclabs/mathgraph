name: V69 Causal Action Scope Calibration

on:
  push:
    branches: [causal-action-scope-transfer-v69]
    paths:
      - 'experiments/causal_action_scope_transfer_v69/**'
      - '.github/workflows/causal-action-scope-transfer-v69.yml'
  workflow_dispatch:

jobs:
  calibrate-causal-action-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Static check
        run: python3 -m py_compile experiments/causal_action_scope_transfer_v69/run_calibration.py

      - name: Install frozen route backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1

      - name: Fetch pinned opened calibration streams
        run: |
          set -euo pipefail
          mkdir -p external-v69
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v69/book3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v69/book3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v69/book3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v69/book3500.jsonl" | sha256sum -c -
          curl -fsSL --retry 3 https://raw.githubusercontent.com/heathsanchez/equational-theories-lean-stage2/374eb40ba5389915deb174fbc12cc92346214dd1/examples/problems/normal.jsonl -o external-v69/stage2-normal.jsonl
          echo "V69_CALIBRATION_ONLY=opened_by_v67_not_fresh"
          echo "V69_FRESH_STREAM=UNSPENT"

      - name: Run V69 action-scope calibration
        run: |
          PYTHONPATH=. python3 experiments/causal_action_scope_transfer_v69/run_calibration.py \
            --book3000 external-v69/book3000.jsonl \
            --book3500 external-v69/book3500.jsonl \
            --stage2 external-v69/stage2-normal.jsonl \
            --out external-v69/results

      - name: Preserve V69 calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v69-causal-action-scope-calibration
          path: external-v69/results/
