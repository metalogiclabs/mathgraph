name: V64 Opened Proof Basis Transfer Calibration

on:
  push:
    branches: [external-capability-compounding-v64]
    paths:
      - 'experiments/external_capability_compounding_v64/**'
      - '.github/workflows/external-capability-compounding-v64.yml'
  workflow_dispatch:

jobs:
  proof-basis-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen route backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1
      - name: Freeze external corpus bytes
        run: |
          set -euo pipefail
          mkdir -p external-v64
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3000/wrong-book-3000.jsonl -o external-v64/book3000.jsonl
          curl -fsSL --retry 3 https://raw.githubusercontent.com/YanbiaoLab/equational-challenges/bed33e36c33fca139d902addd8cb77cd4172fe64/datasets/wrong-book-3500/wrong-book-3500.jsonl -o external-v64/book3500.jsonl
          echo "fb1606578ceafcd1019d96733db4c418596f9884952237e72af2579c382ef1f7  external-v64/book3000.jsonl" | sha256sum -c -
          echo "fca0ccfdb31fd2eae5f6669586309130ccb9e591f19a5142aa6604e81f7023f8  external-v64/book3500.jsonl" | sha256sum -c -
          echo "V64_OPENED_TRAIN_VALIDATION_ONLY"
          echo "FRESH_ROWS_2820_PLUS_UNTOUCHED"
      - name: Compile TRAIN source laws and test later targets
        run: |
          PYTHONPATH=. python3 experiments/external_capability_compounding_v64/run.py \
            --book3000 external-v64/book3000.jsonl \
            --book3500 external-v64/book3500.jsonl \
            --out external-v64/results
      - name: Preserve V64 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v64-opened-proof-basis-transfer
          path: external-v64/results/
