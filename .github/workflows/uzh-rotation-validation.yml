name: UZH rotation dataset validation
on:
  push:
    branches: [exp/uzh-rotation-validation-20261021]
    paths:
      - 'experiments/uzh_rotation/**'
      - '.github/workflows/uzh-rotation-validation.yml'
  workflow_dispatch:
jobs:
  rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible evaluation dependencies
        run: pip install numpy==2.1.3 scipy==1.14.1 opencv-python-headless==4.10.0.84
      - name: Fetch original UZH dataset
        run: |
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 600 \
            https://rpg.ifi.uzh.ch/datasets/davis/shapes_rotation.zip \
            -o shapes_rotation.zip
          unzip -t shapes_rotation.zip | tail -1
          unzip -Z1 shapes_rotation.zip | grep -q '^groundtruth.txt$'
          unzip -Z1 shapes_rotation.zip | grep -q '^imu.txt$'
      - name: Evaluate real camera/IMU pairs
        run: python experiments/uzh_rotation/evaluate.py shapes_rotation.zip --pairs 300 --output rotation_results.csv
      - name: Evaluate real visual-inertial relative heading
        run: python experiments/uzh_rotation/heading_compare.py shapes_rotation.zip --pairs 300 --output heading.csv
      - name: Compare calibrated essential matrix baseline
        run: |
          python experiments/uzh_rotation/heading_essential.py shapes_rotation.zip --pairs 300 --output essential_heading.csv
          cp heading_summary.json essential_summary.json
      - name: Compare calibrated pure rotation baseline
        run: |
          python experiments/uzh_rotation/heading_rotation_only.py shapes_rotation.zip --pairs 300 --output rotation_only_heading.csv
          cp heading_summary.json rotation_only_summary.json
      - name: Evaluate gyro-guided historical visual revisits
        run: python experiments/uzh_rotation/scan_revisit.py shapes_rotation.zip --frames 450
      - name: Check independent startup bias against oracle diagnostic
        run: python experiments/uzh_rotation/gyro_bias_diagnostic.py shapes_rotation.zip
      - name: Transfer to unseen poster and boxes rotation scenes
        run: |
          for scene in poster_rotation boxes_rotation; do
            curl -fLsS --retry 2 --connect-timeout 15 --max-time 600 \
              "https://rpg.ifi.uzh.ch/datasets/davis/${scene}.zip" -o "${scene}.zip"
            python experiments/uzh_rotation/joint_transfer.py "${scene}.zip" \
              --frames 450 --output "${scene}_transfer.json"
          done
      - name: Preserve raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzh-rotation-evidence
          path: |
            rotation_results.csv
            summary.json
            heading.csv
            heading_summary.json
            essential_heading.csv
            essential_summary.json
            rotation_only_heading.csv
            rotation_only_summary.json
            revisit_results.csv
            revisit_summary.json
            gyro_bias_summary.json
            poster_rotation_transfer.json
            boxes_rotation_transfer.json
          if-no-files-found: warn
