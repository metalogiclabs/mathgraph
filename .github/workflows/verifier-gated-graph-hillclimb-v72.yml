name: V72 Verifier-Gated Recursive Graph Development

on:
  push:
    branches: [verifier-gated-graph-hillclimb-v72]
    paths:
      - 'experiments/verifier_gated_graph_hillclimb_v72/**'
      - '.github/workflows/verifier-gated-graph-hillclimb-v72.yml'
  workflow_dispatch:

jobs:
  calibrate-verifier-gated-graph-hillclimb:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Static check
        run: python3 -m py_compile experiments/verifier_gated_graph_hillclimb_v72/run_calibration.py

      - name: Install inherited frozen backend
        run: python3 -m pip install --disable-pip-version-check cvc5==1.3.1

      - name: Fetch pinned opened unlabeled law universe
        run: |
          set -euo pipefail
          mkdir -p external-v72
          curl -fsSL --retry 3 https://raw.githubusercontent.com/heathsanchez/equational-theories-lean-stage2/374eb40ba5389915deb174fbc12cc92346214dd1/examples/problems/eq_size5.txt -o external-v72/eq_size5.txt
          test "$(git hash-object external-v72/eq_size5.txt)" = "0deca9c8860fb60f2ae161ab7e3f458ec3b178ca"
          echo "V72_CALIBRATION_ONLY=opened_eq_size5_not_fresh"
          echo "V72_FRESH_STREAM=UNSPENT"

      - name: Run V72 recursive development calibration
        run: |
          PYTHONPATH=. python3 experiments/verifier_gated_graph_hillclimb_v72/run_calibration.py \
            --laws external-v72/eq_size5.txt \
            --out external-v72/results

      - name: Preserve V72 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v72-verifier-gated-recursive-graph-development
          path: external-v72/results/
