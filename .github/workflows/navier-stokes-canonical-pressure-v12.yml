name: Canonical weighted pressure representation V12
on:
  push:
    branches: [navier-stokes-semantic-bridge-v1]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/CanonicalPressureRepresentation.lean'
      - '.github/workflows/navier-stokes-canonical-pressure-v12.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/navier_stokes_semantic_bridge_v1/CanonicalPressureRepresentation.lean'
      - '.github/workflows/navier-stokes-canonical-pressure-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-pressure-v12-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canonical-pressure-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact V11 mathematical authority and candidate
        run: |
          set -euo pipefail
          mkdir -p .four-loss-env pressure-v12-evidence
          git rev-parse HEAD | tee pressure-v12-evidence/head-sha.txt
          ROOT=experiments/navier_stokes_semantic_bridge_v1
          test "$(git hash-object "$ROOT/PressureGaussianLimit.lean")" = '4235fbf5625714a6bff5660423886def603d611b'
          cp "$ROOT/PressureGaussianLimit.lean" .four-loss-env/PressureGaussianLimit.lean
          cp "$ROOT/CanonicalPressureRepresentation.lean" .four-loss-env/CanonicalPressureRepresentation.lean
          cp .four-loss-env/CanonicalPressureRepresentation.lean pressure-v12-evidence/CanonicalPressureRepresentation.lean
          sha256sum .four-loss-env/{PressureGaussianLimit,CanonicalPressureRepresentation}.lean > pressure-v12-evidence/sources.sha256
          printf '%s\n' 'leanprover/lean4:v4.34.0-rc2' > .four-loss-env/lean-toolchain
          cat > .four-loss-env/lakefile.toml <<'EOF'
          name = "mathgraph_canonical_pressure_v12"
          version = "0.1.0"
          [[require]]
          name = "NavierStokesAndEuler"
          git = "https://github.com/openai/NavierStokesAndEuler.git"
          rev = "f9e8bc5b38b6e212696e8a30e3e91517af887bbd"
          [[lean_lib]]
          name = "PressureGaussianLimit"
          [[lean_lib]]
          name = "CanonicalPressureRepresentation"
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            .four-loss-env/.lake
            .four-loss-env/lake-manifest.json
          key: openai-four-loss-v6-lean434rc2-mathlib-pinned-f9e8bc5
      - name: Install original Lean toolchain
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh' \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lock exact original OpenAI source and mathlib
        working-directory: .four-loss-env
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/NavierStokesAndEuler rev-parse HEAD)" = 'f9e8bc5b38b6e212696e8a30e3e91517af887bbd'
          grep -q 'theorem weightedPressure_distribution' .lake/packages/NavierStokesAndEuler/NavierStokes/R3PressureCutoff.lean
          cp lake-manifest.json ../pressure-v12-evidence/lake-manifest.json
          lake env lean --version | tee ../pressure-v12-evidence/lean-version.txt
          lake exe cache get
      - name: Kernel-check Gaussian to actual canonical distribution bridge
        working-directory: .four-loss-env
        run: |
          set -euo pipefail
          lake build CanonicalPressureRepresentation 2>&1 | tee ../pressure-v12-evidence/build.log
          lake env lean -DwarningAsError=true CanonicalPressureRepresentation.lean 2>&1 | tee ../pressure-v12-evidence/axioms.log
      - name: Verify names, axioms, source scope and exact-head evidence
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('pressure-v12-evidence')
          assert (root/'head-sha.txt').read_text().strip()==os.environ['EXPECTED_HEAD']
          log=(root/'axioms.log').read_text()
          prefix='MathGraph.CanonicalPressureRepresentation.'
          expected={prefix+n for n in ('gaussian_tendsto_canonical_pressure_distribution',
             'gaussian_bound_gives_canonical_L2_representative')}
          rows=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          rows += [(n,'') for n in re.findall(r"'([^']+)' does not depend on any axioms",log)]
          seen={}
          for n,a in rows:
            assert n not in seen,n
            used={s.strip() for s in a.split(',') if s.strip()}
            assert used <= {'propext','Classical.choice','Quot.sound'},(n,sorted(used))
            seen[n]=sorted(used)
          assert set(seen)==expected,('name mismatch',sorted(expected.symmetric_difference(set(seen))))
          d={
            'schema':'mathgraph.actual-canonical-weighted-pressure-distribution-v12',
            'head_sha':os.environ['EXPECTED_HEAD'],
            'original_OpenAI_commit':'f9e8bc5b38b6e212696e8a30e3e91517af887bbd',
            'V11_source_blob':'4235fbf5625714a6bff5660423886def603d611b',
            'canonical_tempered_distribution_limit_proved':True,
            'all_scales_uniform_bound_implies_bounded_canonical_L2_representative':True,
            'all_scales_bound_supplied_here':False,
            'physical_pressure_gradient_identification_proved':False,
            'source_pressure_flux_10_19_proved':False,
            'independent_NL_specification_approval':False,
            'production_admission_changed':False,
            'theorem_axioms':seen,
            'files_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()},
          }
          (root/'result.json').write_text(json.dumps(d,sort_keys=True,indent=2)+'\n')
          print(json.dumps(d,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-pressure-v12
          path: pressure-v12-evidence/
          if-no-files-found: error
