name: WattBot V4 source-value repair external score audit
on:
  push:
    branches: [wattbot-value-repaired-submit-v4]
    paths:
      - '.github/workflows/wattbot-v4-score-audit.yml'
jobs:
  official-status:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle read-only client
        run: python -m pip install kaggle
      - name: Inspect V4 #57017667 and V3 #57017563 scoring states
        run: kaggle competitions submissions -c WattBot2026
      - name: Read current public leaderboard
        run: kaggle competitions leaderboard WattBot2026 --show
      - name: Read authenticated standing
        run: kaggle competitions list --group entered -s WattBot2026 -v
      - name: Boundary
        run: echo "Read-only official scoring audit; no submission/model calls."
