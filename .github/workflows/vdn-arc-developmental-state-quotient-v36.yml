name: VDN ARC developmental-state quotient census V36
on:
  push:
    branches:
      - mathgraph/msi-arc-pikpi-v11-20260828
    paths:
      - 'verified-developmental-navigation/case_studies/arc_agi2_live/run_v36_developmental_state_quotient_census.py'
      - '.github/workflows/vdn-arc-developmental-state-quotient-v36.yml'
  workflow_dispatch:
jobs:
  developmental-state-quotient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ARC-AGI
        run: |
          git clone --quiet https://github.com/fchollet/ARC-AGI.git /tmp/ARC-AGI-1
          cd /tmp/ARC-AGI-1
          git checkout --quiet 399030444e0ab0cc8b4e199870fb20b863846f34
      - name: Run V36 developmental-state quotient census
        run: python3 verified-developmental-navigation/case_studies/arc_agi2_live/run_v36_developmental_state_quotient_census.py /tmp/ARC-AGI-1/data/evaluation /tmp/ARC-AGI-1/data/training
      - uses: actions/upload-artifact@v4
        with:
          name: vdn-arc-developmental-state-quotient-v36
          path: verified-developmental-navigation/case_studies/arc_agi2_live/results_v36_developmental_state_quotient_census/result.json
