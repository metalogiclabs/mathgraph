name: MathGraph mention live model smoke
on:
  push:
    branches: ['feat/mathgraph-mention-agent-v1-20261102']
    paths: ['.github/workflows/mathgraph-mention-live-v1.yml']
permissions:
  contents: read
concurrency:
  group: mathgraph-live-smoke
  cancel-in-progress: false
jobs:
  single-bounded-model-call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify offline integration tests
        run: node --test integrations/mathgraph-check-github/mention-*.test.mjs
      - name: One live call, at most 25 cents reserved at configured conservative rates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node integrations/mathgraph-check-github/mention-live-smoke-v1.mjs
