name: WattBot same-response answer-value residual ablation
on:
  push:
    branches: [wattbot-answer-value-residual-v1]
    paths:
      - 'experiments/wattbot2026/answer_value_residual_probe.py'
      - '.github/workflows/wattbot-answer-value-residual.yml'
jobs:
  answer-evidence-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen WattBot official evaluation dependencies
        run: python -m pip install kaggle requests pandas numpy pymupdf
      - name: Qualify answer-versus-provenance distinction on synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          python experiments/wattbot2026/full_reader.py --self-test
          python experiments/wattbot2026/answer_value_residual_probe.py --self-test
      - name: Compare same-response answer salvage policies under official TRAIN scorer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wattbot"
          kaggle competitions download -c WattBot2026 -p "$RUNNER_TEMP/wattbot" --quiet
          python experiments/wattbot2026/answer_value_residual_probe.py \
            --official-zip "$RUNNER_TEMP/wattbot/WattBot2026.zip"
      - name: Scientific and release evidence boundary
        run: |
          echo "Six candidate policies evaluated on exactly same model outputs."
          echo "No Kaggle TEST, no submission, no private CSV or PDF artifacts."
          echo "Unverified answers are never promoted to verified source consequence."
