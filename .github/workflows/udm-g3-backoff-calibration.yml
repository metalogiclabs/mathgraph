name: G3 source-distinct Go observation calibration - backoff
on:
  push:
    branches: [research/udm-g3-generic-go-observer-20261103]
    paths:
      - 'research/udm_g2_observer_v1/**'
      - '.github/workflows/udm-g3-backoff-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: heathsanchez/test
          ref: 3f29d07fbb09bc56cac0cab676682d7b450a17ee
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cenkalti/backoff
          ref: 6f228bfdb51209aa375869feb27dcede4fa0db06
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Requalify author-native assertion before proposing anything
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '6f228bfdb51209aa375869feb27dcede4fa0db06'
          git -C source fetch --no-tags origin 'refs/pull/197/head:refs/remotes/origin/mg-pr-197'
          test "$(git -C source rev-parse refs/remotes/origin/mg-pr-197)" = '6ec253533f5445d618a94f4b4d1c45b6ff317518'
          mkdir -p qualification packet/base_source
          python tooling/research/g2_native_residual/qualify.py \
            --repo source --base 6f228bfdb51209aa375869feb27dcede4fa0db06 \
            --head 6ec253533f5445d618a94f4b4d1c45b6ff317518 \
            --test-file ticker_test.go --output qualification
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          x=json.loads(Path('qualification/qualification.json').read_text())
          assert x['status']=='WARRANTED_BOUNDED_AUTHENTIC_AUTHOR_NATIVE_RED_GREEN',x['status']
          assert x['matched_failed_tests']==['TestTickerStop'],x.get('matched_failed_tests')
          shutil.copyfile('qualification/learner-residual.json','packet/learner-residual.json')
          shutil.copyfile('source/ticker.go','packet/base_source/ticker.go')
          shutil.copyfile('code/research/udm_g2_observer_v1/backoff-calibration-profile.json','packet/profile.json')
          p=json.loads(Path('packet/profile.json').read_text())
          assert p['scientific_scope']=='POST_HOC_CALIBRATION_ONLY'
          assert p['source_sha']==x['base_sha']
          print('AUTHOR_NATIVE_ADMISSION',x['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-backoff-author-native
          path: qualification
          retention-days: 60
      - uses: actions/upload-artifact@v4
        with:
          name: g3-backoff-source-only-model-packet
          path: packet
          retention-days: 60
  propose:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: g3-backoff-source-only-model-packet
          path: packet
      - name: Frozen same-information bridge and direct proposals
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          node code/research/udm_g2_observer_v1/propose.mjs \
            packet/learner-residual.json packet/base_source proposals packet/profile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-backoff-equal-information-proposals
          path: proposals
          retention-days: 60
  independent-native:
    needs: [propose]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cenkalti/backoff
          ref: 6f228bfdb51209aa375869feb27dcede4fa0db06
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: g3-backoff-equal-information-proposals
          path: proposals
      - name: Independent generic observer controls and test-count verification
        shell: bash
        run: |
          set -euo pipefail
          cd code/research/udm_g2_observer_v1
          python -m unittest -v test_validate.py test_evaluate.py 2>&1 | tee /tmp/g3-backoff-controls.log
          grep -q 'Ran 14 tests' /tmp/g3-backoff-controls.log
          grep -q '^OK$' /tmp/g3-backoff-controls.log
      - name: Replay native behavior without model credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(printenv OPENAI_API_KEY || true)"
          test "$(git -C source rev-parse HEAD)" = '6f228bfdb51209aa375869feb27dcede4fa0db06'
          git -C source fetch --no-tags origin 'refs/pull/197/head:refs/remotes/origin/mg-pr-197'
          test "$(git -C source rev-parse refs/remotes/origin/mg-pr-197)" = '6ec253533f5445d618a94f4b4d1c45b6ff317518'
          python code/research/udm_g2_observer_v1/evaluate.py \
            --package backoff --source source \
            --base 6f228bfdb51209aa375869feb27dcede4fa0db06 \
            --head 6ec253533f5445d618a94f4b4d1c45b6ff317518 \
            --proposals proposals --output evaluation | tee native-summary.txt
          python - <<'PY'
          import json
          x=json.load(open('evaluation/evaluation.json'))
          assert x['schema']=='mathgraph.g2.go-native-qualification.v1'
          assert x['strict_g2']=='UNKNOWN' and x['strict_g3']=='UNKNOWN'
          print('SCIENTIFIC_VERDICT',x['status'])
          print('FAIR_BASELINE',x.get('fair_comparison'))
          for r in x['results']:
            print('OBSERVATION',r['mode'],r['status'],r.get('proposal_sha256'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-backoff-native-observer-calibration
          path: |
            evaluation
            native-summary.txt
            /tmp/g3-backoff-controls.log
          retention-days: 60
