name: Crystal Chess Verified Hybrid Search V14

on:
  push:
    branches:
      - crystal-chess-verified-hybrid-search-v14
    paths:
      - "experiments/crystal_chess_kpvk_v0.py"
      - "experiments/crystal_chess_goal_certificate_v3.py"
      - "experiments/crystal_chess_richer_transfer_v5.py"
      - "experiments/crystal_chess_kppvk_complete_census_v12.py"
      - "experiments/crystal_chess_verified_hybrid_search_v14.py"
      - ".github/workflows/crystal-chess-verified-hybrid-search-v14.yml"
      - "mathgraph/crystal.py"
      - "tests/test_crystal.py"
  workflow_dispatch:

jobs:
  verified-hybrid-search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "python-chess==1.999" "scikit-learn>=1.5,<2"

      - name: Requalify Crystal microkernel
        run: python -m pytest -q tests/test_crystal.py

      - name: Compile V14
        run: python -m py_compile experiments/crystal_chess_verified_hybrid_search_v14.py

      - name: Acquire exact Syzygy WDL authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/syzygy
          base="https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl"
          for f in KPvK.rtbw KQvK.rtbw KRvK.rtbw KBvK.rtbw KNvK.rtbw KPPvK.rtbw; do
            curl --fail --location --retry 5 --retry-delay 2 -o "/tmp/syzygy/$f" "$base/$f"
            test -s "/tmp/syzygy/$f"
          done
          sha256sum /tmp/syzygy/*.rtbw | tee /tmp/syzygy/SHA256SUMS

      - name: Compile and execute complete verified hybrid guard
        run: |
          set -euo pipefail
          mkdir -p artifacts/crystal-chess-v14
          cp /tmp/syzygy/SHA256SUMS artifacts/crystal-chess-v14/
          python experiments/crystal_chess_verified_hybrid_search_v14.py \
            --tablebase-dir /tmp/syzygy \
            --output artifacts/crystal-chess-v14/crystal_chess_verified_hybrid_search_v14.json \
            --guard-output artifacts/crystal-chess-v14/crystal_chess_verified_hybrid_guard_v14.jsonl.gz \
            | tee artifacts/crystal-chess-v14/run.log
          grep -q "CRYSTAL_CHESS_VERIFIED_HYBRID_SEARCH_V14=WARRANTED_COMPLETE_RESTRICTED_KPPVK_VERIFIED_HYBRID_SEARCH_GAIN" artifacts/crystal-chess-v14/run.log

      - name: Upload V14 evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystal-chess-verified-hybrid-search-v14
          path: artifacts/crystal-chess-v14/
          if-no-files-found: error
