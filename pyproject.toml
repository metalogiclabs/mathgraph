[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathgraph"
version = "0.1.0rc1"
description = "A lightweight generative verification kernel for verifiable mathematics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.26.0"]
sair = ["numpy>=1.24", "pandas>=2.0"]
plots = ["matplotlib>=3.7"]
all = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["mathgraph*", "adapters*"]
exclude = ["SAIR_MathGraph*", "codex*", "scripts*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests", "competitions/sair_stage2/tests"]
pythonpath = ["."]
