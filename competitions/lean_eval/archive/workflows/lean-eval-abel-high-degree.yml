name: LeanEval Abel high-degree bridge

on:
  pull_request:
    paths:
      - '.github/workflows/lean-eval-abel-high-degree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abel-high-degree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_EVAL_SHA: de48559590eb8cff2125e8e933b3e13bb8a3ff98
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Clone frozen LeanEval
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean-eval.git /tmp/lean-eval
          cd /tmp/lean-eval
          git checkout "$LEAN_EVAL_SHA"
          lake exe cache get
          lake build
          lake exe lean-eval start-problem abel_ruffini /tmp/abel_ruffini
          cd /tmp/abel_ruffini
          lake update

      - name: Install high-degree obstruction helper
        working-directory: /tmp/abel_ruffini
        run: |
          cat > Submission.lean <<'EOF'
          import Mathlib
          import Archive.Wiedijk100Theorems.AbelRuffini
          import Submission.Helpers

          open Polynomial

          namespace Submission

          theorem high_degree_obstruction (n : ℕ) (hn : 5 ≤ n) :
              ¬ (∀ p : ℚ[X], p.natDegree = n → ∀ x : ℂ, aeval x p = 0 →
                  x ∈ solvableByRad ℚ ℂ) := by
            intro hall
            let bad : ℚ[X] := AbelRuffini.Φ ℚ 4 2
            obtain ⟨y, hy⟩ := (IsAlgClosed.splits (bad.map (algebraMap ℚ ℂ))).exists_eval_eq_zero (by
              simp [bad, AbelRuffini.degree_Phi])
            have hyroot : aeval y bad = 0 := by
              simpa [aeval_def] using hy
            have hynot : y ∉ solvableByRad ℚ ℂ := by
              apply AbelRuffini.not_solvable_by_rad' y
              simpa [bad, aeval_def] using hyroot
            let p : ℚ[X] := bad * X ^ (n - 5)
            have hbad0 : bad ≠ 0 := by
              exact (AbelRuffini.monic_Phi 4 2).ne_zero
            have hdeg : p.natDegree = n := by
              rw [show p = bad * X ^ (n - 5) by rfl, natDegree_mul hbad0 (pow_ne_zero _ X_ne_zero)]
              simp [bad, AbelRuffini.natDegree_Phi]
              omega
            have hroot : aeval y p = 0 := by
              simp [p, hyroot]
            exact hynot (hall p hdeg y hroot)

          theorem abel_ruffini (n : ℕ) (_hn : 1 ≤ n) :
              (∀ p : ℚ[X], p.natDegree = n → ∀ x : ℂ, aeval x p = 0 →
                  x ∈ solvableByRad ℚ ℂ) ↔ n ≤ 4 := by
            constructor
            · intro h
              by_contra hnot
              have hn5 : 5 ≤ n := by omega
              exact high_degree_obstruction n hn5 h
            · intro hn
              sorry

          end Submission
          EOF

      - name: Build split proof and expose residual
        working-directory: /tmp/abel_ruffini
        run: |
          set -o pipefail
          lake build 2>&1 | tee /tmp/abel-high-degree.log
          echo '## Abel-Ruffini high-degree bridge' >> "$GITHUB_STEP_SUMMARY"
          echo 'High-degree direction compiled; low-degree constructive direction intentionally remains the only sorry.' >> "$GITHUB_STEP_SUMMARY"

      - name: Probe cubic capability composition
        working-directory: /tmp/abel_ruffini
        if: always()
        run: |
          cat > DegreeThree.lean <<'EOF'
          import Mathlib

          open Polynomial

          theorem degree_three_depressed_bridge
              (p : ℚ[X]) (hp : p.natDegree = 3) (x : ℂ) (hx : aeval x p = 0) :
              let a : ℚ := p.coeff 3
              let b : ℚ := p.coeff 2
              let c : ℚ := p.coeff 1
              let d : ℚ := p.coeff 0
              let y : ℂ := 3 * (a : ℂ) * x + (b : ℂ)
              let P : ℚ := 3 * (3 * a * c - b ^ 2)
              let Q : ℚ := 27 * a ^ 2 * d - 9 * a * b * c + 2 * b ^ 3
              y ^ 3 + (P : ℂ) * y + (Q : ℂ) = 0 := by
            have hdeg : p.degree = (3 : WithBot ℕ) :=
              (degree_eq_iff_natDegree_eq_of_pos (by norm_num : 0 < 3)).2 hp
            let a : ℚ := p.coeff 3
            let b : ℚ := p.coeff 2
            let c : ℚ := p.coeff 1
            let d : ℚ := p.coeff 0
            have hpform : p = C a * X ^ 3 + C b * X ^ 2 + C c * X + C d := by
              let q : ℚ[X] := C a * X ^ 3 + C b * X ^ 2 + C c * X + C d
              have hqdeg : q.degree ≤ (3 : WithBot ℕ) := by
                dsimp [q]
                exact degree_cubic_le
              ext n
              by_cases hn : n ≤ 3
              · interval_cases n <;> simp [q, a, b, c, d]
              · have hp_lt : p.degree < n := by
                  rw [hdeg]
                  exact_mod_cast (Nat.lt_of_not_ge hn)
                have hq_lt : q.degree < n :=
                  lt_of_le_of_lt hqdeg (by exact_mod_cast (Nat.lt_of_not_ge hn))
                rw [coeff_eq_zero_of_degree_lt hp_lt, coeff_eq_zero_of_degree_lt hq_lt]
            rw [hpform] at hx
            simp [aeval_def] at hx
            dsimp
            push_cast
            linear_combination 27 * (a : ℂ) ^ 2 * hx

          theorem cubic_resolvent_coeffs_base
              (P Q : ℚ) :
              ((Q : ℂ) ^ 2 + 4 * ((P : ℂ) ^ 3 / 27)) ∈ solvableByRad ℚ ℂ := by
            have h := (solvableByRad ℚ ℂ).algebraMap_mem (Q ^ 2 + 4 * (P ^ 3 / 27))
            simpa [algebraMap.coe_ratCast] using h

          theorem cubic_resolvent_discriminant_radical
              (P Q : ℚ) (s : ℂ)
              (hs : s ^ 2 = (Q : ℂ) ^ 2 + 4 * ((P : ℂ) ^ 3 / 27)) :
              s ∈ solvableByRad ℚ ℂ := by
            apply solvableByRad.rad_mem (by norm_num : (2 : ℕ) ≠ 0)
            rw [hs]
            exact cubic_resolvent_coeffs_base P Q

          theorem cubic_cube_radical
              (z : ℂ) (hz : z ∈ solvableByRad ℚ ℂ)
              (u : ℂ) (hu : u ^ 3 = z) :
              u ∈ solvableByRad ℚ ℂ := by
            apply solvableByRad.rad_mem (by norm_num : (3 : ℕ) ≠ 0)
            rw [hu]
            exact hz
          EOF
          set +e
          lake env lean DegreeThree.lean > /tmp/degree-three.log 2>&1
          code=$?
          echo "degree_three_bridge_exit=$code" | tee /tmp/cubic-summary.txt
          tail -n 100 /tmp/degree-three.log
          exit 0

      - name: Upload bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-eval-abel-high-degree
          path: |
            /tmp/abel-high-degree.log
            /tmp/degree-three.log
            /tmp/cubic-summary.txt
          if-no-files-found: warn
