# Render Blueprint: isolated MathGraph Check GitHub App webhook pilot.
# No key or signing secret is stored in Git.
# This service is separate from the existing mathgraph.org website.
services:
  - type: web
    name: mathgraph-check-webhook-pilot
    runtime: docker
    repo: https://github.com/metalogiclabs/mathgraph
    branch: mathgraph-check-github-app-shadow-v0
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    dockerfilePath: ./integrations/mathgraph-check-github/Dockerfile
    dockerContext: ./integrations/mathgraph-check-github
    healthCheckPath: /health
    envVars:
      - key: GITHUB_APP_CLIENT_ID
        value: Iv23lioiUs5KfHD7mkkw
      - key: GITHUB_APP_ID
        value: '5308912'
      - key: MATHGRAPH_ALLOWED_REPOS
        value: metalogiclabs/go-ethereum
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
