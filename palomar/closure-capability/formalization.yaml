summary: >-
  A four-coordinate finite system has an old cyclic presentation symmetry and
  one-site rewrite capabilities. Two literally distinct LT-to-LE rewrites are
  identified by the old symmetry. Retaining that capability does not make a
  target containing OR reachable; adjoining an AND-to-OR capability strictly
  expands reachability and makes the target reachable. At the same time, the
  AND-to-OR rewrite was already formable in the raw one-site constructor
  language. The formalization therefore separates closure-relative capability
  identity and verified reachability growth from growth of raw syntax.
