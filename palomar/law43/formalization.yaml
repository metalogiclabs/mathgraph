summary: >-
  For a two-variable magma law whose right-hand side is obtained by swapping the
  two variables in the left-hand side, every magma satisfying the law admits a
  term-defined commutative binary operation. The construction evaluates the
  law's left-hand-side term on the two input arguments and proves commutativity
  using the swapped-law hypothesis.
