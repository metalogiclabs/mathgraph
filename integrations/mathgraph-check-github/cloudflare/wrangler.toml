name = "mathgraph-check-webhook-pilot"
main = "worker.mjs"
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PR_PILOT_ENABLED = "false"
GITHUB_APP_ID = "5308912"
GITHUB_APP_CLIENT_ID = "Iv23lioiUs5KfHD7mkkw"

[[queues.producers]]
binding = "PR_EVENTS"
queue = "mathgraph-check-pr-events-v0"

[[queues.consumers]]
queue = "mathgraph-check-pr-events-v0"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1
dead_letter_queue = "mathgraph-check-pr-events-dlq-v0"

[[r2_buckets]]
binding = "PILOT_SUBSCRIPTIONS"
bucket_name = "mathgraph-check-warrant-events-v1"

[[durable_objects.bindings]]
name = "PR_PILOT_BUDGET"
class_name = "PilotBudget"

[[migrations]]
tag = "pr-pilot-budget-v1"
new_sqlite_classes = ["PilotBudget"]

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/10 * * * *"]
